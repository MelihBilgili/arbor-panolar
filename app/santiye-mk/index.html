<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MK — Tıkanan Şantiyeler Formu</title>
<style>
  :root{color-scheme:light}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Segoe UI',system-ui,sans-serif;background:#f7f8fa;color:#1c2430;font-size:14px}
  header{background:#2e6b2e;color:#fff;padding:12px 16px}
  header h1{font-size:17px;margin:0;font-weight:700}
  header .sub{font-size:12px;color:#d5efd5;margin-top:3px}
  .wrap{max-width:900px;margin:0 auto;padding:14px 16px 60px}
  .msg{font-size:12.5px;min-height:16px;margin-bottom:8px}.msg.ok{color:#2e7d54;font-weight:600}.msg.err{color:#b40000;font-weight:600}
  .card{background:#fff;border:1px solid #dde3ea;border-radius:10px;padding:12px 14px;margin-bottom:12px}
  .snm{font-weight:700;color:#16324f;font-size:15px}
  .ctx{font-size:12px;color:#5a6b7d;margin:4px 0 8px;background:#f4f6f8;border:1px solid #e7ebef;border-radius:7px;padding:6px 9px}
  .ctx b{color:#8a6100}
  label{font-size:11px;color:#2e6b2e;font-weight:700}
  textarea{font:inherit;width:100%;min-height:56px;padding:8px 10px;border:1px solid #cdd6df;border-radius:8px;background:#f5fbf5;resize:vertical}
  .prev{font-size:11.5px;color:#8a8a8a;font-style:italic;margin:4px 0}
  .save{background:#2e7d54;color:#fff;border:0;border-radius:7px;padding:7px 14px;font-weight:600;cursor:pointer;margin-top:8px}
  .load{padding:30px;text-align:center;color:#8a97a4}
  .hint{font-size:12px;color:#8a97a4;margin:10px 2px}
</style>
</head>
<body>
<header>
  <h1>Tıkanan Şantiyeler — MK Formu</h1>
  <div class="sub">Mehmet Konak · Her şantiye için <b>MK güncel durumunu</b> gir. ÖB'nin girdiği güncel durum bağlam olarak gösterilir. Önceki hafta gri gösterilir.</div>
</header>
<div class="wrap">
  <div id="msg" class="msg"></div>
  <div id="list"><div class="load">Yükleniyor…</div></div>
  <div class="hint">Kayıtlar Supabase'e yazılır (santiye_mk). Yalnız "MK güncel durum" düzenlenir. Melih'in panosuna salt-okur yansır.</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb = supabase.createClient("https://zehysygpqxqmrzangvuc.supabase.co","sb_publishable_ZCcDv4S7qH1hc9tuiv4__A_YVxmIpWc");
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function msg(t,ok){ const m=document.getElementById("msg"); m.className="msg "+(ok?"ok":"err"); m.textContent=t; if(ok) setTimeout(()=>{m.textContent="";},1800); }
let MK={};
async function load(){
  const [a,b]=await Promise.all([ sb.from("santiye").select("*").order("sira"), sb.from("santiye_mk").select("*") ]);
  if(a.error){ document.getElementById("list").innerHTML='<div class="load">Hata: '+esc(a.error.message)+'</div>'; return; }
  MK={}; (b.data||[]).forEach(r=>MK[r.santiye_id]=r);
  const active=(a.data||[]).filter(r=>r.durum!=="Çözüldü");
  const list=document.getElementById("list");
  list.innerHTML=active.length?active.map(card).join(""):'<div class="load">Aktif şantiye yok.</div>';
  active.forEach(r=>{ document.querySelector('.card[data-id="'+r.id+'"] .save').onclick=()=>save(r.id); });
}
function card(r){
  const mk=MK[r.id]||{};
  return '<div class="card" data-id="'+r.id+'">'
    +'<div class="snm">'+esc(r.santiye)+(r.musteri?' — '+esc(r.musteri):'')+'</div>'
    +'<div class="ctx"><b>ÖB güncel:</b> '+(esc(r.ob_guncel)||'<i>bu hafta boş</i>')+(r.neden?' &nbsp;·&nbsp; <b>neden:</b> '+esc(r.neden):'')+'</div>'
    +'<label>MK GÜNCEL DURUM / AKSİYON</label>'
    +'<textarea class="i-mk" placeholder="MK güncel durumu...">'+esc(mk.mk_guncel)+'</textarea>'
    +(mk.mk_onceki?'<div class="prev">◂ önceki: '+esc(mk.mk_onceki)+'</div>':'')
    +'<div><button class="save">Kaydet</button></div>'
    +'</div>';
}
async function save(id){
  const c=document.querySelector('.card[data-id="'+id+'"]');
  const val=c.querySelector(".i-mk").value.trim();
  let error;
  if(MK[id]){ ({error}=await sb.from("santiye_mk").update({mk_guncel:val}).eq("santiye_id",id)); }
  else      { ({error}=await sb.from("santiye_mk").insert({santiye_id:id, mk_guncel:val})); }
  if(error){ msg(error.message,false); return; }
  msg("Kaydedildi.",true); load();
}
load();
</script>
</body>
</html>
