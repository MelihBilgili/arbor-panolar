const ARB_ROLE_EMAIL = "fy.form@arbor.com.tr";
const ARB_STORE = "arbform_yd_akis_" + ARB_ROLE_EMAIL.split("@")[0].replace(/\./g, "_");
const ARB_GATE_SB = supabase.createClient("https://zehysygpqxqmrzangvuc.supabase.co","sb_publishable_ZCcDv4S7qH1hc9tuiv4__A_YVxmIpWc",{auth:{persistSession:true,autoRefreshToken:true,storageKey:ARB_STORE}});
const ARB_MB = "int@arbor.com.tr";

var ARB_ACTIVE = ARB_GATE_SB;
supabase.createClient = function(){ return ARB_ACTIVE; };
function arbGateUI(msg){
  var d=document.createElement("div"); d.id="arb-gate";
  d.style.cssText="position:fixed;inset:0;background:#16324f;z-index:99999;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',system-ui,sans-serif";

function ARB_BOOT(){ (async function(){

  if(em===ARB_ROLE_EMAIL || em===ARB_MB){ window.ARB_EM=em; (0,eval)(document.getElementById("arbmain").textContent); }

<script type="text/plain" id="arbmain">
const sb=supabase.createClient("https://zehysygpqxqmrzangvuc.supabase.co","sb_publishable_ZCcDv4S7qH1hc9tuiv4__A_YVxmIpWc");
const BLOK="YD1";
/* MUSTERI-SINIFLARI (2026-09-18): bu formda gösterilecek sınıf blokları — Fiyatlandırma panosundaki
   `fiyat_musteri_sinif` tablosunun aynısı, salt-okur. sinif kodu: 1=Fransa 1. · 2=Fransa 2. ·
   3=İngiltere 1. · 4=İngiltere 2. · 5=Almanya 1. · 6=Almanya 2. */
const MS_SINIFLAR=[[1,"1. Sınıf Fransa Şirketleri"],[2,"2. Sınıf Fransa Şirketleri"]];
const ARB_EKLEYEN_MAP={"int@arbor.com.tr":"MB","fy.form@arbor.com.tr":"MN","fy2.form@arbor.com.tr":"MKB"};
const ARB_EKLEYEN=ARB_EKLEYEN_MAP[(window.ARB_EM||"")]||"";
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money=n=>{const v=Math.round(Number(n)||0);return v.toLocaleString("tr-TR");};
const parseNet=s=>{ if(s==null) return null; let t=String(s).replace(/[^0-9,.\-]/g,""); if(t==="") return null; if(t.indexOf(",")>-1 && t.indexOf(".")>-1){ t=t.replace(/\./g,"").replace(",", "."); } else { t=t.replace(",", "."); } const v=parseFloat(t); return isNaN(v)?null:v; };
const pad=n=>String(n).padStart(2,"0");
const fmtDate=v=>{ if(!v) return ""; const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(v)); return m? m[3]+"."+m[2]+"."+m[1].slice(2) : String(v); };
function toISO(s){ if(s==null) return null; s=String(s).trim(); if(s==="") return null;
  let m=/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{2,4})$/.exec(s);
  if(m){ let y=m[3]; if(y.length===2) y="20"+y; return y+"-"+pad(m[2])+"-"+pad(m[1]); }
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  return undefined; }
const todayISO=()=>new Date().toISOString().slice(0,10);
function daysAgo(iso){ if(!iso) return null; const s=String(iso).slice(0,10); const d=new Date(s+"T00:00:00"); if(isNaN(d.getTime())) return null; const t=new Date(); t.setHours(0,0,0,0); return Math.floor((t-d)/86400000); }

/* ===== TAKIP-LOG (fy_form/arbor_app deseninin aynısı) ===== */
function tkParseLog(raw,dcol){
  if(raw==null||raw==="") return [];
  try{ const v=JSON.parse(raw); if(Array.isArray(v)) return v.map(x=>({t:(x&&x.t)||"",e:(x&&x.e)||"",n:(x&&x.n)||""})); }catch(e){}
  return [{t:dcol||"",e:"",n:String(raw)}];
}
function tkLatest(log){ return log[0]||{t:"",e:"",n:""}; }
function tkHist(log){ return log.length? log.map(x=>(x.t?fmtDate(x.t)+" — ":"")+(x.e?x.e+": ":"")+(x.n||"")).join("\n") : ""; }

const DURUM_OPTS=["Teklif Talebi Geldi","Teklif İncelendi","Teklif Bekleniyor","Teklif Teslim Edildi","Revizyon İstendi","Takip Bekleniyor","Muhtemel","Kazandık","Üretimde","Kaybettik","Müşteri İşi Alamadı"];
const DURUM_SIRA={}; DURUM_OPTS.forEach((d,i)=>DURUM_SIRA[d]=i+1);
const DURUM_BG={"Teklif İncelendi":"#eafbfa","Teklif Bekleniyor":"#e0f5e0","Revizyon İstendi":"#e8dfb8","Muhtemel":"#7ed957","Kazandık":"#4caf50","Kaybettik":"#c9c9c9","Müşteri İşi Alamadı":"#e8dfb8","Takip Bekleniyor":"#f7e8f2"};
const DISPLAY_ORDER=["Teklif Talebi Geldi","Teklif İncelendi","Teklif Bekleniyor","Takip Bekleniyor","Teklif Teslim Edildi","Muhtemel","Kazandık","Üretimde","Kaybettik","Müşteri İşi Alamadı","Revizyon İstendi"];
const DISPLAY_SIRA={}; DISPLAY_ORDER.forEach((d,i)=>DISPLAY_SIRA[d]=i+1);
const COLS=[
 {f:'proje',h:'Proje',w:112,t:'text',req:1},
 {f:'musteri',h:'Müşteri',w:66,t:'text',req:1},
 {f:'musteri_onem_sinifi',h:'Müşteri Önem Sınıfı',w:35,t:'sel',opts:['1. Sınıf ya da Ciro: >500 m€','2. Sınıf ya da Ciro: 101-500 m€','Ciro: 11-100 m€','Ciro: <10 m€']},
 {f:'gelen_tarih',h:'Gelen Tarih',w:53,t:'date'},
 {f:'istenen_tarih',h:'İstenen Tarih',w:53,t:'date'},
 {f:'ihale',h:'İhale?',w:57,t:'sel',opts:['Alındı','Alınmadı']},
 {f:'talebe_iliskin_notlar',h:'Talebe İlişkin Notlar',w:90,t:'area'},
 {f:'adet',h:'Adet',w:43,t:'int'},
 {f:'urun_tipi_serisi',h:'Ürün Tipi / Serisi',w:48,t:'text'},
 {f:'kemer_karolaj',h:'Kemer/Karolaj',w:47,t:'sel',opts:['Yalnız kemer','Yalnız karolaj','Hiçbiri','Hepsi']},
 {f:'sartname_ahsap',h:'Şartname Ahşap?',w:49,t:'sel',opts:['Evet','Hayır']},
 {f:'teklif_birimi_notlari',h:'Teklif Birimi Notları',w:90,t:'area'},
 {f:'oncelik',h:'Öncelik',w:30,t:'sel',opts:['1','2','3']},
 {f:'teklif_teslim_tarihi',h:'Teklif Teslim Tarihi',w:62,t:'date'},
 {f:'agac',h:'Ağaç',w:55,t:'sel',opts:['ÇAM DKD','ÇAM KKK-20cm','ÇAM KKK-70cm','İROKO DKD','LAREKS DKD','MERANTİ DKD','MEŞE DKD','ACCOYA','OKALİPTUS DKD','OKALİPTUS KKK','SAPELLİ DKD']},
 {f:'iskonto_yuzde',h:'İskonto %',w:29,t:'text'},
 {f:'net_tutar',h:'Montaj Hariç Net Tutar',w:68,t:'num'},
 {f:'para_birimi',h:'Para Birimi',w:45,t:'sel',opts:['EUR','GBP','USD']}
];
const REQ_F=COLS.filter(c=>c.req).map(c=>c.f);
let ROWS=[];
let DRAFT=null;
let PENDING_TK={};
function newDraftRow(){ const rec={blok:BLOK}; COLS.forEach(c=>{ rec[c.f]=""; }); rec.durum=null; rec.son_takip_notlari=null; rec.son_takip_tarihi=null; return rec; }
function getRow(key){ return key==="draft"?DRAFT:ROWS[+key]; }
function colFilled(r,idx){
  if(idx>=1&&idx<=18){ const c=COLS[idx-1]; const v=r[c.f]; return v!=null && String(v).trim()!==""; }
  const log=tkParseLog(r.son_takip_notlari,r.son_takip_tarihi), last=tkLatest(log);
  const noteOk=!!(last.n && String(last.n).trim());
  if(idx===19) return !!last.t && noteOk;
  if(idx===20) return !!last.e && noteOk;
  if(idx===21) return noteOk;
  return false;
}
function rangeFilled(r,a,b){ for(let k=a;k<=b;k++){ if(!colFilled(r,k)) return false; } return true; }
function computeAutoTier(r){
  if(rangeFilled(r,14,18)) return 4;
  if(colFilled(r,13)) return 3;
  if(rangeFilled(r,8,11)) return 2;
  if(rangeFilled(r,1,6)) return 1;
  return 0;
}
function state5Ready(r){ return rangeFilled(r,1,6)&&rangeFilled(r,8,11)&&colFilled(r,13)&&rangeFilled(r,14,18); }
function state6to11Ready(r){ return rangeFilled(r,19,21); }
async function maybeAutoAdvance(r){
  const cur=DURUM_SIRA[r.durum]||0;
  if(cur>=5) return false;
  const eligible=computeAutoTier(r);
  if(eligible>cur){
    const newDurum=DURUM_OPTS[eligible-1];
    if(r.id){
      const {error}=await sb.from("satis_yd_akis").update({durum:newDurum}).eq("id",r.id);
      if(error) return false;
    }
    r.durum=newDurum;
    return true;
  }
  return false;
}
async function maybeFlagTakipBekleniyor(r){
  if(r.durum!=="Teklif Teslim Edildi") return false;
  const tteAge=daysAgo(r.teklif_teslim_tarihi);
  if(tteAge===null || tteAge<=15) return false;
  const log=tkParseLog(r.son_takip_notlari,r.son_takip_tarihi), last=tkLatest(log);
  const noteOk=!!(last.n && String(last.n).trim());
  const takipAge=noteOk?daysAgo(r.son_takip_tarihi):null;
  const eski = takipAge===null || takipAge>15;
  if(!eski) return false;
  if(r.id){
    const {error}=await sb.from("satis_yd_akis").update({durum:"Takip Bekleniyor"}).eq("id",r.id);
    if(error) return false;
  }
  r.durum="Takip Bekleniyor";
  return true;
}
async function load(){
  const {data,error}=await sb.from("satis_yd_akis").select("*").eq("blok",BLOK);
  if(error){ document.getElementById("list").innerHTML='<div class="load">Hata: '+esc(error.message)+'</div>'; return; }
  ROWS=data||[]; DRAFT=newDraftRow();
  for(const r of ROWS){ await maybeFlagTakipBekleniyor(r); }
  render();
}
/* SIRALAMA (2026-09-18, Melih): Satırlar önce Durum grubuna (DISPLAY_ORDER) ayrılır —
   durumu BOŞ olanlar kendi grubu olarak en üstte. Grup içinde sıralama duruma göre FARKLI
   bir tarih alanına bakar ve EN ESKİDEN EN YENİYE gider:
     · boş durum                         → Gelen Tarih
     · Teklif Talebi Geldi / Teklif İncelendi → İstenen Tarih
     · diğer tüm durumlar                → Teklif Teslim Tarihi
   O alanı boş olan satırlar kendi grubunun SONUNA düşer. */
const SIRA_TARIH={"":"gelen_tarih","Teklif Talebi Geldi":"istenen_tarih","Teklif İncelendi":"istenen_tarih"};
function siraTarihi(r){
  const f=SIRA_TARIH[r.durum||""]||"teklif_teslim_tarihi";
  const v=r[f];
  return v?String(v).slice(0,10):"";
}
function sortROWS(){
  const tierOf=d=> d?(DISPLAY_SIRA[d]||99):0;
  ROWS.sort((a,b)=>{
    const sa=tierOf(a.durum), sb2=tierOf(b.durum);
    if(sa!==sb2) return sa-sb2;
    const da=siraTarihi(a), db=siraTarihi(b);
    if(!da&&!db) return 0; if(!da) return 1; if(!db) return -1;
    return da.localeCompare(db);
  });
}
function dispVal(r,c){ const v=r[c.f]; if(v==null) return ""; if(c.t==='date') return fmtDate(v); if(c.t==='num') return money(v); return v; }
function sums(){
  const net=ROWS.reduce((a,r)=>a+(Number(r.net_tutar)||0),0);
  document.getElementById("sum").innerHTML="<b>"+ROWS.length+"</b> proje · Net "+money(net)+" (karışık p.b.)";
}
/* MUSTERI-SINIFLARI penceresi — Fiyatlandırma panosundaki `fiyat_musteri_sinif` listesinin
   SALT-OKUR kopyası (tek kaynak orası; burada ekleme/silme YOK). Şirketler panodaki gibi
   alfabetik (tr) sıralanır. Veri ilk açılışta bir kez çekilip önbelleğe alınır. */
let _MSCACHE=null;
async function msAc(){
  const ov=document.getElementById("ms-ov"), gr=document.getElementById("ms-grid");
  ov.classList.add("on");
  if(!_MSCACHE){
    gr.innerHTML='<div class="bos">Yükleniyor…</div>';
    const {data,error}=await sb.from("fiyat_musteri_sinif").select("sinif,ad");
    if(error){ gr.innerHTML='<div class="bos">Liste okunamadı: '+esc(error.message)+'</div>'; return; }
    _MSCACHE=data||[];
  }
  gr.innerHTML=MS_SINIFLAR.map(s=>{
    const kod=s[0], baslik=s[1];
    const ad=_MSCACHE.filter(r=>Number(r.sinif)===kod).map(r=>String(r.ad||"").trim()).filter(Boolean)
      .sort((a,b)=>a.localeCompare(b,"tr"));
    const govde=ad.length? "<ol>"+ad.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ol>"
                         : '<div class="bos">Kayıtlı şirket yok.</div>';
    return '<div class="msblk"><h3>'+esc(baslik)+' <span class="bos">('+ad.length+')</span></h3>'+govde+'</div>';
  }).join("");
}
function msKapat(){ document.getElementById("ms-ov").classList.remove("on"); }
(function(){
  const b=document.getElementById("ms-btn"); if(b) b.onclick=msAc;
  const k=document.getElementById("ms-kapat"); if(k) k.onclick=msKapat;
  const ov=document.getElementById("ms-ov"); if(ov) ov.onclick=e=>{ if(e.target===ov) msKapat(); };
  document.addEventListener("keydown",e=>{ if(e.key==="Escape") msKapat(); });
})();
function pairCells(r,i,bg){
  const bgv=bg||'transparent';
  if(PENDING_TK[i]){
    return '<td class="pairA gs" style="background:'+bgv+'"><div class="tklatest">—</div></td>'
      +'<td class="pairA" style="background:'+bgv+'"><div class="tklatest">—</div></td>'
      +'<td class="pairA tknotes" style="background:'+bgv+'"><textarea class="cell tknote-pending" data-row="'+i+'" rows="1" placeholder="Not yazın…"></textarea></td>';
  }
  const log=tkParseLog(r.son_takip_notlari,r.son_takip_tarihi), last=tkLatest(log), hist=tkHist(log);
  const histDates = log.length ? log.map(x=>x.t?fmtDate(x.t):"—").join("\n") : "";
  const histEkleyen = log.length ? log.map(x=>x.e||"—").join("\n") : "";
  const noteEmpty = log.length && last.n==="";
  const noteCell = noteEmpty
    ? '<textarea class="cell tknote-input" data-row="'+i+'" rows="1" placeholder="Not yazın…"></textarea>'
    : '<div class="tklatest" title="'+esc(hist)+'">'+esc(last.n||"—")+'</div>';
  const dateDisp = noteEmpty ? "—" : (last.t?fmtDate(last.t):"—");
  const ekleyenDisp = noteEmpty ? "—" : (last.e||"—");
  return '<td class="pairA gs" style="background:'+bgv+'"><div class="tklatest" title="'+esc(histDates)+'">'+esc(dateDisp)+'</div></td>'
    +'<td class="pairA" style="background:'+bgv+'"><div class="tklatest" title="'+esc(histEkleyen)+'">'+esc(ekleyenDisp)+'</div></td>'
    +'<td class="pairA tknotes" style="background:'+bgv+'"><button class="tkAddBtn" data-row="'+i+'">Ekle</button>'+noteCell+'</td>';
}
/* TERMIN-UYARI (2026-09-18): müşterinin İstenen Tarih'i, teklifin Teklif Teslim Tarihi'nden
   önceyse termin kaçmış demektir — Teklif Teslim Tarihi hücresi kırmızı-kalın yazılır.
   YALNIZ durumu "Teklif Bekleniyor" olan satırlarda uygulanır (Melih, 2026-09-18);
   diğer durumlarda hücre normal yazılır. Değerler ISO (YYYY-AA-GG) olduğu için düz metin
   karşılaştırması doğru sonuç verir. */
/* TERMIN-BOS (2026-09-18): Durumu "Teklif Bekleniyor" olup Teklif Teslim Tarihi girilmemiş
   satırlarda o hücre kırmızı doldurulur. */
function terminBos(r){
  return !!r && r.durum==="Teklif Bekleniyor" && !String(r.teklif_teslim_tarihi||"").trim();
}
function terminGec(r){
  if(!r || r.durum!=="Teklif Bekleniyor") return false;
  const ist=r&&r.istenen_tarih?String(r.istenen_tarih).slice(0,10):"";
  const tes=r&&r.teklif_teslim_tarihi?String(r.teklif_teslim_tarihi).slice(0,10):"";
  if(!ist||!tes) return false;
  return ist<tes;
}
function rowHTML(r,key){
  const bg = key==="draft" ? "" : (DURUM_BG[r.durum]||"");
  const bgv=bg||'transparent';
  const ttAge=daysAgo(r.teklif_teslim_tarihi);
  const durumWarn=(r.durum==="Teklif Bekleniyor" && ttAge!==null && ttAge>15) ? " durum-warn" : "";
  return '<tr data-i="'+key+'" style="background:'+bgv+'">'+COLS.map(c=>{
      const v=dispVal(r,c), req=c.req?" req":"", empty=c.req&&!String(v).trim()?" bad":"";
      if(c.t==='area') return '<td style="background:'+bgv+'"><textarea class="cell'+req+empty+'" data-f="'+c.f+'" rows="1" style="width:'+c.w+'px" title="'+esc(v)+'">'+esc(v)+'</textarea></td>';
      if(c.t==='sel'){ const opts='<option value=""></option>'+c.opts.map(o=>'<option'+(String(v)===o?' selected':'')+'>'+esc(o)+'</option>').join(''); const filled=String(v).trim()!==""?" filled":""; return '<td style="background:'+bgv+'"><select class="cell'+req+empty+filled+'" data-f="'+c.f+'" style="width:'+c.w+'px">'+opts+'</select></td>'; }
      let uyari="",ipucu="";
      if(c.f==='teklif_teslim_tarihi'){
        if(terminBos(r)){ uyari=" terminbos"; ipucu=' title="Teklif Bekleniyor — Teklif Teslim Tarihi girilmemiş"'; }
        else if(terminGec(r)){ uyari=" terminuyari"; ipucu=' title="İstenen Tarih, Teklif Teslim Tarihi\'nden erken — termin aşıldı"'; }
      }
      return '<td class="'+(c.t==='num'?'net':'')+'" style="background:'+bgv+'"><input class="cell'+req+empty+uyari+'" data-f="'+c.f+'" type="text"'+ipucu+' style="width:'+c.w+'px" value="'+esc(v)+'"></td>';
    }).join('')
    +pairCells(r,key,bg)
    +'<td style="background:'+bgv+'"><select class="cell'+(r.durum?" filled":"")+durumWarn+'" data-f="durum" style="width:122px"><option value=""></option>'+DURUM_OPTS.map(o=>'<option'+(r.durum===o?' selected':'')+'>'+esc(o)+'</option>').join('')+'</select></td>'
    +(key==="draft" ? '<td class="colp" style="background:'+bgv+'"></td>' : '<td class="colp" style="background:'+bgv+'"><button class="del" title="Satırı sil">✕</button></td>')
    +'</tr>';
}
function render(){
  sortROWS();
  let h='<table><colgroup>'+COLS.map(c=>'<col style="width:'+c.w+'px">').join('')+'<col style="width:72px"><col style="width:60px"><col style="width:150px"><col style="width:130px"><col style="width:28px"></colgroup><thead><tr>'
    +COLS.map(c=>'<th title="'+esc(c.h)+'">'+c.h+'</th>').join('')
    +'<th class="pairA gs">Takip Tarihi</th><th class="pairA">Ekleyen</th><th class="pairA">Takip Notları</th>'
    +'<th>Durum</th><th></th></tr></thead><tbody>';
  h+=rowHTML(DRAFT,"draft");
  ROWS.forEach((r,i)=>{ h+=rowHTML(r,i); });
  h+='</tbody></table>';
  h+='<div class="legend">'+DISPLAY_ORDER.filter(d=>DURUM_BG[d]).map(d=>'<span class="lg-item"><span class="lg-sw" style="background:'+DURUM_BG[d]+'"></span>'+esc(d)+'</span>').join('')+'</div>';
  const list=document.getElementById("list"); list.innerHTML=h;
  list.querySelectorAll("[data-f]").forEach(el=>{
    const key=el.closest("tr").dataset.i, f=el.dataset.f;
    el.addEventListener("change",async()=>{
      await saveRow(key,f,el.value,el);
      if(el.tagName==='SELECT') el.classList.toggle('filled', !!el.value);
    });
  });
  list.querySelectorAll(".tkAddBtn").forEach(b=>b.onclick=()=>tkStartEntry(b.dataset.row));
  list.querySelectorAll(".tknote-input").forEach(ta=>ta.addEventListener("change",()=>tkSaveNote(ta.dataset.row,ta.value)));
  list.querySelectorAll(".tknote-pending").forEach(ta=>ta.addEventListener("change",()=>tkCommitEntry(ta.dataset.row,ta.value)));
  list.querySelectorAll(".del").forEach(b=>b.onclick=()=>delRow(+b.closest("tr").dataset.i));
  if(ARB_FOCUS_ROW!=null){ const ta=list.querySelector('tr[data-i="'+ARB_FOCUS_ROW+'"] .tknote-input, tr[data-i="'+ARB_FOCUS_ROW+'"] .tknote-pending'); if(ta) ta.focus(); ARB_FOCUS_ROW=null; }
  sums();
}
function setMsg(t,ok){ const m=document.getElementById("msg"); m.className="msg "+(ok?"ok":"err"); m.textContent=t; }
function convVal(f,val){
  const c=COLS.find(x=>x.f===f);
  if(f==='durum') return (val===''?null:val);
  if(!c) return (val===''?null:val);
  if(c.t==='num') return parseNet(val);
  if(c.t==='int'){ const n=parseInt(String(val).replace(/[^\d]/g,''),10); return isNaN(n)?null:n; }
  if(c.t==='date') return toISO(val);
  return (val===''?null:String(val).trim());
}
/* ===== KUR-DONDURMA (2026-09-18) — ahsap_form.html deseninin aynısı =====
   Net Tutar € dışında bir para biriminde girilirse KAYIT ANINDA alınan kurla €'ya çevrilir;
   kullanılan kur ve kur tarihi satıra yazılır (eur_kur · net_tutar_eur · kur_tarihi).
   Kaynak sırası: arb-kur (EUR/TL/USD/GBP) → eksik kalırsa ahsap-kur (TL/USD) → kur_son önbelleği.
   1 EUR = rates[X] birim X  →  tutar_eur = tutar / rates[X] */
let _KUR=null;
async function kurAl(){ if(_KUR) return _KUR;
  let r={EUR:1}, tarih=null;
  try{ const {data}=await sb.functions.invoke("arb-kur",{body:{}});
    if(data&&data.ok&&data.rates){ r=Object.assign(r,data.rates); tarih=data.tarih||null; } }catch(e){}
  if(!(r.TL>0)||!(r.USD>0)){ try{ const {data}=await sb.functions.invoke("ahsap-kur",{body:{}});
    if(data&&data.ok&&data.rates){ ["TL","USD"].forEach(p=>{ if(!(r[p]>0)&&data.rates[p]>0) r[p]=data.rates[p]; }); if(!tarih) tarih=data.tarih||null; } }catch(e){} }
  try{ const {data}=await sb.from("kur_son").select("para_birimi,oran,kur_tarihi");
    (data||[]).forEach(k=>{ const v=Number(k.oran); if(v>0&&!(r[k.para_birimi]>0)){ r[k.para_birimi]=v; if(!tarih) tarih=k.kur_tarihi||null; } }); }catch(e){}
  _KUR={rates:r,tarih:tarih}; return _KUR; }
async function eurAlanlari(r,upd){
  const tutar=('net_tutar' in upd)? upd.net_tutar : (r.net_tutar==null?null:Number(r.net_tutar));
  const pb=(('para_birimi' in upd)? upd.para_birimi : r.para_birimi)||'EUR';
  if(tutar==null){ upd.eur_kur=null; upd.net_tutar_eur=null; upd.kur_tarihi=null; return true; }
  if(pb==='EUR'){ upd.eur_kur=1; upd.net_tutar_eur=tutar; upd.kur_tarihi=null; return true; }
  const k=await kurAl();
  if(!(k.rates[pb]>0)){ upd.eur_kur=null; upd.net_tutar_eur=null; upd.kur_tarihi=null; return false; }
  upd.eur_kur=k.rates[pb]; upd.net_tutar_eur=tutar/k.rates[pb]; upd.kur_tarihi=k.tarih||null; return true; }
async function saveRow(key,f,val,el){
  const r=getRow(key); if(!r) return; const m=document.getElementById("msg");
  let v=convVal(f,val);
  if(v===undefined){ m.className="msg err"; m.textContent="Tarih GG.AA.YYYY biçiminde olmalı."; return; }
  if(f==='durum' && v){
    const tier=DURUM_SIRA[v];
    if(tier>=1 && tier<=4 && !rangeFilled(r,1,6)){ el.value=r.durum||""; setMsg("Bu durum için ilk 6 sütun (Proje, Müşteri, Müşteri Önem Sınıfı, Gelen Tarih, İstenen Tarih, İhale?) dolu olmalı.",false); return; }
    if(tier===5 && !state5Ready(r)){ el.value=r.durum||""; setMsg("Bu durum için 1-6, 8-11, 13 ve 14-18 sütunlarının hepsi dolu olmalı.",false); return; }
    if(tier>=6 && !state6to11Ready(r)){ el.value=r.durum||""; setMsg("Bu durum için Takip Tarihi/Ekleyen/Takip Notları alanları dolu olmalı.",false); return; }
  }
  if(key==="draft"){
    r[f]=val;
    if(!(r.proje||"").trim() || !(r.musteri||"").trim()) return;
    const rec={blok:BLOK};
    COLS.forEach(c=>{ rec[c.f]=convVal(c.f, r[c.f]==null?"":String(r[c.f])); });
    rec.durum=r.durum||null;
    await eurAlanlari(rec,rec);
    const {data,error}=await sb.from("satis_yd_akis").insert(rec).select();
    if(error){ m.className="msg err"; m.textContent="Kayıt hatası: "+error.message; return; }
    r.id=data[0].id;
    await maybeAutoAdvance(r);
    ROWS.push(r);
    DRAFT=newDraftRow();
    m.className="msg ok"; m.textContent="Kaydedildi ✓";
    render();
    return;
  }
  const upd={}; upd[f]=v;
  let kurOk=true;
  if(f==='net_tutar'||f==='para_birimi'){ setMsg("Güncel kur alınıyor…",true); kurOk=await eurAlanlari(r,upd); }
  const {error}=await sb.from("satis_yd_akis").update(upd).eq("id",r.id);
  if(error){ m.className="msg err"; m.textContent="Kayıt hatası: "+error.message; return; }
  Object.assign(r,upd);
  r[f]=v; if(el){ const c=COLS.find(x=>x.f===f); if(c){ if(c.t==='num') el.value=(v==null?"":money(v)); else if(c.t==='date') el.value=fmtDate(v); } }
  m.className="msg ok"; m.textContent="Kaydedildi ✓"; if(f==='net_tutar') sums();
  if(!kurOk) setMsg("Kaydedildi ama kur alınamadı — € karşılığı boş bırakıldı, tutarı tekrar kaydedin.",false);
  if(f==='durum'){ if(v==="Revizyon İstendi") await revizyonKopyasi(r); render(); return; }
  const advanced=await maybeAutoAdvance(r);
  /* TERMIN-UYARI: iki tarihten biri değişince kırmızı-kalın işareti yeniden hesaplansın */
  if(advanced || f==='istenen_tarih' || f==='teklif_teslim_tarihi') render();
}
/* REVIZYON-KOPYA (2026-09-18): Durum "Revizyon İstendi" yapıldığı anda satırın bir kopyası
   açılır — tutar alanları (Montaj Hariç Net Tutar + donmuş € karşılıkları) BOŞ, Teklif Birimi
   Notları'nın başına "Revizyon" yazılır, kopyanın durumu "Teklif İncelendi" olur ve takip
   günlüğü sıfırlanır. Özgün satır "Revizyon İstendi" olarak olduğu gibi kalır. Kopya, satır
   her "Revizyon İstendi" yapıldığında yeniden üretilir (2. revizyon = 2. kopya). */
async function revizyonKopyasi(r){
  const m=document.getElementById("msg");
  const rec={blok:BLOK};
  COLS.forEach(c=>{ rec[c.f]=(r[c.f]==null?null:r[c.f]); });
  rec.net_tutar=null; rec.net_tutar_eur=null; rec.eur_kur=null; rec.kur_tarihi=null;
  rec.teklif_teslim_tarihi=null; /* revize teklif henüz teslim edilmedi — pano "Verilen (Ad.)" sayımı şişmesin */
  rec.oncelik=1; /* revizyon her zaman en yüksek öncelik (Melih, 2026-09-18) — kolon smallint */
  const eskiNot=String(r.teklif_birimi_notlari||"").trim();
  rec.teklif_birimi_notlari = eskiNot ? ("Revizyon — "+eskiNot) : "Revizyon";
  rec.durum="Teklif İncelendi";
  rec.son_takip_notlari=null; rec.son_takip_tarihi=null;
  const {data,error}=await sb.from("satis_yd_akis").insert(rec).select();
  if(error){ m.className="msg err"; m.textContent="Revizyon kopyası oluşturulamadı: "+error.message; return false; }
  ROWS.push(data[0]);
  m.className="msg ok"; m.textContent="Revizyon kopyası oluşturuldu ✓ (tutar boş · Öncelik 1 · Teklif İncelendi)";
  sums();
  return true;
}
let ARB_FOCUS_ROW=null;
function tkStartEntry(key){
  const r=getRow(key); if(!r) return; const m=document.getElementById("msg");
  if(!r.id){ m.className="msg err"; m.textContent="Önce Proje ve Müşteri yazıp satırı kaydedin."; return; }
  PENDING_TK[key]=true; ARB_FOCUS_ROW=key; render();
}
async function tkCommitEntry(key,val){
  const r=getRow(key); if(!r) return; const m=document.getElementById("msg");
  const txt=(val||"").trim(); if(!txt) return;
  const iso=todayISO();
  const log=tkParseLog(r.son_takip_notlari,r.son_takip_tarihi); log.unshift({t:iso,e:ARB_EKLEYEN,n:txt});
  const payload={ son_takip_notlari:JSON.stringify(log), son_takip_tarihi:iso };
  const {error}=await sb.from("satis_yd_akis").update(payload).eq("id",r.id);
  if(error){ m.className="msg err"; m.textContent=error.message; return; }
  r.son_takip_notlari=payload.son_takip_notlari; r.son_takip_tarihi=iso;
  delete PENDING_TK[key];
  render();
  m.className="msg ok"; m.textContent="Kaydedildi ✓";
}
async function tkSaveNote(key,val){
  const r=getRow(key); if(!r) return; const m=document.getElementById("msg");
  const txt=(val||"").trim(); if(!txt) return;
  const log=tkParseLog(r.son_takip_notlari,r.son_takip_tarihi); if(!log.length) return;
  log[0].n=txt;
  const payload={ son_takip_notlari:JSON.stringify(log) };
  const {error}=await sb.from("satis_yd_akis").update(payload).eq("id",r.id);
  if(error){ m.className="msg err"; m.textContent=error.message; return; }
  r.son_takip_notlari=payload.son_takip_notlari; render();
  m.className="msg ok"; m.textContent="Kaydedildi ✓";
}
async function delRow(i){
  const r=ROWS[i]; if(!r) return;
  if(r.id){ if(!confirm("Bu satır silinsin mi? (geri alınamaz)")) return;
    const {error}=await sb.from("satis_yd_akis").delete().eq("id",r.id);
    if(error){ setMsg("Silinemedi: "+error.message,false); return; }
  }
  ROWS.splice(i,1); render(); setMsg("Silindi",true);
}
load();
</script>

<!-- ARBOR-DRAGSCROLL -->
<style>
  *{scrollbar-width:none;-ms-overflow-style:none}
  ::-webkit-scrollbar{width:0!important;height:0!important;background:transparent}
  body.arb-dragging,body.arb-dragging *{cursor:grabbing!important;user-select:none!important}
</style>
<script>
(function(){
  var el=null,sx=0,sy=0,l=0,t=0,moved=false;
  function skip(n){ return !!(n.closest && n.closest("input,select,textarea,button,a,summary,label,option,.del,.adel,.idel,.ddel,.fdel")); }
  function scrollable(n){
    var st=getComputedStyle(n);
    var okx=(st.overflowX==="auto"||st.overflowX==="scroll") && n.scrollWidth>n.clientWidth+2;
    var oky=(st.overflowY==="auto"||st.overflowY==="scroll") && n.scrollHeight>n.clientHeight+2;
    return okx||oky;
  }
  function start(n,e){
    el=n; sx=e.clientX; sy=e.clientY; l=n.scrollLeft; t=n.scrollTop; moved=false;
    document.body.classList.add("arb-dragging"); e.preventDefault();
  }
  document.addEventListener("mousedown",function(e){
    if(e.button!==0||skip(e.target)) return;
    var n=e.target, hucre=null;
    while(n && n.nodeType===1 && n!==document.body){
      if(scrollable(n)){
        if(!n.closest("td,th")) return start(n,e);
        if(!hucre) hucre=n;
      }
      n=n.parentElement;
    }
    if(hucre) return start(hucre,e);
  },true);
  document.addEventListener("mousemove",function(e){
    if(!el) return;
    var dx=e.clientX-sx, dy=e.clientY-sy;
    if(Math.abs(dx)+Math.abs(dy)>3) moved=true;
    el.scrollLeft=l-dx; el.scrollTop=t-dy;
  });
  document.addEventListener("mouseup",function(){
    if(!el) return; el=null; document.body.classList.remove("arb-dragging");
  });
  document.addEventListener("click",function(e){ if(moved){ moved=false; e.stopPropagation(); e.preventDefault(); } },true);
})();
</script>
<!-- /ARBOR-DRAGSCROLL -->
<script>
/* ARB-HOVERTITLE: sigmayan hucre/alan icerigi hover'da (title) gosterilir - tum pano/form ortak */
(function(){
  function fx(el){
    if(!el||el.nodeType!==1) return;
    var tag=el.tagName;
    if(tag==='INPUT'||tag==='TEXTAREA'){ var v=el.value||''; if(v) el.title=v; else el.removeAttribute('title'); return; }
    if(tag==='SELECT'){ var o=el.options[el.selectedIndex]; var v2=o?o.textContent:''; if(v2) el.title=v2; else el.removeAttribute('title'); return; }
    if(el.children.length) return;
    var t=(el.textContent||'').trim();
    if(t && el.scrollWidth>el.clientWidth+1 && !el.getAttribute('title')) el.title=t;
  }
  function scan(root){ if(root&&root.querySelectorAll) root.querySelectorAll('td,th,div,span,input,select,textarea').forEach(fx); }
  document.addEventListener('input',function(e){ fx(e.target); },true);
  document.addEventListener('change',function(e){ fx(e.target); },true);
  var mo=new MutationObserver(function(muts){ muts.forEach(function(m){ m.addedNodes.forEach(function(n){ if(n.nodeType===1){ fx(n); scan(n); } }); }); });
  function boot(){ mo.observe(document.body,{childList:true,subtree:true}); scan(document.body); }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
})();
</script>
