<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Onur — Sevk Durumu Formu</title>
<style>
  :root{color-scheme:light}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Segoe UI',system-ui,sans-serif;background:#f7f8fa;color:#1c2430;font-size:14px}
  header{background:#16324f;color:#fff;padding:12px 16px}
  header h1{font-size:17px;margin:0;font-weight:700}
  header .sub{font-size:12px;color:#cfe0f0;margin-top:3px}
  .wrap{max-width:1120px;margin:0 auto;padding:14px 16px 48px}
  .bar{background:#fff;border:1px solid #dde3ea;border-radius:10px;padding:10px 14px;margin-bottom:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .bar label{font-weight:600;color:#16324f}
  select{font:inherit;padding:8px 10px;border:1px solid #cdd6df;border-radius:8px}
  .sum{font-size:12.5px;color:#5a6b7d;margin-left:auto}
  .msg{font-size:12.5px;min-height:16px;font-weight:600}
  .msg.ok{color:#2e7d54}.msg.err{color:#b40000}
  .card{background:#fff;border:1px solid #dde3ea;border-radius:10px;overflow:hidden}
  table{border-collapse:collapse;width:100%;font-size:13px}
  thead th{background:#16324f;color:#fff;font-weight:600;font-size:11.5px;padding:8px 9px;text-align:left;white-space:nowrap;position:sticky;top:0}
  td{border-bottom:1px solid #eef1f5;padding:6px 9px;vertical-align:top}
  tbody tr:nth-child(even){background:#fbfcfe}
  .kod{font-weight:700;color:#16324f;white-space:nowrap}
  .num{white-space:nowrap;color:#5a6b7d}
  .grp td{background:#e8eef5;font-weight:700;color:#16324f}
  .prev{color:#8a97a4;font-size:12px}
  input.cell{font:inherit;border:1px solid #86a6c6;border-radius:6px;padding:5px 7px;width:100%;min-width:160px}
  .ed{border:1px dashed #cdd6df;border-radius:6px;padding:5px 7px;min-height:30px;cursor:text;color:#1c2430}
  .ed:hover{border-color:#2e7d54;background:#f6fbf7}
  .ed.empty{color:#b7c6d6}
  .saveflash{outline:2px solid #2e7d54}
  .hint{font-size:12px;color:#8a97a4;margin:8px 2px}
  .load{padding:30px;text-align:center;color:#8a97a4}

html,body{max-width:100vw;overflow-x:hidden}
table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
</style>
</head>
<body>
<header>
  <h1>Onur — Sevk Durumu Formu</h1>
  <div class="sub">Onur Ekinci · Sevke hazır PEM/PRJ kalemlerinin güncel sevk durumunu buradan gir. Hücreye tıkla, yaz, Enter'a bas.</div>
</header>
<div class="wrap">
  <div class="bar">
    <button id="ay_btn" style="background:#8a6100;color:#fff;border:0;border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer;font-size:13px">AYLIK GÜNCELLE</button>
    <span id="msg" class="msg"></span>
    <span class="msg" id="ay_msg"></span>
  </div>
  <div id="list" class="card"><div class="load">Yükleniyor…</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ===== ARBOR FORM KAPISI (2026-08-20) — anon erisim kapali, rol hesabiyla giris ===== */
const ARB_ROLE_EMAIL = "onur.form@arbor.com.tr";
const ARB_STORE = "arbform_" + ARB_ROLE_EMAIL.split("@")[0].replace(/\./g, "_");
const ARB_GATE_SB = supabase.createClient("https://zehysygpqxqmrzangvuc.supabase.co","sb_publishable_ZCcDv4S7qH1hc9tuiv4__A_YVxmIpWc",{auth:{persistSession:true,autoRefreshToken:true,storageKey:ARB_STORE}});
const ARB_MB = "int@arbor.com.tr";
/* panolarin varsayilan oturumu (ayni origin, varsayilan storageKey) */
const ARB_MB_SB = supabase.createClient("https://zehysygpqxqmrzangvuc.supabase.co","sb_publishable_ZCcDv4S7qH1hc9tuiv4__A_YVxmIpWc");
var ARB_ACTIVE = ARB_GATE_SB;
/* form kodu kendi createClient cagirsa bile aktif oturumlu istemci doner */
supabase.createClient = function(){ return ARB_ACTIVE; };
function arbGateUI(msg){
  var d=document.createElement("div"); d.id="arb-gate";
  d.style.cssText="position:fixed;inset:0;background:#16324f;z-index:99999;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',system-ui,sans-serif";
  d.innerHTML='<div style="background:#fff;color:#1c2430;padding:22px;border-radius:12px;width:310px;box-shadow:0 10px 40px rgba(0,0,0,.3)">'
    +'<div style="font-weight:700;font-size:16px;margin-bottom:3px">Arbor — Form Girisi</div>'
    +'<div style="font-size:12px;color:#5a6b7d;margin-bottom:12px">'+ARB_ROLE_EMAIL+'</div>'
    +'<input id="arb-pw" type="password" placeholder="Parola" autocomplete="current-password" style="width:100%;font:inherit;padding:9px;border:1px solid #cdd6df;border-radius:8px">'
    +'<button id="arb-go" style="width:100%;margin-top:10px;font:inherit;font-weight:600;background:#2e7d54;color:#fff;border:0;border-radius:8px;padding:9px;cursor:pointer">Giris</button>'
    +'<div id="arb-msg" style="font-size:12px;color:#b40000;min-height:16px;margin-top:8px">'+(msg||"")+'</div></div>';
  document.body.appendChild(d);
  var go=async function(){
    var pw=document.getElementById("arb-pw").value;
    document.getElementById("arb-msg").style.color="#5a6b7d";
    document.getElementById("arb-msg").textContent="Giris yapiliyor...";
    var r=await ARB_GATE_SB.auth.signInWithPassword({email:ARB_ROLE_EMAIL,password:pw});
    if(r.error){ document.getElementById("arb-msg").style.color="#b40000"; document.getElementById("arb-msg").textContent="Parola hatali"; return; }
    location.reload();
  };
  document.getElementById("arb-go").onclick=go;
  document.getElementById("arb-pw").onkeydown=function(e){ if(e.key==="Enter"){ e.preventDefault(); go(); } };
  setTimeout(function(){ var i=document.getElementById("arb-pw"); if(i) i.focus(); },50);
}
function ARB_BOOT(){ (async function(){
  var s=await ARB_GATE_SB.auth.getSession();
  var em=(s && s.data && s.data.session && s.data.session.user && s.data.session.user.email || "").toLowerCase();
  if(em!==ARB_ROLE_EMAIL){
    var m=await ARB_MB_SB.auth.getSession();
    var mem=(m && m.data && m.data.session && m.data.session.user && m.data.session.user.email || "").toLowerCase();
    if(mem===ARB_MB){ ARB_ACTIVE=ARB_MB_SB; em=mem; }
  }
  if(em===ARB_ROLE_EMAIL || em===ARB_MB){ (0,eval)(document.getElementById("arbmain").textContent); }
  else { arbGateUI(); }
})(); }
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", ARB_BOOT); else ARB_BOOT();
</script>
<script type="text/plain" id="arbmain">
const sb = supabase.createClient("https://zehysygpqxqmrzangvuc.supabase.co","sb_publishable_ZCcDv4S7qH1hc9tuiv4__A_YVxmIpWc");
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fd=d=>{ if(!d) return ""; const x=new Date(d); return isNaN(x)?"":String(x.getDate()).padStart(2,"0")+"."+String(x.getMonth()+1).padStart(2,"0")+"."+String(x.getFullYear()).slice(2); };
let ROWS=[];
async function load(){
  const [{data,error},dg]=await Promise.all([
    sb.from("hazir_pem_prj").select("*"),
    sb.from("erp_yukleme").select("damga").order("damga",{ascending:false}).limit(1)
  ]);
  if(error){ document.getElementById("list").innerHTML='<div class="load">Hata: '+esc(error.message)+'</div>'; return; }
  /* Hazır PEM/PRJ panosuyla AYNI kural: yalnız hazir_tarihi < (en yeni ERP damgası − 10 gün) görünür; band-içi + gelecek + boş gizli */
  const _dmg=String((dg&&dg.data&&dg.data[0]&&dg.data[0].damga)||"");
  const _ref=/^\d{6}$/.test(_dmg)? new Date(2000+Number(_dmg.slice(0,2)),Number(_dmg.slice(2,4))-1,Number(_dmg.slice(4,6))) : new Date();
  _ref.setHours(23,59,59,999);
  const _cut=new Date(_ref); _cut.setHours(0,0,0,0); _cut.setDate(_cut.getDate()-10);
  ROWS=(data||[]).filter(r=>{ const dt=r.hazir_tarihi; if(!dt) return false; const d=new Date(dt); if(isNaN(d)) return false; return !(d>=_cut); });
  render();
}
function render(){
  const rows=ROWS;
  let html='<table><thead><tr><th>Tür</th><th>No</th><th>Proje Adı</th><th>Ek Bilgi</th><th>Adet</th><th>Hazır Tarihi</th><th>Önceki</th><th>Güncel Sevk Durumu</th></tr></thead><tbody>';
  let last="";
  rows.forEach((r,i)=>{
    if(r.tur!==last){ last=r.tur; html+='<tr class="grp"><td colspan="8">'+esc(r.tur)+'</td></tr>'; }
    const g=r.onur_guncel||"";
    html+='<tr data-i="'+ROWS.indexOf(r)+'">'
      +'<td class="kod">'+esc(r.tur)+'</td>'
      +'<td class="kod">'+esc(r.no)+'</td>'
      +'<td>'+esc(r.proje_adi)+'</td>'
      +'<td>'+esc(r.ek_bilgi)+'</td>'
      +'<td class="num">'+esc(r.adet)+'</td>'
      +'<td class="num">'+fd(r.hazir_tarihi)+'</td>'
      +'<td class="prev">'+esc(r.onur_onceki||"")+'</td>'
      +'<td><div class="ed '+(g?"":"empty")+'" data-i="'+ROWS.indexOf(r)+'">'+(g?esc(g):"+ durum")+'</div></td>'
      +'</tr>';
  });
  html+='</tbody></table>';
  const list=document.getElementById("list"); list.innerHTML=html;
  list.querySelectorAll(".ed").forEach(el=>el.onclick=()=>edit(el));
}
function edit(el){
  if(el.querySelector("input")) return;
  const i=parseInt(el.dataset.i), r=ROWS[i];
  const cur=r.onur_guncel||"";
  const inp=document.createElement("input"); inp.className="cell"; inp.value=cur;
  el.innerHTML=""; el.appendChild(inp); inp.focus(); inp.select();
  const commit=async()=>{
    const val=inp.value.trim();
    const rec={tur:r.tur, kalem_key:String(r.no), guncel:val||null, updated_at:new Date().toISOString()};
    const {error}=await sb.from("sevk_durumu_onur").upsert(rec,{onConflict:"tur,kalem_key"});
    const msg=document.getElementById("msg");
    if(error){ msg.className="msg err"; msg.textContent=error.message; el.textContent=cur||"+ durum"; return; }
    r.onur_guncel=val; msg.className="msg ok"; msg.textContent="Kaydedildi ("+r.tur+" "+r.no+")"; setTimeout(()=>msg.textContent="",1500);
    el.className="ed "+(val?"":"empty"); el.textContent=val||"+ durum"; el.classList.add("saveflash"); setTimeout(()=>el.classList.remove("saveflash"),400);
  };
  inp.onblur=commit;
  inp.onkeydown=e=>{ if(e.key==="Enter"){e.preventDefault();inp.blur();} if(e.key==="Escape"){el.className="ed "+(cur?"":"empty");el.textContent=cur||"+ durum";} };
}
document.getElementById("ay_btn").onclick=async()=>{
  if(!confirm("AYLIK GÜNCELLE\n\nHer kalemin önceki→güncel sevk durumu değişiminin özeti üretilecek ve panoya yazılacak; sonra güncel değer 'önceki'ye kaydırılacak. Ayda bir yapılır. Devam?")) return;
  const btn=document.getElementById("ay_btn"), m=document.getElementById("ay_msg");
  btn.disabled=true; m.className="msg ok"; m.textContent="Özetler üretiliyor…";
  try{
    const {data,error}=await sb.functions.invoke("sevk-degisim-ozet",{body:{}});
    if(error||!(data&&data.ok)){ m.className="msg err"; m.textContent="Hata: "+((error&&error.message)||(data&&data.error)||"bilinmiyor"); }
    else{ m.className="msg ok"; m.textContent=data.note||("Tamam ("+data.updated+" kalem)"); load(); }
  }catch(e){ m.className="msg err"; m.textContent="Hata: "+e; }
  btn.disabled=false;
};
load();
</script>
<!-- ARBOR-DRAGSCROLL -->
<style>
  /* Kaydirma cubuklari gizli — kaydirma tekerlek + surukleme ile yapilir */
  *{scrollbar-width:none;-ms-overflow-style:none}
  ::-webkit-scrollbar{width:0!important;height:0!important;background:transparent}
  body.arb-dragging,body.arb-dragging *{cursor:grabbing!important;user-select:none!important}
</style>
<script>
(function(){
  var el=null,sx=0,sy=0,l=0,t=0,moved=false;
  function skip(n){ return !!(n.closest && n.closest("input,select,textarea,button,a,summary,label,option,.del,.adel,.idel,.ddel,.fdel")); }
  function scrollable(n){
    var st=getComputedStyle(n);
    var okx=(st.overflowX==="auto"||st.overflowX==="scroll") && n.scrollWidth>n.clientWidth+2;
    var oky=(st.overflowY==="auto"||st.overflowY==="scroll") && n.scrollHeight>n.clientHeight+2;
    return okx||oky;
  }
  document.addEventListener("mousedown",function(e){
    if(e.button!==0||skip(e.target)) return;
    var n=e.target;
    while(n && n.nodeType===1 && n!==document.body){
      /* hucre ici mini-kaydiricilari atla: kaydirilmasi istenen tablo/kutu kapsayicisidir */
      if(!(n.closest("td,th")) && scrollable(n)){
        el=n; sx=e.clientX; sy=e.clientY; l=n.scrollLeft; t=n.scrollTop; moved=false;
        document.body.classList.add("arb-dragging"); e.preventDefault(); return;
      }
      n=n.parentElement;
    }
  },true);
  document.addEventListener("mousemove",function(e){
    if(!el) return;
    var dx=e.clientX-sx, dy=e.clientY-sy;
    if(Math.abs(dx)+Math.abs(dy)>3) moved=true;
    el.scrollLeft=l-dx; el.scrollTop=t-dy;
  });
  document.addEventListener("mouseup",function(){
    if(!el) return; el=null; document.body.classList.remove("arb-dragging");
  });
  document.addEventListener("click",function(e){ if(moved){ moved=false; e.stopPropagation(); e.preventDefault(); } },true);
})();
</script>
<!-- /ARBOR-DRAGSCROLL -->
</body>
</html>
