<script>
/* ARB-AD-YAZIM (2026-09-22, Melih): proje / müşteri / firma adları her kelimenin yalnız baş harfi büyük,
   kısaltmalar tamamı büyük. Supabase REST (/rest/v1/) yanıtlarında ve yazma gövdelerinde (POST/PATCH/PUT)
   proje · proje_adi · musteri · firma alanlarına (fiyat_musteri_sinif'te ad) uygulanır — tek kaynak: kod/_arb_ad_yazim.js */
(function(){
  if(window.ARB_AD) return;
  var AKR=("SCI SAS SARL SA SASU EURL SNC SEM SPL SPLA ZAC PEM PST MVT AÜP OE ÖB MK MB EU UK USA TR FR AŞ LTD LLC PLC GMBH AG BV NV SPA SRL "+
    "HLM OPH OPAC EHPAD CHU CROUS RATP SNCF IDF ICF HQE BBC CA ILM FCAI CLC CBC LCB BAT BTP TRT KDV SGDB SVM LMP RBKC MTC GTM NHS PVC "+
    "ARGE ARB YD SÖ TOKİ İBB İTÜ ODTÜ ENSA ESSEC ENS HEC IUT CFA RTE EDF GDF CCI CMA SEMIIC SAEM SPIE CPAM CAF UGC ARS KYK TMO SGK TCDD İSKİ AVM ÖSYM THY PTT MSB TBMM YTÜ MSGSÜ").split(" ");
  var AK={}; AKR.forEach(function(w){ AK[w]=1; });
  var KUCUK={ST:1,MR:1,DR:1,SR:1,JR:1,MRS:1,MS:1};           /* sesli harfsiz ama kısaltma sayılmayanlar → St, Mr … */
  var TRH=/[ğĞşŞıİçÇöÖüÜ]/, SESLI=/[aeiouyàâäéèêëîïôöùûüÿıAEIOUYÀÂÄÉÈÊËÎÏÔÖÙÛÜŸİ]/, ROMA=/^(I{1,3}|IV|VI{0,3}|IX|XI{0,3}|XIV|XV)$/;
  function up(w,tr){ return tr?w.toLocaleUpperCase("tr"):w.toUpperCase(); }
  function lo(w,tr){ return tr?w.toLocaleLowerCase("tr"):w.toLowerCase(); }
  var OLAGAN={};  /* karışık metinde büyük yazılsa da kısaltma sayılmayan sık kelimeler */
  ("LE LA LES DE DU DES SUR SOUS AUX AU ET EN UN UNE THE OF AND FOR ON IN AT TO VON DER DIE DAS UND IM AM ZUM ZUR VE İLE EVİ BEY HAN KAT LOT VIA DEL DI DA LOS EL SAN SUD NORD EST OUEST").split(" ").forEach(function(w){ OLAGAN[w]=1; });
  function kelime(w,karisik,tr){
    if(/\d/.test(w)) return w;                                   /* rakamlı (P19, I3F, 68s) aynen */
    var U=up(w,tr);
    if(AK[U]) return U;
    if(w.length===1) return U;                                   /* tek harf (Lot F, Y Blok) */
    if(ROMA.test(U)) return U;                                   /* III. Faz */
    if(!SESLI.test(w) && !KUCUK[U]) return U;                    /* sesli harfsiz: SVM, LMP, RBKC */
    if(karisik && w===U && w.length<=3 && !OLAGAN[U]) return U;                /* karışık yazılmış metinde büyük yazılmış kısa kelime = kısaltma */
    var l=lo(w,tr); return up(l.charAt(0),tr)+l.slice(1);
  }
  window.ARB_AD=function(s){
    if(s==null||typeof s!=="string") return s;
    var t=s.replace(/\s+/g," ").trim(); if(!t) return t;
    var harf=t.replace(/[^\p{L}]/gu,""), karisik=harf!==harf.toUpperCase()&&harf!==harf.toLowerCase(), tr=TRH.test(t);  /* Türkçe harf içeren metin → tr yerel ayarı (YAPI → Yapı) */
    return t.replace(/[\p{L}\p{M}\p{N}]+/gu,function(w){ return kelime(w,karisik,tr); });
  };
  var ALAN={proje:1,proje_adi:1,musteri:1,firma:1};
  function donus(o,tablo){
    if(Array.isArray(o)){ for(var i=0;i<o.length;i++) donus(o[i],tablo); return o; }
    if(o&&typeof o==="object"){ for(var k in o){ if(typeof o[k]==="string"&&(ALAN[k]||(k==="ad"&&tablo==="fiyat_musteri_sinif"))) o[k]=window.ARB_AD(o[k]); } }
    return o;
  }
  window.ARB_AD_DONUS=donus;
  var of=window.fetch.bind(window);
  window.fetch=function(u,o){
    var url=String((u&&u.url)||u||""), m=url.match(/\/rest\/v1\/([A-Za-z0-9_]+)/), tablo=m?m[1]:null;
    if(!tablo) return of(u,o);
    try{ var me=((o&&o.method)||"GET").toUpperCase();
      if(o&&typeof o.body==="string"&&/^(POST|PATCH|PUT)$/.test(me)&&tablo!=="rpc"){ o=Object.assign({},o,{body:JSON.stringify(donus(JSON.parse(o.body),tablo))}); } }catch(e){}
    return of(u,o).then(function(r){
      var ct=r.headers.get("content-type")||"";
      if(!r.ok||ct.indexOf("json")<0) return r;
      return r.clone().text().then(function(t){ if(!t) return r;
        try{ return new Response(JSON.stringify(donus(JSON.parse(t),tablo)),{status:r.status,statusText:r.statusText,headers:r.headers}); }catch(e){ return r; } });
    });
  };
})();
</script>
<script>
/* ARB-KOD-GIRIS (23.09.2026): forma giris = kisisel 6 haneli kod (App > Referans > Kisiler > Sifre).
   form-giris edge fonksiyonu kodu dogrular, yetkiyi form_erisim'den kontrol eder, rolu otomatik secer ve
   rol hesabi icin tek kullanimlik token doner; burada verifyOtp ile oturum acilir. Rol hesaplarinin parolasi yoktur. */
window.ARB_FORM_YOL=(function(){ var m=/\/app\/([^\/]+)\//.exec(location.pathname); return m?m[1]+"/":""; })();
window.ARB_KOD_GIRIS=async function(cli,kod){
  kod=String(kod==null?"":kod).replace(/\D/g,"");
  if(kod.length!==6) return {error:{message:"Kod 6 haneli olmal\u0131d\u0131r."}};
  try{
    var r=await fetch("https://zehysygpqxqmrzangvuc.supabase.co/functions/v1/form-giris",{method:"POST",cache:"no-store",
      headers:{"Content-Type":"application/json",apikey:"sb_publishable_ZCcDv4S7qH1hc9tuiv4__A_YVxmIpWc"},
      body:JSON.stringify({form:window.ARB_FORM_YOL,kod:kod})});
    var j={}; try{ j=await r.json(); }catch(e){}
    if(!r.ok||!j.ok||!j.token_hash) return {error:{message:j.hata||"Kod hatal\u0131."}};
    var v=await cli.auth.verifyOtp({token_hash:j.token_hash,type:"magiclink"});
    if(v.error) return {error:{message:"Giri\u015f a\u00e7\u0131lamad\u0131: "+v.error.message}};
    try{ localStorage.setItem("arb_kisi_"+window.ARB_FORM_YOL,JSON.stringify({kod:j.kisi,ad:j.ad,rol:j.rol})); }catch(e){}
    return {error:null,data:j};
  }catch(e){ return {error:{message:"Ba\u011flant\u0131 hatas\u0131."}}; }
};
window.ARB_KISI_AL=function(em){ try{ var k=JSON.parse(localStorage.getItem("arb_kisi_"+window.ARB_FORM_YOL)||"null"); return (k&&(!em||k.rol===em))?k:null; }catch(e){ return null; } };
</script>

const sb=supabase.createClient("https://zehysygpqxqmrzangvuc.supabase.co","sb_publishable_ZCcDv4S7qH1hc9tuiv4__A_YVxmIpWc");
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const parseNum=s=>{ if(s==null) return null; let t=String(s).replace(/[^0-9,.\-]/g,""); if(t.indexOf(",")>-1&&t.indexOf(".")>-1){ t=t.replace(/\./g,"").replace(",","."); } else { t=t.replace(",","."); } const v=parseFloat(t); return isNaN(v)?null:v; };
const eur=n=>{ const v=Number(n)||0; return v.toLocaleString("tr-TR",{maximumFractionDigits:2})+" €"; };

/* ===== PRİM KURALLARI (tek kaynak) — Mali→MK Prim panosuyla birebir aynı =====
   Memnuniyet : Oran% × %0,75 × (Kontrat HT ÷ 12)   → 800.000 @%100 = 500
   TS Ekstra  : %0,2 × TS tutarı                     → 150.000 = 300
   FR Satış   : %0,05 × Kontrat HT                   → 600.000 = 300
   Diğer Satış: %0,10 × Kontrat HT                   → 200.000 = 200
   Toplam = dört kriterin tümü (FR dahil).                                    */

  memnuniyet:r=> (Number(parseNum(r.memnuniyet_orani))||0)/100 * 0.0075 * ((Number(parseNum(r.kontrat_tutari))||0)/12),
  ts:r=> 0.002  * (Number(parseNum(r.ts_tutari))||0),
  fr:r=> 0.0005 * (Number(parseNum(r.kontrat_tutari))||0),
  diger:r=> 0.001 * (Number(parseNum(r.kontrat_tutari))||0)
};
const BLOCKS=[
 {tur:"memnuniyet",cls:"b1",ad:"1 · Müşteri Memnuniyeti",formula:"Prim = Memnuniyet Oranı % × %0,75 × (Kontrat HT ÷ 12)",

 {tur:"ts",cls:"b2",ad:"2 · TS Ekstra İşlerin Kabul Ettirilmesi",formula:"Prim = %0,2 × TS Tutarı",
  cols:[["firma","Firma","text"],["proje","Proje","text"],["ts_notlari","TS Notları","ta"],["ts_tutari","TS Tutarı (€)","num"]]},
 {tur:"fr",cls:"b3",ad:"3 · FR (Fransa) Satış",formula:"Prim = %0,05 × Kontrat HT",
  cols:[["firma","Firma","text"],["proje","Proje","text"],["kontrat_tarihi","Kontrat Tarihi","date"],["kontrat_tutari","Kontrat Tutarı HT (€)","num"]]},
 {tur:"diger",cls:"b4",ad:"4 · Diğer Satış",formula:"Prim = %0,10 × Kontrat HT",
  cols:[["firma","Firma","text"],["proje","Proje","text"],["kontrat_tarihi","Kontrat Tarihi","date"],["kontrat_tutari","Kontrat Tutarı HT (€)","num"]]}
];
const DATA={memnuniyet:[],ts:[],fr:[],diger:[]};
function blankRow(b){ const o={}; b.cols.forEach(c=>o[c[0]]=""); return o; }

function rowPrim(tur,r){ return PRIM[tur](r); }
function blockTotal(tur){ return DATA[tur].reduce((a,r)=>a+rowPrim(tur,r),0); }
function grandTotal(){ return BLOCKS.reduce((a,b)=>a+blockTotal(b.tur),0); }
function renderCell(b,i,c){
  const [f,lbl,ty]=c, r=DATA[b.tur][i], v=r[f];
  if(ty==="ta") return '<td><textarea class="cell" data-f="'+f+'">'+esc(v)+'</textarea></td>';
  if(ty==="num") return '<td class="colp num"><input class="cell" data-f="'+f+'" style="width:120px" value="'+esc(v)+'"></td>';
  if(ty==="date") return '<td class="colp"><input class="cell" type="date" data-f="'+f+'" style="width:150px" value="'+esc(v)+'"></td>';
  return '<td><input class="cell" data-f="'+f+'" value="'+esc(v)+'"></td>';
}
function renderBlock(b){
  const head=b.cols.map(c=>'<th>'+esc(c[1])+'</th>').join("")+'<th class="num">Prim (€)</th><th class="colp"></th>';
  let body="";
  DATA[b.tur].forEach((r,i)=>{
    body+='<tr data-i="'+i+'">'+b.cols.map(c=>renderCell(b,i,c)).join("")
      +'<td class="prim" data-prim>'+eur(rowPrim(b.tur,r))+'</td>'
      +'<td class="colp"><button class="del" title="Satırı sil">✕</button></td></tr>';
  });
  if(!DATA[b.tur].length) body='<tr><td colspan="'+(b.cols.length+2)+'" style="color:#8a97a4;padding:12px 10px">Henüz satır yok — “+ satır” ile ekle.</td></tr>';
  return '<div class="blk '+b.cls+'" data-tur="'+b.tur+'">'
    +'<h2>'+esc(b.ad)+' <span class="formula">— '+esc(b.formula)+'</span></h2>'
    +'<div class="tblwrap"><table><thead><tr>'+head+'</tr></thead><tbody>'+body+'</tbody></table></div>'
    +'<div class="blkfoot"><button class="btn sec addr">+ satır</button>'
    +'<span class="subt">Blok primi: <b data-bt>'+eur(blockTotal(b.tur))+'</b> · <span data-bc>'+DATA[b.tur].length+'</span> satır</span></div></div>';
}
function render(){
  document.getElementById("blocks").innerHTML=BLOCKS.map(renderBlock).join("");
  document.querySelectorAll(".blk").forEach(blk=>{
    const tur=blk.dataset.tur, b=BLOCKS.find(x=>x.tur===tur);
    blk.querySelectorAll("[data-f]").forEach(el=>{
      const i=+el.closest("tr").dataset.i, f=el.dataset.f, ev=el.tagName==="TEXTAREA"?"input":(el.type==="date"?"change":"input");
      el.addEventListener(ev,()=>{ DATA[tur][i][f]=el.value; recalcRow(blk,i); });
      el.addEventListener("change",()=>{ saveRow(tur,i); });
      el.addEventListener("blur",()=>{ saveRow(tur,i); });
    });
    blk.querySelectorAll(".del").forEach(btn=>btn.onclick=async()=>{
      const i=+btn.closest("tr").dataset.i, r=DATA[tur][i];
      if(r && r.id){ const {error}=await sb.from("mk_faaliyet").delete().eq("id",r.id);
        if(error){ setMsg("Silinemedi: "+error.message,false); return; } }
      DATA[tur].splice(i,1); render(); setMsg("Satır silindi.",true);
    });
    blk.querySelector(".addr").onclick=()=>{ DATA[tur].push(blankRow(b)); render(); const rows=blk.querySelectorAll("tbody input.cell"); };
  });
  refreshTotals();
}
function recalcRow(blk,i){
  const tur=blk.dataset.tur;
  const cell=blk.querySelector('tr[data-i="'+i+'"] [data-prim]');
  if(cell) cell.textContent=eur(rowPrim(tur,DATA[tur][i]));
  refreshTotals(blk);
}
function refreshTotals(blk){
  if(blk){ const tur=blk.dataset.tur; const bt=blk.querySelector("[data-bt]"); if(bt) bt.textContent=eur(blockTotal(tur)); }
  else document.querySelectorAll(".blk").forEach(b=>{ const t=b.querySelector("[data-bt]"); if(t) t.textContent=eur(blockTotal(b.dataset.tur)); });
  const g=document.getElementById("grand"); if(g) g.textContent=eur(grandTotal());
}
function setMsg(t,ok){ const m=document.getElementById("msg"); m.className="msg "+(ok?"ok":"err"); m.textContent=t; }
function isFilled(tur,r){
  if(tur==="memnuniyet"||tur==="ts") return (r.firma||r.proje||"").trim()!=="" || parseNum(r.kontrat_tutari)!=null || parseNum(r.ts_tutari)!=null;
  return (r.firma||r.proje||"").trim()!=="" || parseNum(r.kontrat_tutari)!=null;
}
/* SATIR BAZLI ANINDA KAYIT (27.08.2026): alttaki "Toplam Prim / Kaydet / Temizle" bandı kalktı;
   her hücre değişiminde dolu satır mk_faaliyet'e yazılır (id yoksa INSERT, varsa UPDATE). */
function mkRow(tur,r){
  return {tur:tur,
    firma:(r.firma||"").trim()||null, proje:(r.proje||"").trim()||null,
    memnuniyet_kriterleri:(r.memnuniyet_kriterleri||"").trim()||null,
    memnuniyet_orani:parseNum(r.memnuniyet_orani),
    ts_notlari:(r.ts_notlari||"").trim()||null, ts_tutari:parseNum(r.ts_tutari),
    kontrat_tarihi:(r.kontrat_tarihi||"")||null, kontrat_tutari:parseNum(r.kontrat_tutari)};
}
async function saveRow(tur,i){
  const r=DATA[tur][i]; if(!r) return;
  if(!isFilled(tur,r)) return;
  const body=mkRow(tur,r);
  if(r.id){
    const {error}=await sb.from("mk_faaliyet").update(body).eq("id",r.id);
    if(error){ setMsg("Kaydedilemedi: "+error.message,false); return; }
  }else{
    const {data,error}=await sb.from("mk_faaliyet").insert(body).select("id").limit(1);
    if(error){ setMsg("Kaydedilemedi: "+error.message,false); return; }
    if(data&&data[0]) r.id=data[0].id;
  }
  setMsg("Kaydedildi.",true); setTimeout(()=>setMsg("",true),1500);
}
async function loadMK(){
  const {data,error}=await sb.from("mk_faaliyet").select("*").order("id");
  if(error){ setMsg("Kayıtlar okunamadı: "+error.message,false); return; }
  BLOCKS.forEach(b=>DATA[b.tur]=[]);
  (data||[]).forEach(r=>{ if(DATA[r.tur]) DATA[r.tur].push(Object.assign({},r,{
    memnuniyet_orani:r.memnuniyet_orani==null?"":String(r.memnuniyet_orani),
    ts_tutari:r.ts_tutari==null?"":String(r.ts_tutari),
    kontrat_tutari:r.kontrat_tutari==null?"":String(r.kontrat_tutari),
    kontrat_tarihi:r.kontrat_tarihi||"" })); });
  render();
}

/* ===== ARBOR-ONAY — blok bazlı "bilgiler güncel" onayı (26.08.2026, Melih kararı) =====
   Her blokta EKLE düğmesinin sağında bir onay düğmesi durur. Aylık/haftalık güncelleme
   düğmesi ancak BÜTÜN blok onayları verilmişse çalışır; eksikse uyarı verir ve durur.
   Onay dönem bazlı localStorage'da tutulur (sayfa yenilense de kalır), başarılı
   güncellemeden sonra sıfırlanır. Yeni blok eklenirse tek satır onayKur(...) yeter. */
const ONAY_FORM="mk";
const ONAY_DONEM=(function(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); })();
document.head.insertAdjacentHTML("beforeend","<style>.onaybtn{background:#fff;border:1.5px solid #0a6b57;color:#0a6b57;border-radius:8px;padding:7px 13px;font-weight:700;cursor:pointer;font-size:12.5px;line-height:1.3;text-align:left}.onaybtn:hover{background:#eaf6f1}.onaybtn.ok{background:#0a6b57;border-color:#0a6b57;color:#fff}</style>");
const ONAYLAR={};
function onayKey(id){ return "arb_onay_"+ONAY_FORM+"_"+id+"_"+ONAY_DONEM; }
function onayVar(id){ try{ return localStorage.getItem(onayKey(id))==="1"; }catch(e){ return false; } }
function onayKur(hedefId,id,ad){
  const h=document.getElementById(hedefId); if(!h) return;
  const b=document.createElement("button"); b.type="button"; b.className="onaybtn"; b.id="onay_"+id;
  ONAYLAR[id]={ad:ad,el:b};
  const ciz=()=>{ const v=onayVar(id); b.classList.toggle("ok",v); b.textContent=(v?"✓ ":"")+ad; };
  b.onclick=()=>{ const v=!onayVar(id); try{ v?localStorage.setItem(onayKey(id),"1"):localStorage.removeItem(onayKey(id)); }catch(e){} ciz(); };
  ciz(); h.insertAdjacentElement("afterend",b);
}
function onayEksik(){ return Object.keys(ONAYLAR).filter(id=>!onayVar(id)).map(id=>ONAYLAR[id].ad); }
function onayKapi(){ const e=onayEksik(); if(e.length){ alert("Güncelleme yapılamadı.\n\nÖnce aşağıdaki onay düğmelerine basmalısınız:\n\n• "+e.join("\n\n• ")); return false; } return true; }
function onaySifirla(){ Object.keys(ONAYLAR).forEach(id=>{ try{ localStorage.removeItem(onayKey(id)); }catch(e){} const o=ONAYLAR[id]; o.el.classList.remove("ok"); o.el.textContent=o.ad; }); }
onayKur("sanH2","santiye","Tıkanmış Şantiyelere İlişkin Aşağıdaki Bilgilerin Güncel Olduğunu Onaylıyorum");
onayKur("a1","alacak","Yurt Dışı Alacaklara İlişkin Aşağıdaki Bilgilerin Güncel Olduğunu Onaylıyorum");

/* ===== Aylık güncelleme: mk_ay_islendi (append) + mk-faaliyet-mail ===== */
const AYLAR=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const DONEM=AYLAR[new Date().getMonth()]+" "+new Date().getFullYear();
document.getElementById("ayBtn").onclick=async()=>{
  const m=document.getElementById("ayMsg"), btn=document.getElementById("ayBtn");
  if(!onayKapi()) return;
  if(!confirm('"'+DONEM+'" ayı için aylık güncelleme işaretlenecek ve Melih\'e mail atılacak.\n\nYalnızca aylık güncelleme için basın; düzeltme/revizyon için BASMAYIN.\n\nOnaylıyor musunuz?')) return;
  btn.disabled=true; m.className="msg"; m.textContent="İşaretleniyor…";
  const {error}=await sb.from("mk_ay_islendi").insert({ay:DONEM});
  if(error){ btn.disabled=false; m.className="msg err"; m.textContent="Hata: "+error.message; return; }
  /* Şantiye MK durumunu panoya aktar: her şantiye için güncel MK → 'son', önceki 'son' → 'geçmiş' (yalnız MK) */
  let snapNote="";
  try{ const sr=await sb.rpc("mk_santiye_snapshot_kapat");
    if(sr.error){ snapNote=" (şantiye aktarımı hatası: "+sr.error.message+")"; }
    else{ snapNote=" · "+(sr.data||0)+" şantiye panoya aktarıldı"; }
  }catch(e){ snapNote=" (şantiye aktarımı hatası)"; }
  let note="";
  try{ const r=await sb.functions.invoke("mk-faaliyet-mail",{body:{ay:DONEM}});
    if(r.error){ note=" (mail gönderilemedi: "+(r.error.message||r.error)+")"; }
  }catch(e){ note=" (mail gönderilemedi)"; }
  sLoadAkis(); onaySifirla();
  btn.disabled=false; m.className="msg ok"; m.textContent="✓ "+DONEM+" ayı işaretlendi."+snapNote+note;
};
/* ===== Tıkanmış Şantiyeler — MK durum girişi (santiye_durum_log, kim='MK') ===== */
function sMsg(t,ok){ const m=document.getElementById("s_msg"); m.className="msg "+(ok?"ok":"err"); m.style.color=ok?"#2e7d54":"#b40000"; m.textContent=t; if(ok) setTimeout(()=>{m.textContent="";},3000); }
const sDk=t=>t?String(t).slice(8,10)+"."+String(t).slice(5,7)+"."+String(t).slice(2,4):"";
async function sLoadAkis(){
  const {data,error}=await sb.from("santiye_durum_akis").select("*").order("tarih",{ascending:false}).order("id",{ascending:false});
  const el=document.getElementById("s_akis");
  if(error){ el.innerHTML='<div class="hint">Akış okunamadı.</div>'; return; }
  /* Şantiye başına TEK satır (pivot): en güncel ÖB + en güncel MK yan yana. Veri tarih desc, id desc sıralı. */
  const piv={};
  (data||[]).forEach(r=>{ const k=r.santiye_id; if(!(k in piv)) piv[k]={sid:k,santiye:r.santiye,ob:null,mk:null};
    if(r.kim==="OB"&&!piv[k].ob) piv[k].ob=r;
    if(r.kim==="MK"&&!piv[k].mk) piv[k].mk=r; });
  const list=Object.values(piv).sort((a,b)=>String(a.santiye||"").localeCompare(String(b.santiye||""),"tr"));
  if(!list.length){ el.innerHTML='<div class="hint">Henüz durum kaydı yok.</div>'; return; }
  const dc=v=>'<div class="sxc">'+esc(v||"")+'</div>';
  const cnt=document.getElementById("cs"); if(cnt) cnt.textContent="("+list.length+")";
  /* MK "Durum / Gelişme" hücresi düzenlenebilir (27.08.2026): ayrı giriş kutusu kaldırıldı,
     hücreye tıklanıp yazılınca santiye_durum_log'a BUGÜNÜN tarihiyle yeni MK kaydı düşer. */
  el.innerHTML='<div class="tblwrap"><table class="pivt"><thead>'
    +'<tr><th rowspan="2" class="ssan">Şantiye</th><th colspan="2" class="grp">ÖB</th><th colspan="2" class="grp mkg">MK</th></tr>'
    +'<tr><th class="sdt">Tarih</th><th>Durum / Gelişme</th><th class="sdt">Tarih</th><th>Durum / Gelişme</th></tr></thead><tbody>'
    +list.map(p=>'<tr><td class="ssan">'+esc(p.santiye)+'</td>'
      +'<td class="sdt">'+(p.ob?sDk(p.ob.tarih):"")+'</td><td>'+dc(p.ob&&p.ob.durum)+'</td>'
      +'<td class="sdt">'+(p.mk?sDk(p.mk.tarih):"")+'</td>'
      +'<td><div class="sxc sed'+((p.mk&&p.mk.durum)?'':' bos')+'" data-sid="'+p.sid+'">'+((p.mk&&p.mk.durum)?esc(p.mk.durum):"+ durum")+'</div></td></tr>').join("")
    +'</tbody></table></div>';
  el.querySelectorAll(".sed").forEach(d=>d.onclick=()=>sEdit(d));
}
function sEdit(el){
  if(el.querySelector("textarea")) return;
  const sid=parseInt(el.dataset.sid), cur=el.classList.contains("bos")?"":el.textContent;
  const ta=document.createElement("textarea");
  ta.className="cell"; ta.style.minHeight="54px"; ta.style.width="100%"; ta.value=cur;
  el.innerHTML=""; el.appendChild(ta); ta.focus();
  let bitti=false;
  const commit=async()=>{
    if(bitti) return; bitti=true;
    const v=ta.value.trim();
    if(!v || v===cur){ el.className="sxc sed"+(cur?"":" bos"); el.textContent=cur||"+ durum"; return; }
    const tarih=new Date().toISOString().slice(0,10);
    const {error}=await sb.from("santiye_durum_log").insert({santiye_id:sid,kim:"MK",durum:v,tarih});
    if(error){ sMsg("Hata: "+error.message,false); el.className="sxc sed"+(cur?"":" bos"); el.textContent=cur||"+ durum"; return; }
    sMsg("Durum kaydedildi (MK · "+sDk(tarih)+").",true);
    try{ await sb.functions.invoke("santiye-degisim-ozet",{body:{santiye_id:sid}}); }catch(e){}
    sLoadAkis();
  };
  ta.onblur=commit;
  ta.onkeydown=e=>{ if(e.key==="Escape"){ bitti=true; el.className="sxc sed"+(cur?"":" bos"); el.textContent=cur||"+ durum"; } };
}
sLoadAkis();

<script>
/* ARB-HOVERTITLE: sigmayan hucre/alan icerigi hover'da (title) gosterilir - tum pano/form ortak */
(function(){
  function fx(el){
    if(!el||el.nodeType!==1) return;
    var tag=el.tagName;
    if(tag==='INPUT'||tag==='TEXTAREA'){ var v=el.value||''; if(v) el.title=v; else el.removeAttribute('title'); return; }
    if(tag==='SELECT'){ var o=el.options[el.selectedIndex]; var v2=o?o.textContent:''; if(v2) el.title=v2; else el.removeAttribute('title'); return; }
    if(el.children.length) return;
    var t=(el.textContent||'').trim();
    if(t && el.scrollWidth>el.clientWidth+1 && !el.getAttribute('title')) el.title=t;
  }
  function scan(root){ if(root&&root.querySelectorAll) root.querySelectorAll('td,th,div,span,input,select,textarea').forEach(fx); }
  document.addEventListener('input',function(e){ fx(e.target); },true);
  document.addEventListener('change',function(e){ fx(e.target); },true);
  var mo=new MutationObserver(function(muts){ muts.forEach(function(m){ m.addedNodes.forEach(function(n){ if(n.nodeType===1){ fx(n); scan(n); } }); }); });
  function boot(){ mo.observe(document.body,{childList:true,subtree:true}); scan(document.body); }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
})();
</script>
<!-- /ARB-HOVERTITLE -->



<!-- ARBOR-DRAGSCROLL -->
<style>
  /* Kaydirma cubuklari gizli — kaydirma tekerlek + surukleme ile yapilir */
  *{scrollbar-width:none;-ms-overflow-style:none}
  ::-webkit-scrollbar{width:0!important;height:0!important;background:transparent}
  body.arb-dragging,body.arb-dragging *{cursor:grabbing!important;user-select:none!important}
</style>
<script>
(function(){
  var el=null,sx=0,sy=0,l=0,t=0,moved=false;
  function skip(n){ return !!(n.closest && n.closest("input,select,textarea,button,a,summary,label,option,.del,.adel,.idel,.ddel,.fdel")); }
  function scrollable(n){
    var st=getComputedStyle(n);
    var okx=(st.overflowX==="auto"||st.overflowX==="scroll") && n.scrollWidth>n.clientWidth+2;
    var oky=(st.overflowY==="auto"||st.overflowY==="scroll") && n.scrollHeight>n.clientHeight+2;
    return okx||oky;
  }
  function start(n,e){
    el=n; sx=e.clientX; sy=e.clientY; l=n.scrollLeft; t=n.scrollTop; moved=false;
    document.body.classList.add("arb-dragging"); e.preventDefault();
  }
  document.addEventListener("mousedown",function(e){
    if(e.button!==0||skip(e.target)) return;
    var n=e.target, hucre=null;
    while(n && n.nodeType===1 && n!==document.body){
      if(scrollable(n)){
        /* once tablo/kutu kapsayicisi; hucre ici mini-kaydirici yalnizca baska aday yoksa */
        if(!n.closest("td,th")) return start(n,e);
        if(!hucre) hucre=n;
      }
      n=n.parentElement;
    }
    if(hucre) return start(hucre,e);
  },true);
  document.addEventListener("mousemove",function(e){
    if(!el) return;
    var dx=e.clientX-sx, dy=e.clientY-sy;
    if(Math.abs(dx)+Math.abs(dy)>3) moved=true;
    el.scrollLeft=l-dx; el.scrollTop=t-dy;
  });
  document.addEventListener("mouseup",function(){
    if(!el) return; el=null; document.body.classList.remove("arb-dragging");
  });
  document.addEventListener("click",function(e){ if(moved){ moved=false; e.stopPropagation(); e.preventDefault(); } },true);
})();
</script>
<!-- /ARBOR-DRAGSCROLL -->
</body>
