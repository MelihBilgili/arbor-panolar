<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ÖB — Faaliyet Formu</title>
<style>
  :root{color-scheme:light}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Segoe UI',system-ui,sans-serif;background:#f7f8fa;color:#1c2430;font-size:13px}
  header{background:#8a6100;color:#fff;padding:12px 16px}
  header h1{font-size:17px;margin:0;font-weight:700}
  header .sub{font-size:12px;color:#ffe9b8;margin-top:3px}
  .wrap{max-width:1100px;margin:0 auto;padding:10px 14px 40px}
  .msg{font-size:12.5px;min-height:16px}.msg.ok{color:#2e7d54;font-weight:600}.msg.err{color:#b40000;font-weight:600}
  .grp{margin:10px 0 4px}
  .grp h2{font-size:13px;margin:0 0 5px;color:#5c4300;border-bottom:2px solid #e6d3a3;padding-bottom:3px}
  .load{padding:30px;text-align:center;color:#8a97a4}
  .hint{font-size:11px;color:#8a97a4;margin:4px 2px}
  .ibtns{display:flex;gap:8px;flex-wrap:wrap;margin:5px 0}
  .ibtns .iadd{background:#8a6100;color:#fff;border:0;border-radius:8px;padding:7px 13px;font-weight:600;cursor:pointer;font-size:12.5px}
  .ibtns .wkbtn{background:#0b57d0;color:#fff;border:0;border-radius:8px;padding:7px 13px;font-weight:600;cursor:pointer;font-size:12.5px}
  .itbl{border-collapse:collapse;width:auto;font-size:12px}
  .itbl th,.itbl td{border-bottom:1px solid #eef1f5;padding:2px 6px;text-align:left;vertical-align:middle;line-height:16px;white-space:nowrap}
  .itbl thead th{background:#8a6100;color:#fff;font-weight:600}
  .itbl .ic{font:inherit;padding:2px 5px;border:1px solid #cdd6df;border-radius:5px;background:#fffdf5;width:150px}
  .itbl .ic[data-f="ob_notlari"]{width:40ch}
  .idel{background:#fff;border:1px solid #e0b4b4;color:#b40000;border-radius:5px;cursor:pointer;padding:0 7px;font-weight:700;line-height:18px}
  .dsel{font:inherit;padding:6px 9px;border:1px solid #cdd6df;border-radius:8px;background:#fffdf5;font-size:12.5px}
  .itbl .ic[data-f="tutar"]{width:130px;text-align:right}
  .itbl .ic[data-f="tedarikci"]{width:28ch}
  .dtot td{background:#fff7e6;font-weight:700}
  .salist{max-height:170px;overflow:auto;border:1px solid #cdd6df;border-radius:7px;background:#fff;margin-top:4px}
  .salist label{display:flex;gap:8px;align-items:flex-start;padding:4px 9px;font-size:12.5px;border-bottom:1px solid #f0f3f7;cursor:pointer}
  .salist label:hover{background:#fffdf3}
  .salist input{margin-top:2px;flex:none}
  .salist .fr{color:#8a97a4;font-size:11px}

html,body{max-width:100vw;overflow-x:hidden}
table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
</style>
</head>
<body>
<div class="wrap">
  <div id="msg" class="msg"></div>

  <div class="grp"><h2>Takipteki İşler</h2>
    <div class="ibtns">
      <button class="iadd" id="iAdd">+ Yeni İş Ekle</button>
      <button class="wkbtn" id="iWeek">Haftalık Güncelleme</button>
    </div>
    <div id="iList"><div class="load">Yükleniyor…</div></div>
  </div>

  <div class="grp"><h2>Dépenses — Tedarikçi Giderleri</h2>
    <div class="ibtns">
      <span class="hint" style="margin:0;align-self:center">Yeni gider ayı:</span>
      <select id="dYil" class="dsel" title="Yeni kaydın yılı"></select>
      <select id="dAy" class="dsel" title="Yeni kaydın ayı"></select>
      <button class="iadd" id="dAdd">+ Tedarikçi Ekle</button>
      <button class="wkbtn" id="dPub">Panoya Aktar</button>
      <span id="dPubInfo" class="hint" style="margin:0;align-self:center"></span>
    </div>
    <div id="dList"><div class="load">Yükleniyor…</div></div>
  </div>

  <div class="grp"><h2>Tıkanmış Şantiyeler — Durum Girişi (ÖB)</h2>
    <div class="ibtns">
      <select id="s_sec" class="dsel" style="min-width:240px"><option value="">Yükleniyor…</option></select>
      <input id="s_tarih" type="date" class="dsel">
      <button class="iadd" id="s_btn">Durumu ekle</button>
      <span id="s_msg" class="msg" style="align-self:center"></span>
    </div>
    <div id="s_yeni" style="display:none;border:1px dashed #cdb27a;border-radius:8px;padding:10px 12px;margin:6px 0;background:#fffdf3">
      <div style="font-size:11px;color:#8a6100;font-weight:700;margin-bottom:3px">SEL-ARB KAYDI SEÇ (şantiyeye ait bir veya birkaç proje)</div>
      <input id="saAra" class="dsel" style="width:100%" placeholder="Ara: proje veya firma adı…">
      <div id="saList" class="salist"><div class="hint" style="margin:4px">Yükleniyor…</div></div>
      <div id="saSec" class="hint" style="margin:4px 2px 8px">Henüz seçim yok.</div>
      <div class="ibtns" style="margin:0">
        <input id="yeniAd" class="dsel" style="min-width:240px" placeholder="Şantiye adı (seçimden gelir)">
        <input id="yeniMusteri" class="dsel" style="min-width:200px" placeholder="Müşteri (seçimden gelir)">
        <input id="yeniNeden" class="dsel" style="min-width:200px" placeholder="Tıkanma nedeni (opsiyonel)">
      </div>
    </div>
    <textarea id="s_durum" class="dsel" style="width:100%;min-height:60px" placeholder="Bu tarihteki durum / gelişme…"></textarea>
    <div id="s_akis"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ===== ARBOR FORM KAPISI (2026-08-20) — anon erisim kapali, rol hesabiyla giris ===== */
const ARB_ROLE_EMAIL = "ob.form@arbor.com.tr";
const ARB_STORE = "arbform_" + ARB_ROLE_EMAIL.split("@")[0].replace(/\./g, "_");
const ARB_GATE_SB = supabase.createClient("https://zehysygpqxqmrzangvuc.supabase.co","sb_publishable_ZCcDv4S7qH1hc9tuiv4__A_YVxmIpWc",{auth:{persistSession:true,autoRefreshToken:true,storageKey:ARB_STORE}});
const ARB_MB = "int@arbor.com.tr";
/* panolarin varsayilan oturumu (ayni origin, varsayilan storageKey) */
const ARB_MB_SB = supabase.createClient("https://zehysygpqxqmrzangvuc.supabase.co","sb_publishable_ZCcDv4S7qH1hc9tuiv4__A_YVxmIpWc");
var ARB_ACTIVE = ARB_GATE_SB;
/* form kodu kendi createClient cagirsa bile aktif oturumlu istemci doner */
supabase.createClient = function(){ return ARB_ACTIVE; };
function arbGateUI(msg){
  var d=document.createElement("div"); d.id="arb-gate";
  d.style.cssText="position:fixed;inset:0;background:#16324f;z-index:99999;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',system-ui,sans-serif";
  d.innerHTML='<div style="background:#fff;color:#1c2430;padding:22px;border-radius:12px;width:310px;box-shadow:0 10px 40px rgba(0,0,0,.3)">'
    +'<div style="font-weight:700;font-size:16px;margin-bottom:3px">Arbor — Form Girisi</div>'
    +'<div style="font-size:12px;color:#5a6b7d;margin-bottom:12px">'+ARB_ROLE_EMAIL+'</div>'
    +'<input id="arb-pw" type="password" placeholder="Parola" autocomplete="current-password" style="width:100%;font:inherit;padding:9px;border:1px solid #cdd6df;border-radius:8px">'
    +'<button id="arb-go" style="width:100%;margin-top:10px;font:inherit;font-weight:600;background:#2e7d54;color:#fff;border:0;border-radius:8px;padding:9px;cursor:pointer">Giris</button>'
    +'<div id="arb-msg" style="font-size:12px;color:#b40000;min-height:16px;margin-top:8px">'+(msg||"")+'</div></div>';
  document.body.appendChild(d);
  var go=async function(){
    var pw=document.getElementById("arb-pw").value;
    document.getElementById("arb-msg").style.color="#5a6b7d";
    document.getElementById("arb-msg").textContent="Giris yapiliyor...";
    var r=await ARB_GATE_SB.auth.signInWithPassword({email:ARB_ROLE_EMAIL,password:pw});
    if(r.error){ document.getElementById("arb-msg").style.color="#b40000"; document.getElementById("arb-msg").textContent="Parola hatali"; return; }
    location.reload();
  };
  document.getElementById("arb-go").onclick=go;
  document.getElementById("arb-pw").onkeydown=function(e){ if(e.key==="Enter"){ e.preventDefault(); go(); } };
  setTimeout(function(){ var i=document.getElementById("arb-pw"); if(i) i.focus(); },50);
}
function ARB_BOOT(){ (async function(){
  var s=await ARB_GATE_SB.auth.getSession();
  var em=(s && s.data && s.data.session && s.data.session.user && s.data.session.user.email || "").toLowerCase();
  if(em!==ARB_ROLE_EMAIL){
    var m=await ARB_MB_SB.auth.getSession();
    var mem=(m && m.data && m.data.session && m.data.session.user && m.data.session.user.email || "").toLowerCase();
    if(mem===ARB_MB){ ARB_ACTIVE=ARB_MB_SB; em=mem; }
  }
  if(em===ARB_ROLE_EMAIL || em===ARB_MB){ (0,eval)(document.getElementById("arbmain").textContent); }
  else { arbGateUI(); }
})(); }
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", ARB_BOOT); else ARB_BOOT();
</script>
<script type="text/plain" id="arbmain">
const sb = supabase.createClient("https://zehysygpqxqmrzangvuc.supabase.co","sb_publishable_ZCcDv4S7qH1hc9tuiv4__A_YVxmIpWc");
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function msg(t,ok){ const m=document.getElementById("msg"); m.className="msg "+(ok?"ok":"err"); m.textContent=t; if(ok) setTimeout(()=>{m.textContent="";},1900); }

/* ===== Takipteki İşler (ob_isler) — anlık kayıt + haftalık arşiv ===== */
const OBI_DURUM=["Henüz çalışılmadı","İlerliyor","Tamamlandı","İptal oldu"];
let IROWS=[];
async function loadIsler(){
  const {data,error}=await sb.from("ob_isler").select("*").order("arsiv").order("id");
  if(error){ document.getElementById("iList").innerHTML='<div class="load">Hata: '+esc(error.message)+'</div>'; return; }
  IROWS=data||[]; renderIsler();
}
function durumOpts(v){ return OBI_DURUM.map(d=>'<option'+(d===v?' selected':'')+'>'+esc(d)+'</option>').join(""); }
function renderIsler(){
  let h='<table class="itbl"><thead><tr><th>Konu</th><th>Durum</th><th>ÖB Notları</th><th></th></tr></thead><tbody>';
  IROWS.forEach(r=>{
    h+='<tr data-id="'+r.id+'">'
      +'<td><input class="ic" data-f="konu" value="'+esc(r.konu)+'" placeholder="Konu"></td>'
      +'<td><select class="ic" data-f="durum">'+durumOpts(r.durum)+'</select></td>'
      +'<td><input type="text" class="ic" data-f="ob_notlari" value="'+esc(r.ob_notlari)+'" placeholder="ÖB notları..."></td>'
      +'<td><button class="idel" title="Sil">✕</button></td></tr>';
  });
  h+='</tbody></table>';
  const list=document.getElementById("iList"); list.innerHTML=h;
  list.querySelectorAll("[data-f]").forEach(el=>{ el.addEventListener("change",()=>saveIsler(+el.closest("tr").dataset.id,el.dataset.f,el.value)); });
  list.querySelectorAll(".idel").forEach(b=>b.onclick=()=>delIsler(+b.closest("tr").dataset.id));
}
async function saveIsler(id,f,v){
  const rec={}; rec[f]=(v===""?null:v); rec.updated_at=new Date().toISOString();
  const {error}=await sb.from("ob_isler").update(rec).eq("id",id);
  if(error){ msg("Hata: "+error.message,false); return; }
  const r=IROWS.find(x=>x.id===id); if(r) r[f]=v; msg("Kaydedildi",true);
}
async function addIsler(){
  const {data,error}=await sb.from("ob_isler").insert({konu:"",durum:"Henüz çalışılmadı",ob_notlari:"",arsiv:false}).select();
  if(error){ msg(error.message,false); return; }
  IROWS.push(data[0]); renderIsler();
  const inps=document.querySelectorAll('#iList input[data-f="konu"]'); if(inps.length) inps[inps.length-1].focus();
}
async function delIsler(id){
  if(!confirm("Bu iş silinsin mi?")) return;
  const {error}=await sb.from("ob_isler").delete().eq("id",id);
  if(error){ msg(error.message,false); return; }
  IROWS=IROWS.filter(x=>x.id!==id); renderIsler();
}
async function haftalikGuncelle(){
  const sil=IROWS.filter(r=>r.durum==="Tamamlandı"||r.durum==="İptal oldu");
  if(!confirm("Haftalık Güncelleme:\n\n• Aktif kalan işlerin önceki→son değişim özeti üretilip panoya yazılacak, sonra son değer 'önceki'ye kaydırılacak (ilk basışta baseline; özet boş).\n• Durumu Tamamlandı/İptal oldu olan "+sil.length+" iş TAMAMEN SİLİNECEK (geri alınamaz).\n\nDevam?")) return;
  const btn=document.getElementById("iWeek"); btn.disabled=true; msg("Değişim özetleri üretiliyor…",true);
  const {data,error}=await sb.functions.invoke("ob-degisim-ozet",{body:{}});
  if(error||!(data&&data.ok)){ btn.disabled=false; msg("Özet üretilemedi: "+((error&&error.message)||(data&&data.error)||"bilinmiyor"),false); return; }
  for(const r of sil){
    const {error:e2}=await sb.from("ob_isler").delete().eq("id",r.id);
    if(e2){ btn.disabled=false; msg("Hata: "+e2.message,false); return; }
  }
  /* Panodaki "Son güncelleme" damgası = bu düğmeye basılma anı */
  try{ await sb.from("pano_yayin").upsert({anahtar:"ob_rapor",yayin_at:new Date().toISOString(),updated_at:new Date().toISOString()},{onConflict:"anahtar"}); }catch(e){}
  btn.disabled=false;
  msg((data.note||"Özet güncellendi")+(sil.length?` · ${sil.length} iş silindi`:""),true); loadIsler();
}
document.getElementById("iAdd").onclick=addIsler;
document.getElementById("iWeek").onclick=haftalikGuncelle;

/* ===== Dépenses (depenses_kalem) — Melih'in Dépenses panosunun tek kaynağı ===== */
const DAY=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const dEur=n=>(Math.round(Number(n)||0)).toLocaleString("tr-TR");
const dDate=s=>{ if(!s) return ""; const d=new Date(s); return isNaN(d)?"":String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+"."+String(d.getFullYear()).slice(2); };
let DROWS=[];
(function initDSel(){
  const now=new Date(), yEl=document.getElementById("dYil"), aEl=document.getElementById("dAy");
  let ys=""; for(let y=now.getFullYear()+1;y>=now.getFullYear()-3;y--) ys+='<option'+(y===now.getFullYear()?' selected':'')+'>'+y+'</option>';
  yEl.innerHTML=ys;
  aEl.innerHTML=DAY.map((a,i)=>'<option value="'+(i+1)+'"'+((i+1)===now.getMonth()+1?' selected':'')+'>'+a+'</option>').join("");
})();
const dYil=()=>parseInt(document.getElementById("dYil").value,10);
const dAy=()=>parseInt(document.getElementById("dAy").value,10);
/* Tüm aylar tek listede, yeni ay en üstte; yeni gider seçili ayın en üstüne eklenir. */
async function loadDep(){
  const [k,y]=await Promise.all([
    sb.from("depenses_kalem").select("*").order("yil",{ascending:false}).order("ay",{ascending:false}).order("id",{ascending:false}),
    sb.from("depenses_yayin").select("yayin_at").limit(1)
  ]);
  if(k.error){ document.getElementById("dList").innerHTML='<div class="load">Hata: '+esc(k.error.message)+'</div>'; return; }
  DROWS=k.data||[];
  const ya=(y&&!y.error&&y.data&&y.data[0])?y.data[0].yayin_at:null;
  document.getElementById("dPubInfo").textContent = ya?("Son aktarım: "+dDate(ya)):"Henüz aktarılmadı";
  renderDep();
}
function renderDep(){
  const keys=[...new Set(DROWS.map(r=>r.yil*100+r.ay))].sort((a,b)=>b-a);
  let h='<table class="itbl"><thead><tr><th>Ay</th><th>Tedarikçi</th><th style="text-align:right">Tutar (€)</th><th></th></tr></thead><tbody>';
  keys.forEach(k=>{
    const yil=Math.floor(k/100), ay=k%100;
    const rs=DROWS.filter(r=>r.yil===yil&&r.ay===ay);
    const top=rs.reduce((a,r)=>a+(Number(r.tutar)||0),0);
    h+='<tr class="dtot"><td colspan="2">'+DAY[ay-1]+' '+yil+' <span style="font-weight:400;color:#8a97a4">('+rs.length+' tedarikçi)</span></td>'
      +'<td style="text-align:right">'+dEur(top)+'</td><td></td></tr>';
    rs.forEach(r=>{
      h+='<tr data-id="'+r.id+'">'
        +'<td style="color:#8a97a4;white-space:nowrap">'+DAY[ay-1].slice(0,3)+' '+String(yil).slice(2)+'</td>'
        +'<td><input class="ic" data-f="tedarikci" value="'+esc(r.tedarikci)+'" placeholder="Tedarikçi adı"></td>'
        +'<td style="text-align:right"><input class="ic" data-f="tutar" type="number" step="0.01" value="'+esc(r.tutar)+'" placeholder="0"></td>'
        +'<td><button class="ddel" title="Sil">✕</button></td></tr>';
    });
  });
  if(!DROWS.length) h+='<tr><td colspan="4" style="color:#8a97a4;padding:10px">Kayıt yok — "+ Tedarikçi Ekle" ile başla.</td></tr>';
  h+='</tbody></table>';
  const list=document.getElementById("dList"); list.innerHTML=h;
  list.querySelectorAll("[data-f]").forEach(el=>{ el.addEventListener("change",()=>saveDep(+el.closest("tr").dataset.id,el.dataset.f,el.value)); });
  list.querySelectorAll(".ddel").forEach(b=>b.onclick=()=>delDep(+b.closest("tr").dataset.id));
}
async function saveDep(id,f,v){
  const rec={}; rec[f]= f==="tutar" ? (v===""?0:Number(v)) : v;
  rec.updated_at=new Date().toISOString();
  const {error}=await sb.from("depenses_kalem").update(rec).eq("id",id);
  if(error){ msg("Hata: "+error.message,false); return; }
  const r=DROWS.find(x=>x.id===id); if(r) r[f]=rec[f];
  msg("Kaydedildi",true); renderDep();
}
async function addDep(){
  const {data,error}=await sb.from("depenses_kalem").insert({yil:dYil(),ay:dAy(),tedarikci:"",tutar:0}).select();
  if(error){ msg(error.message,false); return; }
  DROWS.unshift(data[0]); renderDep();   /* yeni satır kendi ayının en üstünde */
  const tr=document.querySelector('#dList tr[data-id="'+data[0].id+'"]');
  const inp=tr&&tr.querySelector('input[data-f="tedarikci"]'); if(inp){ inp.focus(); tr.scrollIntoView({block:"center"}); }
}
async function delDep(id){
  if(!confirm("Bu tedarikçi satırı silinsin mi?")) return;
  const {error}=await sb.from("depenses_kalem").delete().eq("id",id);
  if(error){ msg(error.message,false); return; }
  DROWS=DROWS.filter(x=>x.id!==id); renderDep();
}
async function pubDep(){
  if(!confirm("Girilen gider kayıtları Melih'in Dépenses panosuna aktarılmış sayılacak ve panodaki 'Son güncelleme' tarihi bugüne çekilecek. Devam?")) return;
  const btn=document.getElementById("dPub"); btn.disabled=true;
  const {error}=await sb.from("depenses_yayin").update({yayin_at:new Date().toISOString(),updated_at:new Date().toISOString()}).eq("id",1);
  btn.disabled=false;
  if(error){ msg("Hata: "+error.message,false); return; }
  msg("Panoya aktarıldı.",true); loadDep();
}
document.getElementById("dAdd").onclick=addDep;
document.getElementById("dPub").onclick=pubDep;

/* ===== Tıkanmış Şantiyeler — ÖB durum girişi + yeni şantiye (SEL-ARB seçiminden) ===== */
const $$=id=>document.getElementById(id);
function sMsg(t,ok){ const m=$$("s_msg"); m.className="msg "+(ok?"ok":"err"); m.textContent=t; if(ok) setTimeout(()=>{m.textContent="";},3000); }
const sDk=t=>t?String(t).slice(8,10)+"."+String(t).slice(5,7)+"."+String(t).slice(2,4):"";
let SA=[], SASEL=new Set();
async function sLoadListe(sel){
  const {data,error}=await sb.from("santiye_liste").select("*").order("santiye");
  const s=$$("s_sec");
  if(error){ s.innerHTML='<option value="">Hata: '+esc(error.message)+'</option>'; return; }
  s.innerHTML='<option value="">— şantiye seç —</option><option value="__new__">➕ Yeni şantiye ekle…</option>'
    +(data||[]).map(r=>'<option value="'+r.id+'"'+(sel===r.id?' selected':'')+'>'+esc(r.santiye)+'</option>').join("");
  if(sel) s.value=String(sel);
  $$("s_yeni").style.display = s.value==="__new__" ? "block" : "none";
}
async function loadSelArbListe(){
  const {data,error}=await sb.from("sel_arb_liste").select("sira,firma,proje").order("proje");
  if(error){ $$("saList").innerHTML='<div class="hint" style="margin:4px">Liste okunamadı: '+esc(error.message)+'</div>'; return; }
  SA=data||[]; renderSaList();
}
function renderSaList(){
  const q=($$("saAra").value||"").toLocaleLowerCase("tr").trim();
  const list=SA.filter(r=>!q||((r.proje||"")+" "+(r.firma||"")).toLocaleLowerCase("tr").includes(q));
  $$("saList").innerHTML=list.length
    ? list.map(r=>'<label><input type="checkbox" value="'+r.sira+'"'+(SASEL.has(r.sira)?' checked':'')+'><span>'+esc(r.proje)+'<span class="fr"> · '+esc(r.firma)+'</span></span></label>').join("")
    : '<div class="hint" style="margin:4px">Eşleşen kayıt yok.</div>';
  $$("saList").querySelectorAll("input").forEach(c=>c.onchange=()=>{ const v=Number(c.value); if(c.checked) SASEL.add(v); else SASEL.delete(v); syncSaSec(); });
}
function syncSaSec(){
  const sel=SA.filter(r=>SASEL.has(r.sira));
  $$("saSec").innerHTML = sel.length ? "Seçilen: "+sel.map(r=>esc(r.proje)).join(" + ") : "Henüz seçim yok.";
  if(sel.length){ if(!$$("yeniAd").dataset.touched) $$("yeniAd").value=sel[0].proje; $$("yeniMusteri").value=sel[0].firma||""; }
}
async function sLoadAkis(){
  const {data,error}=await sb.from("santiye_durum_akis").select("*").order("tarih",{ascending:false}).order("id",{ascending:false});
  const el=$$("s_akis");
  if(error){ el.innerHTML='<div class="hint">Akış okunamadı.</div>'; return; }
  const rows=(data||[]).slice(0,20);
  if(!rows.length){ el.innerHTML='<div class="hint">Henüz durum kaydı yok.</div>'; return; }
  el.innerHTML='<table class="itbl"><thead><tr><th>Şantiye</th><th>Durum / Gelişme</th><th></th></tr></thead><tbody>'
    +rows.map(r=>'<tr data-lid="'+r.id+'"><td>'+esc(r.santiye)+'</td>'
      +'<td><input type="text" class="ic" data-lf="durum" style="width:70ch" value="'+esc(r.durum)+'"></td>'
      +'<td><button class="idel" title="Sil">✕</button></td></tr>').join("")
    +'</tbody></table>';
  el.querySelectorAll("[data-lf]").forEach(i=>i.addEventListener("change",()=>sSaveLog(+i.closest("tr").dataset.lid,i.value)));
  el.querySelectorAll(".idel").forEach(b=>b.onclick=()=>sDelLog(+b.closest("tr").dataset.lid));
}
async function sSaveLog(id,v){
  const t=String(v||"").trim();
  if(!t){ sMsg("Durum boş olamaz.",false); sLoadAkis(); return; }
  const {error}=await sb.from("santiye_durum_log").update({durum:t}).eq("id",id);
  if(error){ sMsg("Kaydedilemedi: "+error.message,false); return; }
  sMsg("Kaydedildi",true);
}
async function sDelLog(id){
  if(!confirm("Bu durum kaydı silinsin mi?")) return;
  const {error}=await sb.from("santiye_durum_log").delete().eq("id",id);
  if(error){ sMsg("Silinemedi: "+error.message,false); return; }
  sMsg("Silindi",true); sLoadAkis();
}
async function createSantiye(){
  if(!SASEL.size){ sMsg("Şantiyenin SEL-ARB kaydını seç (en az bir proje).",false); return null; }
  const ad=$$("yeniAd").value.trim();
  if(!ad){ sMsg("Şantiye adı boş olamaz.",false); return null; }
  const rec={santiye:ad,sel_arb_sira:[...SASEL]};
  const mus=$$("yeniMusteri").value.trim(); if(mus) rec.musteri=mus;
  const ned=$$("yeniNeden").value.trim(); if(ned) rec.neden=ned;
  const ins=await sb.from("santiye").insert(rec);
  if(ins.error){ sMsg("Şantiye oluşturma hatası: "+ins.error.message,false); return null; }
  const {data}=await sb.from("santiye_liste").select("id,santiye").eq("santiye",ad).order("id",{ascending:false}).limit(1);
  return (data&&data[0])?data[0].id:null;
}
$$("s_tarih").value=new Date().toISOString().slice(0,10);
$$("s_sec").onchange=()=>{ $$("s_yeni").style.display = $$("s_sec").value==="__new__" ? "block" : "none"; };
$$("saAra").oninput=renderSaList;
$$("yeniAd").oninput=()=>{ $$("yeniAd").dataset.touched="1"; };
$$("s_btn").onclick=async()=>{
  const durum=$$("s_durum").value.trim(), tarih=$$("s_tarih").value;
  let sid=$$("s_sec").value;
  if(!sid){ sMsg("Şantiye seç veya yeni ekle.",false); return; }
  if(!durum){ sMsg("Durum metni gir.",false); return; }
  if(!tarih){ sMsg("Tarih gir.",false); return; }
  const btn=$$("s_btn"); btn.disabled=true;
  let isNew=false;
  if(sid==="__new__"){ sid=await createSantiye(); if(!sid){ btn.disabled=false; return; } isNew=true; }
  const {error}=await sb.from("santiye_durum_log").insert({santiye_id:parseInt(sid),kim:"OB",durum,tarih});
  btn.disabled=false;
  if(error){ sMsg("Durum kaydı hatası: "+error.message,false); return; }
  sMsg((isNew?"Yeni şantiye + durum eklendi":"Durum eklendi")+" (ÖB · "+tarih+").",true);
  $$("s_durum").value=""; $$("yeniAd").value=""; $$("yeniMusteri").value=""; $$("yeniNeden").value="";
  $$("yeniAd").dataset.touched=""; SASEL.clear(); renderSaList(); syncSaSec();
  try{ await sb.functions.invoke("santiye-degisim-ozet",{body:{santiye_id:parseInt(sid)}}); }catch(e){}
  await sLoadListe(isNew?parseInt(sid):null);
  sLoadAkis();
};

loadIsler();
loadDep();
sLoadListe(); loadSelArbListe(); sLoadAkis();
</script>

<!-- ARBOR-DRAGSCROLL -->
<style>
  /* Kaydirma cubuklari gizli — kaydirma tekerlek + surukleme ile yapilir */
  *{scrollbar-width:none;-ms-overflow-style:none}
  ::-webkit-scrollbar{width:0!important;height:0!important;background:transparent}
  body.arb-dragging,body.arb-dragging *{cursor:grabbing!important;user-select:none!important}
</style>
<script>
(function(){
  var el=null,sx=0,sy=0,l=0,t=0,moved=false;
  function skip(n){ return !!(n.closest && n.closest("input,select,textarea,button,a,summary,label,option,.del,.adel,.idel,.ddel,.fdel")); }
  function scrollable(n){
    var st=getComputedStyle(n);
    var okx=(st.overflowX==="auto"||st.overflowX==="scroll") && n.scrollWidth>n.clientWidth+2;
    var oky=(st.overflowY==="auto"||st.overflowY==="scroll") && n.scrollHeight>n.clientHeight+2;
    return okx||oky;
  }
  function start(n,e){
    el=n; sx=e.clientX; sy=e.clientY; l=n.scrollLeft; t=n.scrollTop; moved=false;
    document.body.classList.add("arb-dragging"); e.preventDefault();
  }
  document.addEventListener("mousedown",function(e){
    if(e.button!==0||skip(e.target)) return;
    var n=e.target, hucre=null;
    while(n && n.nodeType===1 && n!==document.body){
      if(scrollable(n)){
        /* once tablo/kutu kapsayicisi; hucre ici mini-kaydirici yalnizca baska aday yoksa */
        if(!n.closest("td,th")) return start(n,e);
        if(!hucre) hucre=n;
      }
      n=n.parentElement;
    }
    if(hucre) return start(hucre,e);
  },true);
  document.addEventListener("mousemove",function(e){
    if(!el) return;
    var dx=e.clientX-sx, dy=e.clientY-sy;
    if(Math.abs(dx)+Math.abs(dy)>3) moved=true;
    el.scrollLeft=l-dx; el.scrollTop=t-dy;
  });
  document.addEventListener("mouseup",function(){
    if(!el) return; el=null; document.body.classList.remove("arb-dragging");
  });
  document.addEventListener("click",function(e){ if(moved){ moved=false; e.stopPropagation(); e.preventDefault(); } },true);
})();
</script>
<!-- /ARBOR-DRAGSCROLL -->
