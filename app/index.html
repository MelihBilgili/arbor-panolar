<body>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://zehysygpqxqmrzangvuc.supabase.co";
const SUPABASE_KEY = "sb_publishable_ZCcDv4S7qH1hc9tuiv4__A_YVxmIpWc";

const memStore = {};
function safeStorage(){
  try{ const k="__arb_t"; window.localStorage.setItem(k,"1"); window.localStorage.removeItem(k); return window.localStorage; }
  catch(e){ return { getItem:k=> (k in memStore? memStore[k]:null), setItem:(k,v)=>{memStore[k]=String(v)}, removeItem:k=>{delete memStore[k]} }; }
}
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:false, storage:safeStorage() }
});

const app = document.getElementById("app");
let state = { tab:"gundem", email:"", session:null, allowed:null };
const PREFIX = { F:"Fabrika", G:"Yurtdışı / Genel", P:"PEM", S:"Şahsi", ARGE:"ARGE" };

function esc(s){ return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fdate(s){ if(!s) return ""; s=String(s).trim();
  const m=s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})$/);  /* DD.MM.YYYY / DD.MM.YY — new Date() bunu ABD MM/DD sanıp kaydırıyor, elle parse et */
  if(m){ const g=+m[1],ay=+m[2]; if(g>=1&&g<=31&&ay>=1&&ay<=12){ const y=m[3].length<=2?m[3]:m[3].slice(-2); return String(g).padStart(2,'0')+"."+String(ay).padStart(2,'0')+"."+String(y).padStart(2,'0'); } }
  const d=new Date(s); if(isNaN(d)) return esc(s); return String(d.getDate()).padStart(2,'0')+"."+String(d.getMonth()+1).padStart(2,'0')+"."+String(d.getFullYear()).slice(2); }
function money(n){ if(n==null||n==="") return ""; const v=Math.round(Number(n)); return isNaN(v)?"":v.toLocaleString("tr-TR"); }

/* ---------- AUTH ---------- */
function renderLogin(){
  app.innerHTML = `
   <div class="login">
     <h2>Arbor Panolar</h2>
     <p>Devam etmek için giriş yap.</p>
     <input id="email" type="email" placeholder="ornek@arbor.com.tr" value="${esc(state.email)}" autocomplete="username">
     <input id="pw" type="password" placeholder="Parola" autocomplete="current-password">
     <button class="btn" id="go">Giriş yap</button>
     <div class="msg" id="msg"></div>
   </div>`;
  document.getElementById("go").onclick = doLogin;
  document.getElementById("pw").onkeydown = e=>{ if(e.key==='Enter'){ e.preventDefault(); doLogin(); } };
}
function msg(t,ok){ const m=document.getElementById("msg"); if(m){ m.textContent=t; m.className="msg "+(ok?"ok":"err"); } }
async function doLogin(){
  const email=document.getElementById("email").value.trim();
  const pw=document.getElementById("pw").value;
  if(!email||!pw){ msg("E-posta ve parola gir."); return; }
  state.email=email; msg("Giriş yapılıyor…",true);
  const {data,error}=await sb.auth.signInWithPassword({ email, password:pw });
  if(error){ msg("Hata: "+error.message); return; }
  state.session=data.session; await loadPerms(); renderApp();
}
async function doLogout(){ await sb.auth.signOut(); state.session=null; state.allowed=null; state.tab="gundem"; renderLogin(); }
/* Kullanıcının yetkili olduğu bölümler (yetkiler tablosu, RLS ile yalnız kendi satırları). '*' = admin (hepsi). */
async function loadPerms(){
  try{
    const {data,error}=await sb.from("yetkiler").select("bolum");
    if(error){ state.allowed=null; return; }
    const rows=data||[];
    state.allowed = rows.some(r=>r.bolum==='*') ? null : rows.map(r=>r.bolum);
  }catch(e){ state.allowed=null; }
}

/* ---------- APP SHELL ---------- */
const MALI_BOLUM=["kredi","ahsap","sel_arb","mali_maasprim","mali_mkprim"];
const MALI_ALL=["kredi","ahsap","sel_arb","bilanco","icmal","mali_maasprim","mali_mkprim"];
/* ÖB Faaliyet artık Mali grubunun içinde (MK Faaliyet'in yanında) */
const TABS=[["gundem","Ana Gündem"],["aup","AÜP"],["hazir","Hazır PEM/PRJ"],["so","SÖ"],["satis","Satış"],["ref","Referans"],["prosedur","Prosedürler"],["mali","Mali"],["formlar","Formlar"],["ozel","Özel"]];
const TAB_OBRAPOR=["obrapor","ÖB Faaliyet"];
function tabVisible(k){ const a=state.allowed; if(a===null) return true; if(k==='mali') return MALI_ALL.some(b=>a.includes(b))||a.includes('ob_rapor'); if(k==='ozel') return a.includes('ozel')||a.includes('gmenkul'); if(k==='formlar') return a.includes('formlar'); return a.includes(k); }
function renderApp(){
  const vis = TABS.filter(t=> tabVisible(t[0]) );
  if(!vis.length){ app.innerHTML=`<div class="login"><h2>Arbor Panolar</h2><p>Bu hesap için tanımlı bir bölüm yok. Yöneticiyle görüşün.</p><button class="btn" id="lo">Çıkış</button></div>`; document.getElementById("lo").onclick=doLogout; return; }
  if(!vis.some(t=>t[0]===state.tab)) state.tab=vis[0][0];
  app.innerHTML = `
   <header>
     <div class="tabs">
       ${vis.map(t=>`<button data-t="${t[0]}" class="${state.tab===t[0]?'active':''}">${t[1]}</button>`).join("")}
     </div>
   </header>
   <div class="wrap" id="view"><div class="load">Yükleniyor…</div></div>`;
  document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{ state.tab=b.dataset.t; renderApp(); });
  loadView();
}
function loadView(){
  if(state.tab==='gundem') loadGundem();
  else if(state.tab==='hazir') loadHazir();
  else if(state.tab==='so') loadSo();
  else if(state.tab==='satis') loadSatis();
  else if(state.tab==='ref') loadRef();
  else if(state.tab==='prosedur') loadProsedur();
  else if(state.tab==='mali') loadMali();
  else if(state.tab==='formlar') loadFormlar();
  else if(state.tab==='ozel') loadOzel();
  else loadAup();
}
function fmtDamga(dg){ return (dg&&dg.length>=6)? dg.slice(4,6)+"."+dg.slice(2,4)+"."+dg.slice(0,2) : "—"; }
function dOnly(iso){ if(!iso) return "—"; const d=new Date(iso); return isNaN(d)?"—":String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+"."+String(d.getFullYear()).slice(2); }
async function erpStamp(){ const {data}=await sb.from("erp_yukleme").select("damga").order("damga",{ascending:false}).limit(1); return data&&data[0]?fmtDamga(data[0].damga):"—"; }
async function tblStamp(t){ const {data}=await sb.from(t).select("updated_at").order("updated_at",{ascending:false}).limit(1); return data&&data[0]?dOnly(data[0].updated_at):"—"; }
function stampHTML(d){ return '<div class="stamp">Son güncelleme: '+(d||"—")+'</div>'; }
/* Damga satırlarındaki "(+%N)" rozeti — bir önceki ERP çekimine göre değişim, tamsayı. */
function pctSpan(a,b){ a=Number(a)||0; b=Number(b)||0; if(!b) return ""; const v=Math.round((a-b)/Math.abs(b)*100); return ' <span style="color:'+(v>=0?'#0a6b3f':'#b23a2e')+'">('+(v>=0?'+':'−')+Math.abs(v)+'%)</span>'; }

/* ---------- Başlık uydurma: sütun başlığı içerikten genişse bir tık küçült; hâlâ genişse
   iki satıra sar (başlıklar alttan hizalı). Yalnız auto-layout tablolarda çalışır;
   colgroup'lu sabit tablolarda gerek yok. Her tabloya bir kez uygulanır (data-fh). ---------- */
function fitHeads(){
  document.querySelectorAll("#app table").forEach(tbl=>{
    if(tbl.dataset.fh) return; tbl.dataset.fh="1";
    if(getComputedStyle(tbl).tableLayout==="fixed") return;
    const th0=tbl.tHead, body=tbl.tBodies[0];
    if(!th0||!th0.rows.length||!body||!body.rows.length) return;
    const hr=th0.rows[th0.rows.length-1], n=hr.cells.length;
    /* Range ile GERÇEK metin genişliği — scrollWidth yerleşmiş sütun genişliğini verdiği için dairesel olur */
    const rw=el=>{ const r=document.createRange(); r.selectNodeContents(el); return r.getBoundingClientRect().width; };
    const colMax=new Array(n).fill(0);
    for(const row of body.rows){
      if(row.cells.length!==n) continue;              /* grup / colspan satırları hariç */
      for(let i=0;i<n;i++){ const c=row.cells[i], ch=c.firstElementChild;
        const w=ch?ch.getBoundingClientRect().width:rw(c);
        if(w>colMax[i]) colMax[i]=w; }
    }
    for(let i=0;i<n;i++){
      const th=hr.cells[i];
      if(!th||th.colSpan>1||th.rowSpan>1||!th.textContent.trim()||!colMax[i]) continue;
      if(rw(th)<=colMax[i]+2) continue;                        /* başlık zaten dar */
      th.classList.add("thsm");
      if(rw(th)>colMax[i]+2) th.innerHTML='<span class="thw">'+th.innerHTML+'</span>';
    }
  });
}
/* ---------- Taşan hücre içeriği hover'da tam görünsün (title) — TÜM panolar.
   Sütun genişliği yüzünden kırpılan her hücreye (td / içindeki span-div) tam metni
   title olarak koyar; tarayıcı hover'da gösterir. Ölçüm ve yazma iki ayrı geçişte
   (layout thrash yok). title'ı zaten olan öğeye dokunulmaz. Attribute değişimi
   MutationObserver (childList) tetiklemez → döngü yok. ---------- */
function fitTitles(){
  const app=document.getElementById("app"); if(!app) return;
  const todo=[];
  app.querySelectorAll("td,td span,td div").forEach(el=>{
    if(el.hasAttribute("title")) return;
    if(el.firstElementChild&&el.querySelector("button,input,select,textarea,a,table,iframe")) return;
    if(el.scrollWidth>el.clientWidth+1) todo.push(el);
  });
  todo.forEach(el=>{ const t=(el.innerText||el.textContent||"").replace(/\s+/g," ").trim(); if(t) el.setAttribute("title",t); });
}
(function(){
  const run=()=>{ clearTimeout(window._fhT); window._fhT=setTimeout(()=>{ fitHeads(); fitTitles(); },60); };
  const app=document.getElementById("app");
  if(app) new MutationObserver(run).observe(app,{childList:true,subtree:true});
})();

  const man=manAll.filter(r=>r.kaynak_tip!=='pem'&&r.kaynak_tip!=='prj');
  const der=(ar.data||[]).map(r=>Object.assign({_ed:false},r));

      const da=aDt(a)||"9999-99-99", db=aDt(b)||"9999-99-99"; if(da!==db) return da<db?-1:1;

      +`<td class="c a10"><span>${esc(aDur(r))}</span></td>`
      +`<td class="c a100"><span>${esc(aKon(r))}</span></td></tr>`).join("");

  };
  const persons=[...new Set(["MB","EA","OE","CTP","EU"].concat(keys.filter(k=>k!=='ARGE')))];
  const ilgSel=persons.map(k=>`<option value="${esc(k)}"${k==='MB'?' selected':''}>${esc(k)}</option>`).join("")+`<option value="PEM">PEM (takip)</option><option value="PRJ">PRJ (takip)</option><option value="__new__">Diğer…</option>`;
  const restKeys=keys.filter(k=>k!=='MB'&&k!=='ARGE');
  view.innerHTML=`

    .a3>span{max-width:3ch}.a5>span{max-width:5ch}.a10>span{max-width:10ch}.a100>span{max-width:100ch}
    .ag-wrap .scroll{max-height:none;overflow-y:visible;overflow-x:auto;border:0;background:transparent;border-radius:0;margin:0 0 12px}
    .gblk button.fmail{display:none}</style>
    <div class="addbar">
      <select id="ag-ilgili" title="İlgili">${ilgSel}</select>
      <input id="ag-kod" placeholder="Kod" style="display:none;max-width:120px">
      <input id="ag-konu" placeholder="Yeni konu">
      <button class="btn" id="ag-add">Ekle</button>
    </div>
    <div class="ag-wrap">
    ${grpTable(['MB'])}
    ${pemPrjBlock(pemRows,'pem')}
    ${pemPrjBlock(prjRows,'prj')}
    ${grpTable(restKeys)}
    ${argeBlock(groups['ARGE'])}
    </div>`;
  view.querySelectorAll(".del").forEach(b=>b.onclick=()=>delGundem(b.dataset.id));
  const selEl=document.getElementById("ag-ilgili"), kodInp=document.getElementById("ag-kod");
  const syncKod=()=>{ const v=selEl.value, on=(v==='PEM'||v==='PRJ'); kodInp.style.display=on?'':'none'; kodInp.placeholder=v==='PEM'?'Kod (son 5)':(v==='PRJ'?'Kod (son 8)':'Kod'); };
  selEl.onchange=syncKod; syncKod();
  document.getElementById("ag-add").onclick=addGundem;

async function addGundem(){
  const ei=document.getElementById("ag-ilgili"), ek=document.getElementById("ag-konu"), ekod=document.getElementById("ag-kod");
  let ilg=(ei.value||"").trim();
  const konu=(ek.value||"").trim();
  if(ilg==="PEM"||ilg==="PRJ"){
    const need=ilg==="PEM"?5:8, kod=(ekod.value||"").trim();
    if(!new RegExp("^\\d{1,"+need+"}$").test(kod)){ alert(ilg+" için Kod = numaranın son "+need+" hanesi (en çok "+need+" haneli sayı; kısaysa tamamı)."); ekod.focus(); return; }
    if(!konu){ ek.focus(); return; }
    const btn=document.getElementById("ag-add"); btn.disabled=true; btn.textContent="Ekleniyor…";
    const {error}=await sb.from("ana_gundem").insert([{kod:kod,kod_prefix:(ilg==='PEM'?'P':'R'),konu,ilgili:ilg,kaynak_tip:ilg.toLowerCase(),turetilmis:false}]);
    btn.disabled=false; btn.textContent="Ekle";
    if(error){ alert(error.message); return; }
    ekod.value=""; ek.value=""; loadGundem(); return;
  }
  if(ilg==="__new__"){ ilg=(prompt("İlgili kodu (ör. MK, FA):")||"").trim(); }
  ilg=ilg.toUpperCase();
  if(!ilg||!konu){ (ilg?ek:ei).focus(); return; }
  const btn=document.getElementById("ag-add"); btn.disabled=true; btn.textContent="Ekleniyor…";
  const {data}=await sb.from("ana_gundem").select("kod").like("kod","M%");
  let mx=0; (data||[]).forEach(r=>{ const m=String(r.kod||"").match(/^M(\d+)$/); if(m) mx=Math.max(mx,+m[1]); });
  const {error}=await sb.from("ana_gundem").insert([{kod:"M"+(mx+1),kod_prefix:"M",konu,ilgili:ilg,kaynak_tip:"manuel",turetilmis:false}]);
  btn.disabled=false; btn.textContent="Ekle";
  if(error){ alert(error.message); return; }
  loadGundem();
}

function startEdit(el){
  if(el.querySelector("input,select")) return;
  const f=el.dataset.f, type=el.dataset.type, id=el.closest("tr").dataset.id;
  const cur=el.textContent.trim().replace(/^\+.*/,"").replace(/^tarih$/,"");
  const inp=document.createElement("input"); inp.className="cell"; inp.type = type==='date'?'date':'text';
  inp.value = type==='date'? "": cur;
  el.innerHTML=""; el.appendChild(inp); inp.focus();
  const commit=async()=>{
    let val=inp.value;
    if(type==='date' && !val){ el.innerHTML='<span style=color:#b7c6d6>tarih</span>'; return; }
    const {error}=await sb.from("ana_gundem").update({[f]:val||null}).eq("id",id);
    if(error){ el.innerHTML='<span style=color:#b40000>hata</span>'; alert(error.message); return; }
    el.textContent = type==='date'? fdate(val) : (val|| "");
    el.classList.add("saveflash"); setTimeout(()=>el.classList.remove("saveflash"),400);
  };
  inp.onblur=commit;
  inp.onkeydown=e=>{ if(e.key==='Enter'){e.preventDefault();inp.blur();} if(e.key==='Escape'){loadGundem();} };
}

/* Bölge çekim hesabı: aktif=güncel, arşivden en yeni çekim=önceki */
function regCalc(rows){
  const cur=rows.filter(r=>r.aktif), arch=rows.filter(r=>!r.aktif);
  let pc=null; arch.forEach(r=>{ if(pc==null||r.cekim>pc) pc=r.cekim; });
  const prev=arch.filter(r=>r.cekim===pc);
  const cmp = prev.length? cur : [];
  const by=(arr,s)=>arr.filter(r=>String(r.statu||"").toLocaleLowerCase('tr').startsWith(s));
  return {
    cM:by(cur,'muht'), cA:by(cur,'al'),
    cMc:by(cmp,'muht'), cAc:by(cmp,'al'),
    pM:by(prev,'muht'), pA:by(prev,'al'),
    cekim: cur.reduce((m,r)=> (r.cekim>m?r.cekim:m), '0'),
    hasPrev: prev.length>0
  };
}
const sSum=arr=>arr.reduce((a,r)=>a+(Number(r.net_eur)||0),0);
const sKey=r=>String(r.proje||"").trim().toLocaleLowerCase('tr');
function sDiff(c,p){ const ps=new Set(p.map(sKey)), cs=new Set(c.map(sKey));
  return { ekl:c.filter(r=>!ps.has(sKey(r))), sil:p.filter(r=>!cs.has(sKey(r))) }; }
function eurDelta(v){ const r=Math.round(v); const c=r>0?'#0a6b3f':(r<0?'#b23a2e':'#6a7888'); return ` <span style="color:${c}">(${r>0?'+':(r<0?'−':'')}${money(Math.abs(r))} €)</span>`; }
/* Üst özet blok: hizalı Muhtemel | Alınan; Toplam + bölge satırları + eklenen(yeşil)/silinen(kırmızı) */
function satisSummary(regions){
  const cell=(cur,cmp,prev,hasPrev)=>`${money(sSum(cur))} €${hasPrev?eurDelta(sSum(cmp)-sSum(prev)):''}`;
  /* eklenen → YEŞİL; silinen → muhtemel→alınan (M sütunu) veya alınan→üretim (A sütunu) geçişi ise SİYAH, diğer silinenler KIRMIZI */
  const det=(cmp,prev,hasPrev,kind,curM,curA)=>{ if(!hasPrev) return '';
    const {ekl,sil}=sDiff(cmp,prev); let s='';
    const line=(col,proje,sgn,val)=>`<div class="sdrow" style="color:${col}"><span class="sdp">${esc(proje)}</span><span class="sdv">${sgn}${money(val)} €</span></div>`;
    ekl.forEach(r=> s+=line('#0a6b3f',r.proje,'+',r.net_eur));
    sil.forEach(r=>{ const k=sKey(r); const iyi = kind==='M' ? curA.has(k) : (!curM.has(k) && !curA.has(k));
      s+=line(iyi?'#1c2430':'#b23a2e',r.proje,'−',r.net_eur); });
    return s; };
  const tM=[],tA=[],tMc=[],tAc=[],tpM=[],tpA=[]; let anyPrev=false;
  regions.forEach(rg=>{ tM.push(...rg.cM); tA.push(...rg.cA); tMc.push(...rg.cMc); tAc.push(...rg.cAc); tpM.push(...rg.pM); tpA.push(...rg.pA); anyPrev=anyPrev||rg.hasPrev; });
  let body=`<tr class="stot"><td>Toplam</td><td class="num">${cell(tM,tMc,tpM,anyPrev)}</td><td class="num">${cell(tA,tAc,tpA,anyPrev)}</td></tr>`;
  regions.forEach(rg=>{
    const curM=new Set(rg.cM.map(sKey)), curA=new Set(rg.cA.map(sKey));
    body+=`<tr class="sreg"><td>${esc(rg.ad)}</td><td class="num">${cell(rg.cM,rg.cMc,rg.pM,rg.hasPrev)}</td><td class="num">${cell(rg.cA,rg.cAc,rg.pA,rg.hasPrev)}</td></tr>`;
    const dm=det(rg.cMc,rg.pM,rg.hasPrev,'M',curM,curA), da=det(rg.cAc,rg.pA,rg.hasPrev,'A',curM,curA);
    if(dm||da) body+=`<tr class="sdet"><td></td><td>${dm}</td><td>${da}</td></tr>`;
  });
  return `<div class="scroll" style="max-height:none;overflow-y:visible;overflow-x:auto;-webkit-overflow-scrolling:touch;border:0"><table class="ssum"><thead><tr><th></th><th class="num">Muhtemel</th><th class="num">Alınan</th></tr></thead><tbody>${body}</tbody></table></div>`;
}
function satisTbl(arr){
  const list=arr.slice().sort((a,b)=>(Number(b.net_eur)||0)-(Number(a.net_eur)||0));
  const rows=list.map(r=>`<tr>`
    +`<td class="kod"><div class="cx sc1" title="${esc(r.proje)}">${esc(r.proje)}</div></td>`
    +`<td><div class="cx sc2" title="${esc(r.musteri)}">${esc(r.musteri)}</div></td>`
    +`<td class="num"><div class="cx sc3">${money(r.net_eur)}</div></td>`
    +`<td><div class="cx sc4" title="${esc(r.durum)}">${esc(r.durum)}</div></td></tr>`).join("");
  return `<div class="scroll"><table class="sat"><thead><tr><th><span class="cw sc1">PROJE</span></th><th><span class="cw sc2">MÜŞTERİ</span></th><th class="num"><span class="cw sc3">NET (€)</span></th><th><span class="cw sc4">DURUM</span></th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
/* Bölge başlığı yanı: ilgili formun güncelleme düğmesine son basılma tarihi (satis_ay_islendi.updated_at) */
function ayBanner(ai){ if(!ai||!ai.updated_at) return ''; return ` <span class="muted" style="font-weight:400">· ${dOnly(ai.updated_at)}</span>`; }
function regionDetail(rg, ai){
  return `<h2 class="secH" style="margin-top:22px">${esc(rg.ad)}${ayBanner(ai)}</h2>
    <h3 class="sec">Muhtemel <span class="muted">(${rg.cM.length} proje · Net ${money(sSum(rg.cM))} €)</span></h3>
    ${satisTbl(rg.cM)}
    <h3 class="sec">Alınan <span class="muted">(${rg.cA.length} proje · Net ${money(sSum(rg.cA))} €)</span></h3>
    ${satisTbl(rg.cA)}`;
}
/* Ülke normalizasyonu: Almanya · İngiltere · Fransa · Diğer Ülkeler */
function ulkeNorm(u){ u=String(u||"").toLocaleLowerCase('tr');
  if(/alman|german/.test(u)) return 'Almanya';
  if(/ingil|i̇ngil|united kingdom|\buk\b|england|britan/.test(u)) return 'İngiltere';
  if(/fransa|france|\bfr\b/.test(u)) return 'Fransa';
  return 'Diğer Ülkeler'; }
/* Takipteki teklifler istatistiği — Almanya/İngiltere/Diğer + yıllar tek blokta */
function statsBlock(ssData){
  const stats=ssData||[];
  const DD=['Kazandık','Kaybettik','Belirsiz','Müşteri işi alamadı'];
  const ULKE=['Almanya','İngiltere','Fransa','Diğer Ülkeler'];
  const S={}, years=new Set();
  stats.forEach(r=>{ const y=r.yil, u=ulkeNorm(r.ulke), d=r.durum; years.add(y);
    (S[y]=S[y]||{}); (S[y][u]=S[y][u]||{});
    const o=S[y][u][d]=S[y][u][d]||{adet:0,tutar:0,ws:0,wa:0};
    o.adet+=Number(r.adet)||0; o.tutar+=Number(r.tutar)||0;
    if(r.ort_isk!=null){ o.ws+=Number(r.ort_isk)*(Number(r.adet)||0); o.wa+=(Number(r.adet)||0); } });
  const ort=o=>(o&&o.wa)?o.ws/o.wa:null;
  const rd=v=>v==null?'—':Math.round(v)+'%';
  const full=o=>o?`<td class="num">${o.adet}</td><td class="num">${money(o.tutar)}</td><td class="num">${rd(ort(o))}</td>`:'<td class="num">0</td><td class="num">—</td><td class="num">—</td>';
  const cnt=o=>`<td class="num">${o?o.adet:0}</td>`;
  const rowFor=(lbl,g,cl)=>`<tr${cl?' class="grp"':''}><td class="kod">${esc(lbl)}</td>${full(g['Kazandık'])}${full(g['Kaybettik'])}${cnt(g['Belirsiz'])}${cnt(g['Müşteri işi alamadı'])}</tr>`;
  const yrs=[...years].sort((a,b)=>b-a);
  let body='';
  const yearBlock=y=>{
    body+=`<tr class="grp"><td colspan="9">${esc(String(y))}</td></tr>`;
    const gT={}; DD.forEach(d=>{ let ad=0,tu=0,ws=0,wa=0; ULKE.forEach(u=>{ const o=(S[y]&&S[y][u])?S[y][u][d]:null; if(o){ ad+=o.adet; tu+=o.tutar; ws+=o.ws; wa+=o.wa; } }); gT[d]={adet:ad,tutar:tu,ws:ws,wa:wa}; });
    ULKE.forEach(u=> body+=rowFor(u, (S[y]&&S[y][u])||{}, false));
    body+=rowFor('Toplam',gT,true);
  };
  if(yrs.length) yrs.forEach(yearBlock);
  else { body+=`<tr class="grp"><td colspan="9">— (veri bekleniyor)</td></tr>`; ULKE.forEach(u=> body+=rowFor(u,{},false)); body+=rowFor('Toplam',{},true); }
  return '<h3 class="sec">Takipteki teklifler — yıllık sonuç istatistiği</h3>'
    +`<div class="scroll"><table class="tks"><thead>
      <tr><th rowspan="2">Yıl / Ülke</th><th colspan="3">Kazandık</th><th colspan="3">Kaybettik</th><th rowspan="2" class="num">Belirsiz<br>(adet)</th><th rowspan="2" class="num">Müşteri işi<br>alamadı (adet)</th></tr>
      <tr><th class="num">Adet</th><th class="num">Tutar €</th><th class="num">Ort.İsk</th><th class="num">Adet</th><th class="num">Tutar €</th><th class="num">Ort.İsk</th></tr>
      </thead><tbody>${body}</tbody></table></div>`;
}
/* Snapshot'tan eklenen/silinen — en yeni iki çekim farkı */
function takipDiff(snapRows){
  const rows=snapRows||[];
  const cekimler=[...new Set(rows.map(r=>String(r.cekim)))].sort();
  if(cekimler.length<2) return '<div class="hint">Eklenen/silinen için en az iki snapshot gerekir (form her yayınlandığında bir snapshot alınır).</div>';
  const last=cekimler[cekimler.length-1], prev=cekimler[cekimler.length-2];
  const cur=rows.filter(r=>String(r.cekim)===last), pr=rows.filter(r=>String(r.cekim)===prev);
  const {ekl,sil}=sDiff(cur,pr);
  /* eklenen → YEŞİL; silinen (takipten çıktı = karara bağlandı/ilerledi) → SİYAH */
  const chip=(r,pos)=>`<span style="color:${pos?'#0a6b3f':'#1c2430'};white-space:nowrap">${esc(r.proje)}${r.net_ht_eur!=null?` ${pos?'+':'−'}${money(r.net_ht_eur)} €`:''}</span>`;
  let s=`<div class="sybox" style="line-height:1.9">`;
  if(!ekl.length&&!sil.length) s+='<div class="muted">Değişiklik yok.</div>';
  if(ekl.length) s+=`<div><b style="color:#0a6b3f">Eklenen (${ekl.length}):</b> ${ekl.map(r=>chip(r,1)).join(' · ')}</div>`;
  if(sil.length) s+=`<div><b style="color:#1c2430">Silinen (${sil.length}):</b> ${sil.map(r=>chip(r,0)).join(' · ')}</div>`;
  return s+'</div>';
}
/* Yurtdışı takip tablosu: Ülke/Hazırlayan yok; 4 not kolonu (Formlardan) */
function takipSection(title, tkData, ssData, snapRows, showStats){
  const takip=(tkData||[]).slice().sort((a,b)=>String(b.teklif_tarihi||"").localeCompare(String(a.teklif_tarihi||"")));
  const tkNet=takip.reduce((a,r)=>a+(Number(r.net_ht_eur)||0),0);
  const tkRows=takip.map(r=>`<tr>
     <td class="t-proje"><div class="cx" title="${esc(r.proje)}">${esc(r.proje)}</div></td>
     <td class="t-mus"><div class="cx" title="${esc(r.musteri)}">${esc(r.musteri)}</div></td>
     <td class="num">${money(r.net_ht_eur)}</td>
     <td class="num">${fdate(r.teklif_tarihi)}</td>
     <td class="t-agac"><div class="cx" title="${esc(r.agac)}">${esc(r.agac)}</div></td>
     <td class="t-ihale"><div class="cx" title="${esc(r.ihale)}">${esc(r.ihale)}</div></td>
     <td class="t-durum"><div class="cx" title="${esc(r.durum)}">${esc(r.durum)}</div></td>
     <td class="num">${fdate(r.son_takip_teklif)}</td>
     <td class="t-not"><div class="cx" title="${esc(r.takip_sekli)}">${esc(r.takip_sekli)}</div></td>
     <td class="num">${fdate(r.son_takip_yurtdisi)}</td>
     <td class="t-not"><div class="cx" title="${esc(r.yurtdisi_notlari)}">${esc(r.yurtdisi_notlari)}</div></td></tr>`).join("");
  const takipHTML = takip.length? `
    <div class="scroll"><table class="aup">
    <thead><tr><th rowspan="2">PROJE</th><th rowspan="2">MÜŞTERİ</th><th rowspan="2" class="num">NET HT (€)</th><th rowspan="2" class="num">TEKLİF</th><th rowspan="2">AĞAÇ</th><th rowspan="2">İHALE</th><th rowspan="2">DURUM</th><th colspan="2" class="grph">Teklif Birimi</th><th colspan="2" class="grph">Yurtdışı Birimi</th></tr>
    <tr><th class="num grpc">Son Takip T.</th><th>Notları</th><th class="num grpc">Son Takip T.</th><th>Notları</th></tr></thead>
    <tbody>${tkRows}</tbody></table></div>`:'<div class="hint">Takipte teklif yok.</div>';
  return `<h3 class="sec" style="margin-top:26px">${esc(title)} <span class="muted">(${takip.length} teklif · Net HT ${money(tkNet)} €)</span></h3>
    ${takipDiff(snapRows)}
    ${takipHTML}
    ${showStats?statsBlock(ssData):''}`;
}

/* ---------- HAZIR PEM/PRJ ---------- */
async function loadHazir(){
  const view=document.getElementById("view");
  const [{data,error},erpRes,ozRes,dgRes,adRes]=await Promise.all([
    sb.from("hazir_pem_prj").select("*"),
    sb.from("hazir_erp").select("tur,kalem_key,erp"),
    sb.from("sevk_durumu_onur").select("tur,kalem_key,degisim_ozet"),
    sb.from("erp_yukleme").select("damga").order("damga",{ascending:false}).limit(1),
    sb.from("pano_adet_ozet").select("damga,pem_adet,prj_adet").limit(2)
  ]);
  if(error){ view.innerHTML=`<div class="load">Hata: ${esc(error.message)}</div>`; return; }
  const erpMap={}; (erpRes.data||[]).forEach(r=>{ erpMap[String(r.tur).toUpperCase()+"|"+r.kalem_key]=r.erp||{}; });
  const ozMap={}; (ozRes.data||[]).forEach(r=>{ ozMap[String(r.tur).toUpperCase()+"|"+r.kalem_key]=r.degisim_ozet||""; });
  /* Filtre (her ingest sonrası otomatik geçerli):
     1) Termin tarihi (PEM) / AÜP tarihi (PRJ) BOŞ olan kalemler gösterilmez.
     2) Bu tarih, panonun güncelleme tarihinden (son ERP damgası) geriye doğru 10 gün içindeyse gösterilmez. */
  const _dmg=String((dgRes&&dgRes.data&&dgRes.data[0]&&dgRes.data[0].damga)||"");
  const _ref=/^\d{6}$/.test(_dmg)? new Date(2000+Number(_dmg.slice(0,2)),Number(_dmg.slice(2,4))-1,Number(_dmg.slice(4,6))) : new Date();
  _ref.setHours(23,59,59,999);
  const _cut=new Date(_ref); _cut.setHours(0,0,0,0); _cut.setDate(_cut.getDate()-10);
  const filt=(data||[]).filter(r=>{
    const dt=r.hazir_tarihi; if(!dt) return false;
    const d=new Date(dt); if(isNaN(d)) return false;
    return !(d>=_cut);
  });
  const digits=s=>String(s==null?"":s).replace(/\D/g,"");
  const lastN=(s,n)=>{ const d=digits(s); return d.slice(-n); };
  const ev=(tur,no,k)=>{ const e=erpMap[tur+"|"+no]||{}; return e[k]!=null?String(e[k]):""; };
  const block=tip=>{
    const T=tip==="pem"?"PEM":"PRJ";
    const rowsX=filt.filter(r=>String(r.tur||"").toUpperCase()===T);
    if(!rowsX.length) return "";
    const noteCol=tip==="pem"?"ekbilgi":"notlar", dcol=tip==="pem"?"termin":"aup";
    const noteHd=tip==="pem"?"Ek Bilgi":"Satış/Şantiye Notları", dateHd=tip==="pem"?"Termin Tarihi":"AÜP Tarihi";
    const kodW="h8";  /* PEM+PRJ kod aynı genişlik → son 4 sütun hizalı (6d) */
    const sorted=[...rowsX].sort((a,b)=>(ev(T,a.no,dcol)||"99999999").localeCompare(ev(T,b.no,dcol)||"99999999"));
    const body=sorted.map(r=>{
      const kod=lastN(r.no,tip==="pem"?5:8);
      const proje=ev(T,r.no,"proje")||String(r.proje_adi||"");
      /* PRJ notu ERP Prj.xlsx "SATIŞ/ŞANTİYE NOTLARI" alanından (hazir_pem_prj.satis_notu) gelir. */
      const note=ev(T,r.no,noteCol)||(tip==="pem"?String(r.ek_bilgi||""):String(r.satis_notu||""));
      let adet=ev(T,r.no,"adet")||(r.adet==null?"":String(r.adet));
      if(adet!==""&&isFinite(parseFloat(adet))) adet=String(Math.round(parseFloat(adet)));
      const dt=ev(T,r.no,dcol)||r.hazir_tarihi||"";
      const onur=r.onur_guncel||"", oz=ozMap[T+"|"+r.no]||"";
      return `<tr>`
        +`<td class="c ${kodW}"><span title="${esc(kod)}">${esc(kod)}</span></td>`
        +`<td class="c h15"><span title="${esc(proje)}">${esc(proje)}</span></td>`
        +`<td class="c h25"><span title="${esc(note)}">${esc(note)}</span></td>`
        +`<td class="c h3"><span>${esc(adet)}</span></td>`
        +`<td class="c hdt"><span title="${esc(dt)}">${esc(fdate(dt)||dt)}</span></td>`
        +`<td class="c h20"><span title="${esc(onur)}">${esc(onur)}</span></td>`
        +`<td class="c h20"><span title="${esc(oz)}">${esc(oz)}</span></td>`
        +`</tr>`;
    }).join("");
    /* Blok başlığı (h3 "PEM"/"PRJ") YOK — blok kimliği ilk sütun başlığında: PEM / Proje.
       Adetler damga satırında (PEM Adet / PRJ Adet). */
    const kodHd=tip==="pem"?"PEM":"Proje";
    const heads=`<th>${kodHd}</th><th>Proje Adı</th><th>${noteHd}</th><th>Adet</th><th>${dateHd}</th><th>Sevk Durumu (Onur)</th><th>Sevk Durum Değişimi</th>`;
    return `<div class="scroll hblk"><table><thead><tr>${heads}</tr></thead><tbody>${body}</tbody></table></div>`;
  };
  const st=await erpStamp();
  const a0=(adRes&&adRes.data&&adRes.data[0])||{}, a1=(adRes&&adRes.data&&adRes.data[1])||{};
  const hStamp='<div class="stamp">Son güncelleme: '+(st||"—")
    +' · PEM Adet: '+Math.round(Number(a0.pem_adet)||0)+pctSpan(a0.pem_adet,a1.pem_adet)
    +' · PRJ Adet: '+Math.round(Number(a0.prj_adet)||0)+pctSpan(a0.prj_adet,a1.prj_adet)+'</div>';
  view.innerHTML=`${hStamp}
    <style>.hblk table{font-size:11.5px}.hblk th,.hblk td{white-space:nowrap;padding:2px 6px;border-bottom:1px solid #eef1f5;line-height:16px}.hblk thead th{vertical-align:bottom}.hblk .c>span{display:block;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;white-space:nowrap}.hblk .c>span::-webkit-scrollbar{display:none}.h3>span{width:3ch}.h5>span{width:5ch}.h8>span{width:8ch}.h15>span{width:15ch}.h20>span{width:68ch}.h25>span{width:25ch}.hdt>span{width:12.45ch}</style>
    ${block("pem")}
    ${block("prj")}`;
}

/* ---------- AÜP (salt-okur) ---------- */

  let rows="";
  data.forEach(r=>{
    const ga=r.gyt_aup, ky=r.kayma;
    rows+=`<tr>
      <td class="kod">${esc(String(r.proje_no||"").slice(-6))}</td>

      <td class="num">${fdate(r.gyt)}</td>
      <td class="num pstd ${ga<0?'red':''}">${ga==null?'':ga}</td>

      <td class="num">${money(r.anlasma_fiyati)}</td>

      <td class="ur"><div class="cx">${esc(r.uretim_notlari)}</div></td>
    </tr>`;
  });
  const st=await erpStamp();
  const o0=(oz.data&&oz.data[0])||{}, o1=(oz.data&&oz.data[1])||{};
  const pct=(a,b)=>{ a=Number(a)||0; b=Number(b)||0; if(!b) return ""; const v=Math.round((a-b)/Math.abs(b)*100); return ' <span style="color:'+(v>=0?'#0a6b3f':'#b23a2e')+'">('+(v>=0?'+':'−')+Math.abs(v)+'%)</span>'; };
  const gk=Number(o0.global_kayma||0).toFixed(1).replace(".",",");
  const stamp='<div class="stamp">Son güncelleme: '+(st||"—")+' · Adet: '+money(o0.toplam_adet)+pct(o0.toplam_adet,o1.toplam_adet)+' · Tutar: '+money(o0.toplam_tutar)+' €'+pct(o0.toplam_tutar,o1.toplam_tutar)+' · Global kayma: '+gk+' gün</div>';

async function loadBilanco(tgt){

  const rowsD=(data||[]).slice().sort((a,b)=>b.yil-a.yil);
  const cur=rowsD[0]||{};
  const kar=cur.kar_tl, zar=kar<0;
  function card(t,v,s2,cls){ return `<div style="background:#fff;border:1px solid #e3e8ee;border-radius:10px;padding:10px 12px;border-left:4px solid ${cls}"><div style="font-size:11px;color:#6a7888">${t}</div><div style="font-size:18px;font-weight:700;color:#16324f">${v}</div><div style="font-size:10.5px;color:#93a1b0;margin-top:3px">${s2}</div></div>`; }
  const cards=`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin:6px 0 12px">
    ${card("Net Satış ("+cur.yil+")", money(cur.net_tl)+" TL", "≈ "+money(cur.net_eur)+" €", "#0a6b3f")}
    ${card("Toplam Maliyet", money(cur.toplam_gider_tl)+" TL", "710 + 720 + 730", "#b8863a")}
    ${card("Kâr/Zarar", (zar?"−":"+")+money(Math.abs(kar))+" TL", "Net − Maliyet", zar?"#b23a2e":"#0a6b3f")}
    ${card("Kâr Marjı", (cur.marj==null?"":Number(cur.marj).toFixed(1).replace(".",","))+" %", "Kapsam: Arbor Türkiye", zar?"#b23a2e":"#0a6b3f")}
  </div>`;
  let rows="";
  rowsD.forEach(r=>{
    const k=r.kar_tl, hasK=k!=null;
    const kc=hasK?`<td class="num" style="color:${k>=0?'#0a6b3f':'#b23a2e'};font-weight:600">${k>=0?'+':'−'}${money(Math.abs(k))}</td>`:'<td class="num" style="color:#c2ccd6">—</td>';
    const mc=hasK?`<td class="num" style="color:${k>=0?'#0a6b3f':'#b23a2e'}">${Number(r.marj).toFixed(1).replace(".",",")}%</td>`:'<td class="num" style="color:#c2ccd6">—</td>';
    const g=v=>v==null?'<td class="num" style="color:#c2ccd6">—</td>':`<td class="num">${money(v)}</td>`;
    const tg=r.toplam_gider_tl;
    const p=v=>(v==null||tg==null||Number(tg)===0)?'<td class="num" style="color:#c2ccd6">—</td>':`<td class="num" style="color:#6a7888">%${Math.round(v/tg*100)}</td>`;
    rows+=`<tr><td class="kod">${esc(r.yil)}</td><td class="num">${money(r.net_tl)}</td><td class="num">${money(r.net_eur)}</td>${g(r.k710_tl)}${p(r.k710_tl)}${g(r.k720_tl)}${p(r.k720_tl)}${g(r.k730_tl)}${p(r.k730_tl)}${g(r.toplam_gider_tl)}${kc}${mc}</tr>`;
  });
  /* 710 kalem listesi — dönem başına açılır kutu (kaynak: SB malzeme tablosu, gider_710_kalem). */
  const g7rows=(g7&&!g7.error)?(g7.data||[]):[];
  const donemler=[...new Set(g7rows.map(r=>r.donem))].sort().reverse();
  const g710Box=d=>{
    const rs=g7rows.filter(r=>r.donem===d);
    if(!rs.length) return "";
    const tot=rs.filter(r=>r.grup).reduce((a,r)=>a+(Number(r.tutar)||0),0);
    const pay=v=>tot?Math.round((Number(v)||0)/tot*100)+"%":"";
    const body=rs.map(r=>`<tr${r.grup?' class="grp"':''}><td class="kod">${esc(r.sira)}</td><td>${esc(r.cinsi)}</td><td>${esc(r.birim||"")}</td><td class="num">${money(r.miktar)}</td><td class="num">${money(r.alinan_tutar)}</td><td class="num">${money(r.tutar)}</td><td class="num">${r.grup?pay(r.tutar):""}</td></tr>`).join("");
    return `<details class="g7box"><summary>710 — Direkt İlk Madde/Malzeme listesi · ${esc(d)} <span class="muted">(${rs.filter(r=>!r.grup).length} kalem · ${money(tot)} TL)</span></summary>
      <div class="scroll"><table><thead><tr><th>Sıra</th><th>Cinsi</th><th>Birim</th><th class="num">Toplam Miktar</th><th class="num">Dönem İçi Alınan (TL)</th><th class="num">Toplam Tutar (TL)</th><th class="num">Pay</th></tr></thead><tbody>${body}<tr class="itot"><td></td><td>LİSTE TOPLAMI</td><td></td><td></td><td></td><td class="num">${money(tot)}</td><td class="num">100%</td></tr></tbody></table></div></details>`;
  };
  const st=await tblStamp("bilanco_yil");
  view.innerHTML=`${stampHTML(st)}
    <style>.g7box{background:#fff;border:1px solid #dde3ea;border-radius:8px;padding:4px 10px;margin:6px 0;width:max-content;max-width:100%}
    .g7box>summary{cursor:pointer;font-weight:700;color:#16324f;font-size:12px;padding:2px 0}
    .g7box[open]>summary{margin-bottom:4px}</style>
    ${cards}
    <div class="scroll"><table>
    <thead><tr><th>Yıl</th><th class="num">Net Satış (TL)</th><th class="num">Net (€)</th><th class="num">710 Malzeme</th><th class="num">710 %</th><th class="num">720 İşçilik</th><th class="num">720 %</th><th class="num">730 GÜG</th><th class="num">730 %</th><th class="num">Toplam Gider</th><th class="num">Kâr/Zarar</th><th class="num">Marj</th></tr></thead>
    <tbody>${rows}</tbody></table></div>
    ${donemler.map(g710Box).join("")}`;
}


/* ---------- YILLIK İCMAL (icmal_ozet view) ---------- */
async function loadIcmal(tgt){
  const view=document.getElementById(tgt||"view");
  const {data,error}=await sb.from("icmal_satir").select("*").order("sira",{ascending:true});
  if(error){ view.innerHTML=`<div class="load">Hata: ${esc(error.message)}</div>`; return; }
  const F=["adet","dk1_ad","m2","net_eur","ort_kur","net_tl","netfi_eur_m2","netfi_eur_ad","id_per","ur_per","top_per","ciro_per_eur","isk","kapasite_ad_ay","onaysiz_ad","onay_ter_hf","urt_ad","son_proje_cikis","so_alinan_eur","so_muht_eur","fa_alinan_eur","fa_muht_eur","top_alinan_eur","alinan_ter_hf","top_muht_eur","fr_isk_pct","dig_isk_pct"];
  /* Yıl toplam satırı: personel sayıları ve ciro/personel TOPLANMAZ, o yılın dolu aylarının
     ORTALAMASI gösterilir (tamsayı). Satır düzeni: toplam satırı, ardından o yılın ayları. */
  const AVGF=["id_per","ur_per","top_per","ciro_per_eur"];
  const trNum=s=>{ if(s==null||s==="") return null; const v=parseFloat(String(s).replace(/\./g,"").replace(",",".")); return isFinite(v)?v:null; };
  const rowsA=(data||[]).slice();
  for(let i=0;i<rowsA.length;i++){
    if(!rowsA[i].is_total) continue;
    const acc={}; AVGF.forEach(f=>acc[f]=[]);
    let j=i+1;
    for(; j<rowsA.length && !rowsA[j].is_total; j++) AVGF.forEach(f=>{ const v=trNum(rowsA[j][f]); if(v) acc[f].push(v); });
    AVGF.forEach(f=>{ if((rowsA[i][f]==null||rowsA[i][f]==="")&&acc[f].length) rowsA[i][f]=money(acc[f].reduce((a,b)=>a+b,0)/acc[f].length); });
  }
  /* "Yurt Dışı" sütunu = Yurt Dışı 1 (fa_*) + Yurt Dışı 2 (fy2_*); FY2 girilmemiş aylarda
     yalnız FY görünür. FY2 doluysa Toplam da (Yurt İçi + YD1 + YD2) olarak yeniden hesaplanır. */
  rowsA.forEach(r=>{
    const yd2a=trNum(r.fy2_alinan_eur), yd2m=trNum(r.fy2_muht_eur);
    if(yd2a){ r.fa_alinan_eur=money((trNum(r.fa_alinan_eur)||0)+yd2a); r.top_alinan_eur=money((trNum(r.so_alinan_eur)||0)+(trNum(r.fa_alinan_eur)||0)); }
    if(yd2m){ r.fa_muht_eur=money((trNum(r.fa_muht_eur)||0)+yd2m); r.top_muht_eur=money((trNum(r.so_muht_eur)||0)+(trNum(r.fa_muht_eur)||0)); }
  });
  let rows="";
  rowsA.forEach(r=>{
    let tds='<td class="kod">'+esc(r.donem)+'</td>';
    F.forEach(f=>{ tds+='<td class="num">'+esc(r[f])+'</td>'; });
    rows+='<tr'+(r.is_total?' class="itot"':'')+'>'+tds+'</tr>';
  });
  const st=await tblStamp("icmal_yil");
  const TH=["D\u00f6nem","Miktar (Ad)","DK1 (Ad)","Miktar (m\u00b2)","Net Tutar (\u20ac)","Ort. Kur","Net Tutar (TL)","Net Fi. (\u20ac/m\u00b2)","Net Fi. (\u20ac/ad)","\u0130d.Per (Ki\u015fi)","\u00dcr.Per (Ki\u015fi)","Top.Per (ki\u015fi)","Ciro/Per (\u20ac/ki\u015fi)","\u0130sk (%)","Kapasite (Ad/Ay)","0..4 Onays\u0131z (Ad)","Onay Ter (hf)","4.1\u20267 \u00dcrt (Ad)","Son Proje \u00c7\u0131k\u0131\u015f","Yurt \u0130\u00e7i al\u0131nan Prj (\u20ac)","Yurt \u0130\u00e7i muht. Prj (\u20ac)","Yurt D\u0131\u015f\u0131 al\u0131nan Prj (\u20ac)","Yurt D\u0131\u015f\u0131 muht. Prj (\u20ac)","Top.al\u0131nan Prj (\u20ac)","Al.Ter. (hf)","Top.muht. Prj (\u20ac)","FR \u0130sk. (%)","Di\u011f \u0130sk. (%)"];
  const head=TH.map((h,i)=>i===0?('<th>'+h+'</th>'):('<th class="num">'+h+'</th>')).join("");
  view.innerHTML=`${stampHTML(st)}
    <div class="scroll"><table>
    <thead><tr>${head}</tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

    <div class="flow"><b>Güncel işleyiş:</b> <span class="step">Melih ERP'yi manuel çeker</span><span class="arr">→</span><span class="step">Arbor\ERP\&lt;YYMMDD&gt;\ (geçici giriş kutusu)</span><span class="arr">→</span><span class="step">worker · upsert</span><span class="arr">→</span><span class="step">Postgres snapshot</span><span class="arr">→</span><span class="step">bu app</span></div>
    <h3 class="sec">Kişiler (${(k.data||[]).length})</h3>
    <div class="scroll"><table><thead><tr><th>Kod</th><th>Ad Soyad</th><th>Bölüm</th><th>E-posta</th><th>Rol</th></tr></thead><tbody>${kr}</tbody></table></div>
    <div class="hint">Ödemeler (referans — süreç yok) bloğu <b>Mali → Maaş-Prim</b> panosuna taşındı.</div>
    <h3 class="sec">Parametreler</h3>
    <div class="scroll"><table><thead><tr><th>Anahtar</th><th>Değer</th><th>Açıklama</th></tr></thead><tbody>${pr}</tbody></table></div>
    <h3 class="sec">İşleyiş — Süreçler</h3>
    <div class="hint">Süreçler Melih'in tarif ettiği işleyişi yansıtır; her biri <b>tetik → sorumlu → adımlar → çıktı</b> zinciriyle, sıklık etiketiyle yazılmıştır. Firma içi <b>kurallar</b> (yasalar) ayrı Prosedürler sekmesindedir.</div>
    <div class="flow"><b>1. ERP İngest Hattı</b><span class="tag">tek P süreci</span>
      <p>Melih ERP'yi manuel çeker → Excel'leri <code>Arbor\ERP\&lt;YYMMDD&gt;\</code> içine bırakır (geçici giriş kutusu; hedef Supabase Storage <code>erp/&lt;YYMMDD&gt;/</code>) → worker en güncel klasörü <b>başlık adına göre</b> okur, idempotent upsert eder → snapshot tabloları → app view'leri.</p>

    </div>
    <div class="flow"><b>2. SÖ Bölüm Gündem Süreci</b><span class="tag ok">SÖ sorumlusu = EA (Enes Artan)</span>
      <p>Her ERP çekiminden sonra tüm sorun ve öneriler (SÖ'ler) Claude tarafından, EA (Enes Artan) ile paylaşılan bir panoya işlenir.</p>
      <p>EA, o hafta gündeme alacağı bölümü panoda seçer; seçilen bölüme ait olanların yine EA tarafından <b>Pazartesi akşamına kadar</b> incelenip <b>"gündeme alındı"</b>ya çevrilmesi gerektiğini belirten bir mail Claude tarafından EA'ya gönderilir.</p>
      <p>Claude, <b>Salı sabahı</b> paylaşılan panoda seçilen bölümle ilgili tüm SÖ'lerin işlenip işlenmediğini kontrol eder; <b>eksik varsa</b> mail ile EA'dan ister ve bu kontrolü <b>Çarşamba sabahı</b> tekrarlar.</p>
      <p class="muted"><b>EA formu (ayrı):</b> <a href="ea/" target="_blank">app/ea/</a> — EA bunu kendi web formundan yapar; çalışanlar Melih'in panolarına doğrudan yazmaz, form sonucu buraya salt-okur yansır.</p><p class="muted">Fabrika bölümü SÖ.xlsx KUSURLU BİRİM sütunundan gelir; boşsa "Atanmamış". Açık SÖ kümesi: DURUM ≤ 7.2 &amp; NİTELİK PEM/Şantiye.</p>
    </div>
    <div class="flow"><b>3. Bilanço Süreci</b><span class="tag">Türkiye · gider=SB · gelir=İcmal</span>
      <p>SB (Muhasebe) gider tablosu → yeni dönem gideri gelince Melih iletir → Claude bilanço panosunu günceller. Kapsam yalnız Arbor Türkiye. Bilanço = Net Satış (İcmal) − Toplam Maliyet (710+720+730, SB).</p>
    </div>
    <div class="flow"><b>4. Yıllık İcmal Süreci</b><span class="tag">tek gelir kaynağı</span>
      <p>Yıllık İcmal, aylık/yıllık Net Satış'ın tek kaynağıdır ve bilançonun gelir tarafını besler. Aylık üretim-satış kolonları (adet, m², net €/TL, kur, net fiyat, personel, ciro/personel) ERP <b>Üs.xlsx</b>'ten gelir (worker aya göre icmal_satir'a yazar); SO/FA alınan-muhtemel satış formlarından; onaysız/üretim adedi Prj rollup'ından.</p>
    </div>
    <div class="flow"><b>5. Satış Raporları Süreci</b><span class="tag">AK · FA/FY · SO</span>
      <p>Kaynak raporu gönderir → Claude "Satış Yorum" + İcmal'e işler → mail "Rapor" klasörüne taşınır. AK (UK) ve FA/FY (Fransa/ihracat) ayın 1'i ve 15'i; SO (yurtiçi) yalnız ayın 1'i.</p>
      <p class="muted">Eskalasyon: ayın 5. ve 20. günü gelmeyen kaynağa tek hatırlatma; önce Melih, sonra ilgili.</p>
    </div>
    <div class="flow"><b>6. Prim / Ödeme Süreci</b>
      <p>Aylık prim banknot denominasyonu 100 $ → 50 € → 200 TL. Sabit: Onur 200 €/ay, Özlem Y. 7.000 TL/ay, Orhan 20.000 TL/ay. Oransal: Özgül %0,01 tahsilat. Değişken: Fatma proje primi.</p>
      <p class="muted">Ödeme onayı: Melih "Uygundur" (52.1) onaya sunulur; Osman onaylı iç/fabrika (52.25) sorulmadan işlenir.</p>
    </div>
    <div class="flow"><b>7. Sevke-Hazır / PEM Takip</b><span class="tag">Onur (Sevkiyat)</span>
      <p>Onur Ekinci sevke-hazır PEM/PRJ durumunu ve Excel'i günceller. PEM İlgili DURUM bazlı: 1.2 → Berat (dış sipariş), 1.3/2 → Semih (üretim).</p>
      <p class="muted">Hazır PEM/PRJ panosu (<code>hazir_pem_prj</code>): PEM durum 3 · PRJ durum 8/8.1. Onur'un sevk durumu <code>sevk_durumu_onur</code>'a yazılır, panoya salt-okur yansır.</p>
    </div>
    <div class="flow"><b>8. ARGE Süreci</b><span class="tag ok">İlgili = EU</span>
      <p>ERP Arge.xlsx İLGİLİ sütunu (Ömer/Tarık) yok sayılır; tüm ARGE'nin İlgili'si Enes Uzun'da toplanır (K73). Ana Gündem'de ARGE ayrı blok (kişi gruplarından sonra), sıra öncelik→açılış.</p>
      <p class="muted"><code>gundem_arge</code> filtresi: öncelik 1–3 &amp; durum 1–4. (SÖ İlgili = EA, ARGE İlgili = EU — farklı kişiler.)</p>
    </div>
    <div class="flow"><b>9. Cam Fiyatlandırma Aracı</b><span class="tag">talep üzerine · MB</span>
      <p>Cam parametrelerinden (dış/iç cam, kaplama, akustik, temper, form, ara boşluk, Fire Proof…) çarpımsal model + geçmiş teklif eşleşmesiyle €/m² fiyat üretir. Bağlantı çalışanla paylaşılabilir: <a href="cam/" target="_blank">app/cam/</a>. Cam.xlsx ERP'ye ingest edilmez; bu araç ayrıdır.</p>
    </div>
    <div class="flow"><b>10. AÜP Kayma Takibi</b><span class="tag">her ERP çekimi</span>
      <p>AÜP panosu ERP snapshot üstünde canlı görüntüdür. <b>PST-AÜP&gt;0</b> ve <b>Kayma≥3</b> kırmızı işaretlenir; global kayma tutar-ağırlıklı (<code>aup_ozet</code>) hesaplanır ve önceki çekimle karşılaştırılır.</p>
    </div>
    <div class="flow"><b>11. Sistem / Bakım Süreci</b><span class="tag ok">yapısal garanti</span>
      <p><b>App cerrahi düzenlenir</b>, asla sıfırdan üretilmez: <code>arbor_app.html</code> düzenlenir → <code>_deploy_app.py</code> invariants kapısını çalıştırır (require eksik / forbid varsa deploy durur) → GitHub <code>app/index.html</code>. Bilerek davranış değişince önce <code>arbor_invariants.json</code> güncellenir.</p>
      <p class="muted"><b>SQL/DDL</b> service key ile local'den çalışmaz → Supabase SQL Editor (tarayıcı) üzerinden Run; anon yazımlarda <code>audit_log</code> grant + policy unutulmaz.</p>
    </div>
    <div class="flow"><b>12. Prosedür Güncelleme</b><span class="tag">ERP son kayıt</span>
      <p>Prosedürler, <code>C:\\Users\\USER\\OneDrive\\Arbor\\ERP\\</code> son kayıt dikkate alınarak güncellenir.</p>
    </div>
`;
}

async function loadFormlar(){
  const view=document.getElementById("view");
  /* Her form = bir satır. Sütunlar: Form(30) · Kullanıcı(10) · Güncelleme(20) · Geciken(8) · Mail · Formu Aç
     Geciken/Mail sütunları eski Ana Gündem "Formlar" bloğundan buraya taşındı (form_takip). */
  const forms=[
    {ad:"SÖ Gündem",           who:"Enes Artan",        url:"ea/",          sik:"Her Salı"},
    {ad:"Hazır PEM-PRJ Sevk",  who:"Onur Ekinci",       url:"onur/",        sik:"Her ayın ilk iş günü"},
    {ad:"ÖB Faaliyet",         who:"Özgül Bedestenci",  url:"ob-rapor/",    sik:"Her ayın ilk iş günü"},

    {ad:"Yurt Dışı Alacak",    who:"Onur Ekinci",       url:"arbolacak/",   sik:"Her ayın ilk iş günü"},
    {ad:"Cam Fiyatlandırma",   who:"Herkes",            url:"cam/",         sik:"Süresiz"},
    {ad:"Ürün Fiyatlandırma",  who:"Herkes",            url:"teklif/",      sik:"Süresiz"}
  ];
  const FK={"ea/":"ea_so","onur/":"onur_sevk","ob-rapor/":"ob_rapor","mk-prim/":"mk_prim","so/":"yurtici","fy/":"yd1","fy2/":"yd2","ahsap/":"ahsap","selft/":"sel_ft","arbolacak/":"yd_alacak"};
  const ft=await sb.from("form_takip").select("*");
  const ftBy={}; ((ft&&!ft.error)?(ft.data||[]):[]).forEach(r=>ftBy[r.form_key]=r);
  const today=new Date(); today.setHours(0,0,0,0);
  const dParse=s=>{ if(!s) return null; const p=String(s).slice(0,10).split("-"); return new Date(+p[0],+p[1]-1,+p[2]); };
  const addPeriod=(d,sik)=>{ const x=new Date(d); if(/ay/i.test(sik)){ x.setMonth(x.getMonth()+1); } else { x.setDate(x.getDate()+7); } return x; };
  const gecikenGun=r=>{
    let ref=dParse(r.son_guncelleme); if(!ref) ref=new Date(today);
    const gun=Math.floor((today-addPeriod(ref,r.gunc_sikligi||""))/86400000);
    return gun>0?gun:0;
  };
  const body=forms.map(f=>{
    const r=ftBy[FK[f.url]];
    const sik=r?(r.gunc_sikligi||f.sik):f.sik;
    const g=r?gecikenGun(r):null;
    const gc=g==null?'<span class="muted">—</span>':(g>0?`<b style="color:#b40000">${g}</b>`:`<span style="color:#7a8896">0</span>`);

               :'<span class="muted">—</span>';
    return `<tr>`

      +`<td><div class="cx">${esc(f.who)}</div></td>`
      +`<td><div class="cx">${esc(sik)}</div></td>`
      +`<td class="num"><div class="cx">${gc}</div></td>`
      +`<td class="fmailc">${mail}</td>`
      +`<td class="fopen"><a class="btn" href="${esc(f.url)}" target="_blank">Formu aç</a></td></tr>`;
  }).join("");
  view.innerHTML=`<style>
    /* table-layout:fixed + width:1px → tablo genişliği = colgroup toplamı (width:auto olursa tarayıcı yayar) */
    table.frm{width:1px;table-layout:fixed;border-collapse:collapse;font-size:12px;background:#fff}
    table.frm col.f30{width:30ch}table.frm col.f10{width:10ch}table.frm col.f20{width:20ch}table.frm col.f8{width:8ch}table.frm col.fm{width:19ch}table.frm col.fb{width:12ch}
    table.frm td.num,table.frm th.num{text-align:right}
    table.frm td.fmailc{white-space:nowrap;padding:2px 8px}
    table.frm button.fmail{font-size:11px;padding:1px 7px;border:1px solid #8a6100;background:#fff7e6;color:#7a5400;border-radius:5px;cursor:pointer}
    table.frm button.fmail:hover{background:#8a6100;color:#fff}
    table.frm button.freset{font-size:11px;padding:1px 6px;border:1px solid #cdd6df;background:#fff;color:#2e7d54;border-radius:5px;cursor:pointer}
    table.frm button.freset:hover{background:#2e7d54;color:#fff;border-color:#2e7d54}
    table.frm th,table.frm td{border-bottom:1px solid #eef1f5;padding:2px 8px;text-align:left;vertical-align:middle;height:22px;line-height:18px}
    table.frm thead th{background:#16324f;color:#fff;font-weight:600;font-size:11px;white-space:nowrap;padding:4px 8px}
    table.frm .cx{overflow-x:auto;white-space:nowrap;scrollbar-width:none;-ms-overflow-style:none}
    table.frm .cx::-webkit-scrollbar{display:none}
    table.frm td.sb .cx{font-weight:700;color:#16324f}
    table.frm td.fopen{white-space:nowrap;padding:2px 8px}
    table.frm td.fopen .btn{display:inline-block;text-decoration:none;padding:3px 10px;font-size:11.5px;border-radius:6px}
  </style>
  <div class="scroll"><table class="frm">
  <colgroup><col class="f30"><col class="f10"><col class="f20"><col class="f8"><col class="fm"><col class="fb"></colgroup>
  <thead><tr><th>Form</th><th>Kullanıcı</th><th>Güncelleme</th><th class="num">Geciken (Gün)</th><th>Mail</th><th></th></tr></thead>
  <tbody>${body}</tbody></table></div>`;
  view.querySelectorAll(".fmail").forEach(b=>b.onclick=()=>formMail(b.dataset.fk,b));
  view.querySelectorAll(".freset").forEach(b=>b.onclick=()=>formReset(b.dataset.fk));
}

/* ---------- AHŞAP — Timber 72x86: ahsap_alim'den derlenir (ağaç+tedarikçi, CBM ağırlıklı € ort). Bölüm-RLS; anon 401. ---------- */
const AY_TR=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
async function loadAhsap(tgt){
  const body=document.getElementById(tgt);
  const {data,error}=await sb.from("ahsap_alim").select("*");
  if(error){ body.innerHTML=`<div class="load">Hata: ${esc(error.message)}</div>`; return; }
  const rows=data||[];
  const cur=rows.filter(r=>r.aktif), closed=rows.filter(r=>!r.aktif);
  let pd=null; closed.forEach(r=>{ if(r.kapanis_donem&&(pd==null||r.kapanis_donem>pd)) pd=r.kapanis_donem; });
  const prev=closed.filter(r=>r.kapanis_donem===pd);
  const wavg=arr=>{ let s=0,c=0; arr.forEach(r=>{ const cbm=Number(r.toplam_cbm)||0, fe=Number(r.fiyat_eur); if(cbm>0&&isFinite(fe)){ s+=fe*cbm; c+=cbm; } }); return c>0?s/c:null; };
  const scbm=arr=>arr.reduce((a,r)=>a+(Number(r.toplam_cbm)||0),0);
  const int=v=>v==null?"—":Math.round(v).toLocaleString("tr-TR");
  const chg=(cu,pr)=>{ if(cu==null||pr==null||pr===0) return '<td class="num" style="color:#c2ccd6">—</td>'; const p=Math.round((cu-pr)/pr*100); const col=p>0?'#b23a2e':(p<0?'#0a6b3f':'#6a7888'); return `<td class="num" style="color:${col}">${p>0?'+':''}${p}%</td>`; };
  const agaclar=["Çam DKD","Çam KKK-20cm","Çam KKK-70cm","İroko DKD","Lareks DKD","Meranti DKD","Meşe DKD","Accoya DKD","Okaliptus DKD","Okaliptus KKK","Sapelli DKD"];
  let rh="";
  agaclar.forEach(ag=>{
    const cc=cur.filter(r=>r.agac===ag), pp=prev.filter(r=>r.agac===ag);
    if(!cc.length&&!pp.length){ rh+=`<tr style="font-weight:700;background:#f4efe6"><td>${esc(ag)}</td><td class="num" style="color:#c2ccd6">—</td><td class="num" style="color:#c2ccd6">—</td><td class="num" style="color:#c2ccd6">—</td><td class="num" style="color:#c2ccd6">—</td></tr>`; return; }
    const ca=wavg(cc), pa=wavg(pp);
    rh+=`<tr style="font-weight:700;background:#f4efe6"><td>${esc(ag)}</td><td class="num">${int(scbm(cc))}</td><td class="num">${ca==null?"—":int(ca)+" €"}</td><td class="num">${pa==null?"—":int(pa)+" €"}</td>${chg(ca,pa)}</tr>`;
    const teds=[...new Set(cc.map(r=>r.tedarikci).concat(pp.map(r=>r.tedarikci)))].sort((a,b)=>String(a).localeCompare(String(b),'tr'));
    teds.forEach(td=>{
      const tc=cc.filter(r=>r.tedarikci===td), tp=pp.filter(r=>r.tedarikci===td);
      const tca=wavg(tc), tpa=wavg(tp);
      rh+=`<tr><td style="padding-left:22px;color:#5a6b7d">${esc(td==null||td===""?"—":td)}</td><td class="num">${int(scbm(tc))}</td><td class="num">${tca==null?"—":int(tca)+" €"}</td><td class="num">${tpa==null?"—":int(tpa)+" €"}</td>${chg(tca,tpa)}</tr>`;
    });
  });
  /* Son güncelleme = Ahşap formundaki AYLIK GÜNCELLEME düğmesine son basılma (pano_yayin) */
  const py=await sb.from("pano_yayin").select("yayin_at").eq("anahtar","ahsap").limit(1);
  const pyAt=(py&&!py.error&&py.data&&py.data[0])?py.data[0].yayin_at:null;
  body.innerHTML=`<style>table.ahs{width:auto}table.ahs th,table.ahs td{white-space:nowrap}</style>
    <div class="stamp">Son güncelleme: ${pyAt?dOnly(pyAt):"—"}</div>
    <div class="scroll"><table class="ahs"><thead><tr><th>Ağaç Çeşidi / Tedarikçi</th><th class="num">Top. CBM</th><th class="num">Ağ. Ort. €</th><th class="num">Önceki Ort. €</th><th class="num">Değişim %</th></tr></thead><tbody>${rh||'<tr><td colspan="5" class="load">Kayıt yok.</td></tr>'}</tbody></table></div>`;
}
async function loadPanoBolum(bolum, tgt){
  const body=document.getElementById(tgt);
  const [m,t,r]=await Promise.all([
    sb.from("pano_ozel_meta").select("*").eq("bolum",bolum),
    sb.from("pano_ozel_tablo").select("*").eq("bolum",bolum).order("sira"),
    sb.from("pano_ozel").select("*").eq("bolum",bolum).order("tablo").order("sira")
  ]);
  const err=m.error||t.error||r.error;

/* ---------- SEL-ARB — özel render: Firma 15ch / Proje 20ch (nowrap+ellipsis, tam metin title/scroll), tarih sütunları üstünde "Arbor SAS Alacak €" spanning başlık, "Δ ilk→son €", son tarih dolu-alacak satırları görünür + boşlar gizli/toggle, footer daima görünür. Bölüm-RLS aynı (pano_ozel_*). ---------- */
const SA_FOOT=new Set(["Selectron'a gönderilen","Selectron'a Borç (Σ E)","Toplam güncel alacak","Selectron'a Fatura Edilen Tutar","Arbor SAS faaliyet kaybı","TOPLAM GÜNCEL ALACAK"]);
const SA_NOTE="Tarih sütunlarındaki tutarlar o tarihteki güncel ALACAK (receivable) tutarlarıdır · Selectron–Arbor SAS mutabakat · form-beslemeli (Sel Ft-Ödeme + Arbor SAS Alacak); aylık snapshot ile yeni tarih sütunu.";
async function loadSelArb(tgt){
  const body=document.getElementById(tgt);
  const [s,o]=await Promise.all([
    sb.from("sel_arb_snapshot").select("*").order("tarih").order("sira"),
    sb.from("sel_arb_ozet").select("*").order("tarih")
  ]);
  if(s.error||o.error){ body.innerHTML=`<div class="load">Hata: ${esc((s.error||o.error).message)}</div>`; return; }
  const snap=s.data||[], oz=o.data||[];
  const datesAsc=[...new Set(snap.map(x=>x.tarih))].sort();
  const dates=[...datesAsc].reverse();   /* Yeni→Eski: en yeni solda, sağa doğru azalır */
  const nd=dates.length;
  const ozBy={}; oz.forEach(x=>ozBy[x.tarih]=x);
  const fmap=new Map();
  snap.forEach(x=>{ const key=x.sira+"|"+(x.firma||"")+"|"+(x.proje||""); if(!fmap.has(key)) fmap.set(key,{sira:x.sira,firma:x.firma||"",proje:x.proje||"—",vals:{}}); fmap.get(key).vals[x.tarih]=x.alacak; });
  const firmalar=[...fmap.values()].sort((a,b)=>((a.sira==null?1e9:a.sira)-(b.sira==null?1e9:b.sira)));
  const dLbl=t=>t.slice(8,10)+"."+t.slice(5,7)+"."+t.slice(2,4);
  const fmt=v=>(v==null||v==="")?"":Math.round(v).toLocaleString("tr-TR");
  const delta=arr=>{ const p=arr.filter(v=>v!=null); if(p.length<2) return ""; const dl=Math.round(p[p.length-1]-p[0]); if(dl===0) return ""; return (dl>0?"+":"−")+Math.abs(dl).toLocaleString("tr-TR"); };
  const basliklar=["Proje","Firma",...dates.map(dLbl),"Δ eski→yeni"];
  const rows=[];
  firmalar.forEach(f=>{ const series=dates.map(d=>f.vals[d]==null?null:f.vals[d]); rows.push([f.proje,f.firma,...series.map(fmt),delta([...series].reverse())]); });
  const gon=dates.map(d=>ozBy[d]?ozBy[d].gonderilen:null);
  const borc=dates.map(d=>ozBy[d]?ozBy[d].borc:null);
  const topAlac=dates.map(d=>{ let sm=0,any=false; firmalar.forEach(f=>{ if(f.vals[d]!=null){sm+=f.vals[d];any=true;} }); return any?sm:null; });
  const fatE=dates.map(d=>ozBy[d]?ozBy[d].fatura_edilen:null);
  const kayip=dates.map((d,i)=> borc[i]==null?null : borc[i]-((gon[i]||0)+(topAlac[i]||0)+(fatE[i]||0)) );
  const fatDisp=fatE.map(v=>(v==null||Math.round(v)===0)?null:v);
  const foot=(label,series)=>[label,"",...series.map(fmt),delta([...series].reverse())];
  rows.push(foot("Selectron'a gönderilen",gon));
  rows.push(foot("Selectron'a Borç (Σ E)",borc));
  rows.push(foot("Toplam güncel alacak",topAlac));
  rows.push(foot("Selectron'a Fatura Edilen Tutar",fatDisp));
  rows.push(foot("Arbor SAS faaliyet kaybı",kayip));
  const stamp=nd?dLbl(dates[0]):"";
  const lastIdx=2;   /* en yeni tarih artık en soldaki tarih sütunu */
  const filled=c=>{ const raw=String(c==null?"":c).replace(/[^\d-]/g,""); return raw!==""&&Number(raw)!==0; };
  const dateHdrs=basliklar.slice(2,2+nd).map(h=>`<th class="sa-num">${esc(h)}</th>`).join("");
  let dlt=basliklar[basliklar.length-1]; if(dlt.indexOf("€")<0) dlt=dlt+" €";
  let hiddenCount=0;
  const trs=rows.map(h=>{
    const isFoot=SA_FOOT.has(h[0]), show=isFoot||filled(h[lastIdx]);
    if(!show) hiddenCount++;
    const mid=[]; for(let i=0;i<nd;i++) mid.push(`<td class="sa-num">${esc(h[2+i]||"")}</td>`);
    return `<tr class="${isFoot?'sa-foot':''}${show?'':' sa-hide'}"${show?'':' style="display:none"'}>`
      +`<td class="sa-proje"><span class="c" title="${esc(h[0]||"")}">${esc(h[0]||"")}</span></td>`
      +`<td class="sa-firma"><span class="c" title="${esc(h[1]||"")}">${esc(h[1]||"")}</span></td>`
      +mid.join("")+`<td class="sa-num sa-delta">${esc(h[2+nd]||"")}</td></tr>`;
  }).join("");
  const style=`<style>
  .sa-wrap table{border-collapse:collapse;width:auto;font-size:11.5px}
  .sa-wrap th,.sa-wrap td{border-bottom:1px solid #eef1f5;padding:2px 6px;white-space:nowrap;line-height:16px}
  .sa-wrap thead th{background:#16324f;color:#fff;font-weight:600}
  .sa-proje>.c{width:23.33ch}.sa-firma>.c{max-width:20ch}
  .sa-firma>.c,.sa-proje>.c{display:block;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;white-space:nowrap}
  .sa-firma>.c::-webkit-scrollbar,.sa-proje>.c::-webkit-scrollbar{display:none}
  .sa-proje>.c{font-weight:600;color:#16324f}
  .sa-num{text-align:right}
  tr.sa-foot td{font-weight:700;background:#eef3f8}
  </style>`;
  const btn=hiddenCount?`<button class="btn" id="sa-toggle" data-on="0">Boş-alacak satırları göster (${hiddenCount})</button>`:"";
  const pyS=await sb.from("pano_yayin").select("yayin_at").eq("anahtar","sel_arb").limit(1);
  const pyAtS=(pyS&&!pyS.error&&pyS.data&&pyS.data[0])?pyS.data[0].yayin_at:null;
  body.innerHTML=`${style}<div class="stamp">Son güncelleme: ${pyAtS?dOnly(pyAtS):esc(stamp)}</div>${btn?`<div class="hint">${btn}</div>`:""}<div class="sa-wrap scroll"><table><thead>`
    +`<tr><th rowspan="2">${esc(basliklar[0]||"Proje")}</th><th rowspan="2">${esc(basliklar[1]||"Firma")}</th><th colspan="${nd}" class="sa-num" style="text-align:center">Arbor SAS Alacak €</th><th rowspan="2" class="sa-num">${esc(dlt)}</th></tr>`
    +`<tr>${dateHdrs}</tr></thead><tbody>${trs}</tbody></table></div>`;
  const tg=document.getElementById("sa-toggle");
  if(tg) tg.onclick=()=>{ const on=tg.dataset.on==="1"; document.querySelectorAll("#"+tgt+" tr.sa-hide").forEach(x=>x.style.display=on?"none":""); tg.dataset.on=on?"0":"1"; tg.textContent=on?`Boş-alacak satırları göster (${hiddenCount})`:`Boş-alacak satırları gizle (${hiddenCount})`; };
}

function startFiyEdit(el){
  if(el.querySelector("input")) return;
  const t=el.dataset.t, id=el.dataset.id, f=el.dataset.f;
  const cur=el.textContent==="—"?"":el.textContent;
  const inp=document.createElement("input"); inp.value=cur; el.textContent=""; el.appendChild(inp); inp.focus(); inp.select();
  const commit=async()=>{
    const val=inp.value.trim();
    const {error}=await sb.from(t).update({[f]:val||null}).eq("id",id);
    if(error){ el.textContent="hata"; alert(error.message); return; }
    el.textContent=val||"—"; el.classList.add("saveflash"); setTimeout(()=>el.classList.remove("saveflash"),400);
  };
  inp.onblur=commit;
  inp.onkeydown=e=>{ if(e.key==="Enter"){e.preventDefault();inp.blur();} if(e.key==="Escape"){el.textContent=cur||"—";} };
}
async function fiyDel(t,id){
  if(!confirm("Bu satır silinsin mi?")) return;
  const {error}=await sb.from(t).delete().eq("id",id);
  if(error){ alert(error.message); return; } loadFiyat();
}

  const {error}=await sb.from("fiyat_yayin").update({ yayin_at:new Date().toISOString(), snapshot:params||[], bildirim_beklemede:true, bildirim_metni:metin }).eq("id",1);

  if(error){ alert("Hata: "+error.message); return; }
  alert("Yayınlandı. Değişiklik bildirimi BEKLEMEYE ALINDI — int@arbor.com.tr Outlook hesabından ilgili kişilere gönderilecek.");
  loadFiyat();
}

  const bar=all.map(x=>`<button class="malitab${x===b?' active':''}" data-b="${esc(x)}">${esc(label(x))}</button>`).join("");
  view.innerHTML=`<div class="malibar">${bar}</div><div id="mali-body"><div class="load">Yükleniyor…</div></div>`;
  view.querySelectorAll(".malitab").forEach(btn=>btn.onclick=()=>{ state.maliBolum=btn.dataset.b; loadMali(); });
  if(b==="ob_rapor"){ loadObrapor("mali-body"); return; }
  if(b==="bilanco"){ loadBilanco("mali-body"); return; }
  if(b==="icmal"){ loadIcmal("mali-body"); return; }
  /* MK Faaliyet = MK prim blokları + Tıkanmış Şantiyeler (eski ayrı Şantiye sekmesi buraya taşındı) */
  if(b==="mali_mkprim"){ document.getElementById("mali-body").innerHTML=`<div id="mkp-a"></div><div id="mkp-b"></div>`; loadMkPrim("mkp-a"); loadSantiye("mkp-b"); return; }
  if(b==="mali_maasprim"){ loadOzelHtml("mali_maasprim","mali-body"); return; } /* Maaş-Prim: tam sadakat ham-HTML (pano_ozel_html, bölüm-RLS) */
  if(b==="ahsap"){ loadAhsap("mali-body"); return; }
  if(b==="fiyat"){ loadFiyat("mali-body"); return; } /* Fiyatlandırma: kaynak veri + editör (fiyat_* tablolar, anon) */
  /* SEL-ARB = mutabakat matrisi + Dépenses (eski ayrı Dépenses sekmesi buraya taşındı) */
  if(b==="sel_arb"){ document.getElementById("mali-body").innerHTML=`<div id="sa-a"></div><h2 class="secH">Dépenses <span class="muted" id="dep-stamp" style="font-weight:400"></span></h2><div id="sa-b"></div>`; loadSelArb("sa-a"); loadDepenses("sa-b"); return; }
  loadPanoBolum(b, "mali-body");
}

/* ---------- DÉPENSES — kaynak: ÖB Rapor formu (depenses_kalem: yıl×ay×tedarikçi×tutar).
   İki tablo da buradan HESAPLANIR. Tablo boşsa eski pano_ozel baseline'ı okunur. ---------- */
const DEP_AY=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
async function loadDepenses(tgt){
  const body=document.getElementById(tgt||"view");
  const [k,y]=await Promise.all([
    sb.from("depenses_kalem").select("yil,ay,tedarikci,tutar"),
    sb.from("depenses_yayin").select("yayin_at").limit(1)
  ]);
  const ted={}, aylar={};
  const kr=(k&&!k.error)?(k.data||[]):[];
  if(kr.length){
    kr.forEach(r=>{ const t=String(r.tedarikci||"").trim()||"—", v=Number(r.tutar)||0;
      ted[t]=(ted[t]||0)+v; const kk=r.yil+"|"+r.ay; aylar[kk]=(aylar[kk]||0)+v; });
  }else{
    /* ÖB formu doldurulana kadar eski baseline */
    const [tb,pr]=await Promise.all([
      sb.from("pano_ozel_tablo").select("tablo,baslik").eq("bolum","depenses"),
      sb.from("pano_ozel").select("tablo,sira,hucreler").eq("bolum","depenses").order("tablo").order("sira")
    ]);
    const num=s=>{ const x=String(s==null?"":s).replace(/[^\d.,-]/g,"").replace(/\./g,"").replace(",","."); const v=parseFloat(x); return isNaN(v)?0:v; };
    const bl=((tb.data||[]).find(x=>x.tablo==="t2")||{}).baslik||"";
    const ym=String(bl).match(/(20\d{2})/); const yil=ym?Number(ym[1]):new Date().getFullYear();
    (pr.data||[]).forEach(x=>{ const c=x.hucreler||[]; const ad=String(c[0]||"").trim();
      if(!ad||/^toplam$/i.test(ad)) return;
      if(x.tablo==="t1"){ ted[ad]=(ted[ad]||0)+num(c[1]); return; }
      if(x.tablo==="t2"){ const i=DEP_AY.indexOf(ad); const v=num(c[1]); if(i<0||!v) return; aylar[yil+"|"+(i+1)]=v; }
    });
  }
  const tedList=Object.keys(ted).map(t=>({t,v:ted[t]})).sort((a,b)=>b.v-a.v);
  const tTop=tedList.reduce((a,x)=>a+x.v,0);
  const t1=tedList.map(x=>`<tr><td>${esc(x.t)}</td><td class="num">${money(x.v)}</td><td class="num">${tTop?Math.round(x.v/tTop*100):0}%</td></tr>`).join("")
    +`<tr class="itot"><td>TOPLAM</td><td class="num">${money(tTop)}</td><td class="num">100%</td></tr>`;
  const ayList=Object.keys(aylar).map(kk=>{ const p=kk.split("|"); return {yil:Number(p[0]),ay:Number(p[1]),v:aylar[kk]}; })
    .sort((a,b)=> (b.yil-a.yil) || (b.ay-a.ay));
  const aTop=ayList.reduce((a,x)=>a+x.v,0);
  const t2=ayList.map(x=>`<tr><td>${esc(DEP_AY[x.ay-1]||"")} ${x.yil}</td><td class="num">${money(x.v)}</td></tr>`).join("")
    +`<tr class="itot"><td>TOPLAM</td><td class="num">${money(aTop)}</td></tr>`;
  const ya=(y&&!y.error&&y.data&&y.data[0])?y.data[0].yayin_at:null;
  body.innerHTML=`<style>table.dep{width:auto}table.dep th,table.dep td{white-space:nowrap}
      .depd{margin:0 0 14px}.depd>summary{cursor:pointer;color:#16324f;font-size:13px;font-weight:700;margin:14px 2px 6px;list-style:revert}
      .depd .scroll{margin-top:6px}</style>
    <details class="depd"><summary>Tedarikçi Bazında Gider (yüksekten düşüğe) · ${tedList.length}</summary>
      <div class="scroll"><table class="dep"><thead><tr><th>Tedarikçi</th><th class="num">Toplam (€)</th><th class="num">Pay</th></tr></thead><tbody>${t1}</tbody></table></div>
    </details>
    <h3 class="sec">Aylık Toplam Gider</h3>
    <div class="scroll"><table class="dep"><thead><tr><th>Ay</th><th class="num">Tutar (€)</th></tr></thead><tbody>${t2}</tbody></table></div>`;
  const ds=document.getElementById("dep-stamp"); if(ds) ds.textContent="· Son güncelleme: "+(ya?dOnly(ya):"—");
}

/* ---------- MK PRİM — owner salt-okur: MK faaliyet formundan 4 blok + otomatik prim (mk_faaliyet). Tek kaynak: oranlar burada + formda birebir. ---------- */
const MKP_BLOCKS=[["memnuniyet","Müşteri Memnuniyeti","Oran% × %0,75 × (Kontrat HT ÷ 12)"],["ts","TS Ekstra İşler","%0,2 × TS Tutarı"],["fr","FR (Fransa) Satış","%0,05 × Kontrat HT"],["diger","Diğer Satış","%0,10 × Kontrat HT"]];
function mkPrim(tur,r){ const K=Number(r.kontrat_tutari)||0; if(tur==="memnuniyet") return (Number(r.memnuniyet_orani)||0)/100*0.0075*(K/12); if(tur==="ts") return 0.002*(Number(r.ts_tutari)||0); if(tur==="fr") return 0.0005*K; return 0.001*K; }
const mkEur=n=>(Number(n)||0).toLocaleString("tr-TR",{maximumFractionDigits:2})+" €";
/* Dört blok da AYNI 6 sütunlu iskelete oturur (colgroup + table-layout:fixed) →
   Proje, Kontrat HT/TS Tutarı ve Prim sütunları tablolar arasında yatayda tam hizalı.
   1 Firma(35) 2 Proje(35) 3 Kriter/TS Notları(35) 4 Oran%/Kontrat Tarihi(12) 5 Kontrat HT/TS Tutarı(12) 6 Prim(12) */
const MKP_COLS=`<colgroup><col class="w35"><col class="w35"><col class="w35"><col class="w12"><col class="w12"><col class="w12"></colgroup>`;
async function loadMkPrim(tgt){
  const body=document.getElementById(tgt||"view");
  const [f,ai]=await Promise.all([
    sb.from("mk_faaliyet").select("*").eq("aktif",true).order("id",{ascending:false}),
    sb.from("mk_ay_islendi").select("created_at").order("created_at",{ascending:false}).limit(1)
  ]);
  if(f.error){ body.innerHTML=`<div class="load">Hata: ${esc(f.error.message)}</div>`; return; }
  const rows=f.data||[]; const byT={memnuniyet:[],ts:[],fr:[],diger:[]}; rows.forEach(r=>{ (byT[r.tur]=byT[r.tur]||[]).push(r); });
  const gunc=(ai&&!ai.error&&ai.data&&ai.data[0])?dOnly(ai.data[0].created_at):"—";
  const cT=(v,cls)=>`<td class="${cls||""}"><div class="cx">${esc(v==null?"":v)}</div></td>`;
  const cN=(v,cls)=>`<td class="num ${cls||""}"><div class="cx num">${v==null?"":v}</div></td>`;
  let grand=0, html="";
  MKP_BLOCKS.forEach(bl=>{
    const tur=bl[0], rs=byT[tur]||[], bt=rs.reduce((a,r)=>a+mkPrim(tur,r),0); grand+=bt;
    const isMem=tur==="memnuniyet", isTs=tur==="ts";
    const h3= isMem?"Kriter":(isTs?"TS Notları":"");
    const h4= isMem?"Oran %":(isTs?"":"Kontrat Tarihi");
    const h5= isTs?"TS Tutarı (€)":"Kontrat HT (€)";
    const tr=rs.map(r=>`<tr>`
      +cT(r.firma||"")
      +cT(r.proje||"")
      +cT(isMem?(r.memnuniyet_kriterleri||""):(isTs?(r.ts_notlari||""):""))
      +cN(isMem?(r.memnuniyet_orani==null?"":esc(r.memnuniyet_orani)):(isTs?"":fdate(r.kontrat_tarihi)))
      +cN(money(isTs?r.ts_tutari:r.kontrat_tutari))
      +cN(mkEur(mkPrim(tur,r)),"prim")
      +`</tr>`).join("");
    html+=`<h3 class="sec">${esc(bl[1])} <span class="muted">— ${esc(bl[2])} · ${rs.length} satır · ${mkEur(bt)}</span></h3>`
      +`<div class="scroll"><table class="mkp">${MKP_COLS}<thead><tr>`
      +`<th>Firma</th><th>Proje</th><th>${esc(h3)}</th><th class="num">${esc(h4)}</th><th class="num">${esc(h5)}</th><th class="num">Prim (€)</th>`
      +`</tr></thead><tbody>${tr||`<tr><td colspan="6" style="color:#8a97a4;padding:10px">Kayıt yok.</td></tr>`}</tbody></table></div>`;
  });
  body.innerHTML=`<style>
    table.mkp{width:1px;table-layout:fixed;border-collapse:collapse;font-size:12px;background:#fff}
    table.mkp col.w35{width:35ch}table.mkp col.w12{width:12ch}
    table.mkp th,table.mkp td{border-bottom:1px solid #eef1f5;padding:2px 6px;text-align:left;vertical-align:middle;line-height:16px}
    table.mkp thead th{background:#16324f;color:#fff;font-weight:600;font-size:10.5px;white-space:nowrap;padding:3px 6px}
    table.mkp th.num{text-align:right}
    table.mkp .cx{overflow-x:auto;white-space:nowrap;scrollbar-width:none;-ms-overflow-style:none}
    table.mkp .cx::-webkit-scrollbar{display:none}
    table.mkp .cx.num{text-align:right}
    table.mkp td.prim .cx{font-weight:700;color:#0a5745}
    table.mkptop{margin:2px 0 8px}
    table.mkptop td{border:0;background:transparent;padding:2px 8px;font-size:11.5px;color:#0a6b3f;font-weight:700}
  </style>
  <table class="mkp mkptop">${MKP_COLS}<tbody><tr>
    <td colspan="5">Son güncelleme: ${gunc} · Toplam prim (4 kriter)</td>
    <td class="num"><div class="cx num">${mkEur(grand)}</div></td>
  </tr></tbody></table>${html}`;
}

/* ---------- ŞANTİYE — owner salt-okur: tarihli DURUM LOG akışı (ÖB+MK tek form yazar). ---------- */
async function loadSantiye(tgt){
  const view=document.getElementById(tgt||"view");
  const [s,mk,sa]=await Promise.all([
    sb.from("santiye").select("*").order("sira"),
    sb.from("mk_santiye_snapshot").select("*"),
    sb.from("sel_arb_snapshot").select("tarih,sira,firma,proje,alacak")
  ]);
  const err=s.error;
  if(err){ view.innerHTML=`<div class="load">Hata: ${esc(err.message)}</div>`; return; }
  /* Pano DURUM'u YALNIZ MK snapshot'ından okur (önceki+güncel); ÖB verisi panoya girmez */
  const mkBy={}; (mk.data||[]).forEach(x=>{ mkBy[x.santiye_id]=x; });
  const rows=(s.data||[]).filter(r=>r.durum!=="Çözüldü");
  const ay=d=>{ if(!d) return 0; const x=new Date(d); if(isNaN(x)) return 0; const n=new Date(); return (n.getFullYear()-x.getFullYear())*12+(n.getMonth()-x.getMonth()); };
  const sdk=d=>d?String(d).slice(8,10)+"."+String(d).slice(5,7)+"."+String(d).slice(2,4):"";
  /* MK son güncelleme = en yeni snapshot.updated_at (aylık güncelleme düğmesine son basılma; yalnız MK) */
  let mkStamp=null; (mk.data||[]).forEach(x=>{ if(x.updated_at&&(mkStamp==null||String(x.updated_at)>String(mkStamp))) mkStamp=x.updated_at; }); mkStamp=mkStamp?dOnly(mkStamp):"—";
  /* Arbor SAS Alacak — SEL-ARB en yeni çekim; bağ = santiye.sel_arb_sira (ÖB formundaki seçim) */
  const saRows=(sa&&!sa.error)?(sa.data||[]):[];
  let saMax=""; saRows.forEach(x=>{ if(String(x.tarih)>saMax) saMax=String(x.tarih); });
  const saBy={}; saRows.filter(x=>String(x.tarih)===saMax).forEach(x=>{ saBy[x.sira]=x; });
  const norm=t=>String(t==null?"":t).toLocaleLowerCase("tr").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g," ").trim();
  const alacakOf=r=>{
    let keys=Array.isArray(r.sel_arb_sira)?r.sel_arb_sira.map(Number):[];
    if(!keys.length){ /* bağ girilmemişse geçici ad benzerliği (ÖB seçim yaptıkça devre dışı kalır) */
      const kel=norm(r.santiye).split(" ").filter(w=>w.length>=5);
      if(kel.length) keys=Object.keys(saBy).filter(k=>{
        const pw=norm(saBy[k].proje).split(" ");
        return kel.some(w=>pw.some(p=>p.startsWith(w)||w.startsWith(p)));
      }).map(Number);
    }
    const hit=keys.map(k=>saBy[k]).filter(Boolean);
    return { tutar:hit.length?hit.reduce((a,x)=>a+(Number(x.alacak)||0),0):null,
             det:hit.map(x=>x.proje+" · "+money(x.alacak)+" €").join("\n") };
  };
  const toplam=rows.reduce((a,r)=>a+(alacakOf(r).tutar||0),0);
  const body=rows.map(r=>{
    const a=ay(r.ilk_kayit), al=alacakOf(r), m=mkBy[r.id];
    let durTxt;
    if(m&&(m.mk_guncel_durum||m.mk_guncel_tarih)){
      const g=`${m.mk_guncel_tarih?'<b>'+sdk(m.mk_guncel_tarih)+'</b> · ':''}${esc(m.mk_guncel_durum||"")}`;
      const o=(m.mk_onceki_durum||m.mk_onceki_tarih)?` <span class="muted">· Önceki${m.mk_onceki_tarih?' ('+sdk(m.mk_onceki_tarih)+')':''}: ${esc(m.mk_onceki_durum||"")}</span>`:"";
      durTxt=g+o;
    } else durTxt=`<span class="muted">Henüz MK güncellemesi yok.</span>`;
    const dur=`<div class="cx">${durTxt}</div>`;
    return `<tr>`
      +`<td class="sb"><span title="${esc(r.neden||'')}">${esc(r.santiye)}</span>${a>=3?' <span class="sbdg none">'+a+' ay</span>':''}</td>`
      +`<td class="c t20"><span title="${esc(r.musteri||'')}">${esc(r.musteri||'')}</span></td>`
      +`<td class="num"${al.det?` title="${esc(al.det)}"`:''}>${al.tutar==null?'':money(al.tutar)}</td>`
      +`<td class="tdur">${dur}</td></tr>`;
  }).join("");
  view.innerHTML=`<h2 class="secH">Tıkanmış Şantiyeler <span class="muted" style="font-weight:400">· ${rows.length} açık · MK ${mkStamp}</span></h2>
    <style>table.stik{width:auto}
      table.stik td.sb{white-space:nowrap;font-weight:700}
      table.stik .c>span{display:block;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;white-space:nowrap}
      table.stik .c>span::-webkit-scrollbar{display:none}
      table.stik td.t20>span{width:20ch}
      table.stik td.tdur>.cx{display:block;width:119ch;white-space:nowrap;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
      table.stik td.tdur>.cx::-webkit-scrollbar{display:none}</style>
    <div class="scroll"><table class="stbl stik">
    <thead><tr><th>ŞANTİYE</th><th>MÜŞTERİ</th><th class="num">ARBOR SAS ALACAK €</th><th class="tdur">DURUM</th></tr></thead>
    <tbody>${body}<tr class="itot"><td>Toplam · ${rows.length} açık</td><td></td><td class="num">${money(toplam)}</td><td></td></tr></tbody>
    </table></div>`;
}

/* ---------- ÖZEL — grup: 5 hassas pano (pano_ozel_html, iframe srcdoc) + G.menkul (pano_ozel). Bölüm-RLS; anon 401. Parola/ozel4 YOK. ---------- */
const OZEL_HTML=[["ozel_kitaplar","📚 Kitaplar"],["ozel_felsefe","🧠 Felsefe"],["ozel_phd","🎓 PhD Notes"],["ozel_takvim","🎂 Takvim"],["ozel_vapur","🚢 Vapur"]];
function loadOzel(){
  const view=document.getElementById("view");
  const isAdmin=state.allowed===null;
  const htmlTabs=OZEL_HTML.filter(t=> isAdmin || state.allowed.includes(t[0]));
  const showG = isAdmin || state.allowed.includes('gmenkul');
  const tabs=htmlTabs.concat(showG?[["gmenkul","🏢 G.menkul"]]:[]);
  if(!tabs.length){ view.innerHTML=`<div class="load">Bu hesapta özel bölüm yetkisi yok.</div>`; return; }
  if(!state.ozelSub || !tabs.some(t=>t[0]===state.ozelSub)) state.ozelSub=tabs[0][0];
  const cur=document.getElementById("ozf");
  if(cur && cur.getAttribute("data-b")===state.ozelSub) return; /* 60sn tazelemede aktif iframe'i koru (PhD düzenleme) */
  const bar=tabs.map(t=>`<button class="malitab${t[0]===state.ozelSub?' active':''}" data-o="${esc(t[0])}">${esc(t[1])}</button>`).join("");
  view.innerHTML=`<div class="malibar">${bar}</div><div id="ozel-body"><div class="load">Yükleniyor…</div></div>`;
  view.querySelectorAll(".malitab").forEach(btn=>btn.onclick=()=>{ state.ozelSub=btn.dataset.o; loadOzel(); });
  if(state.ozelSub==="gmenkul"){ loadPanoBolum("gmenkul","ozel-body"); return; }
  loadOzelHtml(state.ozelSub,"ozel-body");
}
/* pano_ozel_html satırını iframe srcdoc olarak tam sadakatle render et (CSS+script izole çalışır) */
async function loadOzelHtml(bolum,tgt){
  const body=document.getElementById(tgt);
  if(bolum==="ozel_phd") await phdPrepare();
  const {data,error}=await sb.from("pano_ozel_html").select("html_raw").eq("bolum",bolum).single();
  if(error){ body.innerHTML=`<div class="load">Hata: ${esc(error.message)}</div>`; return; }
  const ifr=document.createElement("iframe");
  ifr.id="ozf"; ifr.setAttribute("data-b",bolum);
  ifr.style.cssText="width:100%;height:86vh;border:1px solid #dde3ea;border-radius:8px;background:#fff";
  body.innerHTML=""; body.appendChild(ifr);
  ifr.srcdoc=data.html_raw;
}
/* PhD Notes: Supabase'ten notları parent'a yükle + kaydetme köprüsü (iframe içindeki script parent.__PHD_NOTES / parent.__phdSave kullanır). Kaynak Supabase, düzenlenebilir. */
async function phdPrepare(){
  const {data,error}=await sb.from("phd_notes").select("*").order("created",{ascending:false});
  window.__PHD_NOTES = error?[]:(data||[]).map(n=>({id:n.id,aim:n.aim,title:n.title,body:n.body,tags:n.tags||[],created:Number(n.created),edited:n.edited?Number(n.edited):undefined}));
  window.__phdSave = async function(notes){
    try{
      const rows=(notes||[]).map(n=>({id:n.id,aim:n.aim,title:n.title||'',body:(typeof n.body==='string'?n.body:JSON.stringify(n.body)),tags:Array.isArray(n.tags)?n.tags:[],created:n.created||Date.now(),edited:n.edited||null}));
      const up=await sb.from('phd_notes').upsert(rows,{onConflict:'id'});
      if(up.error) throw up.error;
      const ids=rows.map(r=>r.id);
      const {data:cur}=await sb.from('phd_notes').select('id');
      const del=(cur||[]).map(r=>r.id).filter(id=>ids.indexOf(id)<0);
      if(del.length) await sb.from('phd_notes').delete().in('id',del);
    }catch(e){ console.error('phdSave',e); alert('PhD kaydetme hatası: '+(e.message||e)); }
  };
}

/* ---------- BOOT (Supabase Auth oturumu — e-posta+parola) ---------- */
async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if(session){ state.session=session; state.email=session.user&&session.user.email||""; await loadPerms(); renderApp(); }
  else renderLogin();
}
sb.auth.onAuthStateChange((_ev,s)=>{ if(!s){ state.session=null; renderLogin(); } });
boot();
setInterval(()=>{ if(!document.getElementById("view")) return; if(document.querySelector('input.cell,select.cell')) return; loadView(); }, 300000);
</script>
