<style>

  table.stbl th.obh{background:#fdf4d6;color:#8a6100}table.stbl th.mkh{background:#e2efda;color:#2e6b2e}
  table.stbl td.sb{font-weight:700}table.stbl td.snum{white-space:nowrap;color:#9c0006;font-weight:600}
  tr.sold td:first-child{border-left:3px solid #d93025}
  td.scmp .cur{white-space:pre-wrap}td.scmp .prev{color:#8a8a8a;font-size:11px;font-style:italic;margin-top:2px}td.scmp.empty{color:#bbb;text-align:center}
  .sbdg{display:inline-block;font-size:9px;font-weight:700;padding:1px 5px;border-radius:8px;margin-bottom:2px}
  .sbdg.snew{background:#e7f0ff;color:#0b57d0}.sbdg.chg{background:#fff0e0;color:#b25a00}.sbdg.same{background:#eef1f4;color:#667}.sbdg.none{background:#fde8e8;color:#9c0006}
  .num{text-align:right;white-space:nowrap}
  .snpink{background:#ffd9ec} .itot td{background:#eef4fb;font-weight:700}

  table.aup th.note,table.aup td.note{width:auto;white-space:normal;min-width:160px}
  .addbar{display:flex;gap:6px;margin:0 0 8px;flex-wrap:nowrap;align-items:center}
  .addbar input{border:1px solid #cdd6df;border-radius:6px;padding:6px 8px;font:inherit;min-width:0}
  .addbar select#ag-ilgili{flex:none;border:1px solid #cdd6df;border-radius:6px;padding:6px 6px;font:inherit;background:#fff}
  .addbar input#ag-konu{flex:1;min-width:0}
  .addbar .btn{flex:none;white-space:nowrap;padding:6px 12px}
  .load{padding:30px;text-align:center;color:#8a97a4}
  .del{color:#b40000;cursor:pointer;font-weight:700;border:0;background:none;font-size:14px;padding:0 4px}
  .flow{background:#fff;border:1px solid #dde3ea;border-radius:8px;padding:10px 12px;margin-bottom:12px;line-height:1.8}
  .step{display:inline-block;background:#eef4fb;border:1px solid #d3e0ee;border-radius:8px;padding:3px 8px;font-weight:600;color:#16324f}
  .arr{color:#2e7d54;font-weight:700;margin:0 3px}

  table.tks{border-collapse:collapse;width:100%;font-size:13px;margin:2px 0 12px}
  table.tks th{background:#16324f;color:#fff;font-weight:600;font-size:11px;padding:5px 7px;text-align:center;white-space:nowrap}
  table.tks td{border-bottom:1px solid #eef1f5;padding:4px 7px}
  table.tks tr.grp td{font-weight:700;background:#eef3f8;border-top:2px solid #cdd8e4}
  table.ssum{border-collapse:collapse;width:auto;min-width:520px;font-size:13px;margin:2px 0 16px;background:#fff}
  table.ssum th{background:#16324f;color:#fff;font-weight:600;font-size:11px;padding:6px 16px;text-align:right;white-space:nowrap}
  table.ssum th:first-child{text-align:left}
  table.ssum td{padding:5px 16px;border-bottom:1px solid #eef1f5;color:#1c2430}
  table.ssum td.num{text-align:right;white-space:nowrap}
  table.ssum tr.stot td{font-weight:700;background:#eef4fb;border-bottom:2px solid #cdd8e4}
  table.ssum tr.sreg td{font-weight:600}
  table.ssum tr.sdet td{padding-top:1px;padding-bottom:7px;font-size:11.5px;line-height:1.6}
  .dl{font-size:12px;color:#6a7888;font-weight:600}
  .pin{background:#eef4fb;border:1px solid #d3e0ee;border-radius:8px;padding:8px 12px;font-size:11.5px;color:#16324f;margin:0 2px 12px;line-height:1.6}
  .secH{margin:16px 2px 6px;color:#16324f;font-size:13px;font-weight:700;border-left:3px solid #16324f;padding-left:8px}
  .law{background:#fff;border:1px solid #dde3ea;border-radius:8px;margin-bottom:7px;padding:9px 12px;display:flex;gap:11px;align-items:flex-start}
  .law:hover{background:#fafcff}
  .lno{font-weight:700;color:#fff;background:#16324f;border-radius:6px;min-width:34px;height:24px;display:flex;align-items:center;justify-content:center;font-size:12px;flex:none;padding:0 4px}
  .lno.ek{background:#b8863a}
  .lbody{flex:1;min-width:0}
  .ltitle{font-weight:700;color:#1c2430}
  .ldate{font-size:10.5px;color:#93a1b0;font-weight:600;margin-left:6px}
  .ltext{color:#3a4756;line-height:1.55;margin-top:3px}
  .ltext .sub{display:block;margin-top:3px;color:#4a5867}
</style>

<body>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://zehysygpqxqmrzangvuc.supabase.co";
const SUPABASE_KEY = "sb_publishable_ZCcDv4S7qH1hc9tuiv4__A_YVxmIpWc";

const memStore = {};
function safeStorage(){
  try{ const k="__arb_t"; window.localStorage.setItem(k,"1"); window.localStorage.removeItem(k); return window.localStorage; }
  catch(e){ return { getItem:k=> (k in memStore? memStore[k]:null), setItem:(k,v)=>{memStore[k]=String(v)}, removeItem:k=>{delete memStore[k]} }; }
}
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:false, storage:safeStorage() }
});

const app = document.getElementById("app");
let state = { tab:"gundem", email:"", session:null, allowed:null };
const PREFIX = { F:"Fabrika", G:"Yurtdışı / Genel", P:"PEM", S:"Şahsi", ARGE:"ARGE" };

function esc(s){ return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fdate(s){ if(!s) return ""; const d=new Date(s); if(isNaN(d)) return esc(s); return String(d.getDate()).padStart(2,'0')+"."+String(d.getMonth()+1).padStart(2,'0')+"."+String(d.getFullYear()).slice(2); }
function money(n){ if(n==null||n==="") return ""; const v=Math.round(Number(n)); return isNaN(v)?"":v.toLocaleString("tr-TR"); }

/* ---------- AUTH ---------- */
function renderLogin(){
  app.innerHTML = `
   <div class="login">
     <h2>Arbor Panolar</h2>
     <p>Devam etmek için giriş yap.</p>
     <input id="email" type="email" placeholder="ornek@arbor.com.tr" value="${esc(state.email)}" autocomplete="username">
     <input id="pw" type="password" placeholder="Parola" autocomplete="current-password">
     <button class="btn" id="go">Giriş yap</button>
     <div class="msg" id="msg"></div>
   </div>`;
  document.getElementById("go").onclick = doLogin;
  document.getElementById("pw").onkeydown = e=>{ if(e.key==='Enter'){ e.preventDefault(); doLogin(); } };
}
function msg(t,ok){ const m=document.getElementById("msg"); if(m){ m.textContent=t; m.className="msg "+(ok?"ok":"err"); } }
async function doLogin(){
  const email=document.getElementById("email").value.trim();
  const pw=document.getElementById("pw").value;
  if(!email||!pw){ msg("E-posta ve parola gir."); return; }
  state.email=email; msg("Giriş yapılıyor…",true);
  const {data,error}=await sb.auth.signInWithPassword({ email, password:pw });
  if(error){ msg("Hata: "+error.message); return; }
  state.session=data.session; await loadPerms(); renderApp();
}
async function doLogout(){ await sb.auth.signOut(); state.session=null; state.allowed=null; state.tab="gundem"; renderLogin(); }
/* Kullanıcının yetkili olduğu bölümler (yetkiler tablosu, RLS ile yalnız kendi satırları). '*' = admin (hepsi). */
async function loadPerms(){
  try{
    const {data,error}=await sb.from("yetkiler").select("bolum");
    if(error){ state.allowed=null; return; }
    const rows=data||[];
    state.allowed = rows.some(r=>r.bolum==='*') ? null : rows.map(r=>r.bolum);
  }catch(e){ state.allowed=null; }
}

/* ---------- APP SHELL ---------- */
const MALI_BOLUM=["depenses","kredi","ahsap","sel_arb","mali_maasprim","mali_mkprim"];
const MALI_ALL=["depenses","kredi","ahsap","sel_arb","bilanco","icmal","mali_maasprim","mali_mkprim"];
const TABS=[["gundem","Ana Gündem"],["aup","AÜP"],["hazir","Hazır PEM/PRJ"],["so","SÖ"],["satis","Satış"],["ref","Referans"],["prosedur","Prosedürler"],["mali","Mali"],["obrapor","ÖB Rapor"],["formlar","Formlar"],["ozel","Özel"]];
function tabVisible(k){ const a=state.allowed; if(a===null) return true; if(k==='mali') return MALI_ALL.some(b=>a.includes(b)); if(k==='obrapor') return a.includes('ob_rapor'); if(k==='ozel') return a.includes('ozel')||a.includes('gmenkul'); if(k==='formlar') return a.includes('formlar')||a.includes('santiye'); return a.includes(k); }
function renderApp(){
  const vis = TABS.filter(t=> tabVisible(t[0]) );
  if(!vis.length){ app.innerHTML=`<div class="login"><h2>Arbor Panolar</h2><p>Bu hesap için tanımlı bir bölüm yok. Yöneticiyle görüşün.</p><button class="btn" id="lo">Çıkış</button></div>`; document.getElementById("lo").onclick=doLogout; return; }
  if(!vis.some(t=>t[0]===state.tab)) state.tab=vis[0][0];
  app.innerHTML = `
   <header>
     <div class="tabs">
       ${vis.map(t=>`<button data-t="${t[0]}" class="${state.tab===t[0]?'active':''}">${t[1]}</button>`).join("")}
     </div>
   </header>
   <div class="wrap" id="view"><div class="load">Yükleniyor…</div></div>`;
  document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{ state.tab=b.dataset.t; renderApp(); });
  loadView();
}
function loadView(){
  if(state.tab==='gundem') loadGundem();
  else if(state.tab==='hazir') loadHazir();
  else if(state.tab==='so') loadSo();
  else if(state.tab==='satis') loadSatis();
  else if(state.tab==='ref') loadRef();
  else if(state.tab==='prosedur') loadProsedur();
  else if(state.tab==='mali') loadMali();
  else if(state.tab==='obrapor') loadObrapor();
  else if(state.tab==='formlar') loadFormlar();
  else if(state.tab==='ozel') loadOzel();
  else loadAup();
}
function fmtDamga(dg){ return (dg&&dg.length>=6)? dg.slice(4,6)+"."+dg.slice(2,4)+"."+dg.slice(0,2) : "—"; }
function dOnly(iso){ if(!iso) return "—"; const d=new Date(iso); return isNaN(d)?"—":String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+"."+String(d.getFullYear()).slice(2); }
async function erpStamp(){ const {data}=await sb.from("erp_yukleme").select("damga").order("damga",{ascending:false}).limit(1); return data&&data[0]?fmtDamga(data[0].damga):"—"; }
async function tblStamp(t){ const {data}=await sb.from(t).select("updated_at").order("updated_at",{ascending:false}).limit(1); return data&&data[0]?dOnly(data[0].updated_at):"—"; }
function stampHTML(d){ return '<div class="stamp">Son güncelleme: '+(d||"—")+'</div>'; }

/* ---------- ANA GÜNDEM (blok = kod_prefix; İlgili = kişi; kapat = sil) ---------- */
async function loadGundem(){
  const view=document.getElementById("view");
  const [g,ar]=await Promise.all([
    sb.from("ana_gundem").select("*"),
    sb.from("gundem_arge").select("*")
  ]);
  const err=g.error||ar.error;
  if(err){ view.innerHTML=`<div class="load">Hata: ${esc(err.message)}</div>`; return; }
  const man=(g.data||[]).map(r=>Object.assign({_ed:true},r));
  const der=(ar.data||[]).map(r=>Object.assign({_ed:false},r));
  const all=man.concat(der);
  const onc=r=>{ const m=String(r.son_durum||"").match(/Öncelik\s*(\d+)/i); return m?parseInt(m[1]):(r.sira!=null?r.sira:999); };
  const ac=r=>{ const m=String(r.son_durum||"").match(/(\d{2})\.(\d{2})\.(\d{4})/); return m?(m[3]+m[2]+m[1]):"99999999"; };
  const isA=r=>/Öncelik/i.test(String(r.son_durum||""));
  const groups={};
  all.forEach(r=>{ const k=isA(r)?"ARGE":(r.ilgili||"—"); (groups[k]=groups[k]||[]).push(r); });
  Object.keys(groups).forEach(k=>groups[k].sort((a,b)=>{
    const aA=isA(a),bA=isA(b);
    if(aA!==bA) return aA?1:-1;
    if(aA){ const oa=onc(a),ob=onc(b); if(oa!==ob) return oa-ob; const ca=ac(a),cb=ac(b); if(ca!==cb) return ca.localeCompare(cb); return String(a.kod).localeCompare(String(b.kod)); }
    return String(a.kod).localeCompare(String(b.kod));
  }));
  const keys=Object.keys(groups).sort((a,b)=> ((b==="MB")-(a==="MB")) || ((a==="ARGE")-(b==="ARGE")) || groups[b].length-groups[a].length || a.localeCompare(b));
  let rows="";
  keys.forEach(k=>{
    rows+=`<tr class="grp"><td colspan="3">${esc(k)} · ${groups[k].length}</td></tr>`;
    groups[k].forEach(r=>{
      if(r._ed){
        rows+=`<tr data-id="${r.id}">
          <td class="kod">${esc(r.kod)}</td>
          <td>${esc(r.konu)}</td>
          <td><button class="del" title="Kapat (sil)" data-id="${r.id}">✕</button></td>
        </tr>`;
      } else {
        rows+=`<tr style="background:#fafbfd" title="ERP-türevi · salt-okur">
          <td class="kod" style="color:#5a6b7d">${esc(r.kod)}</td>
          <td>${esc(r.konu)}</td>
          <td></td>
        </tr>`;
      }
    });
  });
  const st=await erpStamp();
  const ilgSet=[...new Set(["MB","EA","OE","CTP","EU"].concat(keys.filter(k=>k!=='ARGE')))];
  const ilgSel=ilgSet.map(k=>`<option value="${esc(k)}"${k==='MB'?' selected':''}>${esc(k)}</option>`).join("")+`<option value="__new__">Diğer…</option>`;
  view.innerHTML=`${stampHTML(st)}
    <div class="addbar">
      <select id="ag-ilgili" title="İlgili">${ilgSel}</select>
      <input id="ag-konu" placeholder="Yeni konu">
      <button class="btn" id="ag-add">Ekle</button>
    </div>
    <div class="scroll"><table class="gnb">
    <thead><tr><th>Kod</th><th>Konu</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
  view.querySelectorAll(".ed").forEach(el=>el.onclick=()=>startEdit(el));
  view.querySelectorAll(".del").forEach(b=>b.onclick=()=>delGundem(b.dataset.id));
  document.getElementById("ag-add").onclick=addGundem;
  document.getElementById("ag-konu").onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); addGundem(); } };
}
async function addGundem(){
  const ei=document.getElementById("ag-ilgili"), ek=document.getElementById("ag-konu");
  let ilg=(ei.value||"").trim();
  if(ilg==="__new__"){ ilg=(prompt("İlgili kodu (ör. MK, FA):")||"").trim(); }
  ilg=ilg.toUpperCase();
  const konu=(ek.value||"").trim();
  if(!ilg||!konu){ (ilg?ek:ei).focus(); return; }
  const btn=document.getElementById("ag-add"); btn.disabled=true; btn.textContent="Ekleniyor…";
  const {data}=await sb.from("ana_gundem").select("kod").like("kod","M%");
  let mx=0; (data||[]).forEach(r=>{ const m=String(r.kod||"").match(/^M(\d+)$/); if(m) mx=Math.max(mx,+m[1]); });
  const {error}=await sb.from("ana_gundem").insert([{kod:"M"+(mx+1),kod_prefix:"M",konu,ilgili:ilg,kaynak_tip:"manuel",turetilmis:false}]);
  btn.disabled=false; btn.textContent="Ekle";
  if(error){ alert(error.message); return; }
  loadGundem();
}

async function delGundem(id){
  if(!confirm("Bu gündem maddesi kalıcı olarak silinsin mi? (kapat = sil)")) return;
  const {error}=await sb.from("ana_gundem").delete().eq("id",id);
  if(error){ alert(error.message); return; }
  loadGundem();
}
function startEdit(el){
  if(el.querySelector("input,select")) return;
  const f=el.dataset.f, type=el.dataset.type, id=el.closest("tr").dataset.id;
  const cur=el.textContent.trim().replace(/^\+.*/,"").replace(/^tarih$/,"");
  const inp=document.createElement("input"); inp.className="cell"; inp.type = type==='date'?'date':'text';
  inp.value = type==='date'? "": cur;
  el.innerHTML=""; el.appendChild(inp); inp.focus();
  const commit=async()=>{
    let val=inp.value;
    if(type==='date' && !val){ el.innerHTML='<span style=color:#b7c6d6>tarih</span>'; return; }
    const {error}=await sb.from("ana_gundem").update({[f]:val||null}).eq("id",id);
    if(error){ el.innerHTML='<span style=color:#b40000>hata</span>'; alert(error.message); return; }
    el.textContent = type==='date'? fdate(val) : (val|| "");
    el.classList.add("saveflash"); setTimeout(()=>el.classList.remove("saveflash"),400);
  };
  inp.onblur=commit;
  inp.onkeydown=e=>{ if(e.key==='Enter'){e.preventDefault();inp.blur();} if(e.key==='Escape'){loadGundem();} };
}

/* ---------- SÖ (so_panosu, bölüm bloklu) ---------- */
async function loadSo(){
  const view=document.getElementById("view");
  const {data,error}=await sb.from("so_panosu").select("*");
  if(error){ view.innerHTML=`<div class="load">Hata: ${esc(error.message)}</div>`; return; }
  const groups={};
  (data||[]).forEach(r=>{ const k=r.bolum||"—"; (groups[k]=groups[k]||[]).push(r); });
  let rows="";
  Object.keys(groups).sort().forEach(k=>{

/* Bölge çekim hesabı: aktif=güncel, arşivden en yeni çekim=önceki */
function regCalc(rows){
  const cur=rows.filter(r=>r.aktif), arch=rows.filter(r=>!r.aktif);
  let pc=null; arch.forEach(r=>{ if(pc==null||r.cekim>pc) pc=r.cekim; });
  const prev=arch.filter(r=>r.cekim===pc);
  const cmp = prev.length? cur : [];
  const by=(arr,s)=>arr.filter(r=>String(r.statu||"").toLocaleLowerCase('tr').startsWith(s));
  return {
    cM:by(cur,'muht'), cA:by(cur,'al'),
    cMc:by(cmp,'muht'), cAc:by(cmp,'al'),
    pM:by(prev,'muht'), pA:by(prev,'al'),
    cekim: cur.reduce((m,r)=> (r.cekim>m?r.cekim:m), '0'),
    hasPrev: prev.length>0
  };
}
const sSum=arr=>arr.reduce((a,r)=>a+(Number(r.net_eur)||0),0);
const sKey=r=>String(r.proje||"").trim().toLocaleLowerCase('tr');
function sDiff(c,p){ const ps=new Set(p.map(sKey)), cs=new Set(c.map(sKey));
  return { ekl:c.filter(r=>!ps.has(sKey(r))), sil:p.filter(r=>!cs.has(sKey(r))) }; }
function eurDelta(v){ const r=Math.round(v); const c=r>0?'#0a6b3f':(r<0?'#b23a2e':'#6a7888'); return ` <span style="color:${c}">(${r>0?'+':(r<0?'−':'')}${money(Math.abs(r))} €)</span>`; }
/* Üst özet blok: hizalı Muhtemel | Alınan; Toplam + bölge satırları + eklenen(yeşil)/silinen(kırmızı) */
function satisSummary(regions){
  const cell=(cur,cmp,prev,hasPrev)=>`${money(sSum(cur))} €${hasPrev?eurDelta(sSum(cmp)-sSum(prev)):''}`;
  /* eklenen → YEŞİL; silinen → muhtemel→alınan (M sütunu) veya alınan→üretim (A sütunu) geçişi ise SİYAH, diğer silinenler KIRMIZI */
  const det=(cmp,prev,hasPrev,kind,curM,curA)=>{ if(!hasPrev) return '';
    const {ekl,sil}=sDiff(cmp,prev); let s='';
    ekl.forEach(r=> s+=`<div style="color:#0a6b3f;white-space:nowrap">${esc(r.proje)} +${money(r.net_eur)} €</div>`);
    sil.forEach(r=>{ const k=sKey(r); const iyi = kind==='M' ? curA.has(k) : (!curM.has(k) && !curA.has(k));
      s+=`<div style="color:${iyi?'#1c2430':'#b23a2e'};white-space:nowrap">${esc(r.proje)} −${money(r.net_eur)} €</div>`; });
    return s; };
  const tM=[],tA=[],tMc=[],tAc=[],tpM=[],tpA=[]; let anyPrev=false;
  regions.forEach(rg=>{ tM.push(...rg.cM); tA.push(...rg.cA); tMc.push(...rg.cMc); tAc.push(...rg.cAc); tpM.push(...rg.pM); tpA.push(...rg.pA); anyPrev=anyPrev||rg.hasPrev; });
  let body=`<tr class="stot"><td>Toplam</td><td class="num">${cell(tM,tMc,tpM,anyPrev)}</td><td class="num">${cell(tA,tAc,tpA,anyPrev)}</td></tr>`;
  regions.forEach(rg=>{
    const curM=new Set(rg.cM.map(sKey)), curA=new Set(rg.cA.map(sKey));
    body+=`<tr class="sreg"><td>${esc(rg.ad)}</td><td class="num">${cell(rg.cM,rg.cMc,rg.pM,rg.hasPrev)}</td><td class="num">${cell(rg.cA,rg.cAc,rg.pA,rg.hasPrev)}</td></tr>`;
    const dm=det(rg.cMc,rg.pM,rg.hasPrev,'M',curM,curA), da=det(rg.cAc,rg.pA,rg.hasPrev,'A',curM,curA);
    if(dm||da) body+=`<tr class="sdet"><td></td><td>${dm}</td><td>${da}</td></tr>`;
  });
  return `<div class="scroll" style="max-height:none;overflow:visible;border:0"><table class="ssum"><thead><tr><th></th><th class="num">Muhtemel</th><th class="num">Alınan</th></tr></thead><tbody>${body}</tbody></table></div>`;
}
function satisTbl(arr){
  const list=arr.slice().sort((a,b)=>(Number(b.net_eur)||0)-(Number(a.net_eur)||0));
  const rows=list.map(r=>`<tr><td class="kod" style="white-space:normal">${esc(r.proje)}</td><td>${esc(r.musteri)}</td><td>${esc(r.durum)}</td><td class="num">${money(r.net_eur)}</td></tr>`).join("");
  return `<div class="scroll"><table><thead><tr><th>PROJE</th><th>MÜŞTERİ</th><th>DURUM</th><th class="num">NET (€)</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
/* Aylık güncelleme banner: form düğmesi satis_ay_islendi'ye yazar → burada '… ayı işlendi' */
function ayBanner(ai){ if(!ai||!ai.ay) return ''; return `<div class="stamp" style="color:#0b57d0">📅 ${esc(ai.ay)} ayı işlendi${ai.updated_at?` · ${dOnly(ai.updated_at)}`:''}</div>`; }
function regionDetail(rg, ai){
  return `<h2 class="secH" style="margin-top:22px">${esc(rg.ad)}</h2>
    ${ayBanner(ai)}
    <h3 class="sec">Muhtemel <span class="muted">(${rg.cM.length} proje · Net ${money(sSum(rg.cM))} €)</span></h3>

}
/* Ülke normalizasyonu: Almanya · İngiltere · Fransa · Diğer Ülkeler */
function ulkeNorm(u){ u=String(u||"").toLocaleLowerCase('tr');
  if(/alman|german/.test(u)) return 'Almanya';
  if(/ingil|i̇ngil|united kingdom|\buk\b|england|britan/.test(u)) return 'İngiltere';
  if(/fransa|france|\bfr\b/.test(u)) return 'Fransa';
  return 'Diğer Ülkeler'; }
/* Takipteki teklifler istatistiği — Almanya/İngiltere/Diğer + yıllar tek blokta */
function statsBlock(ssData){
  const stats=ssData||[];
  const DD=['Kazandık','Kaybettik','Belirsiz','Müşteri işi alamadı'];
  const ULKE=['Almanya','İngiltere','Fransa','Diğer Ülkeler'];
  const S={}, years=new Set();
  stats.forEach(r=>{ const y=r.yil, u=ulkeNorm(r.ulke), d=r.durum; years.add(y);
    (S[y]=S[y]||{}); (S[y][u]=S[y][u]||{});
    const o=S[y][u][d]=S[y][u][d]||{adet:0,tutar:0,ws:0,wa:0};
    o.adet+=Number(r.adet)||0; o.tutar+=Number(r.tutar)||0;
    if(r.ort_isk!=null){ o.ws+=Number(r.ort_isk)*(Number(r.adet)||0); o.wa+=(Number(r.adet)||0); } });
  const ort=o=>(o&&o.wa)?o.ws/o.wa:null;
  const rd=v=>v==null?'—':Math.round(v)+'%';
  const full=o=>o?`<td class="num">${o.adet}</td><td class="num">${money(o.tutar)}</td><td class="num">${rd(ort(o))}</td>`:'<td class="num">0</td><td class="num">—</td><td class="num">—</td>';
  const cnt=o=>`<td class="num">${o?o.adet:0}</td>`;
  const rowFor=(lbl,g,cl)=>`<tr${cl?' class="grp"':''}><td class="kod">${esc(lbl)}</td>${full(g['Kazandık'])}${full(g['Kaybettik'])}${cnt(g['Belirsiz'])}${cnt(g['Müşteri işi alamadı'])}</tr>`;
  const yrs=[...years].sort((a,b)=>b-a);
  let body='';
  const yearBlock=y=>{
    body+=`<tr class="grp"><td colspan="9">${esc(String(y))}</td></tr>`;
    const gT={}; DD.forEach(d=>{ let ad=0,tu=0,ws=0,wa=0; ULKE.forEach(u=>{ const o=(S[y]&&S[y][u])?S[y][u][d]:null; if(o){ ad+=o.adet; tu+=o.tutar; ws+=o.ws; wa+=o.wa; } }); gT[d]={adet:ad,tutar:tu,ws:ws,wa:wa}; });
    ULKE.forEach(u=> body+=rowFor(u, (S[y]&&S[y][u])||{}, false));
    body+=rowFor('Toplam',gT,true);
  };
  if(yrs.length) yrs.forEach(yearBlock);
  else { body+=`<tr class="grp"><td colspan="9">— (veri bekleniyor)</td></tr>`; ULKE.forEach(u=> body+=rowFor(u,{},false)); body+=rowFor('Toplam',{},true); }
  return '<h3 class="sec">Takipteki teklifler — yıllık sonuç istatistiği</h3>'
    +'<div class="hint">Ülke: Almanya · İngiltere · Fransa · Diğer Ülkeler + Toplam. Kazandık/Kaybettik: adet · tutar · ort. iskonto. Belirsiz/Müşteri işi alamadı: adet. Yıllar tek blokta (2025 · 2026 …).</div>'
    +`<div class="scroll"><table class="tks"><thead>
      <tr><th rowspan="2">Yıl / Ülke</th><th colspan="3">Kazandık</th><th colspan="3">Kaybettik</th><th rowspan="2" class="num">Belirsiz<br>(adet)</th><th rowspan="2" class="num">Müşteri işi<br>alamadı (adet)</th></tr>
      <tr><th class="num">Adet</th><th class="num">Tutar €</th><th class="num">Ort.İsk</th><th class="num">Adet</th><th class="num">Tutar €</th><th class="num">Ort.İsk</th></tr>
      </thead><tbody>${body}</tbody></table></div>`;
}
/* Snapshot'tan eklenen/silinen — en yeni iki çekim farkı */
function takipDiff(snapRows){
  const rows=snapRows||[];
  const cekimler=[...new Set(rows.map(r=>String(r.cekim)))].sort();
  if(cekimler.length<2) return '<div class="hint">Eklenen/silinen için en az iki snapshot gerekir (form her yayınlandığında bir snapshot alınır).</div>';
  const last=cekimler[cekimler.length-1], prev=cekimler[cekimler.length-2];
  const cur=rows.filter(r=>String(r.cekim)===last), pr=rows.filter(r=>String(r.cekim)===prev);
  const {ekl,sil}=sDiff(cur,pr);
  /* eklenen → YEŞİL; silinen (takipten çıktı = karara bağlandı/ilerledi) → SİYAH */
  const chip=(r,pos)=>`<span style="color:${pos?'#0a6b3f':'#1c2430'};white-space:nowrap">${esc(r.proje)}${r.net_ht_eur!=null?` ${pos?'+':'−'}${money(r.net_ht_eur)} €`:''}</span>`;
  let s=`<div class="sybox" style="line-height:1.9"><div class="muted">Önceki çekim ${dOnly(prev)} → ${dOnly(last)}</div>`;
  if(!ekl.length&&!sil.length) s+='<div class="muted">Değişiklik yok.</div>';
  if(ekl.length) s+=`<div><b style="color:#0a6b3f">Eklenen (${ekl.length}):</b> ${ekl.map(r=>chip(r,1)).join(' · ')}</div>`;
  if(sil.length) s+=`<div><b style="color:#1c2430">Silinen (${sil.length}):</b> ${sil.map(r=>chip(r,0)).join(' · ')}</div>`;
  return s+'</div>';
}

async function loadBilanco(tgt){
  const view=document.getElementById(tgt||"view");
  const {data,error}=await sb.from("bilanco_ozet").select("*");
  if(error){ view.innerHTML=`<div class="load">Hata: ${esc(error.message)}</div>`; return; }
  const rowsD=(data||[]).slice().sort((a,b)=>b.yil-a.yil);
  const cur=rowsD[0]||{};
  const kar=cur.kar_tl, zar=kar<0;
  function card(t,v,s2,cls){ return `<div style="background:#fff;border:1px solid #e3e8ee;border-radius:10px;padding:10px 12px;border-left:4px solid ${cls}"><div style="font-size:11px;color:#6a7888">${t}</div><div style="font-size:18px;font-weight:700;color:#16324f">${v}</div><div style="font-size:10.5px;color:#93a1b0;margin-top:3px">${s2}</div></div>`; }
  const cards=`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin:6px 0 12px">
    ${card("Net Satış ("+cur.yil+")", money(cur.net_tl)+" TL", "≈ "+money(cur.net_eur)+" €", "#0a6b3f")}
    ${card("Toplam Maliyet", money(cur.toplam_gider_tl)+" TL", "710 + 720 + 730", "#b8863a")}
    ${card("Kâr/Zarar", (zar?"−":"+")+money(Math.abs(kar))+" TL", "Net − Maliyet", zar?"#b23a2e":"#0a6b3f")}
    ${card("Kâr Marjı", (cur.marj==null?"":Number(cur.marj).toFixed(1).replace(".",","))+" %", "Kapsam: Arbor Türkiye", zar?"#b23a2e":"#0a6b3f")}
  </div>`;
  let rows="";
  rowsD.forEach(r=>{
    const k=r.kar_tl, hasK=k!=null;
    const kc=hasK?`<td class="num" style="color:${k>=0?'#0a6b3f':'#b23a2e'};font-weight:600">${k>=0?'+':'−'}${money(Math.abs(k))}</td>`:'<td class="num" style="color:#c2ccd6">—</td>';
    const mc=hasK?`<td class="num" style="color:${k>=0?'#0a6b3f':'#b23a2e'}">${Number(r.marj).toFixed(1).replace(".",",")}%</td>`:'<td class="num" style="color:#c2ccd6">—</td>';
    const g=v=>v==null?'<td class="num" style="color:#c2ccd6">—</td>':`<td class="num">${money(v)}</td>`;
    const tg=r.toplam_gider_tl;
    const p=v=>(v==null||tg==null||Number(tg)===0)?'<td class="num" style="color:#c2ccd6">—</td>':`<td class="num" style="color:#6a7888">%${Math.round(v/tg*100)}</td>`;
    rows+=`<tr><td class="kod">${esc(r.yil)}</td><td class="num">${money(r.net_tl)}</td><td class="num">${money(r.net_eur)}</td>${g(r.k710_tl)}${p(r.k710_tl)}${g(r.k720_tl)}${p(r.k720_tl)}${g(r.k730_tl)}${p(r.k730_tl)}${g(r.toplam_gider_tl)}${kc}${mc}</tr>`;
  });
  const st=await tblStamp("bilanco_yil");
  view.innerHTML=`${stampHTML(st)}<div class="hint">Bilanço — <b>Arbor Türkiye</b> (yalnız Türkiye kapsamı). Gelir = Yıllık İcmal, gider = SB tablosu. 2011–2024 Türkiye Satış/Gider/Kâr dosyasından; 2022–2025 tam kâr/zarar.</div>
    ${cards}
    <div class="scroll"><table>
    <thead><tr><th>Yıl</th><th class="num">Net Satış (TL)</th><th class="num">Net (€)</th><th class="num">710 Malzeme</th><th class="num">710 %</th><th class="num">720 İşçilik</th><th class="num">720 %</th><th class="num">730 GÜG</th><th class="num">730 %</th><th class="num">Toplam Gider</th><th class="num">Kâr/Zarar</th><th class="num">Marj</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

/* ---------- REFERANS (kisiler / parametreler + işleyiş; ödemeler Maaş-Prim'e taşındı) ---------- */
async function loadRef(){
  const view=document.getElementById("view");
  const [k,p]=await Promise.all([
    sb.from("kisiler").select("*").order("kod"),
    sb.from("parametreler").select("*").order("anahtar")
  ]);
  const err=k.error||p.error;
  if(err){ view.innerHTML=`<div class="load">Hata: ${esc(err.message)}</div>`; return; }
  let kr=""; (k.data||[]).forEach(r=>{ kr+=`<tr><td class="kod">${esc(r.kod)}</td><td>${esc(r.tam_ad)}</td><td>${esc(r.bolum)||''}</td><td>${esc(r.email)||'<span style=color:#b7c6d6>—</span>'}</td><td>${esc(r.rol)||''}</td></tr>`; });
  let pr=""; (p.data||[]).forEach(r=>{ pr+=`<tr><td class="kod">${esc(r.anahtar)}</td><td>${esc(typeof r.deger==='string'?r.deger:JSON.stringify(r.deger))}</td><td>${esc(r.aciklama)}</td></tr>`; });
  const st=await tblStamp("kisiler");
  view.innerHTML=`${stampHTML(st)}
    <div class="flow"><b>Güncel işleyiş:</b> <span class="step">Melih ERP'yi manuel çeker</span><span class="arr">→</span><span class="step">Arbor\ERP\&lt;YYMMDD&gt;\ (geçici giriş kutusu)</span><span class="arr">→</span><span class="step">worker · upsert</span><span class="arr">→</span><span class="step">Postgres snapshot</span><span class="arr">→</span><span class="step">bu app</span></div>
    <h3 class="sec">Kişiler (${(k.data||[]).length})</h3>
    <div class="scroll"><table><thead><tr><th>Kod</th><th>Ad Soyad</th><th>Bölüm</th><th>E-posta</th><th>Rol</th></tr></thead><tbody>${kr}</tbody></table></div>
    <div class="hint">Ödemeler (referans — süreç yok) bloğu <b>Mali → Maaş-Prim</b> panosuna taşındı.</div>
    <h3 class="sec">Parametreler</h3>
    <div class="scroll"><table><thead><tr><th>Anahtar</th><th>Değer</th><th>Açıklama</th></tr></thead><tbody>${pr}</tbody></table></div>
    <h3 class="sec">İşleyiş — Süreçler</h3>
    <div class="hint">Süreçler Melih'in tarif ettiği işleyişi yansıtır; her biri <b>tetik → sorumlu → adımlar → çıktı</b> zinciriyle, sıklık etiketiyle yazılmıştır. Firma içi <b>kurallar</b> (yasalar) ayrı Prosedürler sekmesindedir.</div>
    <div class="flow"><b>1. ERP İngest Hattı</b><span class="tag">tek P süreci</span>
      <p>Melih ERP'yi manuel çeker → Excel'leri <code>Arbor\ERP\&lt;YYMMDD&gt;\</code> içine bırakır (geçici giriş kutusu; hedef Supabase Storage <code>erp/&lt;YYMMDD&gt;/</code>) → worker en güncel klasörü <b>başlık adına göre</b> okur, idempotent upsert eder → snapshot tabloları → app view'leri.</p>
      <p class="muted">Ingest edilen dört rapor: <b>Prj→proje_snapshot, Pem→pem_snapshot, Arge→arge_snapshot, SÖ→so_snapshot</b>. <b>Cam.xlsx ingest edilmez</b> (ayrı fiyat aracı, app/cam/). Panolar: Prj→AÜP + Hazır PRJ (durum 8/8.1); Pem→Hazır PEM (durum 3); Arge→Ana Gündem ARGE bloğu; SÖ→Ana Gündem SÖ türevi + EA formu.</p>
    </div>
    <div class="flow"><b>2. SÖ Bölüm Gündem Süreci</b><span class="tag ok">SÖ sorumlusu = EA (Enes Artan)</span>
      <p>Her ERP çekiminden sonra tüm sorun ve öneriler (SÖ'ler) Claude tarafından, EA (Enes Artan) ile paylaşılan bir panoya işlenir.</p>
      <p>EA, o hafta gündeme alacağı bölümü panoda seçer; seçilen bölüme ait olanların yine EA tarafından <b>Pazartesi akşamına kadar</b> incelenip <b>"gündeme alındı"</b>ya çevrilmesi gerektiğini belirten bir mail Claude tarafından EA'ya gönderilir.</p>
      <p>Claude, <b>Salı sabahı</b> paylaşılan panoda seçilen bölümle ilgili tüm SÖ'lerin işlenip işlenmediğini kontrol eder; <b>eksik varsa</b> mail ile EA'dan ister ve bu kontrolü <b>Çarşamba sabahı</b> tekrarlar.</p>
      <p class="muted"><b>EA formu (ayrı):</b> <a href="ea/" target="_blank">app/ea/</a> — EA bunu kendi web formundan yapar; çalışanlar Melih'in panolarına doğrudan yazmaz, form sonucu buraya salt-okur yansır.</p><p class="muted">Fabrika bölümü SÖ.xlsx KUSURLU BİRİM sütunundan gelir; boşsa "Atanmamış". Açık SÖ kümesi: DURUM ≤ 7.2 &amp; NİTELİK PEM/Şantiye.</p>
    </div>
    <div class="flow"><b>3. Bilanço Süreci</b><span class="tag">Türkiye · gider=SB · gelir=İcmal</span>
      <p>SB (Muhasebe) gider tablosu → yeni dönem gideri gelince Melih iletir → Claude bilanço panosunu günceller. Kapsam yalnız Arbor Türkiye. Bilanço = Net Satış (İcmal) − Toplam Maliyet (710+720+730, SB).</p>
    </div>
    <div class="flow"><b>4. Yıllık İcmal Süreci</b><span class="tag">tek gelir kaynağı</span>
      <p>Yıllık İcmal, aylık/yıllık Net Satış'ın tek kaynağıdır ve bilançonun gelir tarafını besler. PRJ/ERP çekiminden türetilir; satış raporları ay başı mapping ile iş hacmini canlı tutar.</p>
    </div>
    <div class="flow"><b>5. Satış Raporları Süreci</b><span class="tag">AK · FA/FY · SO</span>
      <p>Kaynak raporu gönderir → Claude "Satış Yorum" + İcmal'e işler → mail "Rapor" klasörüne taşınır. AK (UK) ve FA/FY (Fransa/ihracat) ayın 1'i ve 15'i; SO (yurtiçi) yalnız ayın 1'i.</p>
      <p class="muted">Eskalasyon: ayın 5. ve 20. günü gelmeyen kaynağa tek hatırlatma; önce Melih, sonra ilgili.</p>
    </div>
    <div class="flow"><b>6. Prim / Ödeme Süreci</b>
      <p>Aylık prim banknot denominasyonu 100 $ → 50 € → 200 TL. Sabit: Onur 200 €/ay, Özlem Y. 7.000 TL/ay, Orhan 20.000 TL/ay. Oransal: Özgül %0,01 tahsilat. Değişken: Fatma proje primi.</p>
      <p class="muted">Ödeme onayı: Melih "Uygundur" (52.1) onaya sunulur; Osman onaylı iç/fabrika (52.25) sorulmadan işlenir.</p>
    </div>
    <div class="flow"><b>7. Sevke-Hazır / PEM Takip</b><span class="tag">Onur (Sevkiyat)</span>
      <p>Onur Ekinci sevke-hazır PEM/PRJ durumunu ve Excel'i günceller. PEM İlgili DURUM bazlı: 1.2 → Berat (dış sipariş), 1.3/2 → Semih (üretim).</p>
      <p class="muted">Hazır PEM/PRJ panosu (<code>hazir_pem_prj</code>): PEM durum 3 · PRJ durum 8/8.1. Onur'un sevk durumu <code>sevk_durumu_onur</code>'a yazılır, panoya salt-okur yansır.</p>
    </div>
    <div class="flow"><b>8. ARGE Süreci</b><span class="tag ok">İlgili = EU</span>
      <p>ERP Arge.xlsx İLGİLİ sütunu (Ömer/Tarık) yok sayılır; tüm ARGE'nin İlgili'si Enes Uzun'da toplanır (K73). Ana Gündem'de ARGE ayrı blok (kişi gruplarından sonra), sıra öncelik→açılış.</p>
      <p class="muted"><code>gundem_arge</code> filtresi: öncelik 1–3 &amp; durum 1–4. (SÖ İlgili = EA, ARGE İlgili = EU — farklı kişiler.)</p>
    </div>
    <div class="flow"><b>9. Cam Fiyatlandırma Aracı</b><span class="tag">talep üzerine · MB</span>
      <p>Cam parametrelerinden (dış/iç cam, kaplama, akustik, temper, form, ara boşluk, Fire Proof…) çarpımsal model + geçmiş teklif eşleşmesiyle €/m² fiyat üretir. Bağlantı çalışanla paylaşılabilir: <a href="cam/" target="_blank">app/cam/</a>. Cam.xlsx ERP'ye ingest edilmez; bu araç ayrıdır.</p>
    </div>
    <div class="flow"><b>10. AÜP Kayma Takibi</b><span class="tag">her ERP çekimi</span>
      <p>AÜP panosu ERP snapshot üstünde canlı görüntüdür. <b>PST-AÜP&gt;0</b> ve <b>Kayma≥3</b> kırmızı işaretlenir; global kayma tutar-ağırlıklı (<code>aup_ozet</code>) hesaplanır ve önceki çekimle karşılaştırılır.</p>
    </div>
    <div class="flow"><b>11. Sistem / Bakım Süreci</b><span class="tag ok">yapısal garanti</span>
      <p><b>App cerrahi düzenlenir</b>, asla sıfırdan üretilmez: <code>arbor_app.html</code> düzenlenir → <code>_deploy_app.py</code> invariants kapısını çalıştırır (require eksik / forbid varsa deploy durur) → GitHub <code>app/index.html</code>. Bilerek davranış değişince önce <code>arbor_invariants.json</code> güncellenir.</p>
      <p class="muted"><b>SQL/DDL</b> service key ile local'den çalışmaz → Supabase SQL Editor (tarayıcı) üzerinden Run; anon yazımlarda <code>audit_log</code> grant + policy unutulmaz.</p>
    </div>
    <div class="flow"><b>12. Prosedür Güncelleme</b><span class="tag">ERP son kayıt</span>
      <p>Prosedürler, <code>C:\\Users\\USER\\OneDrive\\Arbor\\ERP\\</code> son kayıt dikkate alınarak güncellenir.</p>
    </div>
`;
}

const AY_TR=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
async function loadAhsap(tgt){
  const body=document.getElementById(tgt);
  const {data,error}=await sb.from("ahsap_alim").select("*");
  if(error){ body.innerHTML=`<div class="load">Hata: ${esc(error.message)}</div>`; return; }
  const rows=data||[];
  const cur=rows.filter(r=>r.aktif), closed=rows.filter(r=>!r.aktif);
  let pd=null; closed.forEach(r=>{ if(r.kapanis_donem&&(pd==null||r.kapanis_donem>pd)) pd=r.kapanis_donem; });
  const prev=closed.filter(r=>r.kapanis_donem===pd);
  const wavg=arr=>{ let s=0,c=0; arr.forEach(r=>{ const cbm=Number(r.toplam_cbm)||0, fe=Number(r.fiyat_eur); if(cbm>0&&isFinite(fe)){ s+=fe*cbm; c+=cbm; } }); return c>0?s/c:null; };
  const scbm=arr=>arr.reduce((a,r)=>a+(Number(r.toplam_cbm)||0),0);
  const int=v=>v==null?"—":Math.round(v).toLocaleString("tr-TR");
  const chg=(cu,pr)=>{ if(cu==null||pr==null||pr===0) return '<td class="num" style="color:#c2ccd6">—</td>'; const p=Math.round((cu-pr)/pr*100); const col=p>0?'#b23a2e':(p<0?'#0a6b3f':'#6a7888'); return `<td class="num" style="color:${col}">${p>0?'+':''}${p}%</td>`; };
  const agaclar=[...new Set(cur.map(r=>r.agac).concat(prev.map(r=>r.agac)))].sort((a,b)=>String(a).localeCompare(String(b),'tr'));
  let rh="";
  agaclar.forEach(ag=>{
    const cc=cur.filter(r=>r.agac===ag), pp=prev.filter(r=>r.agac===ag);
    const ca=wavg(cc), pa=wavg(pp);
    rh+=`<tr style="font-weight:700;background:#f4efe6"><td>${esc(ag)}</td><td class="num">${int(scbm(cc))}</td><td class="num">${ca==null?"—":int(ca)+" €"}</td><td class="num">${pa==null?"—":int(pa)+" €"}</td>${chg(ca,pa)}</tr>`;
    const teds=[...new Set(cc.map(r=>r.tedarikci).concat(pp.map(r=>r.tedarikci)))].sort((a,b)=>String(a).localeCompare(String(b),'tr'));
    teds.forEach(td=>{
      const tc=cc.filter(r=>r.tedarikci===td), tp=pp.filter(r=>r.tedarikci===td);
      const tca=wavg(tc), tpa=wavg(tp);
      rh+=`<tr><td style="padding-left:22px;color:#5a6b7d">${esc(td==null||td===""?"—":td)}</td><td class="num">${int(scbm(tc))}</td><td class="num">${tca==null?"—":int(tca)+" €"}</td><td class="num">${tpa==null?"—":int(tpa)+" €"}</td>${chg(tca,tpa)}</tr>`;
    });
  });
  let stamp="—";
  if(cur.length){ const md=cur.reduce((m,r)=> (r.created_at>m?r.created_at:m), '0'); const d=new Date(md); stamp=`${AY_TR[d.getMonth()]} ${d.getFullYear()} ayı işlendi · ${dOnly(md)}`; }
  body.innerHTML=`<div class="stamp">${cur.length?stamp:"—"}</div>
    <div class="hint">Ahşap alımları — ağaç çeşidi başına <b>CBM ağırlıklı € ortalama</b> (giriş kuruyla €'ya çevrilmiş); altında tedarikçi kırılımı. Önceki = son kapanan dönem. <a href="ahsap/" target="_blank">Ahşap formundan</a> işlenir, aylık güncellemede güncel→önceki kayar.</div>
    <div class="scroll"><table><thead><tr><th>Ağaç Çeşidi / Tedarikçi</th><th class="num">Top. CBM</th><th class="num">Ağ. Ort. €</th><th class="num">Önceki Ort. €</th><th class="num">Değişim %</th></tr></thead><tbody>${rh||'<tr><td colspan="5" class="load">Kayıt yok.</td></tr>'}</tbody></table></div>`;
}

/* ---------- MK PRİM — owner salt-okur: MK faaliyet formundan 4 blok + otomatik prim (mk_faaliyet). Tek kaynak: oranlar burada + formda birebir. ---------- */
const MKP_BLOCKS=[["memnuniyet","Müşteri Memnuniyeti","Oran% × %0,75 × (Kontrat HT ÷ 12)"],["ts","TS Ekstra İşler","%0,2 × TS Tutarı"],["fr","FR (Fransa) Satış","%0,05 × Kontrat HT"],["diger","Diğer Satış","%0,10 × Kontrat HT"]];
function mkPrim(tur,r){ const K=Number(r.kontrat_tutari)||0; if(tur==="memnuniyet") return (Number(r.memnuniyet_orani)||0)/100*0.0075*(K/12); if(tur==="ts") return 0.002*(Number(r.ts_tutari)||0); if(tur==="fr") return 0.0005*K; return 0.001*K; }
const mkEur=n=>(Number(n)||0).toLocaleString("tr-TR",{maximumFractionDigits:2})+" €";
async function loadMkPrim(tgt){
  const body=document.getElementById(tgt||"view");
  const {data,error}=await sb.from("mk_faaliyet").select("*").eq("aktif",true).order("id",{ascending:false});
  if(error){ body.innerHTML=`<div class="load">Hata: ${esc(error.message)}</div>`; return; }
  const rows=data||[]; const byT={memnuniyet:[],ts:[],fr:[],diger:[]}; rows.forEach(r=>{ (byT[r.tur]=byT[r.tur]||[]).push(r); });
  let grand=0;
  let html=`<div class="stamp">MK Prim · ${rows.length} faaliyet</div><div class="hint">Mehmet Konak <a href="mk-prim/" target="_blank">Faaliyet formundan</a> girer; prim kontrat/tutar alanlarından otomatik hesaplanır (tek kaynak). Toplam dört kriteri (FR dahil) kapsar.</div>`;
  MKP_BLOCKS.forEach(bl=>{
    const tur=bl[0], rs=byT[tur]||[], bt=rs.reduce((a,r)=>a+mkPrim(tur,r),0); grand+=bt;
    const isMem=tur==="memnuniyet", isTs=tur==="ts";
    const extraH= isMem?"<th>Kriter</th><th class='num'>Oran %</th>":(isTs?"<th>TS Notları</th>":"<th class='num'>Kontrat Tarihi</th>");
    const amtH= isTs?"TS Tutarı (€)":"Kontrat HT (€)";
    const tr=rs.map(r=>{ const extra= isMem?`<td>${esc(r.memnuniyet_kriterleri||"")}</td><td class='num'>${r.memnuniyet_orani==null?"":esc(r.memnuniyet_orani)}</td>`:(isTs?`<td>${esc(r.ts_notlari||"")}</td>`:`<td class='num'>${fdate(r.kontrat_tarihi)}</td>`); const amt=isTs?r.ts_tutari:r.kontrat_tutari; return `<tr><td>${esc(r.firma||"")}</td><td>${esc(r.proje||"")}</td>${extra}<td class='num'>${money(amt)}</td><td class='num' style='font-weight:700;color:#0a5745'>${mkEur(mkPrim(tur,r))}</td></tr>`; }).join("");
    html+=`<h3 class="sec">${esc(bl[1])} <span class="muted">— ${esc(bl[2])} · ${rs.length} satır · ${mkEur(bt)}</span></h3><div class="scroll"><table><thead><tr><th>Firma</th><th>Proje</th>${extraH}<th class='num'>${amtH}</th><th class='num'>Prim (€)</th></tr></thead><tbody>${tr||`<tr><td colspan='6' style='color:#8a97a4;padding:10px'>Kayıt yok.</td></tr>`}</tbody></table></div>`;
  });
  html+=`<div class="skpi" style="margin-top:12px"><div><b>${mkEur(grand)}</b> toplam prim (4 kriter)</div><div><b>${rows.length}</b> faaliyet</div></div>`;
  body.innerHTML=html;
}

    const tl=logs.length?logs.map(x=>`<div style="display:flex;gap:8px;align-items:baseline;padding:3px 0;border-top:1px solid #f0f3f7"><span class="sbdg ${x.kim==='OB'?'snew':'chg'}">${x.kim==='OB'?'ÖB':'MK'}</span><span style="color:#8a97a4;font-size:11px;white-space:nowrap;min-width:66px">${fdate(x.tarih)}</span><span style="flex:1;white-space:pre-wrap">${esc(x.durum)}</span></div>`).join(""):'<div class="muted" style="padding:4px 2px">Henüz durum girişi yok.</div>';
    html+=`<div class="flow"><b class="sb">${esc(r.santiye)}</b>${r.musteri?' <span class="tag">'+esc(r.musteri)+'</span>':''}${r.tutar!=null?' <span class="snum">'+money(r.tutar)+' €</span>':''}${a>=3?' <span class="sbdg none">'+a+' ay</span>':''}
      <p class="muted" style="margin:4px 0 8px">${esc(r.neden||'')}${r.sorumlu?' · Sorumlu: '+esc(r.sorumlu):''}${r.hedef?' · Hedef: '+esc(r.hedef):''}</p>
      <div>${tl}</div></div>`; });
  view.innerHTML=html;
}

/* ---------- ÖZEL — grup: 5 hassas pano (pano_ozel_html, iframe srcdoc) + G.menkul (pano_ozel). Bölüm-RLS; anon 401. Parola/ozel4 YOK. ---------- */
const OZEL_HTML=[["ozel_kitaplar","📚 Kitaplar"],["ozel_felsefe","🧠 Felsefe"],["ozel_phd","🎓 PhD Notes"],["ozel_takvim","🎂 Takvim"],["ozel_vapur","🚢 Vapur"]];
function loadOzel(){
  const view=document.getElementById("view");
  const isAdmin=state.allowed===null;
  const htmlTabs=OZEL_HTML.filter(t=> isAdmin || state.allowed.includes(t[0]));
  const showG = isAdmin || state.allowed.includes('gmenkul');
  const tabs=htmlTabs.concat(showG?[["gmenkul","🏢 G.menkul"]]:[]);
  if(!tabs.length){ view.innerHTML=`<div class="load">Bu hesapta özel bölüm yetkisi yok.</div>`; return; }
  if(!state.ozelSub || !tabs.some(t=>t[0]===state.ozelSub)) state.ozelSub=tabs[0][0];
  const cur=document.getElementById("ozf");
  if(cur && cur.getAttribute("data-b")===state.ozelSub) return; /* 60sn tazelemede aktif iframe'i koru (PhD düzenleme) */
  const bar=tabs.map(t=>`<button class="malitab${t[0]===state.ozelSub?' active':''}" data-o="${esc(t[0])}">${esc(t[1])}</button>`).join("");
  view.innerHTML=`<div class="malibar">${bar}</div><div id="ozel-body"><div class="load">Yükleniyor…</div></div>`;
  view.querySelectorAll(".malitab").forEach(btn=>btn.onclick=()=>{ state.ozelSub=btn.dataset.o; loadOzel(); });
  if(state.ozelSub==="gmenkul"){ loadPanoBolum("gmenkul","ozel-body"); return; }
  loadOzelHtml(state.ozelSub,"ozel-body");
}
/* pano_ozel_html satırını iframe srcdoc olarak tam sadakatle render et (CSS+script izole çalışır) */
async function loadOzelHtml(bolum,tgt){
  const body=document.getElementById(tgt);
  if(bolum==="ozel_phd") await phdPrepare();
  const {data,error}=await sb.from("pano_ozel_html").select("html_raw").eq("bolum",bolum).single();
  if(error){ body.innerHTML=`<div class="load">Hata: ${esc(error.message)}</div>`; return; }
  const ifr=document.createElement("iframe");
  ifr.id="ozf"; ifr.setAttribute("data-b",bolum);
  ifr.style.cssText="width:100%;height:86vh;border:1px solid #dde3ea;border-radius:8px;background:#fff";
  body.innerHTML=""; body.appendChild(ifr);
  ifr.srcdoc=data.html_raw;
}
/* PhD Notes: Supabase'ten notları parent'a yükle + kaydetme köprüsü (iframe içindeki script parent.__PHD_NOTES / parent.__phdSave kullanır). Kaynak Supabase, düzenlenebilir. */
async function phdPrepare(){
  const {data,error}=await sb.from("phd_notes").select("*").order("created",{ascending:false});
  window.__PHD_NOTES = error?[]:(data||[]).map(n=>({id:n.id,aim:n.aim,title:n.title,body:n.body,tags:n.tags||[],created:Number(n.created),edited:n.edited?Number(n.edited):undefined}));
  window.__phdSave = async function(notes){
    try{
      const rows=(notes||[]).map(n=>({id:n.id,aim:n.aim,title:n.title||'',body:(typeof n.body==='string'?n.body:JSON.stringify(n.body)),tags:Array.isArray(n.tags)?n.tags:[],created:n.created||Date.now(),edited:n.edited||null}));
      const up=await sb.from('phd_notes').upsert(rows,{onConflict:'id'});
      if(up.error) throw up.error;
      const ids=rows.map(r=>r.id);
      const {data:cur}=await sb.from('phd_notes').select('id');
      const del=(cur||[]).map(r=>r.id).filter(id=>ids.indexOf(id)<0);
      if(del.length) await sb.from('phd_notes').delete().in('id',del);
    }catch(e){ console.error('phdSave',e); alert('PhD kaydetme hatası: '+(e.message||e)); }
  };
}

/* ---------- BOOT (Supabase Auth oturumu — e-posta+parola) ---------- */
async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if(session){ state.session=session; state.email=session.user&&session.user.email||""; await loadPerms(); renderApp(); }
  else renderLogin();
}
sb.auth.onAuthStateChange((_ev,s)=>{ if(!s){ state.session=null; renderLogin(); } });
boot();
setInterval(()=>{ if(!document.getElementById("view")) return; if(document.querySelector('input.cell,select.cell')) return; loadView(); }, 60000);
</script>
