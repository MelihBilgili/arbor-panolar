<script>
/* ARB-AD-YAZIM (2026-09-22, Melih): proje / müşteri / firma adları her kelimenin yalnız baş harfi büyük,
   kısaltmalar tamamı büyük. Supabase REST (/rest/v1/) yanıtlarında ve yazma gövdelerinde (POST/PATCH/PUT)
   proje · proje_adi · musteri · firma alanlarına (fiyat_musteri_sinif'te ad) uygulanır — tek kaynak: kod/_arb_ad_yazim.js */
(function(){
  if(window.ARB_AD) return;
  var AKR=("SCI SAS SARL SA SASU EURL SNC SEM SPL SPLA ZAC PEM PST MVT AÜP OE ÖB MK MB EU UK USA TR FR AŞ LTD LLC PLC GMBH AG BV NV SPA SRL "+
    "HLM OPH OPAC EHPAD CHU CROUS RATP SNCF IDF ICF HQE BBC CA ILM FCAI CLC CBC LCB BAT BTP TRT KDV SGDB SVM LMP RBKC MTC GTM NHS PVC "+
    "ARGE ARB YD SÖ TOKİ İBB İTÜ ODTÜ ENSA ESSEC ENS HEC IUT CFA RTE EDF GDF CCI CMA SEMIIC SAEM SPIE CPAM CAF UGC ARS KYK TMO SGK TCDD İSKİ AVM ÖSYM THY PTT MSB TBMM YTÜ MSGSÜ").split(" ");
  var AK={}; AKR.forEach(function(w){ AK[w]=1; });
  var KUCUK={ST:1,MR:1,DR:1,SR:1,JR:1,MRS:1,MS:1};           /* sesli harfsiz ama kısaltma sayılmayanlar → St, Mr … */
  var TRH=/[ğĞşŞıİçÇöÖüÜ]/, SESLI=/[aeiouyàâäéèêëîïôöùûüÿıAEIOUYÀÂÄÉÈÊËÎÏÔÖÙÛÜŸİ]/, ROMA=/^(I{1,3}|IV|VI{0,3}|IX|XI{0,3}|XIV|XV)$/;
  function up(w,tr){ return tr?w.toLocaleUpperCase("tr"):w.toUpperCase(); }
  function lo(w,tr){ return tr?w.toLocaleLowerCase("tr"):w.toLowerCase(); }
  var OLAGAN={};  /* karışık metinde büyük yazılsa da kısaltma sayılmayan sık kelimeler */
  ("LE LA LES DE DU DES SUR SOUS AUX AU ET EN UN UNE THE OF AND FOR ON IN AT TO VON DER DIE DAS UND IM AM ZUM ZUR VE İLE EVİ BEY HAN KAT LOT VIA DEL DI DA LOS EL SAN SUD NORD EST OUEST").split(" ").forEach(function(w){ OLAGAN[w]=1; });
  function kelime(w,karisik,tr){
    if(/\d/.test(w)) return w;                                   /* rakamlı (P19, I3F, 68s) aynen */
    var U=up(w,tr);
    if(AK[U]) return U;
    if(w.length===1) return U;                                   /* tek harf (Lot F, Y Blok) */
    if(ROMA.test(U)) return U;                                   /* III. Faz */
    if(!SESLI.test(w) && !KUCUK[U]) return U;                    /* sesli harfsiz: SVM, LMP, RBKC */
    if(karisik && w===U && w.length<=3 && !OLAGAN[U]) return U;                /* karışık yazılmış metinde büyük yazılmış kısa kelime = kısaltma */
    var l=lo(w,tr); return up(l.charAt(0),tr)+l.slice(1);
  }
  window.ARB_AD=function(s){
    if(s==null||typeof s!=="string") return s;
    var t=s.replace(/\s+/g," ").trim(); if(!t) return t;
    var harf=t.replace(/[^\p{L}]/gu,""), karisik=harf!==harf.toUpperCase()&&harf!==harf.toLowerCase(), tr=TRH.test(t);  /* Türkçe harf içeren metin → tr yerel ayarı (YAPI → Yapı) */
    return t.replace(/[\p{L}\p{M}\p{N}]+/gu,function(w){ return kelime(w,karisik,tr); });
  };
  var ALAN={proje:1,proje_adi:1,musteri:1,firma:1};
  function donus(o,tablo){
    if(Array.isArray(o)){ for(var i=0;i<o.length;i++) donus(o[i],tablo); return o; }
    if(o&&typeof o==="object"){ for(var k in o){ if(typeof o[k]==="string"&&(ALAN[k]||(k==="ad"&&tablo==="fiyat_musteri_sinif"))) o[k]=window.ARB_AD(o[k]); } }
    return o;
  }
  window.ARB_AD_DONUS=donus;
  var of=window.fetch.bind(window);
  window.fetch=function(u,o){
    var url=String((u&&u.url)||u||""), m=url.match(/\/rest\/v1\/([A-Za-z0-9_]+)/), tablo=m?m[1]:null;
    if(!tablo) return of(u,o);
    try{ var me=((o&&o.method)||"GET").toUpperCase();
      if(o&&typeof o.body==="string"&&/^(POST|PATCH|PUT)$/.test(me)&&tablo!=="rpc"){ o=Object.assign({},o,{body:JSON.stringify(donus(JSON.parse(o.body),tablo))}); } }catch(e){}
    return of(u,o).then(function(r){
      var ct=r.headers.get("content-type")||"";
      if(!r.ok||ct.indexOf("json")<0) return r;
      return r.clone().text().then(function(t){ if(!t) return r;
        try{ return new Response(JSON.stringify(donus(JSON.parse(t),tablo)),{status:r.status,statusText:r.statusText,headers:r.headers}); }catch(e){ return r; } });
    });
  };
})();
</script>
<script>
/* ARB-KOD-GIRIS (23.09.2026): forma giris = kisisel 6 haneli kod (App > Referans > Kisiler > Sifre).
   form-giris edge fonksiyonu kodu dogrular, yetkiyi form_erisim'den kontrol eder, rolu otomatik secer ve
   rol hesabi icin tek kullanimlik token doner; burada verifyOtp ile oturum acilir. Rol hesaplarinin parolasi yoktur. */
window.ARB_FORM_YOL=(function(){ var m=/\/app\/([^\/]+)\//.exec(location.pathname); return m?m[1]+"/":""; })();
window.ARB_KOD_GIRIS=async function(cli,kod){
  kod=String(kod==null?"":kod).replace(/\D/g,"");
  if(kod.length!==6) return {error:{message:"Kod 6 haneli olmal\u0131d\u0131r."}};
  try{
    var r=await fetch("https://zehysygpqxqmrzangvuc.supabase.co/functions/v1/form-giris",{method:"POST",cache:"no-store",
      headers:{"Content-Type":"application/json",apikey:"sb_publishable_ZCcDv4S7qH1hc9tuiv4__A_YVxmIpWc"},
      body:JSON.stringify({form:window.ARB_FORM_YOL,kod:kod})});
    var j={}; try{ j=await r.json(); }catch(e){}
    if(!r.ok||!j.ok||!j.token_hash) return {error:{message:j.hata||"Kod hatal\u0131."}};
    var v=await cli.auth.verifyOtp({token_hash:j.token_hash,type:"magiclink"});
    if(v.error) return {error:{message:"Giri\u015f a\u00e7\u0131lamad\u0131: "+v.error.message}};
    try{ localStorage.setItem("arb_kisi_"+window.ARB_FORM_YOL,JSON.stringify({kod:j.kisi,ad:j.ad,rol:j.rol})); }catch(e){}
    return {error:null,data:j};
  }catch(e){ return {error:{message:"Ba\u011flant\u0131 hatas\u0131."}}; }
};
window.ARB_KISI_AL=function(em){ try{ var k=JSON.parse(localStorage.getItem("arb_kisi_"+window.ARB_FORM_YOL)||"null"); return (k&&(!em||k.rol===em))?k:null; }catch(e){ return null; } };
</script>

];
function ekTh(){ return '<th class="ek sm">Hedef<br>Yükleme Tarihi</th><th class="ek sm">Yükleme<br>Şekli</th><th class="ek">Açıklama</th><th class="ek sm">Takip<br>Durumu</th>'; }
function sekil(r){ if(!r.sekil) return ""; if(r.sekil==="Uçak") return r.ucak_onay?'<span class="ucok">Uçak</span>':'<span class="ucbek" title="MK onayı bekleniyor">Uçak</span>'; return esc(r.sekil); }
function ekTd(r){
  const ac=r.durum==="Acil", ed=ac?' acd':'';
  return `<td class="c${ed}" data-ed="1">${ac?fd(r.hedef):""}</td><td class="c${ed}" data-ed="1">${ac?sekil(r):""}</td>`
    +`<td class="c w30${ed}" data-ed="1"><span title="${esc(r.aciklama)}">${ac?esc(r.aciklama):""}</span></td>`
    +`<td class="c dur ${ac?'acil':''}">${esc(r.durum||"Normal")}${r.talep?talepKutu(r):''}</td>`;
}
/* MY-SANTIYE (28.10.2026): şantiye formundan gelen Acil/Normal talebi MY onayı bekler — kırmızı kutu, Reddet */
function talepKutu(r){ const d=r.talep+' talebi · '+(r.talep_kisi||'')+(r.talep==='Acil'?' · hedef '+fd(r.talep_hedef)+' · '+(r.talep_sekil||''):'')+(r.talep_aciklama?' · '+r.talep_aciklama:'');
  return ` <button class="tonay" title="${esc(d)}">${esc(r.talep)} talebini onayla</button> <button class="tred" title="${esc(d)}">Reddet</button>`;
}
function ciz(){
  const rows=DATA.rows||[];
  const html=BLOK.map(b=>{
    const R=rows.filter(r=>r.blok===b.k);
    const head=b.pem
      ? '<th>PEM</th><th>Proje Adı</th><th>Ek Bilgi</th><th>Adet</th><th>Talep Tarihi</th><th>Termin Tarihi</th>' /* MY-PEM-TALEPTARIH: Sevk Durumu (Onur) çıktı */
      : '<th>NO</th><th>PROJE ADI</th><th>Ad</th><th>AÜP</th>';
    const body=R.map(r=>{
      const ilk=b.pem
        ? /* MY-PEM-DURUM3: PEM = durumu ≤ 3 tüm yurt dışı PEM'ler; ERP durumu PEM no üzerinde */ `<td class="c"><span title="${esc(r.no+(r.durum_erp?' · '+r.durum_erp:''))}">${esc(r.kod)}</span></td><td class="c w22"><span title="${esc(r.proje)}">${esc(r.proje)}</span></td>`
          +`<td class="c w25"><span title="${esc(r.ekbilgi)}">${esc(r.ekbilgi)}</span></td><td class="n">${esc(r.adet)}</td><td class="c">${fd(r.talep_tarihi)}</td><td class="c">${fd(r.tarih)}</td>`
        : `<td class="c"><span title="${esc(r.no)}">${esc(r.kod)}</span></td><td class="c w30"><span title="${esc(r.proje)}">${esc(r.proje)}</span></td>`
          +`<td class="n">${esc(r.adet)}</td><td class="c">${fd(r.tarih)}</td>`;
      return `<tr class="${r.durum==="Acil"?'acil':''}" data-tur="${esc(r.tur)}" data-no="${esc(r.no)}">${ilk}${ekTd(r)}</tr>`;
    }).join("");
    return `<div class="blk"><h2>${esc(b.ad)} <span class="cnt">${R.length} satır${R.filter(r=>r.durum==="Acil").length?' · '+R.filter(r=>r.durum==="Acil").length+' acil':''}</span></h2>`
      +`<div class="tblwrap"><table class="myt"><thead><tr>${head}${ekTh()}</tr></thead><tbody>${body||`<tr><td colspan="${b.pem?10:8}" class="mut">Kayıt yok</td></tr>`}</tbody></table></div></div>`;
  }).join("");
  $("bloklar").innerHTML=html;
  $("damga").textContent="ERP: "+(DATA.damga||"—")+" · Sevk durumu (OE): "+(DATA.oe_at?fd(String(DATA.oe_at).slice(0,10)):"—")+" · Yurt dışı satırlar · Sağ tık: işlemler";
  document.querySelectorAll("#bloklar tr[data-tur]").forEach(tr=>{
    tr.addEventListener("contextmenu",ev=>{ ev.preventDefault(); menu(ev,satir(tr)); });
    tr.querySelectorAll("td[data-ed]").forEach(td=>td.addEventListener("click",()=>{ const r=satir(tr); if(r&&r.durum==="Acil") acilPencere(r,true); }));
    tr.querySelectorAll("button.tonay,button.tred").forEach(bt=>bt.addEventListener("click",ev=>{ ev.stopPropagation(); talepKarar(satir(tr),bt.classList.contains("tonay"),bt); }));
  });
}
function satir(tr){ const t=tr.getAttribute("data-tur"), n=tr.getAttribute("data-no"); return (DATA.rows||[]).find(r=>r.tur===t&&r.no===n); }
async function yukle(){
  try{ DATA=await MYACIL.liste(sb); ciz(); }
  catch(e){ $("bloklar").innerHTML='<div class="blk" style="padding:12px;color:#b40000">Hata: '+esc(e.message||e)+'</div>'; }
}
function kapatMenu(){ const m=$("myctx"); if(m) m.remove(); }
function menu(ev,r){
  kapatMenu(); if(!r) return;
  const m=document.createElement("div"); m.id="myctx"; m.className="ctx";
  const ops=r.durum==="Acil"?[["normal","Normale çevir"],["iptal","İptal et"],["ayr","Ayrıntılar"]]:[["acil","Acile çevir"],["iptal","İptal et"],["ayr","Ayrıntılar"]];
  m.innerHTML=`<div class="ctxh">${esc(r.tur==="PEM"?"PEM "+r.kod:r.kod)} · ${esc(r.proje)}</div>`+ops.map(o=>`<div class="ctxi" data-o="${o[0]}">${o[1]}</div>`).join("");
  document.body.appendChild(m);
  const w=m.offsetWidth, h=m.offsetHeight;
  m.style.left=Math.max(4,Math.min(ev.clientX,window.innerWidth-w-6))+"px";
  m.style.top=Math.max(4,Math.min(ev.clientY,window.innerHeight-h-6))+"px";
  m.querySelectorAll(".ctxi").forEach(i=>i.onclick=()=>{ kapatMenu(); islem(i.getAttribute("data-o"),r); });
}
document.addEventListener("click",e=>{ if(!e.target.closest||!e.target.closest("#myctx")) kapatMenu(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") kapatMenu(); });
window.addEventListener("scroll",kapatMenu,true);
function bildir(t,ok){ const m=$("msg"); m.className="msg "+(ok?"ok":"err"); m.textContent=t; if(ok) setTimeout(()=>{ if(m.textContent===t) m.textContent=""; },5000); }
async function yaz(r,durum,ek){
  ek=ek||{};
  const res=await sb.rpc("my_durum_yaz",{p_tur:r.tur,p_no:r.no,p_durum:durum,p_hedef:ek.hedef||null,p_sekil:ek.sekil||null,p_aciklama:ek.aciklama||null,p_kisi:KISI(),p_proje:r.proje||null});
  if(res.error){ bildir("Kaydedilemedi: "+res.error.message,false); return false; }
  return true;
}
async function haber(islem,r){
  try{ const {data,error}=await sb.functions.invoke("my-takip",{body:{islem,tur:r.tur,no:r.no,proje:r.proje}});
    if(error||!data||data.ok===false) return "bildirim gönderilemedi"+(data&&data.hata?" ("+data.hata+")":"");
    return islem==="iptal"?"OE'ye iptal maili gönderildi":"OE'ye acil maili"+(data.wa==="ok"?", MB'ye WhatsApp":"")+" gönderildi";
  }catch(e){ return "bildirim gönderilemedi"; }
}
async function talepKarar(r,onay,bt){
  if(!r) return; if(!onay&&!confirm((r.tur==="PEM"?"PEM "+r.kod:r.kod)+" · "+r.talep+" talebi reddedilsin mi?")) return;
  bt.disabled=true;
  const res=await sb.rpc("my_talep_karar",{p_tur:r.tur,p_no:r.no,p_onay:onay,p_kisi:KISI()});
  if(res.error){ bt.disabled=false; bildir("Kaydedilemedi: "+res.error.message,false); return; }
  await yukle();
  let h=""; try{ const {data}=await sb.functions.invoke("my-takip",{body:{islem:"talep_karar",tur:r.tur,no:r.no}}); h=(data&&data.mail==="ok")?" · şantiyeye mail gönderildi":""; }catch(e){}
  bildir((r.tur==="PEM"?"PEM "+r.kod:r.kod)+" · "+r.talep+" talebi "+(onay?"onaylandı":"reddedildi")+h,true);
}
async function islem(o,r){
  if(o==="ayr") return MYACIL.ayrinti(sb,r.tur,r.no);
  if(o==="acil") return acilPencere(r,false);
  if(o==="normal"){ if(await yaz(r,"Normal")){ await yukle(); bildir((r.tur==="PEM"?"PEM "+r.kod:r.kod)+" normale çevrildi",true); } return; }
  if(o==="iptal"){
    if(!confirm((r.tur==="PEM"?"PEM "+r.kod:r.kod)+" · "+r.proje+"\n\nİptal edilsin mi? Satır formdan çıkarılır ve OE'ye iptal maili gönderilir.")) return;
    if(await yaz(r,"İptal")){ await yukle(); bildir((r.tur==="PEM"?"PEM "+r.kod:r.kod)+" iptal edildi · "+await haber("iptal",r),true); }
  }
}
function acilPencere(r,duzenle){
  const m=document.createElement("div"); m.className="my-modal";
  const hd=(duzenle&&r.hedef)?String(r.hedef).slice(0,10):(r.tarih?String(r.tarih).slice(0,10):"");
  const sk=(duzenle&&r.sekil)?r.sekil:"Kamyon";
  m.innerHTML=`<div class="box" style="max-width:460px"><button class="x" title="Kapat">×</button>
    <h4>${duzenle?"Acil bilgileri":"Acile çevir"} · ${esc(r.tur==="PEM"?"PEM "+r.kod:r.kod)}</h4><div class="mut" style="margin-bottom:10px">${esc(r.proje)}</div>
    <label class="fl">Açıklama<textarea id="ma_ac" rows="3">${esc(duzenle?(r.aciklama||""):"")}</textarea></label>
    <label class="fl">Hedef Yükleme Tarihi<input id="ma_hd" type="date" value="${esc(hd)}"></label>
    <label class="fl">Yükleme Şekli<select id="ma_sk"><option${sk==="Kamyon"?" selected":""}>Kamyon</option><option${sk==="Uçak"?" selected":""}>Uçak</option></select></label>
    <div class="mut" style="font-size:11.5px;margin:4px 0 10px">Uçak seçimi MK onaylayana kadar gri görünür.${duzenle?"":" Kaydedince OE'ye acil maili ve MB'ye WhatsApp gider; satır acilden çıkana kadar her iş günü tekrarlanır."}</div>
    <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn sec" id="ma_vz">Vazgeç</button><button class="btn" id="ma_ok">${duzenle?"Kaydet":"Acile çevir"}</button></div></div>`;
  document.body.appendChild(m);
  const kapat=()=>m.remove();
  m.addEventListener("click",e=>{ if(e.target===m||e.target.classList.contains("x")) kapat(); });
  m.querySelector("#ma_vz").onclick=kapat;
  m.querySelector("#ma_ok").onclick=async()=>{
    const hedef=m.querySelector("#ma_hd").value, sekil=m.querySelector("#ma_sk").value, aciklama=m.querySelector("#ma_ac").value.trim();
    if(!hedef){ alert("Hedef yükleme tarihini giriniz."); return; }
    const b=m.querySelector("#ma_ok"); b.disabled=true; b.textContent="Kaydediliyor…";
    if(!(await yaz(r,"Acil",{hedef,sekil,aciklama}))){ b.disabled=false; b.textContent=duzenle?"Kaydet":"Acile çevir"; return; }
    kapat(); await yukle();
    const lbl=(r.tur==="PEM"?"PEM "+r.kod:r.kod);
    if(duzenle) bildir(lbl+" acil bilgileri kaydedildi",true);
    else bildir(lbl+" acile çevrildi · "+await haber("acil",r),true);
  };
  setTimeout(()=>{ const t=m.querySelector("#ma_ac"); if(t) t.focus(); },50);
}
yukle();
setInterval(()=>{ if(!document.querySelector(".my-modal")&&!$("myctx")) yukle(); },5*60*1000);
</script>
