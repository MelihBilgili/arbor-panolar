<script>
/* ARB-AD-YAZIM (2026-09-22, Melih): proje / müşteri / firma adları her kelimenin yalnız baş harfi büyük,
   kısaltmalar tamamı büyük. Supabase REST (/rest/v1/) yanıtlarında ve yazma gövdelerinde (POST/PATCH/PUT)
   proje · proje_adi · musteri · firma alanlarına (fiyat_musteri_sinif'te ad) uygulanır — tek kaynak: kod/_arb_ad_yazim.js */
(function(){
  if(window.ARB_AD) return;
  var AKR=("SCI SAS SARL SA SASU EURL SNC SEM SPL SPLA ZAC PEM PST MVT AÜP OE ÖB MK MB EU UK USA TR FR AŞ LTD LLC PLC GMBH AG BV NV SPA SRL "+
    "HLM OPH OPAC EHPAD CHU CROUS RATP SNCF IDF ICF HQE BBC CA ILM FCAI CLC CBC LCB BAT BTP TRT KDV SGDB SVM LMP RBKC MTC GTM NHS PVC "+
    "ARGE ARB YD SÖ TOKİ İBB İTÜ ODTÜ ENSA ESSEC ENS HEC IUT CFA RTE EDF GDF CCI CMA SEMIIC SAEM SPIE CPAM CAF UGC ARS KYK TMO SGK TCDD İSKİ AVM ÖSYM THY PTT MSB TBMM YTÜ MSGSÜ").split(" ");
  var AK={}; AKR.forEach(function(w){ AK[w]=1; });
  var KUCUK={ST:1,MR:1,DR:1,SR:1,JR:1,MRS:1,MS:1};           /* sesli harfsiz ama kısaltma sayılmayanlar → St, Mr … */
  var TRH=/[ğĞşŞıİçÇöÖüÜ]/, SESLI=/[aeiouyàâäéèêëîïôöùûüÿıAEIOUYÀÂÄÉÈÊËÎÏÔÖÙÛÜŸİ]/, ROMA=/^(I{1,3}|IV|VI{0,3}|IX|XI{0,3}|XIV|XV)$/;
  function up(w,tr){ return tr?w.toLocaleUpperCase("tr"):w.toUpperCase(); }
  function lo(w,tr){ return tr?w.toLocaleLowerCase("tr"):w.toLowerCase(); }
  var OLAGAN={};  /* karışık metinde büyük yazılsa da kısaltma sayılmayan sık kelimeler */
  ("LE LA LES DE DU DES SUR SOUS AUX AU ET EN UN UNE THE OF AND FOR ON IN AT TO VON DER DIE DAS UND IM AM ZUM ZUR VE İLE EVİ BEY HAN KAT LOT VIA DEL DI DA LOS EL SAN SUD NORD EST OUEST").split(" ").forEach(function(w){ OLAGAN[w]=1; });
  function kelime(w,karisik,tr){
    if(/\d/.test(w)) return w;                                   /* rakamlı (P19, I3F, 68s) aynen */
    var U=up(w,tr);
    if(AK[U]) return U;
    if(w.length===1) return U;                                   /* tek harf (Lot F, Y Blok) */
    if(ROMA.test(U)) return U;                                   /* III. Faz */
    if(!SESLI.test(w) && !KUCUK[U]) return U;                    /* sesli harfsiz: SVM, LMP, RBKC */
    if(karisik && w===U && w.length<=3 && !OLAGAN[U]) return U;                /* karışık yazılmış metinde büyük yazılmış kısa kelime = kısaltma */
    var l=lo(w,tr); return up(l.charAt(0),tr)+l.slice(1);
  }
  window.ARB_AD=function(s){
    if(s==null||typeof s!=="string") return s;
    var t=s.replace(/\s+/g," ").trim(); if(!t) return t;
    var harf=t.replace(/[^\p{L}]/gu,""), karisik=harf!==harf.toUpperCase()&&harf!==harf.toLowerCase(), tr=TRH.test(t);  /* Türkçe harf içeren metin → tr yerel ayarı (YAPI → Yapı) */
    return t.replace(/[\p{L}\p{M}\p{N}]+/gu,function(w){ return kelime(w,karisik,tr); });
  };
  var ALAN={proje:1,proje_adi:1,musteri:1,firma:1};
  function donus(o,tablo){
    if(Array.isArray(o)){ for(var i=0;i<o.length;i++) donus(o[i],tablo); return o; }
    if(o&&typeof o==="object"){ for(var k in o){ if(typeof o[k]==="string"&&(ALAN[k]||(k==="ad"&&tablo==="fiyat_musteri_sinif"))) o[k]=window.ARB_AD(o[k]); } }
    return o;
  }
  window.ARB_AD_DONUS=donus;
  var of=window.fetch.bind(window);
  window.fetch=function(u,o){
    var url=String((u&&u.url)||u||""), m=url.match(/\/rest\/v1\/([A-Za-z0-9_]+)/), tablo=m?m[1]:null;
    if(!tablo) return of(u,o);
    try{ var me=((o&&o.method)||"GET").toUpperCase();
      if(o&&typeof o.body==="string"&&/^(POST|PATCH|PUT)$/.test(me)&&tablo!=="rpc"){ o=Object.assign({},o,{body:JSON.stringify(donus(JSON.parse(o.body),tablo))}); } }catch(e){}
    return of(u,o).then(function(r){
      var ct=r.headers.get("content-type")||"";
      if(!r.ok||ct.indexOf("json")<0) return r;
      return r.clone().text().then(function(t){ if(!t) return r;
        try{ return new Response(JSON.stringify(donus(JSON.parse(t),tablo)),{status:r.status,statusText:r.statusText,headers:r.headers}); }catch(e){ return r; } });
    });
  };
})();
</script>
<script>
/* ARB-KOD-GIRIS (23.09.2026): forma giris = kisisel 6 haneli kod (App > Referans > Kisiler > Sifre).
   form-giris edge fonksiyonu kodu dogrular, yetkiyi form_erisim'den kontrol eder, rolu otomatik secer ve
   rol hesabi icin tek kullanimlik token doner; burada verifyOtp ile oturum acilir. Rol hesaplarinin parolasi yoktur. */
window.ARB_FORM_YOL=(function(){ var m=/\/app\/([^\/]+)\//.exec(location.pathname); return m?m[1]+"/":""; })();
window.ARB_KOD_GIRIS=async function(cli,kod){
  kod=String(kod==null?"":kod).replace(/\D/g,"");
  if(kod.length!==6) return {error:{message:"Kod 6 haneli olmal\u0131d\u0131r."}};
  try{
    var r=await fetch("https://zehysygpqxqmrzangvuc.supabase.co/functions/v1/form-giris",{method:"POST",cache:"no-store",
      headers:{"Content-Type":"application/json",apikey:"sb_publishable_ZCcDv4S7qH1hc9tuiv4__A_YVxmIpWc"},
      body:JSON.stringify({form:window.ARB_FORM_YOL,kod:kod})});
    var j={}; try{ j=await r.json(); }catch(e){}
    if(!r.ok||!j.ok||!j.token_hash) return {error:{message:j.hata||"Kod hatal\u0131."}};
    var v=await cli.auth.verifyOtp({token_hash:j.token_hash,type:"magiclink"});
    if(v.error) return {error:{message:"Giri\u015f a\u00e7\u0131lamad\u0131: "+v.error.message}};
    try{ localStorage.setItem("arb_kisi_"+window.ARB_FORM_YOL,JSON.stringify({kod:j.kisi,ad:j.ad,rol:j.rol})); }catch(e){}
    return {error:null,data:j};
  }catch(e){ return {error:{message:"Ba\u011flant\u0131 hatas\u0131."}}; }
};
window.ARB_KISI_AL=function(em){ try{ var k=JSON.parse(localStorage.getItem("arb_kisi_"+window.ARB_FORM_YOL)||"null"); return (k&&(!em||k.rol===em))?k:null; }catch(e){ return null; } };
</script>
<script>
/* MUSTERI-ONERI (05.10.2026) — Müşteriler kayıt/öneri ortak modülü. TEK KAYNAK: kod/_musteri_oneri.js
   Gömülü kopyalar: musteriler_form.html, satis_yd_akis_form_template.html (kod\_musteri_coklu_patch_261006.py eşitler).
   MUSTERI-COKLU (06.10.2026): şirket → birden çok yetkili (musteri_ilgili: firma_id, ad_soyad) → her yetkilinin
   birden çok e-posta/telefonu (musteri_iletisim: ilgili_id, tur 'mail'|'tel', deger). musteri_ilgili.mail/tel ESKİ, yazılmaz.
   Sıra: Şirket → Yetkili → E-posta/Telefon. */
window.MUS=(function(){
  var F=[], I=[], C=[];
  function n(s){ return String(s==null?"":s).replace(/\s+/g," ").trim(); }
  function k(s){ return n(s).toLocaleLowerCase("tr").replace(/ı/g,"i").normalize("NFD").replace(/[\u0300-\u036f]/g,""); } /* MUSTERI-COKLU: LUCIANI/luciani, Léon/Leon eşleşsin */
  function e(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
  async function yukle(sb){
    var a=await sb.from("musteri_firma").select("id,blok,firma").order("firma");
    var b=await sb.from("musteri_ilgili").select("id,firma_id,ad_soyad,created_at").order("id");
    var c=await sb.from("musteri_iletisim").select("id,ilgili_id,tur,deger").order("id");
    if(a.error) throw a.error; if(b.error) throw b.error; if(c.error) throw c.error;
    F=a.data||[]; I=b.data||[]; C=c.data||[]; return {F:F,I:I,C:C};
  }
  function firmalar(blok){ return F.filter(function(f){return f.blok===blok;}).sort(function(x,y){return String(x.firma).localeCompare(String(y.firma),"tr");}); }
  function firmaBul(blok,ad){ var q=k(ad); if(!q) return null; return F.find(function(f){return f.blok===blok&&k(f.firma)===q;})||null; }
  function ilgililer(fid){ return I.filter(function(r){return r.firma_id===fid;}).sort(function(x,y){return String(x.ad_soyad).localeCompare(String(y.ad_soyad),"tr");}); }
  function kisiBul(fid,ad){ var q=k(ad); if(!fid||!q) return null; return I.find(function(r){return r.firma_id===fid&&k(r.ad_soyad)===q;})||null; }
  function adlar(fid){ return ilgililer(fid).map(function(r){return n(r.ad_soyad);}); }
  function iletisim(iid,tur){ return C.filter(function(c){return c.ilgili_id===iid&&c.tur===tur;}); }
  async function iletisimEkle(sb,iid,tur,deger){
    deger=n(deger); if(!iid||!deger) return null;
    var var_=iletisim(iid,tur).find(function(c){return k(c.deger)===k(deger);}); if(var_) return var_;
    var r=await sb.from("musteri_iletisim").insert({ilgili_id:iid,tur:tur,deger:deger}).select("id,ilgili_id,tur,deger"); if(r.error) throw r.error;
    C.push(r.data[0]); return r.data[0];
  }
  async function iletisimSil(sb,cid){
    var r=await sb.from("musteri_iletisim").delete().eq("id",cid); if(r.error) throw r.error;
    C=C.filter(function(c){return c.id!==cid;});
  }
  async function kisiEkle(sb,fid,ad){
    ad=n(ad); var var_=kisiBul(fid,ad); if(var_) return var_;
    var r=await sb.from("musteri_ilgili").insert({firma_id:fid,ad_soyad:ad}).select("id,firma_id,ad_soyad,created_at"); if(r.error) throw r.error;
    I.push(r.data[0]); return r.data[0];
  }
  /* Ekleme: şirket yoksa açılır, yetkili yoksa açılır, e-posta/telefon o yetkilide yoksa eklenir (çift kayıt yok) */
  async function kaydet(sb,blok,firma,ad,mail,tel){
    firma=n(firma); ad=n(ad); mail=n(mail); tel=n(tel);
    if(!firma) throw new Error("Şirket boş");
    var f=firmaBul(blok,firma);
    if(!f){ var r=await sb.from("musteri_firma").insert({blok:blok,firma:firma}).select("id,blok,firma"); if(r.error) throw r.error; f=r.data[0]; F.push(f); }
    if(!ad) return {firma:f,ilgili:null};
    var p=await kisiEkle(sb,f.id,ad);
    if(mail) await iletisimEkle(sb,p.id,"mail",mail);
    if(tel) await iletisimEkle(sb,p.id,"tel",tel);
    return {firma:f,ilgili:p};
  }
  /* Dört kutuyu sıralı öneriye bağlar. o={blok:()=>"YD1", firma,ad,mail,tel:<input>, pre:"benzersiz-önek"} */
  function bagla(o){
    var B=typeof o.blok==="function"?o.blok:function(){return o.blok;};
    function dl(el,ad){ var id=o.pre+"-"+ad, d=document.getElementById(id); if(!d){ d=document.createElement("datalist"); d.id=id; document.body.appendChild(d); } el.setAttribute("list",id); return d; }
    var dF=dl(o.firma,"f"), dA=dl(o.ad,"a"), dM=dl(o.mail,"m"), dT=dl(o.tel,"t");
    function fid(){ var f=firmaBul(B(),o.firma.value); return f?f.id:null; }
    function tazele(){
      dF.innerHTML=firmalar(B()).map(function(f){return '<option value="'+e(f.firma)+'">';}).join("");
      var id=fid(); dA.innerHTML=id?adlar(id).map(function(a){return '<option value="'+e(a)+'">';}).join(""):"";
      var p=kisiBul(id,o.ad.value);
      dM.innerHTML=p?iletisim(p.id,"mail").map(function(c){return '<option value="'+e(c.deger)+'">';}).join(""):"";
      dT.innerHTML=p?iletisim(p.id,"tel").map(function(c){return '<option value="'+e(c.deger)+'">';}).join(""):"";
      var fv=!!n(o.firma.value), av=fv&&!!n(o.ad.value);
      o.ad.disabled=!fv; o.mail.disabled=!av; o.tel.disabled=!av;
      o.ad.placeholder=fv?"Yetkili (ad soyad)":"önce şirket"; o.mail.placeholder=av?"E-posta":"önce yetkili"; o.tel.placeholder=av?"Telefon":"önce yetkili";
    }
    o.firma.addEventListener("input",tazele); o.ad.addEventListener("input",tazele);
    tazele(); return {tazele:tazele};
  }
  return {yukle:yukle,firmalar:firmalar,firmaBul:firmaBul,ilgililer:ilgililer,kisiBul:kisiBul,adlar:adlar,iletisim:iletisim,
          iletisimEkle:iletisimEkle,iletisimSil:iletisimSil,kisiEkle:kisiEkle,kaydet:kaydet,bagla:bagla,
          get F(){return F;}, get I(){return I;}, get C(){return C;}, n:n, k:k, e:e};
})();

</script>
<script>

   YD1/YD2 formlarından gelen oturum (arbform_yd_akis_fy_form / _fy2_form) ve pano (int@) oturumu tanınır; yoksa kod girişi. */
const ARB_ROLLER=["fy.form@arbor.com.tr","fy2.form@arbor.com.tr","obl.form@arbor.com.tr","mk.form@arbor.com.tr","ks.form@arbor.com.tr"];
const ARB_ROL_AD={"fy.form@arbor.com.tr":"MN — Mustafa Nas","fy2.form@arbor.com.tr":"MKB — Melike Başaran","obl.form@arbor.com.tr":"OBL — Orhan Bulut","mk.form@arbor.com.tr":"MK — Mehmet Konak","ks.form@arbor.com.tr":"KS — Kamil Şen","int@arbor.com.tr":"MB"};
const ARB_URL="https://zehysygpqxqmrzangvuc.supabase.co", ARB_KEY="sb_publishable_ZCcDv4S7qH1hc9tuiv4__A_YVxmIpWc";
const ARB_MB="int@arbor.com.tr";

var ARB_ACTIVE=ARB_GATE_SB;

function arbGateUI(msg){

  d.style.cssText="position:fixed;inset:0;background:#16324f;z-index:99999;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',system-ui,sans-serif";
