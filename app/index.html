<body>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://zehysygpqxqmrzangvuc.supabase.co";
const SUPABASE_KEY = "sb_publishable_ZCcDv4S7qH1hc9tuiv4__A_YVxmIpWc";

const memStore = {};
function safeStorage(){
  try{ const k="__arb_t"; window.localStorage.setItem(k,"1"); window.localStorage.removeItem(k); return window.localStorage; }
  catch(e){ return { getItem:k=> (k in memStore? memStore[k]:null), setItem:(k,v)=>{memStore[k]=String(v)}, removeItem:k=>{delete memStore[k]} }; }
}
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:false, storage:safeStorage() }
});

const app = document.getElementById("app");
let state = { tab:"gundem", email:"", session:null, allowed:null };
const PREFIX = { F:"Fabrika", G:"Yurtdışı / Genel", P:"PEM", S:"Şahsi", ARGE:"ARGE" };

function esc(s){ return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fdate(s){ if(!s) return ""; s=String(s).trim();
  const m=s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})$/);  /* DD.MM.YYYY / DD.MM.YY — new Date() bunu ABD MM/DD sanıp kaydırıyor, elle parse et */
  if(m){ const g=+m[1],ay=+m[2]; if(g>=1&&g<=31&&ay>=1&&ay<=12){ const y=m[3].length<=2?m[3]:m[3].slice(-2); return String(g).padStart(2,'0')+"."+String(ay).padStart(2,'0')+"."+String(y).padStart(2,'0'); } }
  const d=new Date(s); if(isNaN(d)) return esc(s); return String(d.getDate()).padStart(2,'0')+"."+String(d.getMonth()+1).padStart(2,'0')+"."+String(d.getFullYear()).slice(2); }
function money(n){ if(n==null||n==="") return ""; const v=Math.round(Number(n)); return isNaN(v)?"":v.toLocaleString("tr-TR"); }

/* ---------- AUTH ---------- */
function renderLogin(){
  /* son giriş yapılan e-postayı hatırla → yalnız parola yazılır */
  if(!state.email){ try{ state.email = safeStorage().getItem("arbor_son_email") || ""; }catch(e){} }
  app.innerHTML = `
   <div class="login">
     <h2>Arbor Panolar</h2>
     <p>Devam etmek için giriş yap.</p>
     <input id="email" type="email" placeholder="ornek@arbor.com.tr" value="${esc(state.email)}" autocomplete="username">
     <input id="pw" type="password" placeholder="Parola" autocomplete="current-password">
     <button class="btn" id="go">Giriş yap</button>
     <div class="msg" id="msg"></div>
   </div>`;
  document.getElementById("go").onclick = doLogin;
  document.getElementById("pw").onkeydown = e=>{ if(e.key==='Enter'){ e.preventDefault(); doLogin(); } };
}
function msg(t,ok){ const m=document.getElementById("msg"); if(m){ m.textContent=t; m.className="msg "+(ok?"ok":"err"); } }
async function doLogin(){
  const email=document.getElementById("email").value.trim();
  const pw=document.getElementById("pw").value;
  if(!email||!pw){ msg("E-posta ve parola gir."); return; }
  state.email=email; msg("Giriş yapılıyor…",true);
  const {data,error}=await sb.auth.signInWithPassword({ email, password:pw });
  if(error){ msg("Hata: "+error.message); return; }
  try{ safeStorage().setItem("arbor_son_email", email); }catch(e){}
  state.session=data.session; await loadPerms(); renderApp();
}
async function doLogout(){ await sb.auth.signOut(); state.session=null; state.allowed=null; state.tab="gundem"; renderLogin(); }
/* Kullanıcının yetkili olduğu bölümler (yetkiler tablosu, RLS ile yalnız kendi satırları). '*' = admin (hepsi). */
async function loadPerms(){
  try{
    const {data,error}=await sb.from("yetkiler").select("bolum");
    if(error){ state.allowed=null; return; }
    const rows=data||[];
    state.allowed = rows.some(r=>r.bolum==='*') ? null : rows.map(r=>r.bolum);
  }catch(e){ state.allowed=null; }
}

/* ---------- APP SHELL ---------- */
const MALI_BOLUM=["kredi","ahsap","sel_arb","mali_maasprim","mali_mkprim"];
const MALI_ALL=["kredi","ahsap","sel_arb","bilanco","icmal","mali_maasprim","mali_mkprim"];
/* ÖB Faaliyet artık Mali grubunun içinde (MK Faaliyet'in yanında) */
const TABS=[["gundem","Ana Gündem"],["aup","AÜP"],["hazir","Hazır PEM/PRJ"],["so","SÖ"],["satis","Satış"],["ref","Referans"],["prosedur","Prosedürler"],["mali","Mali"],["formlar","Formlar"],["ozel","Özel"]];
const TAB_OBRAPOR=["obrapor","ÖB Faaliyet"];
function tabVisible(k){ const a=state.allowed; if(a===null) return true; if(k==='mali') return MALI_ALL.some(b=>a.includes(b))||a.includes('ob_rapor'); if(k==='ozel') return a.includes('ozel')||a.includes('gmenkul'); if(k==='formlar') return a.includes('formlar'); return a.includes(k); }
function renderApp(){
  const vis = TABS.filter(t=> tabVisible(t[0]) );
  if(!vis.length){ app.innerHTML=`<div class="login"><h2>Arbor Panolar</h2><p>Bu hesap için tanımlı bir bölüm yok. Yöneticiyle görüşün.</p><button class="btn" id="lo">Çıkış</button></div>`; document.getElementById("lo").onclick=doLogout; return; }
  if(!vis.some(t=>t[0]===state.tab)) state.tab=vis[0][0];
  app.innerHTML = `
   <header>
     <div class="tabs">
       ${vis.map(t=>`<button data-t="${t[0]}" class="${state.tab===t[0]?'active':''}">${t[1]}</button>`).join("")}
     </div>
   </header>
   <div class="wrap" id="view"><div class="load">Yükleniyor…</div></div>`;
  document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{ state.tab=b.dataset.t; renderApp(); });
  loadView();
}
function loadView(){
  if(state.tab==='gundem') loadGundem();
  else if(state.tab==='hazir') loadHazir();
  else if(state.tab==='so') loadSo();
  else if(state.tab==='satis') loadSatis();
  else if(state.tab==='ref') loadRef();
  else if(state.tab==='prosedur') loadProsedur();
  else if(state.tab==='mali') loadMali();
  else if(state.tab==='formlar') loadFormlar();
  else if(state.tab==='ozel') loadOzel();
  else loadAup();
}
function fmtDamga(dg){ return (dg&&dg.length>=6)? dg.slice(4,6)+"."+dg.slice(2,4)+"."+dg.slice(0,2) : "—"; }
function dOnly(iso){ if(!iso) return "—"; const d=new Date(iso); return isNaN(d)?"—":String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+"."+String(d.getFullYear()).slice(2); }
async function erpStamp(){ const {data}=await sb.from("erp_yukleme").select("damga").order("damga",{ascending:false}).limit(1); return data&&data[0]?fmtDamga(data[0].damga):"—"; }
async function tblStamp(t){ const {data}=await sb.from(t).select("updated_at").order("updated_at",{ascending:false}).limit(1); return data&&data[0]?dOnly(data[0].updated_at):"—"; }
function stampHTML(d){ return '<div class="stamp">Son güncelleme: '+(d||"—")+'</div>'; }
/* Damga satırlarındaki "(+%N)" rozeti — bir önceki ERP çekimine göre değişim, tamsayı. */
function pctSpan(a,b){ a=Number(a)||0; b=Number(b)||0; if(!b) return ""; const v=Math.round((a-b)/Math.abs(b)*100); return ' <span style="color:'+(v>=0?'#0a6b3f':'#b23a2e')+'">('+(v>=0?'+':'−')+Math.abs(v)+'%)</span>'; }

/* ---------- Başlık uydurma: sütun başlığı içerikten genişse bir tık küçült; hâlâ genişse
   iki satıra sar (başlıklar alttan hizalı). Yalnız auto-layout tablolarda çalışır;
   colgroup'lu sabit tablolarda gerek yok. Her tabloya bir kez uygulanır (data-fh). ---------- */
function fitHeads(){
  document.querySelectorAll("#app table").forEach(tbl=>{
    if(tbl.dataset.fh) return; tbl.dataset.fh="1";
    if(getComputedStyle(tbl).tableLayout==="fixed") return;
    const th0=tbl.tHead, body=tbl.tBodies[0];
    if(!th0||!th0.rows.length||!body||!body.rows.length) return;
    const hr=th0.rows[th0.rows.length-1], n=hr.cells.length;
    /* Range ile GERÇEK metin genişliği — scrollWidth yerleşmiş sütun genişliğini verdiği için dairesel olur */
    const rw=el=>{ const r=document.createRange(); r.selectNodeContents(el); return r.getBoundingClientRect().width; };
    const colMax=new Array(n).fill(0);
    for(const row of body.rows){
      if(row.cells.length!==n) continue;              /* grup / colspan satırları hariç */
      for(let i=0;i<n;i++){ const c=row.cells[i], ch=c.firstElementChild;
        const w=ch?ch.getBoundingClientRect().width:rw(c);
        if(w>colMax[i]) colMax[i]=w; }
    }
    for(let i=0;i<n;i++){
      const th=hr.cells[i];
      if(!th||th.colSpan>1||th.rowSpan>1||!th.textContent.trim()||!colMax[i]) continue;
      if(rw(th)<=colMax[i]+2) continue;                        /* başlık zaten dar */
      th.classList.add("thsm");
      if(rw(th)>colMax[i]+2) th.innerHTML='<span class="thw">'+th.innerHTML+'</span>';
    }
  });
}
/* ---------- Taşan hücre içeriği hover'da tam görünsün (title) — TÜM panolar.
   Sütun genişliği yüzünden kırpılan her hücreye (td / içindeki span-div) tam metni
   title olarak koyar; tarayıcı hover'da gösterir. Ölçüm ve yazma iki ayrı geçişte
   (layout thrash yok). title'ı zaten olan öğeye dokunulmaz. Attribute değişimi
   MutationObserver (childList) tetiklemez → döngü yok. ---------- */
function fitTitles(){
  const app=document.getElementById("app"); if(!app) return;
  const todo=[];
  app.querySelectorAll("td,td span,td div").forEach(el=>{
    if(el.hasAttribute("title")) return;
    if(el.firstElementChild&&el.querySelector("button,input,select,textarea,a,table,iframe")) return;
    if(el.scrollWidth>el.clientWidth+1) todo.push(el);
  });
  todo.forEach(el=>{ const t=(el.innerText||el.textContent||"").replace(/\s+/g," ").trim(); if(t) el.setAttribute("title",t); });
}
(function(){
  const run=()=>{ clearTimeout(window._fhT); window._fhT=setTimeout(()=>{ fitHeads(); fitTitles(); },60); };
  const app=document.getElementById("app");
  if(app) new MutationObserver(run).observe(app,{childList:true,subtree:true});
})();

async function addGundem(){
  const ei=document.getElementById("ag-ilgili"), ek=document.getElementById("ag-konu"), ekod=document.getElementById("ag-kod");
  let ilg=(ei.value||"").trim();
  const konu=(ek.value||"").trim();
  if(ilg==="PEM"||ilg==="PRJ"){
    const need=ilg==="PEM"?5:8, kod=(ekod.value||"").trim();
    if(!new RegExp("^\\d{1,"+need+"}$").test(kod)){ alert(ilg+" için Kod = numaranın son "+need+" hanesi (en çok "+need+" haneli sayı; kısaysa tamamı)."); ekod.focus(); return; }
    if(!konu){ ek.focus(); return; }
    const btn=document.getElementById("ag-add"); btn.disabled=true; btn.textContent="Ekleniyor…";
    const {error}=await sb.from("ana_gundem").insert([{kod:kod,kod_prefix:(ilg==='PEM'?'P':'R'),konu,ilgili:ilg,kaynak_tip:ilg.toLowerCase(),turetilmis:false}]);
    btn.disabled=false; btn.textContent="Ekle";
    if(error){ alert(error.message); return; }
    ekod.value=""; ek.value=""; loadGundem(); return;
  }
  if(ilg==="__new__"){ ilg=(prompt("İlgili kodu (ör. MK, FA):")||"").trim(); }
  ilg=ilg.toUpperCase();
  if(!ilg||!konu){ (ilg?ek:ei).focus(); return; }
  /* İş1: kullanılan İlgili kodu seçenek listesinde yoksa kalıcı olarak ekle */
  { const {data:_ex}=await sb.from("gundem_secenek").select("id").eq("ad",ilg).limit(1);
    if(!_ex||!_ex.length){ const {data:_mx}=await sb.from("gundem_secenek").select("sira").order("sira",{ascending:false}).limit(1);
      await sb.from("gundem_secenek").insert([{ad:ilg,sira:((_mx&&_mx[0]&&_mx[0].sira)||0)+10}]); } }
  const btn=document.getElementById("ag-add"); btn.disabled=true; btn.textContent="Ekleniyor…";
  const {data}=await sb.from("ana_gundem").select("kod").like("kod","M%");
  let mx=0; (data||[]).forEach(r=>{ const m=String(r.kod||"").match(/^M(\d+)$/); if(m) mx=Math.max(mx,+m[1]); });
  const {error}=await sb.from("ana_gundem").insert([{kod:"M"+(mx+1),kod_prefix:"M",konu,ilgili:ilg,kaynak_tip:"manuel",turetilmis:false}]);
  btn.disabled=false; btn.textContent="Ekle";
  if(error){ alert(error.message); return; }
  loadGundem();
}
async function secAdd(inp){
  const ad=(inp.value||"").trim().toUpperCase();
  if(!ad){ inp.focus(); return; }
  const {data:mx}=await sb.from("gundem_secenek").select("sira").order("sira",{ascending:false}).limit(1);
  const {error}=await sb.from("gundem_secenek").insert([{ad,sira:((mx&&mx[0]&&mx[0].sira)||0)+10}]);
  if(error){ alert(error.code==='23505'?(ad+" zaten listede."):error.message); return; }
  inp.value=""; loadGundem();
}
async function secDelete(id,ad){
  if(!confirm(ad+" seçeneği listeden kaldırılsın mı?\n(Bu seçenekle eklenmiş mevcut gündem kalemleri SİLİNMEZ.)")) return;

async function secMove(id,dir,sorted){
  const i=sorted.findIndex(r=>String(r.id)===String(id)), j=i+dir;
  if(i<0||j<0||j>=sorted.length) return;
  const a=sorted[i], b=sorted[j];

  await sb.from("gundem_secenek").update({sira:a.sira}).eq("id",b.id);
  loadGundem();
}

async function delGundem(id){

function startEdit(el){
  if(el.querySelector("input,select")) return;
  const f=el.dataset.f, type=el.dataset.type, id=el.closest("tr").dataset.id;
  const cur=el.textContent.trim().replace(/^\+.*/,"").replace(/^tarih$/,"");
  const inp=document.createElement("input"); inp.className="cell"; inp.type = type==='date'?'date':'text';
  inp.value = type==='date'? "": cur;
  el.innerHTML=""; el.appendChild(inp); inp.focus();
  const commit=async()=>{
    let val=inp.value;
    if(type==='date' && !val){ el.innerHTML='<span style=color:#b7c6d6>tarih</span>'; return; }
    const {error}=await sb.from("ana_gundem").update({[f]:val||null}).eq("id",id);
    if(error){ el.innerHTML='<span style=color:#b40000>hata</span>'; alert(error.message); return; }
    el.textContent = type==='date'? fdate(val) : (val|| "");
    el.classList.add("saveflash"); setTimeout(()=>el.classList.remove("saveflash"),400);
  };
  inp.onblur=commit;
  inp.onkeydown=e=>{ if(e.key==='Enter'){e.preventDefault();inp.blur();} if(e.key==='Escape'){loadGundem();} };
}

/* Bölge çekim hesabı: aktif=güncel, arşivden en yeni çekim=önceki */
function regCalc(rows){
  const cur=rows.filter(r=>r.aktif), arch=rows.filter(r=>!r.aktif);
  let pc=null; arch.forEach(r=>{ if(pc==null||r.cekim>pc) pc=r.cekim; });
  const prev=arch.filter(r=>r.cekim===pc);
  const cmp = prev.length? cur : [];
  const by=(arr,s)=>arr.filter(r=>String(r.statu||"").toLocaleLowerCase('tr').startsWith(s));
  return {
    cM:by(cur,'muht'), cA:by(cur,'al'),
    cMc:by(cmp,'muht'), cAc:by(cmp,'al'),
    pM:by(prev,'muht'), pA:by(prev,'al'),
    cekim: cur.reduce((m,r)=> (r.cekim>m?r.cekim:m), '0'),
    hasPrev: prev.length>0
  };
}
const sSum=arr=>arr.reduce((a,r)=>a+(Number(r.net_eur)||0),0);
const sKey=r=>String(r.proje||"").trim().toLocaleLowerCase('tr');
function sDiff(c,p){ const ps=new Set(p.map(sKey)), cs=new Set(c.map(sKey));
  return { ekl:c.filter(r=>!ps.has(sKey(r))), sil:p.filter(r=>!cs.has(sKey(r))) }; }
function eurDelta(v){ const r=Math.round(v); const c=r>0?'#0a6b3f':(r<0?'#b23a2e':'#6a7888'); return ` <span style="color:${c}">(${r>0?'+':(r<0?'−':'')}${money(Math.abs(r))} €)</span>`; }
/* Üst özet blok: hizalı Muhtemel | Alınan; Toplam + bölge satırları + eklenen(yeşil)/silinen(kırmızı) */
function satisSummary(regions){
  const cell=(cur,cmp,prev,hasPrev)=>`${money(sSum(cur))} €${hasPrev?eurDelta(sSum(cmp)-sSum(prev)):''}`;
  /* eklenen → YEŞİL, ama Alınan sütununda ÖNCEKİ ÇEKİMDE MUHTEMEL olan proje yeni iş değil,
     muhtemel→alınan GEÇİŞİdir → SİYAH (SATIS-GECIS).
     silinen → muhtemel→alınan (M sütunu) veya alınan→üretim (A sütunu) geçişi ise SİYAH, diğer silinenler KIRMIZI */
  const det=(cmp,prev,hasPrev,kind,curM,curA,prevM)=>{ if(!hasPrev) return '';
    const {ekl,sil}=sDiff(cmp,prev); let s='';
    const line=(col,proje,sgn,val)=>`<div class="sdrow" style="color:${col}"><span class="sdp">${esc(proje)}</span><span class="sdv">${sgn}${money(val)} €</span></div>`;
    ekl.forEach(r=>{ const gecis = kind==='A' && prevM && prevM.has(sKey(r));
      s+=line(gecis?'#1c2430':'#0a6b3f',r.proje,'+',r.net_eur); });
    sil.forEach(r=>{ const k=sKey(r); const iyi = kind==='M' ? curA.has(k) : (!curM.has(k) && !curA.has(k));
      s+=line(iyi?'#1c2430':'#b23a2e',r.proje,'−',r.net_eur); });
    return s; };
  const tM=[],tA=[],tMc=[],tAc=[],tpM=[],tpA=[]; let anyPrev=false;
  regions.forEach(rg=>{ tM.push(...rg.cM); tA.push(...rg.cA); tMc.push(...rg.cMc); tAc.push(...rg.cAc); tpM.push(...rg.pM); tpA.push(...rg.pA); anyPrev=anyPrev||rg.hasPrev; });
  /* SATIS-GUNC: en sağdaki "Güncelleme" sütunu = o bölgenin formundan yapılan SON aktarım
     (aktif satırların çekim damgası). Toplam satırında üçünün en yenisi görünür. */
  const gunc=rg=>(rg.cekim && rg.cekim!=='0')?dOnly(rg.cekim):'—';
  const enYeni=regions.reduce((m,rg)=>(rg.cekim&&rg.cekim>m?rg.cekim:m),'0');
  let body=`<tr class="stot"><td>Toplam</td><td class="num">${cell(tM,tMc,tpM,anyPrev)}</td><td class="num">${cell(tA,tAc,tpA,anyPrev)}</td><td class="num">${enYeni!=='0'?dOnly(enYeni):'—'}</td></tr>`;
  regions.forEach(rg=>{
    const curM=new Set(rg.cM.map(sKey)), curA=new Set(rg.cA.map(sKey)), prevM=new Set(rg.pM.map(sKey));
    body+=`<tr class="sreg"><td>${esc(rg.ad)}</td><td class="num">${cell(rg.cM,rg.cMc,rg.pM,rg.hasPrev)}</td><td class="num">${cell(rg.cA,rg.cAc,rg.pA,rg.hasPrev)}</td><td class="num">${gunc(rg)}</td></tr>`;
    const dm=det(rg.cMc,rg.pM,rg.hasPrev,'M',curM,curA,prevM), da=det(rg.cAc,rg.pA,rg.hasPrev,'A',curM,curA,prevM);
    if(dm||da) body+=`<tr class="sdet"><td></td><td>${dm}</td><td>${da}</td><td></td></tr>`;
  });
  return `<div class="scroll" style="max-height:none;overflow-y:visible;overflow-x:auto;-webkit-overflow-scrolling:touch;border:0"><table class="ssum"><thead><tr><th></th><th class="num">Muhtemel</th><th class="num">Alınan</th><th class="num">Güncelleme</th></tr></thead><tbody>${body}</tbody></table></div>`;
}
function satisTbl(arr){
  const list=arr.slice().sort((a,b)=>(Number(b.net_eur)||0)-(Number(a.net_eur)||0));
  const rows=list.map(r=>`<tr>`
    +`<td class="kod"><div class="cx sc1" title="${esc(r.proje)}">${esc(r.proje)}</div></td>`
    +`<td><div class="cx sc2" title="${esc(r.musteri)}">${esc(r.musteri)}</div></td>`
    +`<td class="num"><div class="cx sc3">${money(r.net_eur)}</div></td>`
    +`<td><div class="cx sc4" title="${esc(r.durum)}">${esc(r.durum)}</div></td></tr>`).join("");
  return `<div class="scroll"><table class="sat"><thead><tr><th><span class="cw sc1">PROJE</span></th><th><span class="cw sc2">MÜŞTERİ</span></th><th class="num"><span class="cw sc3">NET (€)</span></th><th><span class="cw sc4">DURUM</span></th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
/* Bölge başlığı yanı: ilgili formun güncelleme düğmesine son basılma tarihi (satis_ay_islendi.updated_at) */
function ayBanner(ai){ if(!ai||!ai.updated_at) return ''; return ` <span class="muted" style="font-weight:400">· ${dOnly(ai.updated_at)}</span>`; }
function regionDetail(rg, ai){

/* Ülke normalizasyonu: Almanya · İngiltere · Fransa · Diğer Ülkeler */
function ulkeNorm(u){ u=String(u||"").toLocaleLowerCase('tr');
  if(/alman|german/.test(u)) return 'Almanya';
  if(/ingil|i̇ngil|united kingdom|\buk\b|england|britan/.test(u)) return 'İngiltere';
  if(/fransa|france|\bfr\b/.test(u)) return 'Fransa';
  return 'Diğer Ülkeler'; }
/* Takipteki teklifler istatistiği — Almanya/İngiltere/Diğer + yıllar tek blokta */
function statsBlock(ssData){
  const stats=ssData||[];
  const DD=['Kazandık','Kaybettik','Belirsiz','Müşteri işi alamadı'];
  const ULKE=['Almanya','İngiltere','Fransa','Diğer Ülkeler'];
  const S={}, years=new Set();
  stats.forEach(r=>{ const y=r.yil, u=ulkeNorm(r.ulke), d=r.durum; years.add(y);
    (S[y]=S[y]||{}); (S[y][u]=S[y][u]||{});
    const o=S[y][u][d]=S[y][u][d]||{adet:0,tutar:0,ws:0,wa:0};
    o.adet+=Number(r.adet)||0; o.tutar+=Number(r.tutar)||0;
    if(r.ort_isk!=null){ o.ws+=Number(r.ort_isk)*(Number(r.adet)||0); o.wa+=(Number(r.adet)||0); } });
  const ort=o=>(o&&o.wa)?o.ws/o.wa:null;
  const rd=v=>v==null?'—':Math.round(v)+'%';
  const full=o=>o?`<td class="num">${o.adet}</td><td class="num">${money(o.tutar)}</td><td class="num">${rd(ort(o))}</td>`:'<td class="num">0</td><td class="num">—</td><td class="num">—</td>';
  const cnt=o=>`<td class="num">${o?o.adet:0}</td>`;
  const rowFor=(lbl,g,cl)=>`<tr${cl?' class="grp"':''}><td class="kod">${esc(lbl)}</td>${full(g['Kazandık'])}${full(g['Kaybettik'])}${cnt(g['Belirsiz'])}${cnt(g['Müşteri işi alamadı'])}</tr>`;
  const yrs=[...years].sort((a,b)=>b-a);
  let body='';
  const yearBlock=y=>{
    body+=`<tr class="grp"><td colspan="9">${esc(String(y))}</td></tr>`;
    const gT={}; DD.forEach(d=>{ let ad=0,tu=0,ws=0,wa=0; ULKE.forEach(u=>{ const o=(S[y]&&S[y][u])?S[y][u][d]:null; if(o){ ad+=o.adet; tu+=o.tutar; ws+=o.ws; wa+=o.wa; } }); gT[d]={adet:ad,tutar:tu,ws:ws,wa:wa}; });
    ULKE.forEach(u=> body+=rowFor(u, (S[y]&&S[y][u])||{}, false));
    body+=rowFor('Toplam',gT,true);
  };
  if(yrs.length) yrs.forEach(yearBlock);
  else { body+=`<tr class="grp"><td colspan="9">— (veri bekleniyor)</td></tr>`; ULKE.forEach(u=> body+=rowFor(u,{},false)); body+=rowFor('Toplam',{},true); }
  return '<h3 class="sec">Takipteki teklifler — yıllık sonuç istatistiği</h3>'
    +`<div class="scroll"><table class="tks"><thead>
      <tr><th rowspan="2">Yıl / Ülke</th><th colspan="3">Kazandık</th><th colspan="3">Kaybettik</th><th rowspan="2" class="num">Belirsiz<br>(adet)</th><th rowspan="2" class="num">Müşteri işi<br>alamadı (adet)</th></tr>
      <tr><th class="num">Adet</th><th class="num">Tutar €</th><th class="num">Ort.İsk</th><th class="num">Adet</th><th class="num">Tutar €</th><th class="num">Ort.İsk</th></tr>
      </thead><tbody>${body}</tbody></table></div>`;
}
/* Snapshot'tan eklenen/silinen — en yeni iki çekim farkı */
function takipDiff(snapRows){
  const rows=snapRows||[];
  const cekimler=[...new Set(rows.map(r=>String(r.cekim)))].sort();
  if(cekimler.length<2) return '<div class="hint">Eklenen/silinen için en az iki snapshot gerekir (form her yayınlandığında bir snapshot alınır).</div>';
  const last=cekimler[cekimler.length-1], prev=cekimler[cekimler.length-2];
  const cur=rows.filter(r=>String(r.cekim)===last), pr=rows.filter(r=>String(r.cekim)===prev);
  const {ekl,sil}=sDiff(cur,pr);
  /* eklenen → YEŞİL; silinen (takipten çıktı = karara bağlandı/ilerledi) → SİYAH */
  const chip=(r,pos)=>`<span style="color:${pos?'#0a6b3f':'#1c2430'};white-space:nowrap">${esc(r.proje)}${r.net_ht_eur!=null?` ${pos?'+':'−'}${money(r.net_ht_eur)} €`:''}</span>`;
  let s=`<div class="sybox" style="line-height:1.9">`;
  if(!ekl.length&&!sil.length) s+='<div class="muted">Değişiklik yok.</div>';
  if(ekl.length) s+=`<div><b style="color:#0a6b3f">Eklenen (${ekl.length}):</b> ${ekl.map(r=>chip(r,1)).join(' · ')}</div>`;
  if(sil.length) s+=`<div><b style="color:#1c2430">Silinen (${sil.length}):</b> ${sil.map(r=>chip(r,0)).join(' · ')}</div>`;
  return s+'</div>';
}

/* ---------- HAZIR PEM/PRJ ---------- */

  ]);

  const erpMap={}; (erpRes.data||[]).forEach(r=>{ erpMap[String(r.tur).toUpperCase()+"|"+r.kalem_key]=r.erp||{}; });
  const ozMap={}; (ozRes.data||[]).forEach(r=>{ ozMap[String(r.tur).toUpperCase()+"|"+r.kalem_key]=r.degisim_ozet||""; });
  /* Filtre (her ingest sonrası otomatik geçerli):
     1) Termin tarihi (PEM) / AÜP tarihi (PRJ) BOŞ olan kalemler gösterilmez.
     2) Bu tarih, panonun güncelleme tarihinden (son ERP damgası) geriye doğru 10 gün içindeyse gösterilmez. */
  const _dmg=String((dgRes&&dgRes.data&&dgRes.data[0]&&dgRes.data[0].damga)||"");
  const _ref=/^\d{6}$/.test(_dmg)? new Date(2000+Number(_dmg.slice(0,2)),Number(_dmg.slice(2,4))-1,Number(_dmg.slice(4,6))) : new Date();
  _ref.setHours(23,59,59,999);
  const _cut=new Date(_ref); _cut.setHours(0,0,0,0); _cut.setDate(_cut.getDate()-10);
  const filt=(data||[]).filter(r=>{
    const dt=r.hazir_tarihi; if(!dt) return false;
    const d=new Date(dt); if(isNaN(d)) return false;
    return !(d>=_cut);
  });
  const digits=s=>String(s==null?"":s).replace(/\D/g,"");
  const lastN=(s,n)=>{ const d=digits(s); return d.slice(-n); };
  const ev=(tur,no,k)=>{ const e=erpMap[tur+"|"+no]||{}; return e[k]!=null?String(e[k]):""; };
  const block=tip=>{
    const T=tip==="pem"?"PEM":"PRJ";
    const rowsX=filt.filter(r=>String(r.tur||"").toUpperCase()===T);
    if(!rowsX.length) return "";
    const noteCol=tip==="pem"?"ekbilgi":"notlar", dcol=tip==="pem"?"termin":"aup";
    const noteHd=tip==="pem"?"Ek Bilgi":"Satış/Şantiye Notları", dateHd=tip==="pem"?"Termin Tarihi":"AÜP Tarihi";
    const kodW="h8";  /* PEM+PRJ kod aynı genişlik → son 4 sütun hizalı (6d) */
    const sorted=[...rowsX].sort((a,b)=>(ev(T,a.no,dcol)||"99999999").localeCompare(ev(T,b.no,dcol)||"99999999"));
    const body=sorted.map(r=>{
      const kod=lastN(r.no,tip==="pem"?5:8);
      const proje=ev(T,r.no,"proje")||String(r.proje_adi||"");
      /* PRJ notu ERP Prj.xlsx "SATIŞ/ŞANTİYE NOTLARI" alanından (hazir_pem_prj.satis_notu) gelir. */
      const note=ev(T,r.no,noteCol)||(tip==="pem"?String(r.ek_bilgi||""):String(r.satis_notu||""));
      let adet=ev(T,r.no,"adet")||(r.adet==null?"":String(r.adet));
      if(adet!==""&&isFinite(parseFloat(adet))) adet=String(Math.round(parseFloat(adet)));
      const dt=ev(T,r.no,dcol)||r.hazir_tarihi||"";
      const onur=r.onur_guncel||"", oz=ozMap[T+"|"+r.no]||"";
      return `<tr>`
        +`<td class="c ${kodW}"><span title="${esc(kod)}">${esc(kod)}</span></td>`
        +`<td class="c h15"><span title="${esc(proje)}">${esc(proje)}</span></td>`
        +`<td class="c h25"><span title="${esc(note)}">${esc(note)}</span></td>`
        +`<td class="c h3"><span>${esc(adet)}</span></td>`
        +`<td class="c hdt"><span title="${esc(dt)}">${esc(fdate(dt)||dt)}</span></td>`
        +`<td class="c h20"><span title="${esc(onur)}">${esc(onur)}</span></td>`
        +`<td class="c h20"><span title="${esc(oz)}">${esc(oz)}</span></td>`
        +`</tr>`;
    }).join("");
    /* Blok başlığı (h3 "PEM"/"PRJ") YOK — blok kimliği ilk sütun başlığında: PEM / Proje.
       Adetler damga satırında (PEM Adet / PRJ Adet). */
    const kodHd=tip==="pem"?"PEM":"Proje";
    const heads=`<th>${kodHd}</th><th>Proje Adı</th><th>${noteHd}</th><th>Adet</th><th>${dateHd}</th><th>Sevk Durumu (Onur)</th><th>Sevk Durum Değişimi</th>`;
    return `<div class="scroll hblk"><table><thead><tr>${heads}</tr></thead><tbody>${body}</tbody></table></div>`;
  };
  const st=await erpStamp();
  const a0=(adRes&&adRes.data&&adRes.data[0])||{}, a1=(adRes&&adRes.data&&adRes.data[1])||{};
  const oeAt=(oeRes&&oeRes.data&&oeRes.data[0])?oeRes.data[0].yayin_at:null;
  const hStamp='<div class="stamp">ERP: '+(st||"—")+' · Sevk durumu (OE): '+(oeAt?dOnly(oeAt):"—")
    +' · PEM Adet: '+Math.round(Number(a0.pem_adet)||0)+pctSpan(a0.pem_adet,a1.pem_adet)
    +' · PRJ Adet: '+Math.round(Number(a0.prj_adet)||0)+pctSpan(a0.prj_adet,a1.prj_adet)+'</div>';
  view.innerHTML=`${hStamp}
    <style>.hblk table{font-size:11.5px}.hblk th,.hblk td{white-space:nowrap;padding:2px 6px;border-bottom:1px solid #eef1f5;line-height:16px}.hblk thead th{vertical-align:bottom}.hblk .c>span{display:block;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;white-space:nowrap}.hblk .c>span::-webkit-scrollbar{display:none}.h3>span{width:3ch}.h5>span{width:5ch}.h8>span{width:8ch}.h15>span{width:15ch}.h20>span{width:68ch}.h25>span{width:25ch}.hdt>span{width:12.45ch}</style>
    ${block("pem")}
    ${block("prj")}`;
}

async function loadAup(){

  const [{data,error},oz]=await Promise.all([sb.from("aup_panosu").select("*").order("aup",{ascending:true}), sb.from("aup_ozet").select("*").order("damga",{ascending:false}).limit(2)]);
  if(error){ view.innerHTML=`<div class="load">Hata: ${esc(error.message)}</div>`; return; }
  const dk=d=>{ d=String(d||""); const i=d.indexOf(" "); return i<0?d:(d.slice(0,i)+" "+d.slice(i+1,i+4)); };
  /* Hücre deseni = Hazır PEM/PRJ panosu: her hücre tek satır, sığmayan içerik yatayda kaydırılır
     (scrollbar gizli), tam metin title ile hover'da görünür. Metin KIRPILMAZ — sütun genişliği
     kadarı görünür, gerisi kaydırılarak okunur. */
  let rows="";
  data.forEach(r=>{
    const ga=r.gyt_aup, ky=r.kayma;

      <td class="c kod a6"><span title="${esc(r.proje_no)}">${esc(String(r.proje_no||"").slice(-6))}</span></td>
      <td class="c a30"><span title="${esc(pad)}">${esc(pad)}</span></td>

      <td class="num">${esc(r.adet)}</td>
      <td class="num">${fdate(r.mvt)}</td>
      <td class="num">${fdate(r.aup)}</td>
      <td class="num">${fdate(r.gyt)}</td>
      <td class="num pstd ${ga<0?'red':''}">${ga==null?'':ga}</td>
      <td class="num ${ky>=3?'red':''}">${ky==null?'':ky}</td>
      <td class="num">${money(r.anlasma_fiyati)}</td>
      <td class="c ss${r.satis_santiye_notlari?' snpink':''}"><span title="${esc(sn)}">${esc(sn)}</span></td>
      <td class="c ur"><span title="${esc(un)}">${esc(un)}</span></td>
    </tr>`;
  });
  const st=await erpStamp();
  const o0=(oz.data&&oz.data[0])||{}, o1=(oz.data&&oz.data[1])||{};
  const pct=(a,b)=>{ a=Number(a)||0; b=Number(b)||0; if(!b) return ""; const v=Math.round((a-b)/Math.abs(b)*100); return ' <span style="color:'+(v>=0?'#0a6b3f':'#b23a2e')+'">('+(v>=0?'+':'−')+Math.abs(v)+'%)</span>'; };
  const gk=Number(o0.global_kayma||0).toFixed(1).replace(".",",");
  const stamp='<div class="stamp">Son güncelleme: '+(st||"—")+' · Adet: '+money(o0.toplam_adet)+pct(o0.toplam_adet,o1.toplam_adet)+' · Tutar: '+money(o0.toplam_tutar)+' €'+pct(o0.toplam_tutar,o1.toplam_tutar)+' · Global kayma: '+gk+' gün</div>';
  view.innerHTML=`${stamp}
    <style>
    #view table.aupmain td,#view table.aupmain th{white-space:nowrap;padding:2px 6px;line-height:16px}
    #view table.aupmain td.c>span{display:block;white-space:nowrap;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
    #view table.aupmain td.c>span::-webkit-scrollbar{display:none}
    #view table.aupmain td.ss,#view table.aupmain td.ur{white-space:nowrap;vertical-align:middle}
    /* Sütun genişliği span'ın ch genişliğiyle belirlenir (tablonun içeriğe göre şişmemesi için),
       ama span hücre daha genişse hücrenin TAMAMINI kullanır (min-width:100%) — aksi halde
       son iki sütunda sağda kullanılmayan boşluk kalıyordu. */
    #view table.aupmain td.c>span{min-width:100%}
    #view table.aupmain td.a6>span{width:6ch}
    #view table.aupmain td.a30>span{width:30ch}
    #view table.aupmain td.a10>span{width:10ch}
    #view table.aupmain td.ss>span{width:40ch}
    #view table.aupmain td.ur>span{width:67.5ch}
    /* Tablo ekranın tamamını kullanır; artan genişlik iki not sütununa dağılır
       (sabit ch genişlikleri artık ALT sınır). */
    #view .aupwrap{width:100%}
    #view table.aupmain{width:100%}
    </style>
    <div class="scroll aupwrap"><table class="aup aupmain">
    <thead><tr><th>NO</th><th>PROJE ADI</th><th>DURUM</th><th>Ad</th><th>MVT</th><th>AÜP</th><th>PST</th><th class="pstd">PST-AÜP</th><th>Kayma</th><th>TUTAR €</th><th class="ss">Satış-Şantiye Notu</th><th class="ur">Üretim Notu</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}


/* ---------- BILANÇO (bilanco_ozet view + gider detay) ---------- */
async function loadBilanco(tgt){
  const view=document.getElementById(tgt||"view");
  const [{data,error},g7]=await Promise.all([
    sb.from("bilanco_ozet").select("*"),
    sb.from("gider_710_kalem").select("*").order("sira_no",{ascending:true})
  ]);
  if(error){ view.innerHTML=`<div class="load">Hata: ${esc(error.message)}</div>`; return; }
  const rowsD=(data||[]).slice().sort((a,b)=>b.yil-a.yil);
  /* Üstteki 4 KPI kutusu (Net Satış · Toplam Maliyet · Kâr/Zarar · Kâr Marjı) KALDIRILDI
     (26.08.2026, Melih): aynı bilgi tablonun ilk satırında zaten var. */
  /* 710 MALZEME İKİYE AYRILDI: "710 Ahşap Mlz" = 710 listesinin ilk grubu (1 AHŞAP HAMMADDE
     ALIMLARI) · "710 Diğer Mlz" = k710_tl − Ahşap. Ahşap değeri 2025 ve sonrası için CANLI
     olarak gider_710_kalem'den (grup satırı, sira="1") gelir; 2024 ve öncesi SB tablosundan
     bilanco_yil.k710_ahsap_tl'ye yazılmıştır ve o değer önceliklidir. */
  const g7all=(g7&&!g7.error)?(g7.data||[]):[];
  const ahsapYil={};
  g7all.forEach(r=>{ if(r.grup && String(r.sira||"").trim()==="1"){ const y=parseInt(String(r.donem).slice(0,4),10); if(y) ahsapYil[y]=Number(r.alinan_tutar)||0; } });
  const ahsapOf=r=>(r.k710_ahsap_tl!=null?Number(r.k710_ahsap_tl):(ahsapYil[r.yil]!=null?ahsapYil[r.yil]:null));
  let rows="";
  rowsD.forEach(r=>{
    const k=r.kar_tl, hasK=k!=null;
    const kc=hasK?`<td class="num" style="color:${k>=0?'#0a6b3f':'#b23a2e'};font-weight:600">${k>=0?'+':'−'}${money(Math.abs(k))}</td>`:'<td class="num" style="color:#c2ccd6">—</td>';
    const mc=hasK?`<td class="num" style="color:${k>=0?'#0a6b3f':'#b23a2e'}">${Number(r.marj).toFixed(1).replace(".",",")}%</td>`:'<td class="num" style="color:#c2ccd6">—</td>';
    const g=v=>v==null?'<td class="num" style="color:#c2ccd6">—</td>':`<td class="num">${money(v)}</td>`;
    /* Pay sütunları NET SATIŞ'a orandır (toplam gidere değil — 27.08.2026, Melih). */
    const tg=r.net_tl;
    const p=v=>(v==null||tg==null||Number(tg)===0)?'<td class="num" style="color:#c2ccd6">—</td>':`<td class="num" style="color:#6a7888">%${Math.round(v/tg*100)}</td>`;
    const ah=ahsapOf(r), dg=(ah==null||r.k710_tl==null)?null:(Number(r.k710_tl)-ah);
    rows+=`<tr><td class="kod">${esc(r.yil)}</td><td class="num">${money(r.net_tl)}</td><td class="num">${money(r.net_eur)}</td>${g(ah)}${p(ah)}${g(dg)}${p(dg)}${g(r.k720_tl)}${p(r.k720_tl)}${g(r.k730_tl)}${p(r.k730_tl)}${g(r.toplam_gider_tl)}${kc}${mc}</tr>`;
  });
  /* 710 kalem listesi — TEK liste, dönemler YAN YANA (yeni → eski).
     Sabit sütunlar: Sıra · Cinsi · Birim. Her dönem için: Dönem İçi Alınan (€) · Birim Fiyat (€) · Pay (%).
     Kaynak TL'dir; € = TL / dönemin ORTALAMA EUR/TRY kuru (x-rates.com aylık ortalamalarının
     gün-ağırlıklı ortalaması): 2025 (12 ay) = 44,82 · 2026-6 (Oca–Haz) = 52,05.
     YENİ DÖNEM EKLENDİĞİNDE kurunu da G7KUR'a ekle; kuru olmayan dönem "—" gösterir.
     Birim Fiyat = dönem içi alınan tutar / dönem içi alınan miktar. Pay = dönem toplamına oran. */
  const G7KUR={"2025":44.82,"2026-6":52.05};
  const g7rows=(g7&&!g7.error)?(g7.data||[]):[];
  const donemler=[...new Set(g7rows.map(r=>r.donem))].sort().reverse();
  const eur=(tl,k)=>(!k||tl==null||!isFinite(Number(tl)))?null:Number(tl)/k;
  const e0=v=>v==null?"":Math.round(v).toLocaleString("tr-TR");
  const e2=v=>v==null?"":Number(v).toLocaleString("tr-TR",{minimumFractionDigits:2,maximumFractionDigits:2});
  const g710Box=()=>{
    if(!g7rows.length||!donemler.length) return "";
    /* Satır kimliği = sira_no (dönemler arasında birebir aynı liste). */
    const keys=[...new Set(g7rows.map(r=>r.sira_no))].sort((a,b)=>a-b);
    const byK={}; g7rows.forEach(r=>{ (byK[r.sira_no]=byK[r.sira_no]||{})[r.donem]=r; });
    const tot={}; donemler.forEach(d=>{ tot[d]=g7rows.filter(r=>r.donem===d&&r.grup).reduce((a,r)=>a+(Number(r.alinan_tutar)||0),0); });
    const cells=(r,d)=>{
      const k=G7KUR[d];
      if(!r||!k) return `<td class="num g7s" style="color:#c2ccd6">—</td><td class="num" style="color:#c2ccd6">—</td><td class="num" style="color:#c2ccd6">—</td>`;
      const tl=Number(r.alinan_tutar)||0, mk=Number(r.alinan_miktar)||0;
      /* Grup satırında birim fiyat YOK — grup miktarı farklı birimlerin (m3+adet+kg) toplamıdır. */
      const e=eur(tl,k), bf=(!r.grup&&mk>0&&tl>0)?eur(tl/mk,k):null;
      const py=tot[d]&&tl?(tl/tot[d]*100):null;
      return `<td class="num g7s">${tl?e0(e):""}</td><td class="num">${bf==null?"":e2(bf)}</td>`
        +`<td class="num" style="color:#6a7888">${py==null?"":("%"+py.toLocaleString("tr-TR",{minimumFractionDigits:1,maximumFractionDigits:1}))}</td>`;
    };
    const body=keys.map(k=>{
      const any=donemler.map(d=>byK[k]&&byK[k][d]).find(Boolean)||{};
      return `<tr${any.grup?' class="grp"':''}><td class="kod">${esc(any.sira)}</td><td>${esc(any.cinsi)}</td><td>${esc(any.birim||"")}</td>`
        +donemler.map(d=>cells(byK[k]&&byK[k][d],d)).join("")+`</tr>`;
    }).join("");
    const totRow=`<tr class="itot"><td></td><td>LİSTE TOPLAMI</td><td></td>`
      +donemler.map(d=>`<td class="num g7s">${G7KUR[d]?e0(eur(tot[d],G7KUR[d])):"—"}</td><td class="num"></td><td class="num">${G7KUR[d]?"%100,0":""}</td>`).join("")
      +`</tr>`;
    const h1=`<tr><th rowspan="2">Sıra</th><th rowspan="2">Cinsi</th><th rowspan="2">Birim</th>`
      +donemler.map(d=>`<th colspan="3" class="g7s g7h">${esc(d)}${G7KUR[d]?` <span class="g7k">(kur ${String(G7KUR[d]).replace(".",",")})</span>`:""}</th>`).join("")+`</tr>`;
    const h2=`<tr>`+donemler.map(()=>`<th class="num g7s">Dönem İçi Alınan (€)</th><th class="num">Birim Fiyat (€)</th><th class="num">Pay (%)</th>`).join("")+`</tr>`;
    const adet=g7rows.filter(r=>r.donem===donemler[0]&&!r.grup).length;
    return `<details class="g7box"><summary>710 — Direkt İlk Madde/Malzeme listesi <span class="muted">(${adet} kalem · ${esc(donemler.join(" · "))})</span></summary>
      <div class="scroll"><table class="g7t"><thead>${h1}${h2}</thead><tbody>${body}${totRow}</tbody></table></div></details>`;
  };
  const st=await tblStamp("bilanco_yil");
  view.innerHTML=`${stampHTML(st)}
    <style>.g7box{background:#fff;border:1px solid #dde3ea;border-radius:8px;padding:4px 10px;margin:6px 0;width:max-content;max-width:100%}
    .g7box>summary{cursor:pointer;font-weight:700;color:#16324f;font-size:12px;padding:2px 0}
    .g7box[open]>summary{margin-bottom:4px}
    table.g7t td.g7s,table.g7t th.g7s{border-left:2px solid #cdd8e4}
    table.g7t th.g7h{text-align:center;background:#22456b}
    table.g7t .g7k{font-weight:400;opacity:.8}
    table.g7t thead th{vertical-align:bottom}
    table.g7t thead tr:first-child th{top:0;z-index:3}
    table.g7t thead tr:nth-child(2) th{top:22px;z-index:2}</style>
    <div class="scroll"><table>
    <thead><tr><th>Yıl</th><th class="num">Net Satış (TL)</th><th class="num">Net (€)</th><th class="num">710 Ahşap Mlz</th><th class="num">Ahşap %</th><th class="num">710 Diğer Mlz</th><th class="num">Diğer %</th><th class="num">720 İşçilik</th><th class="num">720 %</th><th class="num">730 GÜG</th><th class="num">730 %</th><th class="num">Toplam Gider</th><th class="num">Kâr/Zarar</th><th class="num">Marj</th></tr></thead>
    <tbody>${rows}</tbody></table></div>
    ${g710Box()}`;
}


/* ---------- YILLIK İCMAL (icmal_ozet view) ---------- */
async function loadIcmal(tgt){
  const view=document.getElementById(tgt||"view");
  const [ic,bl]=await Promise.all([
    sb.from("icmal_satir").select("*").order("sira",{ascending:true}),
    sb.from("fiyat_parametre_log").select("*").eq("anahtar","baz_iskonto").order("gecerli_baslangic",{ascending:true})
  ]);
  const {data,error}=ic;
  if(error){ view.innerHTML=`<div class="load">Hata: ${esc(error.message)}</div>`; return; }
  /* Sütun sırası (27.08.2026, Melih): Miktar (DK1) ve Top.Per birer "lider" sütun — sağlarındaki
     ikişer ayrıntı sütunu (Miktar Ad + m² · İd.Per + Ür.Per) VARSAYILAN GİZLİ, lider başlığa
     tıklanınca açılır/kapanır (Ahşap panosundaki yıl→ay deseninin aynısı). */
  const F=["dk1_ad","adet","m2","net_eur","ort_kur","net_tl","netfi_eur_m2","netfi_eur_ad","top_per","id_per","ur_per","ciro_per_eur","isk","kapasite_ad_ay","onaysiz_ad","onay_ter_hf","urt_ad","son_proje_cikis","so_alinan_eur","so_muht_eur","fa_alinan_eur","fa_muht_eur","top_alinan_eur","alinan_ter_hf","top_muht_eur","fr_isk_pct","dig_isk_pct"];
  const IC_LIDER={dk1_ad:"mik", top_per:"per"};          /* lider sütun → grup kodu */
  const IC_GIZLI={adet:"mik", m2:"mik", id_per:"per", ur_per:"per"};   /* gizli ayrıntı sütunları */
  /* DAR sütunlar: verisi en çok 4-5 hane olanlar. Başlık sarma sınırı bunlarda 4,5ch'e iner
     (uzun sözcük varsa sözcük genişliği taban olur) → başlığın açtığı sol boşluk kalkar.
     Verisi geniş sütunlara uygulanmaz; orada sınırı düşürmek başlığı uzatır, sütunu daraltmaz. */
  const IC_DAR=new Set(["adet","m2","ort_kur","netfi_eur_m2","netfi_eur_ad","id_per","ur_per","top_per","isk","kapasite_ad_ay","onaysiz_ad","onay_ter_hf","urt_ad","alinan_ter_hf","fr_isk_pct","dig_isk_pct"]);
  /* YIL TOPLAM SATIRI PANODA HESAPLANIR (DB'deki değer kullanılmaz).
     Sebep: icmal_satir'ın is_total satırlarını hiçbir betik güncellemiyordu (worker/us_icmal ve
     icmal_satis_yaz yalnız is_total=false satırlara yazar) → yeni ay girilince yıl toplamı
     geride kalıyordu (07.26 eklendiğinde "2026 Top." Ocak–Haziran'da kalmıştı).
     Kural: SUMF = altındaki ayların toplamı · türevler orandan · personel/Ciro-Per dolu ayların
     ORTALAMASI · İsk brüt-ağırlıklı (brüt = net/(1-isk/100)). Ayların hiçbirinde veri yoksa
     sütun DB'deki haliyle bırakılır (2011-13 dk1_ad gibi). Satır düzeni: toplam, sonra o yılın ayları. */
  const SUMF=["adet","dk1_ad","m2","net_eur","net_tl"];
  const AVGF=["id_per","ur_per","top_per","ciro_per_eur"];
  const trNum=s=>{ if(s==null||s==="") return null; const v=parseFloat(String(s).replace(/\./g,"").replace(",",".")); return isFinite(v)?v:null; };
  const rowsA=(data||[]).slice();
  for(let i=0;i<rowsA.length;i++){
    if(!rowsA[i].is_total) continue;
    const T=rowsA[i], acc={}, sum={}, cnt={};
    AVGF.forEach(f=>acc[f]=[]); SUMF.forEach(f=>{ sum[f]=0; cnt[f]=0; });
    let net=0, brut=0;
    for(let j=i+1; j<rowsA.length && !rowsA[j].is_total; j++){
      const m=rowsA[j];
      AVGF.forEach(f=>{ const v=trNum(m[f]); if(v) acc[f].push(v); });
      SUMF.forEach(f=>{ const v=trNum(m[f]); if(v!=null){ sum[f]+=v; cnt[f]++; } });
      const ne=trNum(m.net_eur), ik=trNum(m.isk);
      if(ne!=null && ik!=null && ik!==100){ net+=ne; brut+=ne/(1-ik/100); }
    }
    SUMF.forEach(f=>{ if(cnt[f]) T[f]=money(sum[f]); });
    if(cnt.net_eur && sum.net_tl)  T.ort_kur=money(sum.net_tl/sum.net_eur);
    if(cnt.net_eur && sum.m2)      T.netfi_eur_m2=money(sum.net_eur/sum.m2);
    if(cnt.net_eur && sum.adet)    T.netfi_eur_ad=money(sum.net_eur/sum.adet);
    if(brut) T.isk=money((1-net/brut)*100);
    AVGF.forEach(f=>{ if(acc[f].length) T[f]=money(acc[f].reduce((a,b)=>a+b,0)/acc[f].length); });
  }
  /* "Yurt Dışı" sütunu = Yurt Dışı 1 (fa_*) + Yurt Dışı 2 (fy2_*); FY2 girilmemiş aylarda
     yalnız FY görünür. FY2 doluysa Toplam da (Yurt İçi + YD1 + YD2) olarak yeniden hesaplanır. */
  rowsA.forEach(r=>{
    const yd2a=trNum(r.fy2_alinan_eur), yd2m=trNum(r.fy2_muht_eur);
    if(yd2a){ r.fa_alinan_eur=money((trNum(r.fa_alinan_eur)||0)+yd2a); r.top_alinan_eur=money((trNum(r.so_alinan_eur)||0)+(trNum(r.fa_alinan_eur)||0)); }
    if(yd2m){ r.fa_muht_eur=money((trNum(r.fa_muht_eur)||0)+yd2m); r.top_muht_eur=money((trNum(r.so_muht_eur)||0)+(trNum(r.fa_muht_eur)||0)); }
  });
  /* YD1 İsk. / YD2 İsk. = o aya isabet eden SON baz iskonto (Fiyatlandırma panosu: FR / Diğer).
     Kaynak fiyat_parametre_log — fiyat_parametre üstündeki trigger her değer değişiminde bir satır
     bırakır (kod/fiyat_parametre_log_260826.sql). Log'un başlangıcından ÖNCEKİ aylar icmal_satir'daki
     elle girilmiş değerde kalır (Melih kararı 26.08.2026). */
  const BIL=(bl&&!bl.error)?(bl.data||[]):[];
  const pctNum=s=>{ const m=String(s==null?"":s).match(/-?\d+([.,]\d+)?/); return m?m[0].replace(",","."):null; };
  if(BIL.length) rowsA.forEach(r=>{
    if(r.is_total) return;
    const d=String(r.donem||""); if(!/^\d{2}\.\d{2}$/.test(d)) return;
    const ay=+d.slice(0,2), yil=2000+ +d.slice(3,5);
    const sonGun=new Date(Date.UTC(yil,ay,0)).toISOString().slice(0,10);
    let hit=null; BIL.forEach(x=>{ if(String(x.gecerli_baslangic)<=sonGun) hit=x; });
    if(hit){ r.fr_isk_pct=pctNum(hit.fransa_deger); r.dig_isk_pct=pctNum(hit.diger_deger); }
  });
  let rows="";
  rowsA.forEach(r=>{
    let tds='<td class="kod">'+esc(r.donem)+'</td>';
    F.forEach(f=>{ const g=IC_GIZLI[f]; tds+='<td class="num'+(g?' icg icg-'+g+' ichide':'')+'">'+esc(r[f])+'</td>'; });
    rows+='<tr'+(r.is_total?' class="itot"':'')+'>'+tds+'</tr>';
  });
  const st=await tblStamp("icmal_yil");
  const TH=["D\u00f6nem","Miktar (DK1)","Miktar (Ad)","Miktar (m\u00b2)","Net Tutar (\u20ac)","Ort. Kur","Net Tutar (TL)","Net Fi. (\u20ac/m\u00b2)","Net Fi. (\u20ac/ad)","Top.Per (ki\u015fi)","\u0130d.Per (Ki\u015fi)","\u00dcr.Per (Ki\u015fi)","Ciro/Per (\u20ac/ki\u015fi)","\u0130sk (%)","Kapasite (Ad/Ay)","0..4 Onays\u0131z (Ad)","Onay Ter (hf)","4.1\u20267 \u00dcrt (Ad)","Son Proje \u00c7\u0131k\u0131\u015f","Yurt \u0130\u00e7i al\u0131nan Prj (\u20ac)","Yurt \u0130\u00e7i muht. Prj (\u20ac)","Yurt D\u0131\u015f\u0131 al\u0131nan Prj (\u20ac)","Yurt D\u0131\u015f\u0131 muht. Prj (\u20ac)","Top.al\u0131nan Prj (\u20ac)","Al.Ter. (hf)","Top.muht. Prj (\u20ac)","YD1 \u0130sk. (%)","YD2 \u0130sk. (%)"];
  /* Gizli sütunların başlıkları fitHeads çalışırken display:none olduğu için ölçülemez
     (genişlik 0 → atlanır) → Ahşap panosundaki gibi thsm/thw ELLE verilir; açılınca dar
     ve iki satırlı gelirler. */
  const head=TH.map((h,i)=>{
    if(i===0) return '<th>'+h+'</th>';
    const f=F[i-1], lid=IC_LIDER[f], giz=IC_GIZLI[f];
    const dar=IC_DAR.has(f)?" icn":"";
    if(lid) return '<th class="num iclead'+dar+'" data-g="'+lid+'" title="Ayrıntı sütunlarını aç/kapa">'+h+' <span class="iccar" id="icc-'+lid+'">▸</span></th>';
    if(giz) return '<th class="num icg icg-'+giz+' ichide thsm'+dar+'"><span class="thw">'+h+'</span></th>';
    return '<th class="num'+dar+'">'+h+'</th>';
  }).join("");
  view.innerHTML=`${stampHTML(st)}
    <style>
     .ichide{display:none}
     thead th.iclead{cursor:pointer;background:#22456b}
     thead th.iclead:hover{background:#2d5a8a}
     .iccar{font-size:9px;opacity:.85}
     /* Başlık sarma genişliği global 14ch idi; dar sayılı sütunlarda (Kapasite, Onay Ter,
        Al.Ter., YD1/YD2 İsk. …) başlık sütunu gereksiz genişletip solda boşluk bırakıyordu.
        8ch'e indirildi — verisi geniş sütunlar zaten veriden ölçüldüğü için etkilenmez. */
     table.icm thead th .thw{max-width:8ch}
     /* min-width:min-content ŞART — max-width tek başına uzun sözcüğü (Kapasite, Top.Per)
        kırpıyordu ("Kapasi", "Top.Pe"); artık taban en uzun sözcüğün genişliği. */
     table.icm thead th.icn .thw{max-width:4.5ch;min-width:min-content}
     table.icm th,table.icm td{padding-left:5px;padding-right:5px}
    </style>
    <div class="scroll"><table class="icm">
    <thead><tr>${head}</tr></thead>
    <tbody>${rows}</tbody></table></div>`;
  view.querySelectorAll("th.iclead").forEach(th=>{ th.onclick=()=>{
    const g=th.dataset.g, on=th.dataset.on==="1";
    view.querySelectorAll(".icg-"+g).forEach(c=>c.classList.toggle("ichide",on));
    th.dataset.on=on?"0":"1";
    const c=view.querySelector("#icc-"+g); if(c) c.textContent=on?"▸":"▾";
  }; });
}

/* ---------- KİŞİLER satır düzeni (Referans panosu) — yazma yalnız authenticated int@arbor.com.tr; anon RLS ile kapalı ---------- */
function startKisiEdit(el){
  if(el.querySelector("input")) return;
  const kod=el.dataset.kod, f=el.dataset.f;
  const cur=el.textContent==="—"?"":el.textContent;
  const inp=document.createElement("input"); inp.className="cell"; inp.value=cur;
  el.textContent=""; el.appendChild(inp); inp.focus(); inp.select();
  const commit=async()=>{
    const val=inp.value.trim();
    if((f==="kod"||f==="tam_ad") && !val){ el.textContent=cur||"—"; return; }
    if(val===cur){ el.textContent=cur||"—"; return; }
    const patch={}; patch[f]=(f==="kod"||f==="tam_ad")?val:(val||null); patch.updated_at=new Date().toISOString();
    const {error}=await sb.from("kisiler").update(patch).eq("kod",kod);
    if(error){ el.textContent="hata"; alert(error.message); return; }
    if(f==="kod"){ const tr=el.closest("tr"); if(tr){ tr.dataset.kod=val; tr.querySelectorAll(".kicell").forEach(x=>x.dataset.kod=val); const db=tr.querySelector(".kdel"); if(db) db.dataset.kod=val; } }
    el.textContent=val||"—"; el.classList.add("saveflash"); setTimeout(()=>el.classList.remove("saveflash"),400);
  };
  inp.onblur=commit;
  inp.onkeydown=e=>{ if(e.key==="Enter"){e.preventDefault();inp.blur();} if(e.key==="Escape"){el.textContent=cur||"—";} };
}
async function kisiAdd(){
  const g=id=>document.getElementById(id).value.trim();
  const kod=g("ki-kod"), tam_ad=g("ki-ad");
  if(!kod){ alert("Kod gir."); return; }
  if(!tam_ad){ alert("Ad Soyad gir."); return; }
  const rec={kod,tam_ad,bolum:g("ki-bolum")||null,email:g("ki-email")||null,rol:g("ki-rol")||null,updated_at:new Date().toISOString()};
  const {error}=await sb.from("kisiler").insert(rec);
  if(error){ alert(error.message); return; }
  loadRef();
}
async function kisiDel(kod){
  if(!confirm("Bu kişi silinsin mi? ("+kod+")")) return;
  const {error}=await sb.from("kisiler").delete().eq("kod",kod);
  if(error){ alert(error.message); return; }
  loadRef();
}

  const dnum=t=>{ const re=/(\d{1,2})\.(\d{1,2})\.(\d{4})/g; let m,best=0;

  const [ft,pyF,eaU,onU,obU,daU,sayU,mkaU]=await Promise.all([

  const today=new Date(); today.setHours(0,0,0,0);

  }).join("");
  view.innerHTML=`<style>

    table.frm{width:1px;table-layout:fixed;border-collapse:collapse;font-size:12px;background:#fff}

    table.frm td.num,table.frm th.num{text-align:right}

    table.frm button.fmail:hover{background:#8a6100;color:#fff}

    table.frm button.freset:hover{background:#2e7d54;color:#fff;border-color:#2e7d54}
    table.frm th,table.frm td{border-bottom:1px solid #eef1f5;padding:2px 8px;text-align:left;vertical-align:middle;height:22px;line-height:18px}
    table.frm thead th{background:#16324f;color:#fff;font-weight:600;font-size:11px;white-space:nowrap;padding:4px 8px}

  <div class="scroll"><table class="frm">

  <thead><tr><th>Form</th><th>Kullanıcı</th><th>Güncelleme</th><th class="num">Geciken (Gün)</th><th>Mail</th><th></th></tr></thead>
  <tbody>${body}</tbody></table></div>`;
  view.querySelectorAll(".fmail").forEach(b=>b.onclick=()=>formMail(b.dataset.fk,b));

/* ---------- Ortak: tek pano_ozel bölümünü hedef elemana render et (bölüm-RLS; anon 401) ---------- */
/* ---------- AHŞAP — Timber 72x86: ahsap_alim'den derlenir (ürün bazında CBM-ağırlıklı € ortalama).

const AY_TR=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
/* Pencad birim maliyetleri (bir defalık, 2026-08-20'de Melih'in verdiği liste). Accoya'nın Pencad değeri yok. */
const AHS_PENCAD={"Çam KKK-20cm":615,"Çam KKK-70cm":733,"Çam DKD":1197,"Okaliptus KKK":1368,"Okaliptus DKD":1465,
                  "Meşe DKD":1856,"Lareks DKD":1358,"Meranti DKD":1064,"Sapelli DKD":2051,"İroko DKD":2823,"Accoya DKD":null};
const AHS_SIRA=["Çam KKK-20cm","Çam KKK-70cm","Çam DKD","Okaliptus KKK","Okaliptus DKD","Meşe DKD",
                "Lareks DKD","Meranti DKD","Sapelli DKD","İroko DKD","Accoya DKD"];
async function loadAhsap(tgt){
  const body=document.getElementById(tgt);
  const {data,error}=await sb.from("ahsap_alim").select("*");
  if(error){ body.innerHTML=`<div class="load">Hata: ${esc(error.message)}</div>`; return; }
  const rows=(data||[]).filter(r=>r.tarih&&Number(r.toplam_cbm)>0&&isFinite(Number(r.fiyat_eur)));
  /* CBM ağırlıklı € ortalama */
  const acc={};                                  /* acc[ürün][anahtar] = {s:Σ fiyat×cbm, c:Σ cbm} */
  const add=(ag,k,fe,cbm)=>{ const o=(acc[ag]=acc[ag]||{}); const t=(o[k]=o[k]||{s:0,c:0}); t.s+=fe*cbm; t.c+=cbm; };
  const yset=new Set();
  rows.forEach(r=>{
    const ym=String(r.tarih).slice(0,7), yy=ym.slice(0,4), fe=Number(r.fiyat_eur), cbm=Number(r.toplam_cbm);
    yset.add(yy); add(r.agac,"M"+ym,fe,cbm); add(r.agac,"Y"+yy,fe,cbm);
  });
  const avg=(ag,k)=>{ const t=acc[ag]&&acc[ag][k]; return (t&&t.c>0)?t.s/t.c:null; };
  const int=v=>v==null?'<span style="color:#c2ccd6">—</span>':Math.round(v).toLocaleString("tr-TR");
  const now=new Date(), cy=now.getFullYear(), cm=now.getMonth()+1;
  const yillar=[...yset].sort().reverse();
  /* Yıl başına ay listesi: cari yılda cari aydan geriye, geçmiş yıllarda Aralık→Ocak */
  const aylar=y=>{ const son=(Number(y)===cy)?cm:12; const a=[]; for(let m=son;m>=1;m--) a.push(String(y)+"-"+String(m).padStart(2,"0")); return a; };
  /* Son Alım Ayı = o ürünün veri bulunan EN YENİ ayı; 6 aydan eskiyse gri */
  const sonAy=ag=>{ const ks=Object.keys(acc[ag]||{}).filter(k=>k[0]==="M").map(k=>k.slice(1)).sort(); return ks.length?ks[ks.length-1]:null; };
  const aySayisi=ym=>{ const y=+ym.slice(0,4), m=+ym.slice(5,7); return (cy-y)*12+(cm-m); };
  let rh="";
  AHS_SIRA.forEach(ag=>{
    const pc=AHS_PENCAD[ag], sa=sonAy(ag), sv=sa?avg(ag,"M"+sa):null, eski=sa?aySayisi(sa)>6:false;
    rh+=`<tr><td class="ahnm">${esc(ag)}</td>`
      +`<td class="num">${pc==null?'<span style="color:#c2ccd6">—</span>':int(pc)}</td>`
      +`<td class="num${eski?" ahold":""}"${sa?` title="${esc(AY_TR[+sa.slice(5,7)-1]+" "+sa.slice(0,4))}"`:""}>${int(sv)}</td>`;
    yillar.forEach(y=>{
      rh+=`<td class="num ahy">${int(avg(ag,"Y"+y))}</td>`;
      aylar(y).forEach(ym=>{ rh+=`<td class="num ahm ahm-${y} ahhide">${int(avg(ag,"M"+ym))}</td>`; });
    });
    rh+=`</tr>`;
  });
  let hh=`<th>Ürün</th><th class="num">Pencad (€/m3)</th><th class="num">Son Alım Ayı (€/m3)</th>`;
  yillar.forEach(y=>{
    hh+=`<th class="num ahy ahyh" data-y="${y}" title="Ay sütunlarını aç/kapa">${y} Ort. (€/m3) <span class="ahcar" id="ahc-${y}">▸</span></th>`;
    /* Ay sütunları açılırken fitHeads çalışmış olduğu (ve hücreler o an gizli olduğu) için
       başlıklar sarılmıyordu → yıl sütunu gibi küçült + iki satıra sar (thsm/thw) elle verilir. */
    aylar(y).forEach(ym=>{ hh+=`<th class="num ahm ahm-${y} ahhide thsm"><span class="thw">${esc(AY_TR[+ym.slice(5,7)-1])} Ort. (€/m3)</span></th>`; });
  });
  /* Son güncelleme = Ahşap formundaki AYLIK GÜNCELLEME düğmesine son basılma (pano_yayin) */
  const py=await sb.from("pano_yayin").select("yayin_at").eq("anahtar","ahsap").limit(1);
  const pyAt=(py&&!py.error&&py.data&&py.data[0])?py.data[0].yayin_at:null;
  body.innerHTML=`<style>
    table.ahs{width:auto;border-collapse:collapse;font-size:11.5px}
    table.ahs th,table.ahs td{white-space:nowrap;padding:2px 8px;border-bottom:1px solid #eef1f5;line-height:16px}
    table.ahs thead th{background:#16324f;color:#fff;font-weight:600;font-size:10.5px;vertical-align:bottom}
    /* Ay başlıkları .thw ile sarılıyor; global "thead th.num .thw{text-align:center}" kuralı
       onları ortalayıp sağa dayalı sayılarla hizasız bırakıyordu → sağa yaslanır. */
    table.ahs thead th.num .thw{text-align:right}
    table.ahs th.ahyh{cursor:pointer;background:#22456b}
    table.ahs th.ahyh:hover{background:#2d5a8a}
    table.ahs .ahcar{font-size:9px;opacity:.85}
    table.ahs td.ahnm{font-weight:700;color:#16324f;background:#f4efe6}
    table.ahs td.ahy{background:#f7fafd;font-weight:600}
    table.ahs td.ahold{color:#b0b8c1}
    table.ahs .ahhide{display:none}
  </style>
    <div class="stamp">Son güncelleme: ${pyAt?dOnly(pyAt):"—"} · ${rows.length} sipariş kaydı</div>

    <div class="scroll"><table class="ahs"><thead><tr>${hh}</tr></thead><tbody>${rh}</tbody></table></div>`;
  body.querySelectorAll("th.ahyh").forEach(th=>{ th.onclick=()=>{
    const y=th.dataset.y, on=th.dataset.on==="1";
    body.querySelectorAll(".ahm-"+y).forEach(c=>c.classList.toggle("ahhide",on));
    th.dataset.on=on?"0":"1"; const c=document.getElementById("ahc-"+y); if(c) c.textContent=on?"▸":"▾";
  }; });
}
async function loadPanoBolum(bolum, tgt){
  const body=document.getElementById(tgt);
  const [m,t,r]=await Promise.all([
    sb.from("pano_ozel_meta").select("*").eq("bolum",bolum),
    sb.from("pano_ozel_tablo").select("*").eq("bolum",bolum).order("sira"),
    sb.from("pano_ozel").select("*").eq("bolum",bolum).order("tablo").order("sira")
  ]);
  const err=m.error||t.error||r.error;
  if(err){ body.innerHTML=`<div class="load">Hata: ${esc(err.message)}</div>`; return; }
  const meta=(m.data||[])[0]||{};
  const rowsByT={}; (r.data||[]).forEach(x=>{ (rowsByT[x.tablo]=rowsByT[x.tablo]||[]).push(x); });
  const isGM=bolum==="gmenkul"; /* G.menkul: yalnız sütun görünümü optimize edilir (veri/hesap değişmez) */
  let html="";
  (t.data||[]).forEach(tb=>{
    if(!isGM){
      const hs=(tb.basliklar||[]).map(h=>`<th>${esc(h)}</th>`).join("");
      const rs=(rowsByT[tb.tablo]||[]).map(row=>`<tr>${(row.hucreler||[]).map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("");
      html+=`${tb.baslik?`<h3 class="sec">${esc(tb.baslik)}</h3>`:""}<div class="scroll"><table class="pob"><thead><tr>${hs}</tr></thead><tbody>${rs}</tbody></table></div>`;
      return;
    }
    /* G.menkul sütun analizi: kısa alan = içeriğe göre dar; uzun metin = sabit makul genişlik + hücre-içi yatay kaydırma (içerik kesilmez); sayısal = sağa dayalı. */
    const heads=tb.basliklar||[], rws=rowsByT[tb.tablo]||[], nc=heads.length;
    const colW=[], colNum=[];
    for(let i=0;i<nc;i++){
      const hl=String(heads[i]||"").length; let maxLen=hl, ne=0, num=0; const lens=[];
      rws.forEach(rw=>{ const s=String((rw.hucreler||[])[i]||"").trim(); if(s){ lens.push(s.length); if(s.length>maxLen)maxLen=s.length; ne++; if(/^[\d.,]+$/.test(s)&&/\d/.test(s))num++; } });
      colNum[i]=(ne>0&&num===ne);
      if(maxLen>=26){ /* geniş boşluğa yol açan / uzun metin sütunu → sabit makul genişlik + hücre-içi kaydırma (içerik kesilmez) */
        lens.sort((a,b)=>a-b);
        const p90=lens.length?lens[Math.min(lens.length-1,Math.floor(lens.length*0.9))]:0;
        const chars=Math.max(p90,Math.min(hl,18),6); /* p90: tipik içerik tam görünür, seyrek uzun aykırılar kaydırılır */
        colW[i]=Math.max(44,Math.min(240,chars*7+16));
      } else colW[i]=0;
    }
    const mk=(v,i,tag)=>{ const cls=colNum[i]?' class="pob-num"':''; const w=colW[i];
      const inner=(tag==="td"&&w)?`<div class="pob-sc" style="width:${w}px">${esc(v)}</div>`:esc(v);
      return `<${tag}${cls}>${inner}</${tag}>`; };
    const hs=heads.map((h,i)=>mk(h,i,"th")).join("");
    const rs=rws.map(row=>`<tr>${(row.hucreler||[]).map((c,i)=>mk(c,i,"td")).join("")}</tr>`).join("");
    html+=`${tb.baslik?`<h3 class="sec">${esc(tb.baslik)}</h3>`:""}<div class="scroll"><table class="pob pobgm"><thead><tr>${hs}</tr></thead><tbody>${rs}</tbody></table></div>`;
  });
  const styleGM=`<style>table.pob{width:auto}table.pob th,table.pob td{white-space:nowrap}`
    +`table.pob.pobgm td.pob-num,table.pob.pobgm th.pob-num{text-align:right}`
    +`table.pob.pobgm td{vertical-align:top}`
    +`table.pob.pobgm .pob-sc{overflow-x:auto;overflow-y:hidden;white-space:nowrap;-webkit-overflow-scrolling:touch}`
    +`table.pob.pobgm .pob-sc::-webkit-scrollbar{height:6px}table.pob.pobgm .pob-sc::-webkit-scrollbar-thumb{background:#c4d0dd;border-radius:3px}</style>`;
  const styleDef=`<style>table.pob{width:auto}table.pob th,table.pob td{white-space:nowrap}</style>`;
  body.innerHTML=(isGM?styleGM:styleDef)
    +`<div class="stamp">${esc(meta.son_guncelleme||"")}${meta.kaynak?` · <span style="font-weight:400;color:#7a8896">${esc(meta.kaynak)}</span>`:""}</div>`
    +`${html||'<div class="load">Kayıt yok.</div>'}`;
}
/* ---------- SEL-ARB — özel render: Firma 15ch / Proje 20ch (nowrap+ellipsis, tam metin title/scroll), tarih sütunları üstünde "Arbor SAS Alacak €" spanning başlık, "Δ ilk→son €", son tarih dolu-alacak satırları görünür + boşlar gizli/toggle, footer daima görünür. Bölüm-RLS aynı (pano_ozel_*). ---------- */
const SA_FOOT=new Set(["Selectron'a Gönderilen Toplam (€)","Selectron'a Borç (€)","Güncel Alacak Toplam (€)","Selectron'a Ft Edilen Toplam (€)","Arbor SAS Faaliyet Kaybı Toplam (€)","TOPLAM GÜNCEL ALACAK"]);
const SA_NOTE="Tarih sütunlarındaki tutarlar o tarihteki güncel ALACAK (receivable) tutarlarıdır · Selectron–Arbor SAS mutabakat · form-beslemeli (Yurt Dışı Alacak + OE Faaliyet); aylık güncelleme ile ay başına tek sütun.";
async function loadSelArb(tgt){
  const body=document.getElementById(tgt);
  const [s,o]=await Promise.all([
    sb.from("sel_arb_snapshot").select("*").order("tarih").order("sira"),
    sb.from("sel_arb_ozet").select("*").order("tarih")
  ]);
  if(s.error||o.error){ body.innerHTML=`<div class="load">Hata: ${esc((s.error||o.error).message)}</div>`; return; }
  const snap=s.data||[], oz=o.data||[];
  /* Sütun tarihleri = snapshot ∪ özet (OE Faaliyet yalnız özet satırı yazabilir) */
  const datesAsc=[...new Set([...snap.map(x=>x.tarih),...oz.map(x=>x.tarih)])].sort();
  const dates=[...datesAsc].reverse();   /* Yeni→Eski: en yeni solda, sağa doğru azalır */
  const nd=dates.length;
  const ozBy={}; oz.forEach(x=>ozBy[x.tarih]=x);
  const fmap=new Map();
  snap.forEach(x=>{ const key=x.sira+"|"+(x.firma||"")+"|"+(x.proje||""); if(!fmap.has(key)) fmap.set(key,{sira:x.sira,firma:x.firma||"",proje:x.proje||"—",vals:{}}); fmap.get(key).vals[x.tarih]=x.alacak; });
  const firmalar=[...fmap.values()].sort((a,b)=>((a.sira==null?1e9:a.sira)-(b.sira==null?1e9:b.sira)));
  const dLbl=t=>t.slice(8,10)+"."+t.slice(5,7)+"."+t.slice(2,4);
  const fmt=v=>(v==null||v==="")?"":Math.round(v).toLocaleString("tr-TR");
  /* Δ = SON AY − BİR ÖNCEKİ AY (en yeni iki tarih sütunu). series yeni→eski sıralı: [0]=son ay, [1]=önceki ay. İkisinden biri boşsa fark boş. */
  const delta=arr=>{ const cur=arr[0], prev=arr[1]; if(cur==null||prev==null) return ""; const dl=Math.round(cur-prev); if(dl===0) return ""; return (dl>0?"+":"−")+Math.abs(dl).toLocaleString("tr-TR"); };
  /* Sütun sırası: Proje · Firma · Δ önceki→son ay € · tarih sütunları (yeni→eski) */
  const basliklar=["Proje","Firma",...dates.map(dLbl),"Δ önceki→son ay"];
  const rows=[];
  firmalar.forEach(f=>{ const series=dates.map(d=>f.vals[d]==null?null:f.vals[d]); rows.push([f.proje,f.firma,...series.map(fmt),delta(series)]); });
  const gon=dates.map(d=>ozBy[d]?ozBy[d].gonderilen:null);
  const borc=dates.map(d=>ozBy[d]?ozBy[d].borc:null);
  const topAlac=dates.map(d=>{ let sm=0,any=false; firmalar.forEach(f=>{ if(f.vals[d]!=null){sm+=f.vals[d];any=true;} }); return any?sm:null; });
  const fatE=dates.map(d=>ozBy[d]?ozBy[d].fatura_edilen:null);
  const kayip=dates.map((d,i)=> borc[i]==null?null : borc[i]-((gon[i]||0)+(topAlac[i]||0)+(fatE[i]||0)) );
  const fatDisp=fatE.map(v=>(v==null||Math.round(v)===0)?null:v);
  const foot=(label,series)=>[label,"",...series.map(fmt),delta(series)];
  /* Güncel Alacak Toplam, "Selectron'a Gönderilen"in ÜSTÜNE alındı (2026-08-24) */
  rows.push(foot("Güncel Alacak Toplam (€)",topAlac));
  rows.push(foot("Selectron'a Gönderilen Toplam (€)",gon));
  rows.push(foot("Selectron'a Borç (€)",borc));
  rows.push(foot("Selectron'a Ft Edilen Toplam (€)",fatDisp));
  rows.push(foot("Arbor SAS Faaliyet Kaybı Toplam (€)",kayip));
  const stamp=nd?dLbl(dates[0]):"";
  const lastIdx=2;   /* en yeni tarih artık en soldaki tarih sütunu */
  const filled=c=>{ const raw=String(c==null?"":c).replace(/[^\d-]/g,""); return raw!==""&&Number(raw)!==0; };
  const dateHdrs=basliklar.slice(2,2+nd).map(h=>`<th class="sa-num">${esc(h)}</th>`).join("");
  let dlt=basliklar[basliklar.length-1]; if(dlt.indexOf("€")<0) dlt=dlt+" €";
  let hiddenCount=0;
  const trs=rows.map(h=>{
    const isFoot=SA_FOOT.has(h[0]), show=isFoot||filled(h[lastIdx]);
    if(!show) hiddenCount++;
    const mid=[]; for(let i=0;i<nd;i++) mid.push(`<td class="sa-num">${esc(h[2+i]||"")}</td>`);
    return `<tr class="${isFoot?'sa-foot':''}${show?'':' sa-hide'}"${show?'':' style="display:none"'}>`
      +`<td class="sa-proje"><span class="c" title="${esc(h[0]||"")}">${esc(h[0]||"")}</span></td>`
      +`<td class="sa-firma"><span class="c" title="${esc(h[1]||"")}">${esc(h[1]||"")}</span></td>`
      +`<td class="sa-num sa-delta">${esc(h[2+nd]||"")}</td>`
      +mid.join("")+`</tr>`;
  }).join("");
  const style=`<style>
  .sa-wrap table{border-collapse:collapse;width:auto;font-size:11.5px}
  .sa-wrap th,.sa-wrap td{border-bottom:1px solid #eef1f5;padding:2px 6px;white-space:nowrap;line-height:16px}
  .sa-wrap thead th{background:#16324f;color:#fff;font-weight:600}
  .sa-proje>.c{width:23.33ch}.sa-firma>.c{max-width:20ch}
  .sa-firma>.c,.sa-proje>.c{display:block;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;white-space:nowrap}
  .sa-firma>.c::-webkit-scrollbar,.sa-proje>.c::-webkit-scrollbar{display:none}
  .sa-proje>.c{font-weight:600;color:#16324f}
  .sa-num{text-align:right}
  tr.sa-foot td{font-weight:700;background:#eef3f8}
  /* 2 satırlı başlık: global thead th{position:sticky;top:0} iki satırı üst üste bindiriyordu
     (kayma görüntüsü). 1. satır top:0, 2. satır 1. satırın yüksekliği kadar aşağı. */
  .sa-wrap thead tr:first-child th{top:0;z-index:3}
  .sa-wrap thead tr:nth-child(2) th{top:20px;z-index:2}
  .sa-wrap td.sa-delta{border-right:2px solid #cdd8e4}
  .sa-wrap th.sa-dh{border-right:2px solid #cdd8e4}
  </style>`;
  const btn=hiddenCount?`<button class="btn" id="sa-toggle" data-on="0">Boş-alacak satırları göster (${hiddenCount})</button>`:"";
  const pyS=await sb.from("pano_yayin").select("yayin_at").eq("anahtar","sel_arb").limit(1);
  const pyAtS=(pyS&&!pyS.error&&pyS.data&&pyS.data[0])?pyS.data[0].yayin_at:null;
  body.innerHTML=`${style}<div class="stamp">Son güncelleme: ${pyAtS?dOnly(pyAtS):esc(stamp)}</div>${btn?`<div class="hint">${btn}</div>`:""}<div class="sa-wrap scroll"><table><thead>`
    +`<tr><th rowspan="2">${esc(basliklar[0]||"Proje")}</th><th rowspan="2">${esc(basliklar[1]||"Firma")}</th><th rowspan="2" class="sa-num sa-dh">${esc(dlt)}</th><th colspan="${nd}" class="sa-num" style="text-align:center">Alacak €</th></tr>`
    +`<tr>${dateHdrs}</tr></thead><tbody>${trs}</tbody></table></div>`;
  const tg=document.getElementById("sa-toggle");
  if(tg) tg.onclick=()=>{ const on=tg.dataset.on==="1"; document.querySelectorAll("#"+tgt+" tr.sa-hide").forEach(x=>x.style.display=on?"none":""); tg.dataset.on=on?"0":"1"; tg.textContent=on?`Boş-alacak satırları göster (${hiddenCount})`:`Boş-alacak satırları gizle (${hiddenCount})`; };
}
/* ---------- ÖB Rapor — bağımsız üst-nav sekmesi (Takipteki İşler / ob_isler; ÖB formu yazar, owner salt-okur) ---------- */
/* Geçmiş hafta not sütunları açık mı (Son ÖB Notları başlığına tıklanınca) */
let obWeeksOpen=false;
async function loadObrapor(tgt){
  const view=document.getElementById(tgt||"view");
  const isl=await sb.from("ob_isler").select("*").order("arsiv").order("id");
  if(isl.error){ view.innerHTML=`<div class="load">Hata: ${esc(isl.error.message)}</div>`; return; }
  const iRows=isl.data||[];
  /* Takipteki İşler ÖNCELİK sıralaması: 1<2<3<"-"/boş<Rutin. Bilinmeyen/boş/null → "-" grubu
     (Rutin'den önce, 3'ten sonra). Stabil: aynı öncelikte mevcut (arsiv,id) ikincil sırası korunur. */
  const _oncRank=v=>{ const s=String(v==null?"":v).trim();
    if(s==="1") return 0; if(s==="2") return 1; if(s==="3") return 2;
    if(s==="Rutin") return 4; return 3; };
  iRows.sort((a,b)=>{ const aa=(a.arsiv?1:0)-(b.arsiv?1:0); if(aa) return aa;
    return _oncRank(a.oncelik)-_oncRank(b.oncelik); });
  /* Haftalık geçmiş (ob_isler_log) — her HAFTALIK GÜNCELLEME'de o haftanın notu yazılır */
  const lg=await sb.from("ob_isler_log").select("is_id,hafta,ob_notlari").order("hafta",{ascending:false});
  const lRows=(lg&&!lg.error)?(lg.data||[]):[];
  const isoWk=d=>{ const t=new Date(d+"T00:00:00Z"); const g=new Date(Date.UTC(t.getUTCFullYear(),t.getUTCMonth(),t.getUTCDate()));
    g.setUTCDate(g.getUTCDate()+4-(g.getUTCDay()||7)); const y0=new Date(Date.UTC(g.getUTCFullYear(),0,1));
    return Math.ceil(((g-y0)/86400000+1)/7); };
  const isoYr=d=>{ const t=new Date(d+"T00:00:00Z"); const g=new Date(Date.UTC(t.getUTCFullYear(),t.getUTCMonth(),t.getUTCDate()));
    g.setUTCDate(g.getUTCDate()+4-(g.getUTCDay()||7)); return g.getUTCFullYear(); };
  const wkKey=d=> isoYr(d)+"-"+String(isoWk(d)).padStart(2,"0");
  /* Geçmiş haftalar HAM TARİH yerine ISO HAFTA bazlı gruplanır: aynı ISO haftaya düşen birden çok
     log tarihi tek "N. Hafta" sütununda birleşir. İş bazında en yeni not alınır (lRows tarih-DESC);
     yeni not BOŞsa aynı haftanın daha eski DOLU notu korunur (boş, doluyu ezmez). */
  const weekMap={};                                     /* wkKey -> {maxDate, notes:{is_id:not}} */
  lRows.forEach(r=>{ const k=wkKey(r.hafta); const w=weekMap[k]||(weekMap[k]={maxDate:r.hafta,notes:{}});
    if(r.hafta>w.maxDate) w.maxDate=r.hafta; const id=String(r.is_id);
    if(!(id in w.notes)) w.notes[id]=r.ob_notlari;
    else if(String(r.ob_notlari||"").trim()!=="" && String(w.notes[id]||"").trim()==="") w.notes[id]=r.ob_notlari; });
  /* En yeni ISO hafta = "Son ÖB Notları" sütunu; gizli sütunlar ondan öncekiler (yeni→eski) */
  const haftaKeys=Object.keys(weekMap).sort().reverse().slice(1);
  const dgun=d=>d.slice(8,10)+"."+d.slice(5,7)+"."+d.slice(2,4);
  /* Son güncelleme = ÖB formundaki HAFTALIK GÜNCELLEME düğmesine son basılma (pano_yayin) */
  const py=await sb.from("pano_yayin").select("yayin_at").eq("anahtar","ob_rapor").limit(1);
  const pyAt=(py&&!py.error&&py.data&&py.data[0])?py.data[0].yayin_at:null;
  const cx=(v,cls)=>`<td class="${cls||""}"><div class="cx">${esc(v==null?"":v)}</div></td>`;
  const kar=obWeeksOpen?"▾":"▸";
  let cg=`<col class="k35"><col class="k20"><col class="k20"><col class="k100">`
    + (obWeeksOpen?haftaKeys.map(()=>`<col class="k40">`).join(""):"")
    + `<col class="k60"><col class="k60">`;
  let hd=`<th>Konu</th><th>Durum</th><th>Öncelik</th><th class="obwh" id="ob-wk" title="Geçmiş hafta notlarını aç/kapa">Son ÖB Notları <span class="ahcar">${kar}</span></th>`
    + (obWeeksOpen?haftaKeys.map(k=>`<th class="thsm" title="${dgun(weekMap[k].maxDate)}"><span class="thw">${isoWk(weekMap[k].maxDate)}. Hafta ÖB Notu</span></th>`).join(""):"")
    + `<th>Son Değişim Özeti</th><th>Aylık Değişim Özeti</th>`;
  let ib=`<h3 class="sec">Takipteki İşler <span class="muted">(${iRows.length})</span></h3>`
    +`<div class="scroll"><table class="obt">`
    +`<colgroup>${cg}</colgroup>`
    +`<thead><tr>${hd}</tr></thead><tbody>`;
  iRows.forEach(r=>{
    ib+=`<tr>${cx(r.konu,"sb")}${cx(r.durum)}${cx(r.oncelik)}${cx(r.ob_notlari)}`
      + (obWeeksOpen?haftaKeys.map(k=>cx((weekMap[k].notes||{})[String(r.id)])).join(""):"")
      + `${cx(r.degisim_ozet)}${cx(r.aylik_ozet)}</tr>`;
  });
  if(!iRows.length) ib+=`<tr><td colspan="6" class="muted">Henüz iş yok — ÖB formundaki "Yeni İş Ekle" ile eklenir.</td></tr>`;
  ib+=`</tbody></table></div>`;
  /* AYLIK FAALİYET — Takipteki İşler'in hemen altı (27.08.2026): ÖB'nin kapanan aya ilişkin
     yorumu (ob_aylik_faaliyet.ob_yorum, ÖB formundan girilir) + o ayda Selectron'a yapılan
     ödemeler (sel_odeme). Dönem = cari aydan bir önceki ay. */
  const AY_AD=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
  const _d=new Date(), _y=(_d.getMonth()===0)?_d.getFullYear()-1:_d.getFullYear(), _m=(_d.getMonth()===0)?12:_d.getMonth();
  const afDon=_y+"-"+String(_m).padStart(2,"0"), afAd=AY_AD[_m-1]+" "+_y;
  const afSon=new Date(Date.UTC(_y,_m,0)).toISOString().slice(0,10);
  const [afq,odq]=await Promise.all([
    sb.from("ob_aylik_faaliyet").select("*").eq("donem",afDon).limit(1),
    sb.from("sel_odeme").select("*").gte("odeme_tarihi",afDon+"-01").lte("odeme_tarihi",afSon).order("odeme_tarihi")
  ]);
  const afR=(afq&&!afq.error&&afq.data&&afq.data[0])?afq.data[0]:null;
  const odR=(odq&&!odq.error)?(odq.data||[]):[];
  const nf=v=>{ const n=Number(v); return isFinite(n)?n.toLocaleString("tr-TR",{minimumFractionDigits:2,maximumFractionDigits:2}):esc(v); };
  const topl={}; odR.forEach(r=>{ const pb=r.para_birimi||"EUR"; topl[pb]=(topl[pb]||0)+(Number(r.tutar)||0); });
  let odTbl;
  if(odR.length){
    odTbl=`<div class="scroll"><table class="obod"><thead><tr><th>Yurt Dışı Birim</th><th>Ödeme Tarihi</th><th>Gönderen Banka</th><th class="num">Tutar</th><th>Para Birimi</th></tr></thead><tbody>`
      + odR.map(r=>`<tr><td>${esc(r.yd_birim)}</td><td>${esc(dgun(String(r.odeme_tarihi)))}</td><td>${esc(r.gonderen_banka)}</td><td class="num">${nf(r.tutar)}</td><td>${esc(r.para_birimi)}</td></tr>`).join("")
      + `<tr class="itot"><td colspan="3">TOPLAM</td><td class="num">${Object.keys(topl).map(k=>nf(topl[k])+" "+k).join(" · ")}</td><td></td></tr>`
      + `</tbody></table></div>`;
  } else odTbl=`<div class="muted" style="font-size:12px;margin:2px">${esc(afAd)} ayında kayıtlı ödeme yok.</div>`;
  ib+=`<h3 class="sec">Aylık Faaliyet <span class="muted">(${esc(afAd)})</span></h3>
    <div class="obaf">
      <div class="obafh">Aylık Faaliyete İlişkin Özgül Bedestenci Yorumu</div>
      <div class="obafy">${afR&&afR.ob_yorum?esc(afR.ob_yorum):'<span class="muted">— (ÖB formundaki Aylık Faaliyet bloğundan girilir)</span>'}</div>
      <div class="obafh" style="margin-top:9px">Yurt Dışı Birimlerden Selectron'a Yapılan Ödemeler</div>
      ${odTbl}
    </div>`;
  /* Panonun altında serbest metin kutusu → ÖB'ye anında mail (pano-mesaj-mail, alıcı form_takip'ten) */
  ib+=`<div class="obmail">
    <div class="obmh">ÖB'ye Mail Gönder</div>
    <textarea id="ob-mail-tx" placeholder="Özgül Bedestenci'ye iletilecek mesaj…"></textarea>
    <div class="obmr"><button class="btn" id="ob-mail-btn">Mail Gönder</button><span class="msg" id="ob-mail-msg"></span></div>
  </div>`;
  view.innerHTML=`<style>
    table.obt{width:1px;table-layout:fixed;border-collapse:collapse;font-size:12px;background:#fff}
    table.obt col.k20{width:20ch}table.obt col.k35{width:35ch}table.obt col.k40{width:40ch}table.obt col.k60{width:48ch}table.obt col.k100{width:59.5ch}
    table.obt th.obwh{cursor:pointer;background:#22456b}
    table.obt th.obwh:hover{background:#2d5a8a}
    table.obt .ahcar{font-size:9px;opacity:.85}
    table.obt th,table.obt td{border-bottom:1px solid #eef1f5;padding:2px 8px;text-align:left;vertical-align:middle;height:20px;line-height:16px}
    table.obt thead th{background:#16324f;color:#fff;font-weight:600;font-size:11px;white-space:nowrap;padding:4px 8px}
    table.obt .cx{overflow-x:auto;white-space:nowrap;scrollbar-width:none;-ms-overflow-style:none}
    table.obt .cx::-webkit-scrollbar{display:none}
    table.obt td.sb .cx{font-weight:700;color:#16324f}
    .obaf{background:#fff;border:1px solid #dde3ea;border-radius:10px;padding:9px 12px;max-width:900px}
    .obaf .obafh{font-size:12px;font-weight:700;color:#16324f;margin-bottom:3px}
    .obaf .obafy{font-size:12.5px;line-height:1.45;white-space:pre-wrap}
    table.obod{border-collapse:collapse;font-size:12px;width:auto}
    table.obod th,table.obod td{border-bottom:1px solid #eef1f5;padding:2px 8px;text-align:left;white-space:nowrap}
    table.obod thead th{background:#16324f;color:#fff;font-weight:600;font-size:10.5px}
    table.obod tr.itot td{background:#f4f7fb;font-weight:700}
    .obmail{margin-top:12px;background:#fff;border:1px solid #dde3ea;border-radius:10px;padding:10px 12px;max-width:900px}
    .obmail .obmh{font-size:12.5px;font-weight:700;color:#16324f;margin-bottom:6px}
    .obmail textarea{width:100%;min-height:88px;font:inherit;font-size:12.5px;line-height:1.45;padding:7px 9px;border:1px solid #cdd6df;border-radius:8px;background:#fffdf8;resize:vertical}
    .obmail .obmr{display:flex;gap:10px;align-items:center;margin-top:7px}
    .obmail button{background:#8a6100;color:#fff;border:0;border-radius:8px;padding:7px 15px;font-weight:700;cursor:pointer;font-size:12.5px}
    .obmail button:disabled{opacity:.55;cursor:default}
    .obmail .msg{font-size:12px}.obmail .msg.ok{color:#0a6b3f;font-weight:600}.obmail .msg.err{color:#b40000;font-weight:600}
  </style>
  <div class="stamp">Son güncelleme: ${pyAt?dOnly(pyAt):"—"}</div>${ib}`;
  const wh=document.getElementById("ob-wk");
  if(wh) wh.onclick=()=>{ obWeeksOpen=!obWeeksOpen; loadObrapor(tgt); };
  const mb=document.getElementById("ob-mail-btn");
  if(mb) mb.onclick=async()=>{
    const tx=document.getElementById("ob-mail-tx"), mg=document.getElementById("ob-mail-msg");
    const metin=(tx.value||"").trim();
    if(!metin){ mg.className="msg err"; mg.textContent="Önce mesajı yazın."; return; }
    if(!confirm("Bu mesaj Özgül Bedestenci'ye mail olarak gönderilecek (cc: int@arbor.com.tr). Devam?")) return;
    mb.disabled=true; mg.className="msg"; mg.textContent="Gönderiliyor…";
    try{
      const {data,error}=await sb.functions.invoke("pano-mesaj-mail",{body:{form_key:"ob_rapor",metin}});
      if(error||!(data&&data.ok)){ mg.className="msg err"; mg.textContent="Hata: "+((error&&error.message)||(data&&data.error)||"bilinmiyor"); }
      else { mg.className="msg ok"; mg.textContent="Gönderildi → "+data.to; tx.value=""; }
    }catch(e){ mg.className="msg err"; mg.textContent="Hata: "+e; }
    mb.disabled=false;
  };
}

/* ---------- DA Rapor — ÖB panosuna paralel (Takipteki İşler / da_isler + Aylık Faaliyet / da_aylik_faaliyet; DA formu yazar, owner salt-okur) ---------- */
let daWeeksOpen=false;
async function loadDaRapor(tgt){
  const view=document.getElementById(tgt||"view");
  const isl=await sb.from("da_isler").select("*").order("arsiv").order("id");
  if(isl.error){ view.innerHTML=`<div class="load">Hata: ${esc(isl.error.message)}</div>`; return; }
  const iRows=isl.data||[];
  const lg=await sb.from("da_isler_log").select("is_id,hafta,da_notlari").order("hafta",{ascending:false});
  const lRows=(lg&&!lg.error)?(lg.data||[]):[];
  const isoWk=d=>{ const t=new Date(d+"T00:00:00Z"); const g=new Date(Date.UTC(t.getUTCFullYear(),t.getUTCMonth(),t.getUTCDate()));
    g.setUTCDate(g.getUTCDate()+4-(g.getUTCDay()||7)); const y0=new Date(Date.UTC(g.getUTCFullYear(),0,1));
    return Math.ceil(((g-y0)/86400000+1)/7); };
  const isoYr=d=>{ const t=new Date(d+"T00:00:00Z"); const g=new Date(Date.UTC(t.getUTCFullYear(),t.getUTCMonth(),t.getUTCDate()));
    g.setUTCDate(g.getUTCDate()+4-(g.getUTCDay()||7)); return g.getUTCFullYear(); };
  const wkKey=d=> isoYr(d)+"-"+String(isoWk(d)).padStart(2,"0");
  const weekMap={};

  const pyAt=(py&&!py.error&&py.data&&py.data[0])?py.data[0].yayin_at:null;

  const kar=daWeeksOpen?"▾":"▸";
