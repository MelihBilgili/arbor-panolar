    let gt="";
    if(r){ const d=sonTarih(r.gunc_sikligi||""), s=sonGuncelleme(r);
      gt=` title="Son tarih: ${d?fdate(d.toISOString()):"—"} · Son güncelleme: ${s?fdate(s.toISOString()):"—"}"`; }
    const gc=g==null?'<span class="muted">—</span>':(g>0?`<b style="color:#b40000"${gt}>${g}</b>`:`<span style="color:#7a8896"${gt}>0</span>`);
    const mail=r?`<button class="fmail" data-fk="${esc(r.form_key)}" title="${esc(r.ilgili_ad)} · ${esc(r.ilgili_email)} (cc: int@arbor.com.tr)">${(r.mail_sayac||0)+1}. mail</button>`
                 +` <button class="freset" data-fk="${esc(r.form_key)}" title="Güncellendi olarak işaretle (geciken + mail sayacı sıfırlanır)">✓</button>`
               :'<span class="muted">—</span>';
    return `<tr>`
      +`<td class="sb"><div class="cx"><a class="fad" href="${esc(f.url)}" target="_blank" title="Formu aç">${esc(f.ad)}</a>${(()=>{ const e=engBy[FK[f.url]], b=BTN_AT[f.url];
          if(!e||(b&&new Date(b)>=new Date(e.at))) return "";
          const d=new Date(e.at), tt="Güncelleme DURDURULDU: "+d.toLocaleString("tr-TR")+"\n\n"+e.mesaj;
          return ` <b style="color:#b40000" title="${esc(tt)}">⚠ durduruldu ${fdate(e.at)}</b>`; })()}</div></td>`
      +`<td title="${esc(f.tam||f.who)}${f._fe?" — düzenlemek için tıklayınız":""}"${f._fe?` class="feed" data-yol="${esc(f.url)}"`:""}><div class="cx">${esc(f.who)}</div></td>`  /* FORM-KISALTMA: yalnız kişi kısaltması, tam ad hover */
      +`<td><div class="cx">${esc(sik)}</div></td>`
      +`<td class="num"><div class="cx">${BTN_AT[f.url]?fdate(BTN_AT[f.url]):'<span class="muted">—</span>'}</div></td>`
      +`<td class="num"><div class="cx">${gc}</div></td>`
      +`<td class="fmailc">${mail}</td></tr>`;  /* FORM-AD-LINK: Formu aç sütunu kalktı, form adına basınca açılır */
  }).join("");

/* FORM-ERISIM-ED (23.09.2026, Melih): Formlar > Kullanıcı hücresi düzenlenebilir → form_erisim.kisiler / herkes
   (form-giris yetkisinin tek kaynağı). Giriş: kişi kodları (boşluk, virgül veya · ile) ya da "Herkes".
   Kodlar Personel sekmesinde olmalı. Listeye eklenen yeni kişi formun varsayılan rolüyle girer (rol_map'te yoksa). */
async function formErisimEdit(td){
  if(td.querySelector("input")) return;
  const yol=td.dataset.yol, cx=td.querySelector(".cx"), cur=cx.textContent.trim();
  const inp=document.createElement("input"); inp.className="cell"; inp.value=cur; inp.style.width="100%";
  cx.textContent=""; cx.appendChild(inp); inp.focus(); inp.select();
  let bitti=false;
  const geri=()=>{ cx.textContent=cur; };
  const kaydet=async()=>{
    if(bitti) return; bitti=true;
    const val=inp.value.trim();
    if(val===cur){ geri(); return; }
    let rec;
    if(/^herkes$/i.test(val)) rec={herkes:true,kisiler:[]};
    else {
      const kodlar=[...new Set(val.split(/[\s,;·]+/).map(x=>x.trim().toLocaleUpperCase("tr-TR")).filter(Boolean))];
      if(!kodlar.length){ alert("En az bir kişi kodu ya da Herkes yazınız."); geri(); return; }
      const {data,error}=await sb.from("kisiler").select("kod").in("kod",kodlar);
      if(error){ alert(error.message); geri(); return; }
      const vr=new Set((data||[]).map(r=>r.kod)), yok=kodlar.filter(k=>!vr.has(k));
      if(yok.length){ alert("Personel sekmesinde olmayan kod: "+yok.join(", ")); geri(); return; }
      rec={herkes:false,kisiler:kodlar};
    }
    rec.updated_at=new Date().toISOString();
    const {error}=await sb.from("form_erisim").update(rec).eq("yol",yol);
    if(error){ alert(error.message); geri(); return; }
    loadFormlar();
  };
  inp.onblur=kaydet;
  inp.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); inp.blur(); } if(e.key==="Escape"){ bitti=true; geri(); } };
}

async function loadPanoBolum(bolum, tgt){
  const body=document.getElementById(tgt);
  const [m,t,r]=await Promise.all([
    sb.from("pano_ozel_meta").select("*").eq("bolum",bolum),
    sb.from("pano_ozel_tablo").select("*").eq("bolum",bolum).order("sira"),
    sb.from("pano_ozel").select("*").eq("bolum",bolum).order("tablo").order("sira")
  ]);
  const err=m.error||t.error||r.error;
  if(err){ body.innerHTML=`<div class="load">Hata: ${esc(err.message)}</div>`; return; }
  const meta=(m.data||[])[0]||{};
  const rowsByT={}; (r.data||[]).forEach(x=>{ (rowsByT[x.tablo]=rowsByT[x.tablo]||[]).push(x); });
  const isGM=bolum==="gmenkul"; /* G.menkul: yalnız sütun görünümü optimize edilir (veri/hesap değişmez) */
  let html="";
  (t.data||[]).forEach(tb=>{
    if(!isGM){

      const rs=(rowsByT[tb.tablo]||[]).map(row=>`<tr>${(row.hucreler||[]).map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("");
      html+=`${tb.baslik?`<h3 class="sec">${esc(tb.baslik)}</h3>`:""}<div class="scroll"><table class="pob"><thead><tr>${hs}</tr></thead><tbody>${rs}</tbody></table></div>`;
      return;
    }
    /* G.menkul sütun analizi: kısa alan = içeriğe göre dar; uzun metin = sabit makul genişlik + hücre-içi yatay kaydırma (içerik kesilmez); sayısal = sağa dayalı. */
    const heads=tb.basliklar||[], rws=rowsByT[tb.tablo]||[], nc=heads.length;
    const colW=[], colNum=[];
    for(let i=0;i<nc;i++){
      const hl=String(heads[i]||"").length; let maxLen=hl, ne=0, num=0; const lens=[];
      rws.forEach(rw=>{ const s=String((rw.hucreler||[])[i]||"").trim(); if(s){ lens.push(s.length); if(s.length>maxLen)maxLen=s.length; ne++; if(/^[\d.,]+$/.test(s)&&/\d/.test(s))num++; } });
      colNum[i]=(ne>0&&num===ne);
      if(maxLen>=26){ /* geniş boşluğa yol açan / uzun metin sütunu → sabit makul genişlik + hücre-içi kaydırma (içerik kesilmez) */
        lens.sort((a,b)=>a-b);
        const p90=lens.length?lens[Math.min(lens.length-1,Math.floor(lens.length*0.9))]:0;
        const chars=Math.max(p90,Math.min(hl,18),6); /* p90: tipik içerik tam görünür, seyrek uzun aykırılar kaydırılır */
        colW[i]=Math.max(44,Math.min(240,chars*7+16));
      } else colW[i]=0;
    }
    const mk=(v,i,tag)=>{ const cls=colNum[i]?' class="pob-num"':''; const w=colW[i];
      const inner=(tag==="td"&&w)?`<div class="pob-sc" style="width:${w}px">${esc(v)}</div>`:esc(v);
      return `<${tag}${cls}>${inner}</${tag}>`; };
    const hs=heads.map((h,i)=>mk(h,i,"th")).join("");
    const rs=rws.map(row=>`<tr>${(row.hucreler||[]).map((c,i)=>mk(c,i,"td")).join("")}</tr>`).join("");
    html+=`${tb.baslik?`<h3 class="sec">${esc(tb.baslik)}</h3>`:""}<div class="scroll"><table class="pob pobgm"><thead><tr>${hs}</tr></thead><tbody>${rs}</tbody></table></div>`;
  });
  const styleGM=`<style>table.pob{width:auto}table.pob th,table.pob td{white-space:nowrap}`
    +`table.pob.pobgm td.pob-num,table.pob.pobgm th.pob-num{text-align:right}`
    +`table.pob.pobgm td{vertical-align:top}`
    +`table.pob.pobgm .pob-sc{overflow-x:auto;overflow-y:hidden;white-space:nowrap;-webkit-overflow-scrolling:touch}`
    +`table.pob.pobgm .pob-sc::-webkit-scrollbar{height:6px}table.pob.pobgm .pob-sc::-webkit-scrollbar-thumb{background:#c4d0dd;border-radius:3px}</style>`;
  const styleDef=`<style>table.pob{width:auto}table.pob th,table.pob td{white-space:nowrap}</style>`;
  body.innerHTML=(isGM?styleGM:styleDef)
    +`<div class="stamp">${esc(meta.son_guncelleme||"")}${meta.kaynak?` · <span style="font-weight:400;color:#7a8896">${esc(meta.kaynak)}</span>`:""}</div>`

  const _num=v=>{ let t=String(v||"").replace(/[^0-9,.\-]/g,""); if(!t) return null; if(t.indexOf(",")>-1&&t.indexOf(".")>-1) t=t.replace(/\./g,"").replace(",","."); else t=t.replace(",","."); const n=parseFloat(t); return isNaN(n)?null:n; };
  const mbn=document.getElementById("ob-mbnot");
  if(mbn) mbn.onchange=async()=>{ const {error}=await sb.from("ob_prim_ay").upsert({donem:window._obPrimDon,mb_notu:mbn.value===""?null:Number(mbn.value),updated_at:new Date().toISOString()},{onConflict:"donem"});
    if(error) _pm("Hata: "+error.message,false); else loadObrapor(tgt); };
  [["ob-dph","dpgf_hedef"],["ob-sth","situation_hedef"],["ob-taban","taban_prim"]].forEach(([id,k])=>{ const el=document.getElementById(id); if(!el) return;
    el.onchange=async()=>{ const {error}=await sb.from("ob_prim_param").upsert({anahtar:k,deger:_num(el.value),updated_at:new Date().toISOString()},{onConflict:"anahtar"});
      if(error) _pm("Hata: "+error.message,false); else loadObrapor(tgt); }; });
}

/* DA-KALDIRILDI (21.09.2026, Melih): DA Faaliyet panosu ve formu (app/da-rapor/) kaldırıldı; veri tabloları (da_isler, da_aylik_faaliyet) silinmedi. */

/* ---------- FİYATLANDIRMA — kaynak veri + editör (fiyat_* tabloları, anon dar). GÜNCELLE = yayınla + bildir. ---------- */

  const [pp,ah,ms,ya,tt]=await Promise.all([

  const ec=(t,id,f,v,type)=>`<span class="fedit" data-t="${t}" data-id="${id}" data-f="${f}"${type?` data-type="${type}"`:""} title="Düzenlemek için tıkla">${esc(v==null||v===""?"—":v)}</span>`;

  /* B) Termin — MVT hafta tablosu (form bunu birebir okur; boş numune hücresi = gri/uygulanmaz) */
  let tRows=T.map(r=>`<tr data-id="${r.id}">`

  const tTbl=`<h3 class="sec">Termin — MVT (hafta)</h3><div class="scroll"><table class="ftbl"><thead><tr>`

  let aRows=A.map(r=>`<tr data-id="${r.id}">`
    +`<td class="fc">${ec("fiyat_ahsap",r.id,"ad",r.ad)}</td>`
    +`<td class="fc">${ec("fiyat_ahsap",r.id,"durum",r.durum)}</td>`
    +`<td class="fc"><div class="acx">${ec("fiyat_ahsap",r.id,"aciklama",r.aciklama)}</div></td>`

  const aTbl=`<h3 class="sec">Ahşap Türü ve Durumu</h3><div class="scroll"><table class="ftbl"><thead><tr><th>Tür</th><th>Durum</th><th>Açıklama</th><th></th></tr></thead><tbody>${aRows}`

  /* C/D) Müşteri sınıfları — altı liste, birebir aynı format, şirketler alfabetik.
     sinif kodu: 1=Fransa 1. · 2=Fransa 2. · 3=İngiltere 1. · 4=İngiltere 2. · 5=Almanya 1. · 6=Almanya 2. */
  const SINIFLAR=[[1,"1. Sınıf Fransa Şirketleri"],[2,"2. Sınıf Fransa Şirketleri"],
                  [3,"1. Sınıf İngiltere Şirketleri"],[4,"2. Sınıf İngiltere Şirketleri"],
                  [5,"1. Sınıf Almanya Şirketleri"],[6,"2. Sınıf Almanya Şirketleri"]];
  const msBlock=(sinif,title)=>{
    const rows=M.filter(r=>r.sinif===sinif).slice().sort((a,b)=>String(a.ad||"").localeCompare(String(b.ad||""),"tr"));
    let body=rows.map(r=>`<tr data-id="${r.id}"><td class="fc"><div class="mcx">${ec("fiyat_musteri_sinif",r.id,"ad",r.ad)}</div></td><td><button class="fdel" data-t="fiyat_musteri_sinif" data-id="${r.id}" title="Sil">✕</button></td></tr>`).join("");
    return `<h3 class="sec">${esc(title)}</h3><div class="scroll"><table class="ftbl"><thead><tr><th>Şirket</th><th></th></tr></thead><tbody>${body}`
      +`<tr class="faddrow"><td><input id="fm${sinif}-ad" placeholder="Şirket adı"></td><td><button class="btn" id="fm${sinif}-add" data-sinif="${sinif}">Ekle</button></td></tr>`
      +`</tbody></table></div>`;
  };
  const style=`<style>
   .ftbl{border-collapse:collapse;width:auto;font-size:11.5px}
   .ftbl th,.ftbl td{border-bottom:1px solid #eef1f5;padding:2px 7px;text-align:left;vertical-align:middle;white-space:nowrap;line-height:16px}
   .ftbl .acx{display:block;width:87ch;white-space:nowrap;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
   .ftbl .mcx{display:block;width:26ch;white-space:nowrap;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
   .ftbl .acx::-webkit-scrollbar,.ftbl .mcx::-webkit-scrollbar{display:none}
   .fpubx{color:#a3aeba}
   .ftbl thead th{background:#16324f;color:#fff;font-weight:600;white-space:nowrap}
   .ftbl .fedit{cursor:pointer;display:inline-block;min-width:24px;border-bottom:1px dashed #cdd6df}
   .ftbl .fedit:hover{background:#fff3d6}
   .ftbl input{font:inherit;padding:3px 6px;border:1px solid #cdd6df;border-radius:5px;width:100%;min-width:70px}
   .ftbl .faddrow td{background:#f6f9fc}
   .ftbl .fdel{border:1px solid #e3b3b3;background:#fff;color:#b40000;border-radius:5px;cursor:pointer;padding:1px 7px}
   .ftbl .fdel:hover{background:#b40000;color:#fff}
   .fbar{display:flex;align-items:center;gap:12px;margin:2px 0 12px}
   #fiyat-guncelle{background:#2e7d54;color:#fff;border:0;border-radius:8px;padding:8px 18px;font-weight:700;cursor:pointer;font-size:13px}
   #fiyat-guncelle:hover{background:#24623f}
   .fpub{font-size:11px;color:#7a8896}
  </style>`;
  view.innerHTML=`${style}
    <div class="fbar"><button id="fiyat-guncelle">GÜNCELLE</button><span class="fpub">${yr.yayin_at?("Son yayın: "+dOnly(yr.yayin_at)+" <span class=\"fpubx\">(bu düğmeye son basılıp fiyatlandırma formuna aktarıldığı tarih)</span>"):"Henüz yayınlanmadı"}${yr.bildirim_beklemede?" · <b style=color:#b47800>bildirim beklemede</b>":""}</span></div>
    ${pTbl}${tTbl}${aTbl}${SINIFLAR.map(s=>msBlock(s[0],s[1])).join("")}`;
  // olaylar
  view.querySelectorAll(".fedit").forEach(el=>el.onclick=()=>startFiyEdit(el));
  view.querySelectorAll(".fdel").forEach(b=>b.onclick=()=>fiyDel(b.dataset.t,b.dataset.id));
  document.getElementById("fa-add").onclick=async()=>{
    const ad=document.getElementById("fa-ad").value.trim(); if(!ad){alert("Tür gir.");return;}
    const rec={ad,durum:document.getElementById("fa-durum").value.trim()||null,aciklama:document.getElementById("fa-ac").value.trim()||null,sira:(A.length?Math.max(...A.map(x=>x.sira||0))+1:1)};
    const {error}=await sb.from("fiyat_ahsap").insert(rec); if(error){alert(error.message);return;} loadFiyat();
  };
  document.getElementById("ft-add").onclick=async()=>{
    const ar=document.getElementById("ft-aralik").value.trim(); if(!ar){alert("Aralık gir (ör. 1–4 adet).");return;}
    const g=id=>{ const v=document.getElementById(id).value.trim(); return v||null; };
    const rec={aralik:ar,ic_68:g("ft-ic"),numune:g("ft-nu"),std_disi:g("ft-sd"),sira:(T.length?Math.max(...T.map(x=>x.sira||0))+1:1)};
    const {error}=await sb.from("fiyat_termin").insert(rec); if(error){alert(error.message);return;} loadFiyat();
  };
  SINIFLAR.map(s=>s[0]).forEach(sn=>{ document.getElementById("fm"+sn+"-add").onclick=async()=>{
    const ad=document.getElementById("fm"+sn+"-ad").value.trim(); if(!ad){alert("Şirket adı gir.");return;}
    const rec={ad,sinif:sn,sira:(M.length?Math.max(...M.map(x=>x.sira||0))+1:1)};

function startFiyEdit(el){
  if(el.querySelector("input")) return;
  const t=el.dataset.t, id=el.dataset.id, f=el.dataset.f;
  const cur=el.textContent==="—"?"":el.textContent;
  const inp=document.createElement("input"); inp.value=cur; el.textContent=""; el.appendChild(inp); inp.focus(); inp.select();
  const commit=async()=>{
    const val=inp.value.trim();
    const {error}=await sb.from(t).update({[f]:val||null}).eq("id",id);
    if(error){ el.textContent="hata"; alert(error.message); return; }
    el.textContent=val||"—"; el.classList.add("saveflash"); setTimeout(()=>el.classList.remove("saveflash"),400);
  };
  inp.onblur=commit;
  inp.onkeydown=e=>{ if(e.key==="Enter"){e.preventDefault();inp.blur();} if(e.key==="Escape"){el.textContent=cur||"—";} };
}
async function fiyDel(t,id){
  if(!confirm("Bu satır silinsin mi?")) return;
  const {error}=await sb.from(t).delete().eq("id",id);
  if(error){ alert(error.message); return; } loadFiyat();
}
/* FIYAT-DEGISIM-METNI (2026-09-10): GÜNCELLE artık ÖNCEKİ yayının anlık görüntüsüyle
   kıyaslar; bildirim metni değişen maddelerin ESKİ → YENİ değerlerini madde madde yazar.
   snapshot yeni biçim {parametre,termin,ahsap,sinif}; ESKİ biçim (düz parametre dizisi)
   okunurken desteklenir (ilk kıyasta yalnız parametreler kıyaslanır). */
const FIY_SINIF_AD={1:"1. Sınıf Fransa",2:"2. Sınıf Fransa",3:"1. Sınıf İngiltere",4:"2. Sınıf İngiltere",5:"1. Sınıf Almanya",6:"2. Sınıf Almanya"};
const FIY_KAPANIS="Bu değişiklikler sizde görünmüyorsa, lütfen tarama verilerini silerek formu yenileyiniz.";
const fiyV=v=>(v==null||String(v).trim()==="")?"—":String(v).trim();
function fiySnapNorm(s){
  if(Array.isArray(s)) return {parametre:s,termin:null,ahsap:null,sinif:null};
  if(s&&typeof s==="object") return {parametre:s.parametre||null,termin:s.termin||null,ahsap:s.ahsap||null,sinif:s.sinif||null};
  return {parametre:null,termin:null,ahsap:null,sinif:null};
}
function fiyDiffListe(onc,yeni,cfg){
  if(!Array.isArray(onc)) return [];   // önceki yayında bu liste yok → kıyas yapılmaz
  const out=[], E=new Map(onc.map(r=>[String(r.id),r])), Y=new Map((yeni||[]).map(r=>[String(r.id),r]));
  Y.forEach((r,id)=>{
    const e=E.get(id);
    if(!e){ out.push(`${cfg.on}${fiyV(cfg.ad(r))} — YENİ${cfg.alan.length?" ("+cfg.alan.map(a=>a[1]+": "+fiyV(r[a[0]])).join(" · ")+")":""}`); return; }
    const d=[];
    if(fiyV(cfg.ad(e))!==fiyV(cfg.ad(r))) d.push(`Tanım değişti (önceki: ${fiyV(cfg.ad(e))})`);
    cfg.alan.forEach(a=>{ if(fiyV(e[a[0]])!==fiyV(r[a[0]])) d.push(`${a[1]}: ${fiyV(e[a[0]])} → ${fiyV(r[a[0]])}`); });
    if(d.length) out.push(`${cfg.on}${fiyV(cfg.ad(r))} — ${d.join(" · ")}`);
  });
  E.forEach((e,id)=>{ if(!Y.has(id)) out.push(`${cfg.on}${fiyV(cfg.ad(e))} — ÇIKARILDI`); });
  return out;
}
function fiyBildirimMetni(onceki,simdi){
  const o=fiySnapNorm(onceki);
  const d=[]
    .concat(fiyDiffListe(o.parametre,simdi.parametre,{on:"",ad:r=>r.baslik,alan:[["fransa_deger","Fransa"],["diger_deger","Diğer"]]}))
    .concat(fiyDiffListe(o.termin,simdi.termin,{on:"Termin (MVT) · ",ad:r=>r.aralik,alan:[["ic_68","68p/78t/78a içeren"],["numune","Numune"],["std_disi","Std. dışı cam"]]}))
    .concat(fiyDiffListe(o.ahsap,simdi.ahsap,{on:"Ahşap · ",ad:r=>r.ad,alan:[["durum","Durum"],["aciklama","Açıklama"]]}))
    .concat(fiyDiffListe(o.sinif,simdi.sinif,{on:"Müşteri sınıfı · ",ad:r=>`${FIY_SINIF_AD[r.sinif]||("Sınıf "+r.sinif)} · ${r.ad}`,alan:[]}));
  const kiyas=Array.isArray(o.parametre)||Array.isArray(o.termin)||Array.isArray(o.ahsap)||Array.isArray(o.sinif);
  if(!kiyas) return {metin:"Fiyatlandırma kurallarında değişiklik yapılmıştır.\n\n"+FIY_KAPANIS,adet:-1};
  if(!d.length) return {metin:"Fiyatlandırma kuralları yeniden yayınlanmıştır; önceki yayına göre değişen madde yoktur.\n\n"+FIY_KAPANIS,adet:0};
  return {metin:"Fiyatlandırma kurallarında aşağıdaki değişiklikler yapılmıştır:\n\n"+d.map(x=>"• "+x).join("\n")+"\n\n"+FIY_KAPANIS,adet:d.length};
}
async function fiyGuncelle(){
  const btn=document.getElementById("fiyat-guncelle"); btn.disabled=true; btn.textContent="Hazırlanıyor…";
  const [pp,tt,aa,mm,yy]=await Promise.all([
    sb.from("fiyat_parametre").select("*").order("sira"),
    sb.from("fiyat_termin").select("*").order("sira").order("id"),
    sb.from("fiyat_ahsap").select("*").order("sira").order("id"),
    sb.from("fiyat_musteri_sinif").select("*").order("sira").order("id"),
    sb.from("fiyat_yayin").select("snapshot").eq("id",1).limit(1)
  ]);
  btn.disabled=false; btn.textContent="GÜNCELLE";
  const hata=pp.error||yy.error;
  if(hata){ alert("Hata: "+hata.message); return; }
  const simdi={parametre:pp.data||[],
               termin:(tt&&!tt.error)?(tt.data||[]):[],
               ahsap:(aa&&!aa.error)?(aa.data||[]):[],
               sinif:(mm&&!mm.error)?(mm.data||[]):[]};
  const onceki=((yy.data&&yy.data[0])||{}).snapshot;
  const {metin}=fiyBildirimMetni(onceki,simdi);
  if(!confirm("Fiyatlandırma değerleri yayınlanacak ve aşağıdaki bilgi maili beklemeye alınacak (int@arbor.com.tr Outlook üzerinden gönderilir):\n\n"+metin+"\n\nOnaylıyor musunuz?")) return;
  btn.disabled=true; btn.textContent="Yayınlanıyor…";
  // Yayınla + bildirim beklemeye al (asıl gönderim Outlook üzerinden yapılır — Resend dış gönderim yapmıyor)
  const {error}=await sb.from("fiyat_yayin").update({ yayin_at:new Date().toISOString(), snapshot:simdi, bildirim_beklemede:true, bildirim_metni:metin }).eq("id",1);
  btn.disabled=false; btn.textContent="GÜNCELLE";
  if(error){ alert("Hata: "+error.message); return; }
  alert("Yayınlandı. Değişiklik bildirimi BEKLEMEYE ALINDI — int@arbor.com.tr Outlook hesabından ilgili kişilere gönderilecek.");
  loadFiyat();
}
/* ---------- MALİ — grup: Bilanço, İcmal + hassas panolar (depenses/kredi/ahsap/sel_arb). Bölüm-RLS. ---------- */
async function loadMali(){
  const view=document.getElementById("view");
  const isAdmin = state.allowed===null;
  const ek = [["bilanco","Bilanço"],["icmal","İcmal"],["fiyat","Fiyatlandırma"]].filter(x=> isAdmin || state.allowed.includes(x[0]));
  const obOk = isAdmin || state.allowed.includes("ob_rapor");
  const panoAllowed = isAdmin ? MALI_BOLUM.slice() : MALI_BOLUM.filter(b=>state.allowed.includes(b));
  const all = ek.map(x=>x[0]).concat(panoAllowed).concat(obOk?["ob_rapor"]:[]);
  if(!all.length){ view.innerHTML=`<div class="load">Bu hesapta mali bölüm yetkisi yok.</div>`; return; }
  if(!state.maliBolum || !all.includes(state.maliBolum)) state.maliBolum=all[0];
  const b=state.maliBolum;
  let metaMap={};
  if(panoAllowed.length){ const m=await sb.from("pano_ozel_meta").select("*").in("bolum",panoAllowed); (m.data||[]).forEach(x=>metaMap[x.bolum]=x); }
  const label=x=> x==="bilanco"?"Bilanço" : x==="icmal"?"İcmal" : x==="fiyat"?"Fiyatlandırma" : x==="ahsap"?"Ahşap" : x==="mali_maasprim"?"Maaş-Prim" : x==="mali_mkprim"?"MK Faaliyet" : x==="ob_rapor"?"ÖB Faaliyet" : ((metaMap[x]&&metaMap[x].etiket)||x);
  const bar=all.map(x=>`<button class="malitab${x===b?' active':''}" data-b="${esc(x)}">${esc(label(x))}</button>`).join("");
  view.innerHTML=`<div class="malibar">${bar}</div><div id="mali-body"><div class="load">Yükleniyor…</div></div>`;
  view.querySelectorAll(".malitab").forEach(btn=>btn.onclick=()=>{ state.maliBolum=btn.dataset.b; loadMali(); });
  if(b==="ob_rapor"){ loadObrapor("mali-body"); return; }
  if(b==="bilanco"){ loadBilanco("mali-body"); return; }
  if(b==="icmal"){ loadIcmal("mali-body"); return; }
  /* MK Faaliyet = MK prim blokları + Tıkanmış Şantiyeler (eski ayrı Şantiye sekmesi buraya taşındı) */
  if(b==="mali_mkprim"){ document.getElementById("mali-body").innerHTML=`<div id="mkp-a"></div><div id="mkp-b"></div>`; loadMkPrim("mkp-a"); loadSantiye("mkp-b"); return; }
  /* MAASPRIM-PERSONEL (23.09.2026): Maaş-Prim panosu kaldırıldı; bilgileri Personel (eski Referans) sekmesinde */
  if(b==="ahsap"){ loadAhsap("mali-body"); return; }
  if(b==="fiyat"){ loadFiyat("mali-body"); return; } /* Fiyatlandırma: kaynak veri + editör (fiyat_* tablolar, anon) */
  /* SEL-ARB = mutabakat matrisi + Dépenses (eski ayrı Dépenses sekmesi buraya taşındı) */
  if(b==="sel_arb"){ document.getElementById("mali-body").innerHTML=`<div id="sa-a"></div><h2 class="secH">Dépenses <span class="muted" id="dep-stamp" style="font-weight:400"></span></h2><div id="sa-b"></div>`; loadSelArb("sa-a"); loadDepenses("sa-b"); return; }
  loadPanoBolum(b, "mali-body");
}

/* ---------- DÉPENSES — kaynak: ÖB Rapor formu (depenses_kalem: yıl×ay×tedarikçi×tutar).
   İki tablo da buradan HESAPLANIR. Tablo boşsa eski pano_ozel baseline'ı okunur. ---------- */
const DEP_AY=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
async function loadDepenses(tgt){
  const body=document.getElementById(tgt||"view");
  const [k,y]=await Promise.all([
    sb.from("depenses_kalem").select("yil,ay,tedarikci,tutar"),
    sb.from("depenses_yayin").select("yayin_at").limit(1)
  ]);
  const ted={}, aylar={};
  const kr=(k&&!k.error)?(k.data||[]):[];
  if(kr.length){
    kr.forEach(r=>{ const t=String(r.tedarikci||"").trim()||"—", v=Number(r.tutar)||0;
      ted[t]=(ted[t]||0)+v; const kk=r.yil+"|"+r.ay; aylar[kk]=(aylar[kk]||0)+v; });
  }else{
    /* ÖB formu doldurulana kadar eski baseline */
    const [tb,pr]=await Promise.all([
      sb.from("pano_ozel_tablo").select("tablo,baslik").eq("bolum","depenses"),
      sb.from("pano_ozel").select("tablo,sira,hucreler").eq("bolum","depenses").order("tablo").order("sira")
    ]);
    const num=s=>{ const x=String(s==null?"":s).replace(/[^\d.,-]/g,"").replace(/\./g,"").replace(",","."); const v=parseFloat(x); return isNaN(v)?0:v; };
    const bl=((tb.data||[]).find(x=>x.tablo==="t2")||{}).baslik||"";
    const ym=String(bl).match(/(20\d{2})/); const yil=ym?Number(ym[1]):new Date().getFullYear();
    (pr.data||[]).forEach(x=>{ const c=x.hucreler||[]; const ad=String(c[0]||"").trim();
      if(!ad||/^toplam$/i.test(ad)) return;
      if(x.tablo==="t1"){ ted[ad]=(ted[ad]||0)+num(c[1]); return; }
      if(x.tablo==="t2"){ const i=DEP_AY.indexOf(ad); const v=num(c[1]); if(i<0||!v) return; aylar[yil+"|"+(i+1)]=v; }
    });
  }
  const tedList=Object.keys(ted).map(t=>({t,v:ted[t]})).sort((a,b)=>b.v-a.v);
  const tTop=tedList.reduce((a,x)=>a+x.v,0);
  const t1=tedList.map(x=>`<tr><td>${esc(x.t)}</td><td class="num">${money(x.v)}</td><td class="num">${tTop?Math.round(x.v/tTop*100):0}%</td></tr>`).join("")
    +`<tr class="itot"><td>TOPLAM</td><td class="num">${money(tTop)}</td><td class="num">100%</td></tr>`;
  const ayList=Object.keys(aylar).map(kk=>{ const p=kk.split("|"); return {yil:Number(p[0]),ay:Number(p[1]),v:aylar[kk]}; })
    .sort((a,b)=> (b.yil-a.yil) || (b.ay-a.ay));
  const aTop=ayList.reduce((a,x)=>a+x.v,0);
  const t2=ayList.map(x=>`<tr><td>${esc(DEP_AY[x.ay-1]||"")} ${x.yil}</td><td class="num">${money(x.v)}</td></tr>`).join("")
    +`<tr class="itot"><td>TOPLAM</td><td class="num">${money(aTop)}</td></tr>`;
  const ya=(y&&!y.error&&y.data&&y.data[0])?y.data[0].yayin_at:null;
  body.innerHTML=`<style>table.dep{width:auto}table.dep th,table.dep td{white-space:nowrap}
      .depd{margin:0 0 14px}.depd>summary{cursor:pointer;color:#16324f;font-size:13px;font-weight:700;margin:14px 2px 6px;list-style:revert}
      .depd .scroll{margin-top:6px}</style>
    <details class="depd"><summary>Tedarikçi Bazında Gider (yüksekten düşüğe) · ${tedList.length}</summary>
      <div class="scroll"><table class="dep"><thead><tr><th>Tedarikçi</th><th class="num">Toplam (€)</th><th class="num">Pay</th></tr></thead><tbody>${t1}</tbody></table></div>
    </details>
    <h3 class="sec">Aylık Toplam Gider</h3>
    <div class="scroll"><table class="dep"><thead><tr><th>Ay</th><th class="num">Tutar (€)</th></tr></thead><tbody>${t2}</tbody></table></div>`;
  const ds=document.getElementById("dep-stamp"); if(ds) ds.textContent="· Son güncelleme: "+(ya?dOnly(ya):"—");
}

/* ---------- MK PRİM — owner salt-okur: MK faaliyet formundan 4 blok + otomatik prim (mk_faaliyet). Tek kaynak: oranlar burada + formda birebir. ---------- */
const MKP_BLOCKS=[["memnuniyet","Müşteri Memnuniyeti","Oran% × %0,75 × (Kontrat HT ÷ 12)"],["ts","TS Ekstra İşler","%0,2 × TS Tutarı"],["fr","FR (Fransa) Satış","%0,05 × Kontrat HT"],["diger","Diğer Satış","%0,10 × Kontrat HT"]];
function mkPrim(tur,r){ const K=Number(r.kontrat_tutari)||0; if(tur==="memnuniyet") return (Number(r.memnuniyet_orani)||0)/100*0.0075*(K/12); if(tur==="ts") return 0.002*(Number(r.ts_tutari)||0); if(tur==="fr") return 0.0005*K; return 0.001*K; }
const mkEur=n=>(Number(n)||0).toLocaleString("tr-TR",{maximumFractionDigits:2})+" €";
/* Dört blok da AYNI 6 sütunlu iskelete oturur (colgroup + table-layout:fixed) →
   Proje, Kontrat HT/TS Tutarı ve Prim sütunları tablolar arasında yatayda tam hizalı.
   1 Firma(35) 2 Proje(35) 3 Kriter/TS Notları(35) 4 Oran%/Kontrat Tarihi(12) 5 Kontrat HT/TS Tutarı(12) 6 Prim(12) */
const MKP_COLS=`<colgroup><col class="w35"><col class="w35"><col class="w35"><col class="w12"><col class="w12"><col class="w12"></colgroup>`;
async function loadMkPrim(tgt){
  const body=document.getElementById(tgt||"view");
  const [f,ai]=await Promise.all([
    sb.from("mk_faaliyet").select("*").eq("aktif",true).order("id",{ascending:false}),
    sb.from("mk_ay_islendi").select("created_at").order("created_at",{ascending:false}).limit(1)
  ]);
  if(f.error){ body.innerHTML=`<div class="load">Hata: ${esc(f.error.message)}</div>`; return; }
  const rows=f.data||[]; const byT={memnuniyet:[],ts:[],fr:[],diger:[]}; rows.forEach(r=>{ (byT[r.tur]=byT[r.tur]||[]).push(r); });
  const gunc=(ai&&!ai.error&&ai.data&&ai.data[0])?dOnly(ai.data[0].created_at):"—";
  const cT=(v,cls)=>`<td class="${cls||""}"><div class="cx">${esc(v==null?"":v)}</div></td>`;
  const cN=(v,cls)=>`<td class="num ${cls||""}"><div class="cx num">${v==null?"":v}</div></td>`;
  let grand=0, html="";
  MKP_BLOCKS.forEach(bl=>{
    const tur=bl[0], rs=byT[tur]||[], bt=rs.reduce((a,r)=>a+mkPrim(tur,r),0); grand+=bt;
    const isMem=tur==="memnuniyet", isTs=tur==="ts";
    const h3= isMem?"Kriter":(isTs?"TS Notları":"");
    const h4= isMem?"Oran %":(isTs?"":"Kontrat Tarihi");
    const h5= isTs?"TS Tutarı (€)":"Kontrat HT (€)";
    const tr=rs.map(r=>`<tr>`
      +cT(r.firma||"")
      +cT(r.proje||"")
      +cT(isMem?(r.memnuniyet_kriterleri||""):(isTs?(r.ts_notlari||""):""))
      +cN(isMem?(r.memnuniyet_orani==null?"":esc(r.memnuniyet_orani)):(isTs?"":fdate(r.kontrat_tarihi)))
      +cN(money(isTs?r.ts_tutari:r.kontrat_tutari))
      +cN(mkEur(mkPrim(tur,r)),"prim")
      +`</tr>`).join("");
    html+=`<h3 class="sec">${esc(bl[1])} <span class="muted">— ${esc(bl[2])} · ${rs.length} satır · ${mkEur(bt)}</span></h3>`
      +`<div class="scroll"><table class="mkp">${MKP_COLS}<thead><tr>`
      +`<th>Firma</th><th>Proje</th><th>${esc(h3)}</th><th class="num">${esc(h4)}</th><th class="num">${esc(h5)}</th><th class="num">Prim (€)</th>`
      +`</tr></thead><tbody>${tr||`<tr><td colspan="6" style="color:#8a97a4;padding:10px">Kayıt yok.</td></tr>`}</tbody></table></div>`;
  });
  body.innerHTML=`<style>
    table.mkp{width:1px;table-layout:fixed;border-collapse:collapse;font-size:12px;background:#fff}
    table.mkp col.w35{width:35ch}table.mkp col.w12{width:12ch}
    table.mkp th,table.mkp td{border-bottom:1px solid #eef1f5;padding:2px 6px;text-align:left;vertical-align:middle;line-height:16px}
    table.mkp thead th{background:#16324f;color:#fff;font-weight:600;font-size:10.5px;white-space:nowrap;padding:3px 6px}
    table.mkp th.num{text-align:right}
    table.mkp .cx{overflow-x:auto;white-space:nowrap;scrollbar-width:none;-ms-overflow-style:none}
    table.mkp .cx::-webkit-scrollbar{display:none}
    table.mkp .cx.num{text-align:right}
    table.mkp td.prim .cx{font-weight:700;color:#0a5745}
    table.mkptop{margin:2px 0 8px}
    table.mkptop td{border:0;background:transparent;padding:2px 8px;font-size:11.5px;color:#0a6b3f;font-weight:700}
  </style>
  <table class="mkp mkptop">${MKP_COLS}<tbody><tr>
    <td colspan="5">Son güncelleme: ${gunc} · Toplam prim (4 kriter)</td>
    <td class="num"><div class="cx num">${mkEur(grand)}</div></td>
  </tr></tbody></table>${html}`;
}

/* ---------- ŞANTİYE — owner salt-okur: tarihli DURUM LOG akışı (ÖB+MK tek form yazar). ---------- */
async function loadSantiye(tgt){
  const view=document.getElementById(tgt||"view");
  const [s,mk,sa]=await Promise.all([
    sb.from("santiye").select("*").order("sira"),
    sb.from("mk_santiye_snapshot").select("*"),
    sb.from("sel_arb_snapshot").select("tarih,sira,firma,proje,alacak")
  ]);
  const err=s.error;
  if(err){ view.innerHTML=`<div class="load">Hata: ${esc(err.message)}</div>`; return; }
  /* Pano DURUM'u YALNIZ MK snapshot'ından okur (önceki+güncel); ÖB verisi panoya girmez */
  const mkBy={}; (mk.data||[]).forEach(x=>{ mkBy[x.santiye_id]=x; });
  const rows=(s.data||[]).filter(r=>r.durum!=="Çözüldü");
  const ay=d=>{ if(!d) return 0; const x=new Date(d); if(isNaN(x)) return 0; const n=new Date(); return (n.getFullYear()-x.getFullYear())*12+(n.getMonth()-x.getMonth()); };
  const sdk=d=>d?String(d).slice(8,10)+"."+String(d).slice(5,7)+"."+String(d).slice(2,4):"";
  /* MK son güncelleme = en yeni snapshot.updated_at (aylık güncelleme düğmesine son basılma; yalnız MK) */
  let mkStamp=null; (mk.data||[]).forEach(x=>{ if(x.updated_at&&(mkStamp==null||String(x.updated_at)>String(mkStamp))) mkStamp=x.updated_at; }); mkStamp=mkStamp?dOnly(mkStamp):"—";
  /* Arbor SAS Alacak — SEL-ARB en yeni çekim; bağ = santiye.sel_arb_sira (ÖB formundaki seçim) */
  const saRows=(sa&&!sa.error)?(sa.data||[]):[];
  let saMax=""; saRows.forEach(x=>{ if(String(x.tarih)>saMax) saMax=String(x.tarih); });
  const saBy={}; saRows.filter(x=>String(x.tarih)===saMax).forEach(x=>{ saBy[x.sira]=x; });
  const norm=t=>String(t==null?"":t).toLocaleLowerCase("tr").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g," ").trim();
  const alacakOf=r=>{
    let keys=Array.isArray(r.sel_arb_sira)?r.sel_arb_sira.map(Number):[];
    if(!keys.length){ /* bağ girilmemişse geçici ad benzerliği (ÖB seçim yaptıkça devre dışı kalır) */
      const kel=norm(r.santiye).split(" ").filter(w=>w.length>=5);
      if(kel.length) keys=Object.keys(saBy).filter(k=>{
        const pw=norm(saBy[k].proje).split(" ");
        return kel.some(w=>pw.some(p=>p.startsWith(w)||w.startsWith(p)));
      }).map(Number);
    }
    const hit=keys.map(k=>saBy[k]).filter(Boolean);
    return { tutar:hit.length?hit.reduce((a,x)=>a+(Number(x.alacak)||0),0):null,
             det:hit.map(x=>x.proje+" · "+money(x.alacak)+" €").join("\n") };
  };
  const toplam=rows.reduce((a,r)=>a+(alacakOf(r).tutar||0),0);
  const body=rows.map(r=>{
    const a=ay(r.ilk_kayit), al=alacakOf(r), m=mkBy[r.id];
    let durTxt;
    if(m&&(m.mk_guncel_durum||m.mk_guncel_tarih)){
      const g=`${m.mk_guncel_tarih?'<b>'+sdk(m.mk_guncel_tarih)+'</b> · ':''}${esc(m.mk_guncel_durum||"")}`;
      const o=(m.mk_onceki_durum||m.mk_onceki_tarih)?` <span class="muted">· Önceki${m.mk_onceki_tarih?' ('+sdk(m.mk_onceki_tarih)+')':''}: ${esc(m.mk_onceki_durum||"")}</span>`:"";
      durTxt=g+o;
    } else durTxt=`<span class="muted">Henüz MK güncellemesi yok.</span>`;
    const dur=`<div class="cx">${durTxt}</div>`;
    return `<tr>`
      +`<td class="sb"><span title="${esc(r.neden||'')}">${esc(r.santiye)}</span>${a>=3?' <span class="sbdg none">'+a+' ay</span>':''}</td>`
      +`<td class="c t20"><span title="${esc(r.musteri||'')}">${esc(r.musteri||'')}</span></td>`
      +`<td class="num"${al.det?` title="${esc(al.det)}"`:''}>${al.tutar==null?'':money(al.tutar)}</td>`
      +`<td class="tdur">${dur}</td></tr>`;
  }).join("");
  view.innerHTML=`<h2 class="secH">Tıkanmış Şantiyeler <span class="muted" style="font-weight:400">· ${rows.length} açık · MK ${mkStamp}</span></h2>
    <style>table.stik{width:auto}
      table.stik td.sb{white-space:nowrap;font-weight:700}
      table.stik .c>span{display:block;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;white-space:nowrap}
      table.stik .c>span::-webkit-scrollbar{display:none}
      table.stik td.t20>span{width:20ch}
      table.stik td.tdur>.cx{display:block;width:119ch;white-space:nowrap;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
      table.stik td.tdur>.cx::-webkit-scrollbar{display:none}</style>
    <div class="scroll"><table class="stbl stik">
    <thead><tr><th>ŞANTİYE</th><th>MÜŞTERİ</th><th class="num">ARBOR SAS ALACAK €</th><th class="tdur">DURUM</th></tr></thead>
    <tbody>${body}<tr class="itot"><td>Toplam · ${rows.length} açık</td><td></td><td class="num">${money(toplam)}</td><td></td></tr></tbody>
    </table></div>`;
}

/* ---------- ÖZEL — grup: 5 hassas pano (pano_ozel_html, iframe srcdoc) + G.menkul (pano_ozel). Bölüm-RLS; anon 401. Parola/ozel4 YOK. ---------- */
/* OZEL-SIRA (07.09.2026, Melih): sekmeler soldan sağa Sözlük · G.Menkul · Takvim · Vapur · PhD · Kitap.
   FELSEFE SEKMESİ YOK — içeriği PhD panosunun ALTINDA ikinci iframe olarak açılır (loadOzelHtml).
   pano_ozel_html'deki 'ozel_felsefe' satırı DURUYOR, yalnız görünme yeri değişti. */
const OZEL_HTML=[["ozel_kitaplar","📚 Kitap"],["ozel_phd","🎓 PhD"],["ozel_takvim","🎂 Takvim"],["ozel_vapur","🚢 Vapur"]];
const OZEL_SIRA=["ozel_sozluk","gmenkul","ozel_takvim","ozel_vapur","ozel_phd","ozel_kitaplar","ozel_bahce"]; /* BAHCE-SEKME 21.09.2026 */
function loadOzel(){
  const view=document.getElementById("view");
  const isAdmin=state.allowed===null;
  const htmlTabs=OZEL_HTML.filter(t=> isAdmin || state.allowed.includes(t[0]));
  const showG = isAdmin || state.allowed.includes('gmenkul');
  const showS = isAdmin || state.allowed.includes('ozel_sozluk');
  const showB = isAdmin || state.allowed.includes('ozel_bahce');   /* BAHCE-SEKME */
  const tabs=htmlTabs.concat(showG?[["gmenkul","🏢 G.Menkul"]]:[]).concat(showS?[["ozel_sozluk","📖 Sözlük"]]:[]).concat(showB?[["ozel_bahce","🌿 Bahçe"]]:[])
    .sort((a,b)=>{ const ia=OZEL_SIRA.indexOf(a[0]), ib=OZEL_SIRA.indexOf(b[0]);
                   return (ia<0?99:ia)-(ib<0?99:ib); });
  if(!tabs.length){ view.innerHTML=`<div class="load">Bu hesapta özel bölüm yetkisi yok.</div>`; return; }
  if(!state.ozelSub || !tabs.some(t=>t[0]===state.ozelSub)) state.ozelSub=tabs[0][0];
  const cur=document.getElementById("ozf");
  if(cur && cur.getAttribute("data-b")===state.ozelSub) return; /* 60sn tazelemede aktif iframe'i koru (PhD düzenleme) */
  const bar=tabs.map(t=>`<button class="malitab${t[0]===state.ozelSub?' active':''}" data-o="${esc(t[0])}">${esc(t[1])}</button>`).join("");
  view.innerHTML=`<div class="malibar">${bar}</div><div id="ozel-body"><div class="load">Yükleniyor…</div></div>`;
  view.querySelectorAll(".malitab").forEach(btn=>btn.onclick=()=>{ state.ozelSub=btn.dataset.o; loadOzel(); });
  if(state.ozelSub==="gmenkul"){ loadGmenkul("ozel-body"); return; }   /* GMENKUL-DUZENLE */
  if(state.ozelSub==="ozel_sozluk"){ loadSozluk("ozel-body"); return; }
  if(state.ozelSub==="ozel_bahce"){ loadBahce("ozel-body"); return; }   /* BAHCE-SEKME */
  loadOzelHtml(state.ozelSub,"ozel-body");
}
/* pano_ozel_html satırını iframe srcdoc olarak tam sadakatle render et (CSS+script izole çalışır) */
async function loadOzelHtml(bolum,tgt){
  const body=document.getElementById(tgt);
  if(bolum==="ozel_phd") await phdPrepare();
  const {data,error}=await sb.from("pano_ozel_html").select("html_raw").eq("bolum",bolum).single();
  if(error){ body.innerHTML=`<div class="load">Hata: ${esc(error.message)}</div>`; return; }
  const ifr=document.createElement("iframe");
  ifr.id="ozf"; ifr.setAttribute("data-b",bolum);
  ifr.style.cssText="width:100%;height:86vh;border:1px solid #dde3ea;border-radius:8px;background:#fff";
  body.innerHTML=""; body.appendChild(ifr);
  /* Ham HTML panoları (Maaş-Prim vb.) Supabase REST'i kendi içinde publishable anahtarla çağırır;
     anon kapatıldığı için bu 401 veriyordu. Iframe'e giren fetch'lere oturum token'ı eklenir. */
  let _tok=""; try{ const s=await sb.auth.getSession(); _tok=(s&&s.data&&s.data.session&&s.data.session.access_token)||""; }catch(e){}
  const _inj="<scr"+"ipt>(function(){var T="+JSON.stringify(_tok)+";if(!T)return;var of=window.fetch;"
    +"window.fetch=function(u,o){o=o||{};try{if(String((u&&u.url)||u).indexOf('supabase.co')>-1){var h=new Headers(o.headers||{});h.set('Authorization','Bearer '+T);o.headers=h;}}catch(e){}return of(u,o);};})();</scr"+"ipt>";
  ifr.srcdoc=_inj+data.html_raw;
  /* FELSEFE-ALT: Felsefe'nin kendi sekmesi kaldırıldı; içeriği PhD panosunun altında açılır. */
  if(bolum==="ozel_phd"){
    const f=await sb.from("pano_ozel_html").select("html_raw").eq("bolum","ozel_felsefe").single();
    if(!f.error && f.data){
      const h2=document.createElement("h2"); h2.className="secH"; h2.textContent="Felsefe";
      const ifr2=document.createElement("iframe");
      ifr2.id="ozf2"; ifr2.setAttribute("data-b","ozel_felsefe");
      ifr2.style.cssText=ifr.style.cssText;
      body.appendChild(h2); body.appendChild(ifr2);
      ifr2.srcdoc=_inj+f.data.html_raw;
    }
  }
}
/* PhD Notes: Supabase'ten notları parent'a yükle + kaydetme köprüsü (iframe içindeki script parent.__PHD_NOTES / parent.__phdSave kullanır). Kaynak Supabase, düzenlenebilir. */
async function phdPrepare(){
  const {data,error}=await sb.from("phd_notes").select("*").order("created",{ascending:false});
  window.__PHD_NOTES = error?[]:(data||[]).map(n=>({id:n.id,aim:n.aim,title:n.title,body:n.body,tags:n.tags||[],created:Number(n.created),edited:n.edited?Number(n.edited):undefined}));
  window.__phdSave = async function(notes){
    try{
      const rows=(notes||[]).map(n=>({id:n.id,aim:n.aim,title:n.title||'',body:(typeof n.body==='string'?n.body:JSON.stringify(n.body)),tags:Array.isArray(n.tags)?n.tags:[],created:n.created||Date.now(),edited:n.edited||null}));
      const up=await sb.from('phd_notes').upsert(rows,{onConflict:'id'});
      if(up.error) throw up.error;
      const ids=rows.map(r=>r.id);
      const {data:cur}=await sb.from('phd_notes').select('id');
      const del=(cur||[]).map(r=>r.id).filter(id=>ids.indexOf(id)<0);
      if(del.length) await sb.from('phd_notes').delete().in('id',del);
    }catch(e){ console.error('phdSave',e); alert('PhD kaydetme hatası: '+(e.message||e)); }
  };
}

    .szt td{border-bottom:1px solid #eef1f5;padding:4px 8px;vertical-align:top;line-height:1.45}
    .szt td.szk{font-weight:700;color:#16324f;white-space:nowrap}
    .szt th.szxh,.szt td.szx{width:28px;padding:4px 6px;text-align:center}
    .szdel{border:0;background:none;cursor:pointer;color:#b9c2cc;font-size:14px;line-height:1;padding:2px 4px;border-radius:4px}
    .szdel:hover{color:#c0392b;background:#fdecea}
    .szdel[disabled]{opacity:.4;cursor:default}
    .szadd{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 10px}
    .szadd input{flex:0 0 260px;max-width:60%;padding:6px 9px;border:1px solid #cfd8e3;border-radius:6px;font-size:13px}
    .szadd button{padding:6px 14px;border:0;border-radius:6px;background:#16324f;color:#fff;font-size:13px;cursor:pointer}
    .szadd button[disabled]{opacity:.5;cursor:default}
    .szmsg{font-size:12px;color:#6b7683}
    .szmsg.err{color:#c0392b}
    .szmsg.ok{color:#1a7a3d}
  </style>`;
  /* SOZLUK-EKLE: en üstte kalıcı giriş kutusu. Türkçe-dışı bir kelime yazılınca kendi dilinde
     tanımıyla anında eklenir (sozluk-ekle edge function; ANTHROPIC anahtarı sunucuda kalır,
     client'a konmaz). Anon yazma (RLS 401) yolu değişmez; bu yalnız ek bir giriş yolu. */
  h+='<div class="szadd"><input id="sz-inp" type="text" placeholder="Kelime ekle (İngilizce, Fransızca…)" maxlength="80" autocomplete="off"><button id="sz-add" type="button">Ekle</button><span id="sz-msg" class="szmsg"></span></div>';
  if(error){ h+=`<div class="load">Hata: ${esc(error.message)}</div>`; }
  else if(!rows.length){ h+=`<div class="load">Henüz sözlük girişi yok.</div>`; }
  else {
    h+='<div class="scroll"><table class="szt"><thead><tr><th>Kelime</th><th>Anlam</th><th class="szxh"></th></tr></thead><tbody>';
    rows.forEach(r=>{ h+='<tr><td class="szk">'+esc(r.kelime)+'</td><td>'+esc(r.anlam||"")+'</td><td class="szx"><button class="szdel" title="Sil" data-id="'+esc(r.id)+'" data-k="'+esc(r.kelime)+'">✕</button></td></tr>'; });
    h+='</tbody></table></div>';
  }
  body.innerHTML=h;
  /* Kelime ekleme: edge function kelimenin dilini tespit eder, o dilde kısa tanım üretir ve
     id="v-"+slug ile idempotent ekler; başarıda liste tazelenir (zaten varsa çakışmaz). */
  const inp=document.getElementById("sz-inp"), addb=document.getElementById("sz-add"), msg=document.getElementById("sz-msg");
  async function szEkle(){
    const kelime=(inp.value||"").trim();
    if(!kelime){ msg.className="szmsg err"; msg.textContent="Önce bir kelime yazın."; inp.focus(); return; }
    addb.disabled=true; inp.disabled=true; msg.className="szmsg"; msg.textContent="Ekleniyor…";
    try{
      const {data:d,error:e}=await sb.functions.invoke("sozluk-ekle",{body:{kelime}});
      if(e||!(d&&d.ok)){ msg.className="szmsg err"; msg.textContent="Hata: "+((e&&e.message)||(d&&d.error)||"bilinmiyor"); addb.disabled=false; inp.disabled=false; return; }
      inp.value="";
      await loadSozluk(tgt);
      const m2=document.getElementById("sz-msg");
      if(m2){ m2.className="szmsg ok"; m2.textContent=(d.existed?"Zaten vardı: ":"Eklendi: ")+d.kelime+(d.dil?" ("+d.dil+")":""); }
      const i2=document.getElementById("sz-inp"); if(i2) i2.focus();
    }catch(ex){ msg.className="szmsg err"; msg.textContent="Hata: "+ex; addb.disabled=false; inp.disabled=false; }
  }
  if(addb) addb.onclick=szEkle;
  if(inp) inp.onkeydown=ev=>{ if(ev.key==="Enter"){ ev.preventDefault(); szEkle(); } };
  /* Satır silme: tablodan kalıcı siler. Delta dosyaları sync sonrası arşive taşındığı için geri gelmez. */
  body.querySelectorAll(".szdel").forEach(b=>{
    b.onclick=async()=>{
      if(!confirm('"'+b.dataset.k+'" sözlükten silinsin mi?')) return;
      b.disabled=true;
      const {error:de}=await sb.from("sozluk").delete().eq("id",b.dataset.id);
      if(de){ b.disabled=false; alert("Silme hatası: "+(de.message||de)); return; }
      const tr=b.closest("tr"); if(tr) tr.remove();
    };
  });
}

/* ---------- BAHÇE (Özel grubu) — BAHCE-SEKME (21.09.2026, Melih). Kaynak Supabase 'bahce_bitki'
   (ad · latince · isik · soguk · toprak · sulama · cok_yillik · notlar). Satırları Claude ekler
   (bahce-bitki skill'i: Melih yalnız bitki adı yazınca). Panoda yalnız okuma + ✕ silme. RLS int@. ---------- */
async function loadBahce(tgt){   /* BAHCE-KOMPAKT (21.09.2026): telefona göre dar tablo */
  const body=document.getElementById(tgt);
  const {data,error}=await sb.from("bahce_bitki").select("*");
  const rows=(!error&&data)?data.slice():[];
  const nm=r=>(r.latince||r.ad||"");
  rows.sort((x,y)=>nm(x).localeCompare(nm(y),"tr"));
  const notVar=rows.some(r=>(r.notlar||"").trim());
  let h=`<style>
    .bht{border-collapse:collapse;width:auto;font-size:12px}
    .bht th{background:#2f5d3a;color:#fff;font-weight:600;padding:3px 5px;text-align:left;white-space:nowrap}
    .bht td{border-bottom:1px solid #eef1f5;padding:3px 5px;vertical-align:top;line-height:1.35}
    .bht td.bhk{font-style:italic;font-weight:600;color:#2f5d3a;max-width:34vw}
    .bht td.bhi{white-space:nowrap;font-size:13px;letter-spacing:-1px}
    .bht td.bhs,.bht td.bhu,.bht td.bhc{white-space:nowrap;text-align:center}
    .bht td.bht2{max-width:30ch}
    .bht td.bhx{width:20px;padding:3px 2px;text-align:center}
    .bhdel{border:0;background:none;cursor:pointer;color:#b9c2cc;font-size:13px;line-height:1;padding:1px 3px;border-radius:4px}
    .bhdel:hover{color:#c0392b;background:#fdecea}
    .bhnot{font-size:11px;color:#6b7683;margin:0 0 6px}
  </style>`;
  h+='<div class="bhnot">'+rows.length+' bitki · ☀️ güneş · ⛅ yarı gölge · ☁️ gölge</div>';
  if(error){ h+=`<div class="load">Hata: ${esc(error.message)}</div>`; }
  else if(!rows.length){ h+=`<div class="load">Henüz bitki yok.</div>`; }
  else {
    h+='<div class="scroll"><table class="bht"><thead><tr><th>Bitki</th><th title="Işık">Işık</th><th title="Soğuğa dayanım">Soğuk</th><th>Toprak</th><th>Sulama</th><th title="Çok yıllık">Ç.Yıl</th>'+(notVar?'<th>Not</th>':'')+'<th></th></tr></thead><tbody>';
    rows.forEach(r=>{ h+='<tr><td class="bhk" title="'+esc(r.ad||"")+'">'+esc(nm(r))+'</td><td class="bhi">'+esc(r.isik||"")+'</td><td class="bhs">'+esc(r.soguk||"")+'</td><td class="bht2">'+esc(r.toprak||"")+'</td><td class="bhu">'+esc(r.sulama||"")+'</td><td class="bhc">'+esc(r.cok_yillik||"")+'</td>'+(notVar?'<td>'+esc(r.notlar||"")+'</td>':'')+'<td class="bhx"><button class="bhdel" title="Sil" data-id="'+esc(r.id)+'" data-k="'+esc(nm(r))+'">✕</button></td></tr>'; });
    h+='</tbody></table></div>';
  }
  body.innerHTML=h;
  body.querySelectorAll(".bhdel").forEach(b=>{
    b.onclick=async()=>{
      if(!confirm('"'+b.dataset.k+'" Bahçe panosundan silinsin mi?')) return;
      b.disabled=true;
      const {error:de}=await sb.from("bahce_bitki").delete().eq("id",b.dataset.id);
      if(de){ b.disabled=false; alert("Silme hatası: "+(de.message||de)); return; }
      const tr=b.closest("tr"); if(tr) tr.remove();
    };
  });
}

<script>
/* ARB-HOVERTITLE: sigmayan hucre/alan icerigi hover'da (title) gosterilir - tum pano/form ortak */
(function(){
  function fx(el){
    if(!el||el.nodeType!==1) return;
    var tag=el.tagName;
    if(tag==='INPUT'||tag==='TEXTAREA'){ var v=el.value||''; if(v) el.title=v; else el.removeAttribute('title'); return; }
    if(tag==='SELECT'){ var o=el.options[el.selectedIndex]; var v2=o?o.textContent:''; if(v2) el.title=v2; else el.removeAttribute('title'); return; }
    if(el.children.length) return;
    var t=(el.textContent||'').trim();
    if(t && el.scrollWidth>el.clientWidth+1 && !el.getAttribute('title')) el.title=t;
  }
  function scan(root){ if(root&&root.querySelectorAll) root.querySelectorAll('td,th,div,span,input,select,textarea').forEach(fx); }
  document.addEventListener('input',function(e){ fx(e.target); },true);
  document.addEventListener('change',function(e){ fx(e.target); },true);
  var mo=new MutationObserver(function(muts){ muts.forEach(function(m){ m.addedNodes.forEach(function(n){ if(n.nodeType===1){ fx(n); scan(n); } }); }); });
  function boot(){ mo.observe(document.body,{childList:true,subtree:true}); scan(document.body); }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
})();
</script>
<!-- /ARB-HOVERTITLE -->


<!-- ARBOR-DRAGSCROLL -->
<style>
  /* Kaydirma cubuklari gizli — kaydirma tekerlek + surukleme ile yapilir */
  *{scrollbar-width:none;-ms-overflow-style:none}
  ::-webkit-scrollbar{width:0!important;height:0!important;background:transparent}
  body.arb-dragging,body.arb-dragging *{cursor:grabbing!important;user-select:none!important}
</style>
<script>
(function(){
  var el=null,sx=0,sy=0,l=0,t=0,moved=false;
  function skip(n){ return !!(n.closest && n.closest("input,select,textarea,button,a,summary,label,option,.del,.adel,.idel,.ddel,.fdel")); }
  function scrollable(n){
    var st=getComputedStyle(n);
    var okx=(st.overflowX==="auto"||st.overflowX==="scroll") && n.scrollWidth>n.clientWidth+2;
    var oky=(st.overflowY==="auto"||st.overflowY==="scroll") && n.scrollHeight>n.clientHeight+2;
    return okx||oky;
  }
  function start(n,e){
    el=n; sx=e.clientX; sy=e.clientY; l=n.scrollLeft; t=n.scrollTop; moved=false;
    document.body.classList.add("arb-dragging"); e.preventDefault();
  }
  document.addEventListener("mousedown",function(e){
    if(e.button!==0||skip(e.target)) return;
    var n=e.target, hucre=null;
    while(n && n.nodeType===1 && n!==document.body){
      if(scrollable(n)){
        /* once tablo/kutu kapsayicisi; hucre ici mini-kaydirici yalnizca baska aday yoksa */
        if(!n.closest("td,th")) return start(n,e);
        if(!hucre) hucre=n;
      }
      n=n.parentElement;
    }
    if(hucre) return start(hucre,e);
  },true);
  document.addEventListener("mousemove",function(e){
    if(!el) return;
    var dx=e.clientX-sx, dy=e.clientY-sy;
    if(Math.abs(dx)+Math.abs(dy)>3) moved=true;
    el.scrollLeft=l-dx; el.scrollTop=t-dy;
  });
  document.addEventListener("mouseup",function(){
    if(!el) return; el=null; document.body.classList.remove("arb-dragging");
  });
  document.addEventListener("click",function(e){ if(moved){ moved=false; e.stopPropagation(); e.preventDefault(); } },true);
})();
</script>
<!-- /ARBOR-DRAGSCROLL -->
</body>
