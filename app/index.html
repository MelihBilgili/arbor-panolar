<script>
/* ARB-AD-YAZIM (2026-09-22, Melih): proje / müşteri / firma adları her kelimenin yalnız baş harfi büyük,
   kısaltmalar tamamı büyük. Supabase REST (/rest/v1/) yanıtlarında ve yazma gövdelerinde (POST/PATCH/PUT)
   proje · proje_adi · musteri · firma alanlarına (fiyat_musteri_sinif'te ad) uygulanır — tek kaynak: kod/_arb_ad_yazim.js */
(function(){
  if(window.ARB_AD) return;
  var AKR=("SCI SAS SARL SA SASU EURL SNC SEM SPL SPLA ZAC PEM PST MVT AÜP OE ÖB MK MB EU UK USA TR FR AŞ LTD LLC PLC GMBH AG BV NV SPA SRL "+
    "HLM OPH OPAC EHPAD CHU CROUS RATP SNCF IDF ICF HQE BBC CA ILM FCAI CLC CBC LCB BAT BTP TRT KDV SGDB SVM LMP RBKC MTC GTM NHS PVC "+
    "ARGE ARB YD SÖ TOKİ İBB İTÜ ODTÜ ENSA ESSEC ENS HEC IUT CFA RTE EDF GDF CCI CMA SEMIIC SAEM SPIE CPAM CAF UGC ARS KYK TMO SGK TCDD İSKİ AVM ÖSYM THY PTT MSB TBMM YTÜ MSGSÜ").split(" ");
  var AK={}; AKR.forEach(function(w){ AK[w]=1; });
  var KUCUK={ST:1,MR:1,DR:1,SR:1,JR:1,MRS:1,MS:1};           /* sesli harfsiz ama kısaltma sayılmayanlar → St, Mr … */
  var TRH=/[ğĞşŞıİçÇöÖüÜ]/, SESLI=/[aeiouyàâäéèêëîïôöùûüÿıAEIOUYÀÂÄÉÈÊËÎÏÔÖÙÛÜŸİ]/, ROMA=/^(I{1,3}|IV|VI{0,3}|IX|XI{0,3}|XIV|XV)$/;
  function up(w,tr){ return tr?w.toLocaleUpperCase("tr"):w.toUpperCase(); }
  function lo(w,tr){ return tr?w.toLocaleLowerCase("tr"):w.toLowerCase(); }
  var OLAGAN={};  /* karışık metinde büyük yazılsa da kısaltma sayılmayan sık kelimeler */
  ("LE LA LES DE DU DES SUR SOUS AUX AU ET EN UN UNE THE OF AND FOR ON IN AT TO VON DER DIE DAS UND IM AM ZUM ZUR VE İLE EVİ BEY HAN KAT LOT VIA DEL DI DA LOS EL SAN SUD NORD EST OUEST").split(" ").forEach(function(w){ OLAGAN[w]=1; });
  function kelime(w,karisik,tr){
    if(/\d/.test(w)) return w;                                   /* rakamlı (P19, I3F, 68s) aynen */
    var U=up(w,tr);
    if(AK[U]) return U;
    if(w.length===1) return U;                                   /* tek harf (Lot F, Y Blok) */
    if(ROMA.test(U)) return U;                                   /* III. Faz */
    if(!SESLI.test(w) && !KUCUK[U]) return U;                    /* sesli harfsiz: SVM, LMP, RBKC */
    if(karisik && w===U && w.length<=3 && !OLAGAN[U]) return U;                /* karışık yazılmış metinde büyük yazılmış kısa kelime = kısaltma */
    var l=lo(w,tr); return up(l.charAt(0),tr)+l.slice(1);
  }
  window.ARB_AD=function(s){
    if(s==null||typeof s!=="string") return s;
    var t=s.replace(/\s+/g," ").trim(); if(!t) return t;
    var harf=t.replace(/[^\p{L}]/gu,""), karisik=harf!==harf.toUpperCase()&&harf!==harf.toLowerCase(), tr=TRH.test(t);  /* Türkçe harf içeren metin → tr yerel ayarı (YAPI → Yapı) */
    return t.replace(/[\p{L}\p{M}\p{N}]+/gu,function(w){ return kelime(w,karisik,tr); });
  };
  var ALAN={proje:1,proje_adi:1,musteri:1,firma:1};
  function donus(o,tablo){
    if(Array.isArray(o)){ for(var i=0;i<o.length;i++) donus(o[i],tablo); return o; }
    if(o&&typeof o==="object"){ for(var k in o){ if(typeof o[k]==="string"&&(ALAN[k]||(k==="ad"&&tablo==="fiyat_musteri_sinif"))) o[k]=window.ARB_AD(o[k]); } }
    return o;
  }
  window.ARB_AD_DONUS=donus;
  var of=window.fetch.bind(window);
  window.fetch=function(u,o){
    var url=String((u&&u.url)||u||""), m=url.match(/\/rest\/v1\/([A-Za-z0-9_]+)/), tablo=m?m[1]:null;
    if(!tablo) return of(u,o);
    try{ var me=((o&&o.method)||"GET").toUpperCase();
      if(o&&typeof o.body==="string"&&/^(POST|PATCH|PUT)$/.test(me)&&tablo!=="rpc"){ o=Object.assign({},o,{body:JSON.stringify(donus(JSON.parse(o.body),tablo))}); } }catch(e){}
    return of(u,o).then(function(r){
      var ct=r.headers.get("content-type")||"";
      if(!r.ok||ct.indexOf("json")<0) return r;
      return r.clone().text().then(function(t){ if(!t) return r;
        try{ return new Response(JSON.stringify(donus(JSON.parse(t),tablo)),{status:r.status,statusText:r.statusText,headers:r.headers}); }catch(e){ return r; } });
    });
  };
})();
</script>

function fdate(s){ if(!s) return ""; s=String(s).trim();
  const m=s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})$/);  /* DD.MM.YYYY / DD.MM.YY — new Date() bunu ABD MM/DD sanıp kaydırıyor, elle parse et */
  if(m){ const g=+m[1],ay=+m[2]; if(g>=1&&g<=31&&ay>=1&&ay<=12){ const y=m[3].length<=2?m[3]:m[3].slice(-2); return String(g).padStart(2,'0')+"."+String(ay).padStart(2,'0')+"."+String(y).padStart(2,'0'); } }
  const d=new Date(s); if(isNaN(d)) return esc(s); return String(d.getDate()).padStart(2,'0')+"."+String(d.getMonth()+1).padStart(2,'0')+"."+String(d.getFullYear()).slice(2); }
function money(n){ if(n==null||n==="") return ""; const v=Math.round(Number(n)); return isNaN(v)?"":v.toLocaleString("tr-TR"); }

/* TAKIP-LOG (2026-09-14): takip_sekli/yurtdisi_notlari artık JSON geçmiş dizisi olabilir
   ({t,n} yeni-en-üstte). Eski düz metin değerler geriye dönük olarak tek kayıt sayılır. */
function tkParseLog(raw,dval){
  if(raw==null||raw==="") return [];
  try{ const v=JSON.parse(raw); if(Array.isArray(v)) return v.map(x=>({t:(x&&x.t)||"",n:(x&&x.n)||""})); }catch(e){}
  return [{t:dval||"",n:String(raw)}];
}
function tkLatest(log){ return log[0]||{t:"",n:""}; }
function tkHist(log){ return log.length? log.map(e=>(e.t?fdate(e.t)+" — ":"")+(e.n||"")).join("\n") : ""; }
function tkPairCells(r,dCol,nCol){
  const log=tkParseLog(r[nCol],r[dCol]);
  const last=tkLatest(log), hist=tkHist(log);
  const histDates = log.length? log.map(e=>e.t?fdate(e.t):"—").join("\n") : "";
  return `<td class="num" title="${esc(histDates)}">${esc(last.t?fdate(last.t):"")}</td>`
       + `<td class="t-not"><div class="cx" title="${esc(hist)}">${esc(last.n||"")}</div></td>`;
}

async function doLogin(){

  state.email=email; msg("Giriş yapılıyor…",true);

/* ---------- Başlık uydurma: sütun başlığı içerikten genişse bir tık küçült; hâlâ genişse
   iki satıra sar (başlıklar alttan hizalı). Yalnız auto-layout tablolarda çalışır;
   colgroup'lu sabit tablolarda gerek yok. Her tabloya bir kez uygulanır (data-fh). ---------- */
function fitHeads(){
  document.querySelectorAll("#app table").forEach(tbl=>{
    if(tbl.dataset.fh) return; tbl.dataset.fh="1";
    if(getComputedStyle(tbl).tableLayout==="fixed") return;
    const th0=tbl.tHead, body=tbl.tBodies[0];
    if(!th0||!th0.rows.length||!body||!body.rows.length) return;
    const hr=th0.rows[th0.rows.length-1], n=hr.cells.length;
    /* Range ile GERÇEK metin genişliği — scrollWidth yerleşmiş sütun genişliğini verdiği için dairesel olur */
    const rw=el=>{ const r=document.createRange(); r.selectNodeContents(el); return r.getBoundingClientRect().width; };
    const colMax=new Array(n).fill(0);
    for(const row of body.rows){
      if(row.cells.length!==n) continue;              /* grup / colspan satırları hariç */
      for(let i=0;i<n;i++){ const c=row.cells[i], ch=c.firstElementChild;
        const w=ch?ch.getBoundingClientRect().width:rw(c);
        if(w>colMax[i]) colMax[i]=w; }
    }
    for(let i=0;i<n;i++){
      const th=hr.cells[i];
      if(!th||th.colSpan>1||th.rowSpan>1||!th.textContent.trim()||!colMax[i]) continue;
      if(rw(th)<=colMax[i]+2) continue;                        /* başlık zaten dar */
      th.classList.add("thsm");
      if(rw(th)>colMax[i]+2) th.innerHTML='<span class="thw">'+th.innerHTML+'</span>';
    }
  });
}
/* ---------- Taşan hücre içeriği hover'da tam görünsün (title) — TÜM panolar.
   Sütun genişliği yüzünden kırpılan her hücreye (td / içindeki span-div) tam metni
   title olarak koyar; tarayıcı hover'da gösterir. Ölçüm ve yazma iki ayrı geçişte
   (layout thrash yok). title'ı zaten olan öğeye dokunulmaz. Attribute değişimi
   MutationObserver (childList) tetiklemez → döngü yok. ---------- */
function fitTitles(){
  const app=document.getElementById("app"); if(!app) return;
  const todo=[];
  app.querySelectorAll("td,td span,td div").forEach(el=>{
    if(el.hasAttribute("title")) return;
    if(el.firstElementChild&&el.querySelector("button,input,select,textarea,a,table,iframe")) return;
    if(el.scrollWidth>el.clientWidth+1) todo.push(el);
  });
  todo.forEach(el=>{ const t=(el.innerText||el.textContent||"").replace(/\s+/g," ").trim(); if(t) el.setAttribute("title",t); });
}
(function(){
  const run=()=>{ clearTimeout(window._fhT); window._fhT=setTimeout(()=>{ fitHeads(); fitTitles(); },60); };
  const app=document.getElementById("app");
  if(app) new MutationObserver(run).observe(app,{childList:true,subtree:true});
})();

/* AG-OZELGUN: Ana Gündem'in EN ÜSTÜNDE, Takvim (pano_ozel_html/ozel_takvim) özel günlerinden
   bugünden itibaren <=30 gün içindekileri tarihe göre (yakın→uzak) listeler. Kaynak SALT-OKUNUR;
   Takvim panosuna dokunulmaz. Seyahat (✈) kayıtları HARİÇ (özel gün ≠ seyahat). Yıllık-tekrarlı
   günler (doğum günü/yıldönümü/sene-i devriye) bugünden sonraki İLK oluşuma göre alınır. Pencere
   her render'da (300sn tazeleme dahil) bugüne göre yeniden hesaplanır. Yetki yok/okunamazsa gizlenir. */
async function agOzelGun(){
  const box=document.getElementById("ag-ozelgun"); if(!box) return;
  try{
    const {data,error}=await sb.from("pano_ozel_html").select("html_raw").eq("bolum","ozel_takvim").single();
    if(error||!data||!data.html_raw){ box.remove(); return; }
    const raw=data.html_raw;
    const MN=["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];
    const WD=["Paz","Pzt","Sal","Çar","Per","Cum","Cts"];
    const today=new Date(); today.setHours(0,0,0,0);
    const end=new Date(today); end.setDate(end.getDate()+30);
    const re=/add\(\s*(\d{1,2})\s*,\s*(\d{1,2})\s*,\s*"([^"]*)"\s*\)/g;
    const items=[]; let m;
    while((m=re.exec(raw))){
      const mo=+m[1], da=+m[2], txt=m[3];
      let dt=new Date(today.getFullYear(),mo-1,da); dt.setHours(0,0,0,0);
      if(dt<today){ dt=new Date(today.getFullYear()+1,mo-1,da); dt.setHours(0,0,0,0); }  /* yıllık-tekrar: sonraki oluşum */
      if(dt.getMonth()!==mo-1) continue;                 /* geçersiz tarih (ör. 29 Şub) elenir */
      if(dt>=today && dt<=end) items.push({dt:dt,txt:txt});
    }
    if(!items.length){ box.className=""; box.innerHTML='<div class="agog-none">🎂 Önümüzdeki 30 günde özel gün yok.</div>'; return; }
    items.sort((a,b)=>a.dt-b.dt);
    const kalan=dt=>{ const g=Math.round((dt-today)/86400000); return g===0?"bugün":(g===1?"yarın":g+" gün"); };
    const rows=items.map(it=>{ const d=it.dt, ds=d.getDate()+" "+MN[d.getMonth()]+" "+WD[d.getDay()];
      return '<tr><td class="agog-d">'+esc(ds)+'</td><td class="agog-x">'+esc(it.txt)+'</td><td class="agog-k">'+esc(kalan(d))+'</td></tr>'; }).join("");
    box.innerHTML='<div class="agog-h">🎂 Yaklaşan Özel Günler <span class="agog-sub">· 30 gün · Takvim</span></div>'
      +'<table class="agog-t"><tbody>'+rows+'</tbody></table>';
  }catch(e){ box.remove(); }
}
async function addGundem(){
  const ei=document.getElementById("ag-ilgili"), ek=document.getElementById("ag-konu"), ekod=document.getElementById("ag-kod");
  let ilg=(ei.value||"").trim();
  const konu=(ek.value||"").trim();
  if(ilg==="PEM"||ilg==="PRJ"){
    const need=ilg==="PEM"?5:8, kod=(ekod.value||"").trim();
    if(!new RegExp("^\\d{1,"+need+"}$").test(kod)){ alert(ilg+" için Kod = numaranın son "+need+" hanesi (en çok "+need+" haneli sayı; kısaysa tamamı)."); ekod.focus(); return; }
    if(!konu){ ek.focus(); return; }
    const btn=document.getElementById("ag-add"); btn.disabled=true; btn.textContent="Ekleniyor…";
    const {error}=await sb.from("ana_gundem").insert([{kod:kod,kod_prefix:(ilg==='PEM'?'P':'R'),konu,ilgili:ilg,kaynak_tip:ilg.toLowerCase(),turetilmis:false}]);
    btn.disabled=false; btn.textContent="Ekle";
    if(error){ alert(error.message); return; }

  }
  if(ilg==="__new__"){ ilg=(prompt("İlgili kodu (ör. MK, FA):")||"").trim(); }
  ilg=ilg.toUpperCase();
  if(!ilg||!konu){ (ilg?ek:ei).focus(); return; }
  /* İş1: kullanılan İlgili kodu seçenek listesinde yoksa kalıcı olarak ekle */
  { const {data:_ex}=await sb.from("gundem_secenek").select("id").eq("ad",ilg).limit(1);
    if(!_ex||!_ex.length){ const {data:_mx}=await sb.from("gundem_secenek").select("sira").order("sira",{ascending:false}).limit(1);
      await sb.from("gundem_secenek").insert([{ad:ilg,sira:((_mx&&_mx[0]&&_mx[0].sira)||0)+10}]); } }
  const btn=document.getElementById("ag-add"); btn.disabled=true; btn.textContent="Ekleniyor…";
  const {data}=await sb.from("ana_gundem").select("kod").like("kod","M%");
  let mx=0; (data||[]).forEach(r=>{ const m=String(r.kod||"").match(/^M(\d+)$/); if(m) mx=Math.max(mx,+m[1]); });
  const {error}=await sb.from("ana_gundem").insert([{kod:"M"+(mx+1),kod_prefix:"M",konu,ilgili:ilg,kaynak_tip:"manuel",turetilmis:false}]);
  btn.disabled=false; btn.textContent="Ekle";
  if(error){ alert(error.message); return; }
  loadGundem();
}

function startEdit(el){
  if(el.querySelector("input,select")) return;
  const f=el.dataset.f, type=el.dataset.type, id=el.closest("tr").dataset.id;
  const cur=el.textContent.trim().replace(/^\+.*/,"").replace(/^tarih$/,"");
  const inp=document.createElement("input"); inp.className="cell"; inp.type = type==='date'?'date':'text';
  inp.value = type==='date'? "": cur;
  el.innerHTML=""; el.appendChild(inp); inp.focus();
  const commit=async()=>{
    let val=inp.value;
    if(type==='date' && !val){ el.innerHTML='<span style=color:#b7c6d6>tarih</span>'; return; }
    const {error}=await sb.from("ana_gundem").update({[f]:val||null}).eq("id",id);
    if(error){ el.innerHTML='<span style=color:#b40000>hata</span>'; alert(error.message); return; }
    el.textContent = type==='date'? fdate(val) : (val|| "");
    el.classList.add("saveflash"); setTimeout(()=>el.classList.remove("saveflash"),400);
  };
  inp.onblur=commit;
  inp.onkeydown=e=>{ if(e.key==='Enter'){e.preventDefault();inp.blur();} if(e.key==='Escape'){loadGundem();} };
}

const sSum=arr=>arr.reduce((a,r)=>a+(r.pb==='EUR'?(Number(r.net_eur)||0):0),0);
/* SATIS-OZET-EUR (22.09.2026): parantezli değer rakamın SOLUNDA, para birimi EUR */
function eurDelta(v){ const r=Math.round(v); const c=r>0?'#0a6b3f':(r<0?'#b23a2e':'#6a7888'); return `<span style="color:${c}">(${r>0?'+':(r<0?'−':'')}${money(Math.abs(r))} EUR)</span> `; }
/* Üst özet blok: Toplam + bölge satırları (delta = canlı durum − ayın ilk iş günü tabanı, yalnız EUR);
   her bölge satırının hemen altına, aynı Muhtemel/Alınan sütunlarının içine gömülü proje listesi (proje adı + tutar, tutara göre azalan). Toplam satırının altına liste eklenmez. */
function satisSummary(regions,hasBase){
  const cell=(cur,base)=>`${hasBase?eurDelta(cur-base):''}${money(cur)} EUR`;
  const tM=regions.reduce((a,rg)=>a+sSum(rg.cM),0), tA=regions.reduce((a,rg)=>a+sSum(rg.cA),0);
  const tbM=regions.reduce((a,rg)=>a+rg.baseM,0), tbA=regions.reduce((a,rg)=>a+rg.baseA,0);
  const itemList=arr=>arr.length?arr.slice().sort((a,b)=>(Number(b.net_eur)||0)-(Number(a.net_eur)||0))
    .map(r=>{ const ham=(r.hampb&&r.hampb!=='EUR'&&r.ham!=null)?`(${money(r.ham)} ${esc(r.hampb)}) `:'';
      return `<div class="sdi"><span class="sdi-p">${esc(r.proje||"")}</span><span class="sdi-t" title="${ham}${money(r.net_eur)} EUR">${ham}${money(r.net_eur)} ${esc(r.pb||"EUR")}</span></div>`; }).join(''):'';
  let body=`<tr class="stot"><td>Toplam</td><td class="num">${cell(tM,tbM)}</td><td class="num">${cell(tA,tbA)}</td></tr>`;
  regions.forEach(rg=>{
    body+=`<tr class="sreg"><td>${esc(rg.ad)}</td><td class="num">${cell(sSum(rg.cM),rg.baseM)}</td><td class="num">${cell(sSum(rg.cA),rg.baseA)}</td></tr>`;
    body+=`<tr class="sitm"><td></td><td class="sdlist">${itemList(rg.cM)}</td><td class="sdlist">${itemList(rg.cA)}</td></tr>`;
  });
  return `<div class="scroll" style="max-height:none;overflow-y:visible;overflow-x:auto;-webkit-overflow-scrolling:touch;border:0"><table class="ssum"><thead><tr><th></th><th class="num">Muhtemel</th><th class="num">Alınan</th></tr></thead><tbody>${body}</tbody></table></div>`;
}
/* satis_yd_akis'in son_takip_notlari JSON geçmiş-logu ([{t,e,n}], yeni-en-üstte) — yalnız okuma */
function ydTkParse(raw){ if(raw==null||raw==="") return [];
  try{ const v=JSON.parse(raw); if(Array.isArray(v)) return v.map(x=>({t:(x&&x.t)||"",e:(x&&x.e)||"",n:(x&&x.n)||""})); }catch(e){}
  return []; }
function ydTkLatest(r){ const log=ydTkParse(r.son_takip_notlari); return log[0]||{t:r.son_takip_tarihi||"",e:"",n:""}; }
function gunFark(a,b){ const da=(a instanceof Date)?a:new Date(String(a)+'T00:00:00'), db=(b instanceof Date)?b:new Date(String(b)+'T00:00:00');
  return Math.round((da-db)/86400000); }
function iskOrt(rows){
  const vals=[];
  rows.forEach(r=>{ const s=r.iskonto_yuzde; if(s==null||s==='') return;
    String(s).replace(',','.').split('/').forEach(p=>{ const v=parseFloat(p.trim()); if(!isNaN(v)) vals.push(v); }); });
  if(!vals.length) return null;
  return vals.reduce((a,b)=>a+b,0)/vals.length;
}
function pipeGenTbl(title, rows, cols){
  const body=rows.map(r=>'<tr>'+cols.map(c=>{
    const v=c.get?c.get(r):(r[c.f]==null?'':r[c.f]);
    const cls=[c.wcls,c.cls?c.cls(r):''].filter(Boolean).join(' ');
    if(c.html) return `<td class="${cls}">${c.html(r)}</td>`;  /* YD-ONCELIK-PANO: ham HTML hücre */
    return `<td class="${cls}"><div class="cx" title="${esc(String(v))}">${esc(String(v))}</div></td>`;
  }).join('')+'</tr>').join('');
  const head=cols.map(c=>`<th class="${c.wcls||''}"><span class="cw">${esc(c.h)}</span></th>`).join('');
  return `<h3 class="sec" style="margin-top:26px">${esc(title)} <span class="muted">(${rows.length} satır)</span></h3>
    ${rows.length?`<div class="scroll"><table class="sat"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`:'<div class="hint">Satır yok.</div>'}`;
}
/* Yurt Dışı Satış 1+2 (satis_yd_akis) — durum bazlı 4 aşama, her biri YD1/YD2 alt-bloklarına ayrılır; Takipteki Teklifler bloklarının yerini alır */
function pipelineTables(ydRows, today){
  const sorted=ydRows.slice().sort((a,b)=>String(b.gelen_tarih||'').localeCompare(String(a.gelen_tarih||'')));
  const eksik=sorted.filter(r=>!r.durum||r.durum==='Teklif Talebi Geldi');
  const oncelik=sorted.filter(r=>r.durum==='Teklif İncelendi');
  const hazirlik=sorted.filter(r=>r.durum==='Teklif Bekleniyor');
  /* Takiptekiler: Teklif Teslim Tarihi'ne göre eskiden yeniye sıralanır (tarihi olmayanlar en sona) */
  const takiptekiler=sorted.filter(r=>r.durum==='Teklif Teslim Edildi'||r.durum==='Takip Bekleniyor')
    .slice().sort((a,b)=>String(a.teklif_teslim_tarihi||'9999-99-99').localeCompare(String(b.teklif_teslim_tarihi||'9999-99-99')));
  const C1=[
    {h:'Proje',f:'proje'},{h:'Müşteri',f:'musteri'},{h:'Gelen Tarih',get:r=>fdate(r.gelen_tarih)},{h:'İstenen Tarih',get:r=>fdate(r.istenen_tarih)},
    {h:'İhale?',f:'ihale'},{h:'Talebe İlişkin Notlar',f:'talebe_iliskin_notlar'},{h:'Adet',f:'adet'},
    {h:'Ürün Tipi / Serisi',f:'urun_tipi_serisi'},{h:'Kemer/Karolaj',f:'kemer_karolaj'},{h:'Şartname Ahşap?',f:'sartname_ahsap'},
    {h:'Teklif Birimi Notları',f:'teklif_birimi_notlari'}
  ];
  /* Geciken Gün = sayfa açılış tarihi − Teklif Teslim Tarihi (yalnız pozitifse kırmızı gösterilir) */
  const hazGecGun=r=>{ if(!r.teklif_teslim_tarihi) return null; const g=gunFark(today,r.teklif_teslim_tarihi); return g>0?g:null; };
  const C2=[
    {h:'Proje',f:'proje'},{h:'Müşteri',f:'musteri'},{h:'Gelen Tarih',get:r=>fdate(r.gelen_tarih)},{h:'İstenen Tarih',get:r=>fdate(r.istenen_tarih)},
    {h:'Teklif Teslim Tarihi',get:r=>fdate(r.teklif_teslim_tarihi),cls:r=>!r.teklif_teslim_tarihi?'eksikbos':''},  /* TERMIN-BOS-PANO: formdaki TERMIN-BOS kuralı — Teklif Bekleniyor + tarih boş → kırmızı */
    {h:'İhale?',f:'ihale'},{h:'Talebe İlişkin Notlar',f:'talebe_iliskin_notlar'},{h:'Adet',f:'adet'},{h:'Teklif Birimi Notları',f:'teklif_birimi_notlari'},
    {h:'Geciken Gün',get:r=>{const g=hazGecGun(r); return g==null?'':g;},cls:r=>hazGecGun(r)!=null?'gecgun':''}
  ];
  /* Sütun genişlikleri (tk1..tk15): kullanıcının verdiği daraltma yüzdeleri, mevcut auto-genişliğe
     yakın bir taban (başlık uzunluğu + tipik içerik uzunluğu, satis_yd_akis'teki gerçek verinin
     max/ortalama karakter sayısına göre) üzerinden hesaplandı. Net Tutar (tk11) daraltılmadı, sağa hizalı. */
  const tkGecGun=r=>{
    const tt=r.teklif_teslim_tarihi, tk=ydTkLatest(r).t||r.son_takip_tarihi;
    const ref = tk ? ((tt&&tt>tk)?tt:tk) : tt;
    if(!ref) return null;
    const g=gunFark(today,ref)-15;
    return g>0?g:null;
  };
  const C4=[
    {h:'Proje',f:'proje',wcls:'tk1'},{h:'Müşteri',f:'musteri',wcls:'tk2'},{h:'İhale?',f:'ihale',wcls:'tk3'},{h:'Adet',f:'adet',wcls:'tk4'},{h:'Ürün Tipi / Serisi',f:'urun_tipi_serisi',wcls:'tk5'},
    {h:'Kemer / Karolaj',f:'kemer_karolaj',wcls:'tk6'},{h:'Şartname Ahşap?',f:'sartname_ahsap',wcls:'tk7'},{h:'Teklif Teslim Tarihi',get:r=>fdate(r.teklif_teslim_tarihi),wcls:'tk8'},
    {h:'Ağaç',f:'agac',wcls:'tk9'},{h:'İskonto %',f:'iskonto_yuzde',wcls:'tk10'},{h:'Net Tutar',get:r=>(r.net_tutar==null?'':money(r.net_tutar)+' '+(r.para_birimi||'EUR')),wcls:'tk11'},
    {h:'Takip Tarihi',get:r=>{const l=ydTkLatest(r); return l.t?fdate(l.t):'';},wcls:'tk12'},
    {h:'Ekleyen',get:r=>ydTkLatest(r).e||'',wcls:'tk13'},
    {h:'Takip Notları',get:r=>ydTkLatest(r).n||'',wcls:'tk14'},
    {h:'Geciken Gün',wcls:'tk15',get:r=>{const g=tkGecGun(r); return g==null?'':g;},cls:r=>tkGecGun(r)!=null?'gecgun':''}
  ];
  /* Her aşama tablosu Yurt Dışı 1 / Yurt Dışı 2 olarak ikiye ayrılır (blok alanına göre) */
  const two=(title,rows,cols)=>
    pipeGenTbl(title+' - Yurt Dışı 1',rows.filter(r=>r.blok==='YD1'),cols)
    +pipeGenTbl(title+' - Yurt Dışı 2',rows.filter(r=>r.blok==='YD2'),cols);
  /* YD-EKSIK-BOS (2026-09-23, Melih): formdaki kuralın aynısı — durumu boş satırda form sütunu 1-6 ve 8-11
     (Proje, Müşteri, Gelen/İstenen Tarih, İhale?, Adet, Ürün Tipi, Kemer/Karolaj, Şartname Ahşap?) boşsa hücre kırmızı */
  const EKSIK_F=['proje','musteri','musteri_onem_sinifi','gelen_tarih','istenen_tarih','ihale','adet','urun_tipi_serisi','kemer_karolaj','sartname_ahsap'];
  /* YD-EKSIK-ONEM: Eksik bloklarına Müşteri Önem Sınıfı sütunu (Müşteri'den sonra) */
  const C1E=[].concat(C1.slice(0,2),[{h:'Müşteri Önem Sınıfı',f:'musteri_onem_sinifi'}],C1.slice(2)).map(c=>{ const f=c.f||({'Gelen Tarih':'gelen_tarih','İstenen Tarih':'istenen_tarih'})[c.h];
    return EKSIK_F.includes(f)?Object.assign({},c,{cls:r=>(!r.durum&&(r[f]==null||String(r[f]).trim()===''))?'eksikbos':''}):c; });
  return two('Eksik Kaydedilmiş Teklif Talepleri',eksik,C1E)
    +two('Öncelik Belirlenmesi Gerekenler',oncelik,C1.concat([{h:'Öncelik',wcls:'oncsec',html:r=>`<select class="ydonc" data-id="${r.id}" title="Öncelik seç — forma yazılır, satır Teklif Hazırlığında'ya geçer"><option value=""></option>${['1','2','3'].map(o=>`<option${String(r.oncelik||'')===o?' selected':''}>${o}</option>`).join('')}</select>`}]))
    +two('Teklif Hazırlığında',hazirlik,C2)
    +two('Takiptekiler',takiptekiler,C4);
}
/* SATIS-YILLIK-KAYNAK (2026-09-18, Melih kararı): Yıllık Teklif İstatistiği'nin TEK kaynağı canlı
   public.satis_yd_akis (blok=YD1/YD2) — eski satis_takip_stats/satis_takip_stats_2 tabloları DEĞİL.
   Yıl = teklif_teslim_tarihi'nin yılı (altı sütunun HEPSİ için). Eşlemeler:
   Verilen (Ad.) = teklif_teslim_tarihi dolu satırlar · Kazandık (Ad./€) = durum 'Kazandık'
   Kaybettik (€) = durum 'Kaybettik' · Müşteri İşi Alamadı (Ad.) = durum 'Müşteri İşi Alamadı'
   Ortalama İsk. (%) = Kazandık satırlarının net tutarıyla (EUR) AĞIRLIKLANDIRILMIŞ iskonto ortalaması.
   Tutarlar: GBP/USD satırlar EUR'ye çevrilir (arb-kur, yedek: kur_son önbelleği).
   İskonto "42/25" gibi bileşikse BÜYÜK olan alınır. */
/* KUR-ONBELLEK: 1 EUR = rates[X] birim X → tutar_eur = tutar / rates[X].
   Birincil kaynak arb-kur edge fonksiyonu; başarılı olursa sonuç public.kur_son'a
   write-through yazılır (arb_kur_yaz RPC). arb-kur'a ulaşılamazsa son bilinen kur
   kur_son'dan okunur — böylece EUR dışı satırlar toplamdan düşmez. */
let _SATIS_KUR=null;
async function satisKur(){ if(_SATIS_KUR) return _SATIS_KUR;
  let r={EUR:1}, canli=false;
  try{ const {data}=await sb.functions.invoke("arb-kur",{body:{}});
    if(data&&data.ok&&data.rates){ r=Object.assign(r,data.rates); canli=true;
      try{ Promise.resolve(sb.rpc("arb_kur_yaz",{p_rates:data.rates,p_tarih:data.tarih||null})).catch(()=>{}); }catch(e){} } }catch(e){}
  if(!canli){ try{ const {data}=await sb.from("kur_son").select("para_birimi,oran");
    (data||[]).forEach(k=>{ const v=Number(k.oran); if(v>0) r[k.para_birimi]=v; }); }catch(e){} }
  _SATIS_KUR=r; return _SATIS_KUR; }
/* KUR-DONDURMA: öncelik satırda DONMUŞ değerdedir (form kayıt anında yazar, ahsap_alim deseni);
   yalnız o yoksa canlı kur / kur_son önbelleği ile çevrilir. */
function netEur(r,kur){
  if(r.net_tutar_eur!=null){ const d=Number(r.net_tutar_eur); if(isFinite(d)) return d; }
  const v=Number(r.net_tutar); if(!isFinite(v)) return null;
  const pb=r.para_birimi||'EUR'; if(pb==='EUR') return v;
  const k=kur&&kur[pb]; return (k>0)? v/k : null; }
function iskMax(s){ if(s==null||s==='') return null;
  const vals=String(s).replace(',','.').split('/').map(p=>parseFloat(p.trim())).filter(v=>!isNaN(v));
  return vals.length? Math.max.apply(null,vals) : null; }
function yillikTeklifIstatistigi(ydRows,kur){
  const yilOf=r=>r.teklif_teslim_tarihi?Number(String(r.teklif_teslim_tarihi).slice(0,4)):null;
  const S={};
  const bos=()=>({verilen:0,kazAd:0,kazTut:0,kayTut:0,ihaleKayip:0,iskA:0,iskT:0});
  ydRows.forEach(r=>{
    const y=yilOf(r); if(!y) return; const b=r.blok; if(b!=='YD1'&&b!=='YD2') return;
    S[y]=S[y]||{YD1:bos(),YD2:bos()};
    const o=S[y][b]; o.verilen++;
    const e=netEur(r,kur);
    if(r.durum==='Kazandık'){ o.kazAd++; if(e!=null) o.kazTut+=e;
      const i=iskMax(r.iskonto_yuzde); if(i!=null&&e!=null&&e>0){ o.iskA+=e; o.iskT+=i*e; } }
    else if(r.durum==='Kaybettik'){ if(e!=null) o.kayTut+=e; }
    else if(r.durum==='Müşteri İşi Alamadı'){ o.ihaleKayip++; }
  });
  const years=Object.keys(S).map(Number).sort((a,b)=>b-a);
  const cellsFor=o=>`<td class="num">${o.verilen}</td><td class="num">${o.kazAd}</td><td class="num">${o.iskA>0?Math.round(o.iskT/o.iskA)+'%':'—'}</td><td class="num">${money(o.kazTut)}</td><td class="num">${money(o.kayTut)}</td><td class="num">${o.ihaleKayip}</td>`;
  const body=years.length? years.map(y=>`<tr><td class="kod">${y}</td>${cellsFor(S[y].YD1)}${cellsFor(S[y].YD2)}</tr>`).join('')
    : `<tr><td colspan="13">— (veri bekleniyor)</td></tr>`;
  const grp2=c=>`<th class="num grpc">Verilen<br>(Ad.)</th><th class="num">Kazandık<br>(Ad.)</th><th class="num">Ortalama<br>İsk. (%)</th><th class="num">Kazandık<br>(€)</th><th class="num">Kaybettik<br>(€)</th><th class="num">Müşteri İşi<br>Alamadı (Ad.)</th>`;
  return `<h3 class="sec" style="margin-top:26px">Yıllık Teklif İstatistiği</h3>
    <div class="scroll"><table class="tks"><thead>
    <tr><th rowspan="2"></th><th colspan="6" class="grph">Yurt Dışı 1</th><th colspan="6" class="grph">Yurt Dışı 2</th></tr>
    <tr>${grp2()}${grp2()}</tr>
    </thead><tbody>${body}</tbody></table></div>`;
}

/* ---------- HAZIR PEM/PRJ ---------- */

    sb.from("hazir_pem_prj").select("*"),

    /* SEVK-CANLI-OZET (07.09.2026): "Sevk Durum Değişimi" artık AYLIK GÜNCELLE düğmesine
       basılmasını beklemez. onceki<>guncel olan satırda CANLI özet (canli_ozet) gösterilir;
       satır düğmeden bu yana değişmemişse son düğme özeti (degisim_ozet). Bayat satır varsa
       aşağıda sevk-degisim-ozet fonksiyonu mod:"canli" ile bir kez çağrılıp pano tazelenir. */
    sb.from("sevk_durumu_onur").select("tur,kalem_key,degisim_ozet,canli_ozet,canli_kaynak,onceki,guncel"),
    sb.from("erp_yukleme").select("damga").order("damga",{ascending:false}).limit(1),
    sb.from("pano_adet_ozet").select("damga,pem_adet,prj_adet").limit(2),
    /* HAZIR-IKI-DAMGA: sevk durumu damgası = OE formundaki AYLIK GÜNCELLE düğmesine son basılma
       (pano_yayin.oe_sevk). sevk_durumu_onur.updated_at KULLANILMAZ — o satır-bazlı otomatik
       kayıttır (hücreye yazma), düğmeye basma değil. */
    sb.from("pano_yayin").select("yayin_at").eq("anahtar","oe_sevk").limit(1)
  ]);
  if(error){ view.innerHTML=`<div class="load">Hata: ${esc(error.message)}</div>`; return; }
  const erpMap={}; (erpRes.data||[]).forEach(r=>{ erpMap[String(r.tur).toUpperCase()+"|"+r.kalem_key]=r.erp||{}; });
  const trm=v=>String(v==null?"":v).trim();
  const sevkSig=r=>trm(r.onceki)+" >>> "+trm(r.guncel);   /* edge fn ile birebir aynı imza */
  const ozMap={}; let sevkBayat=0;
  (ozRes.data||[]).forEach(r=>{
    const k=String(r.tur).toUpperCase()+"|"+r.kalem_key;
    const degisti = trm(r.onceki) && trm(r.onceki)!==trm(r.guncel);
    ozMap[k] = !trm(r.onceki) ? "" : (degisti ? (r.canli_ozet||"") : (r.degisim_ozet||r.canli_ozet||""));
    if(trm(r.guncel) && trm(r.onceki) && trm(r.canli_kaynak)!==sevkSig(r) && !(!degisti && trm(r.degisim_ozet))) sevkBayat++;
  });
  /* Filtre (her ingest sonrası otomatik geçerli):
     1) Termin tarihi (PEM) / AÜP tarihi (PRJ) BOŞ olan kalemler gösterilmez.
     2) Bu tarih, panonun güncelleme tarihinden (son ERP damgası) geriye doğru 10 gün içindeyse gösterilmez. */
  const _dmg=String((dgRes&&dgRes.data&&dgRes.data[0]&&dgRes.data[0].damga)||"");
  const _ref=/^\d{6}$/.test(_dmg)? new Date(2000+Number(_dmg.slice(0,2)),Number(_dmg.slice(2,4))-1,Number(_dmg.slice(4,6))) : new Date();
  _ref.setHours(23,59,59,999);
  const _cut=new Date(_ref); _cut.setHours(0,0,0,0); _cut.setDate(_cut.getDate()-10);
  const filt=(data||[]).filter(r=>{
    const dt=r.hazir_tarihi; if(!dt) return false;
    const d=new Date(dt); if(isNaN(d)) return false;
    return !(d>=_cut);
  });
  const digits=s=>String(s==null?"":s).replace(/\D/g,"");
  const lastN=(s,n)=>{ const d=digits(s); return d.slice(-n); };
  const ev=(tur,no,k)=>{ const e=erpMap[tur+"|"+no]||{}; return e[k]!=null?String(e[k]):""; };
  const block=tip=>{
    const T=tip==="pem"?"PEM":"PRJ";
    const rowsX=filt.filter(r=>String(r.tur||"").toUpperCase()===T);
    if(!rowsX.length) return "";
    const noteCol=tip==="pem"?"ekbilgi":"notlar", dcol=tip==="pem"?"termin":"aup";
    const noteHd=tip==="pem"?"Ek Bilgi":"Satış/Şantiye Notları", dateHd=tip==="pem"?"Termin Tarihi":"AÜP Tarihi";
    const kodW="h8";  /* PEM+PRJ kod aynı genişlik → son 4 sütun hizalı (6d) */

    const body=sorted.map(r=>{

      let adet=ev(T,r.no,"adet")||(r.adet==null?"":String(r.adet));
      if(adet!==""&&isFinite(parseFloat(adet))) adet=String(Math.round(parseFloat(adet)));
      const dt=ev(T,r.no,dcol)||r.hazir_tarihi||"";
      const onur=r.onur_guncel||"", oz=ozMap[T+"|"+r.no]||"";
      return `<tr>`
        +`<td class="c ${kodW}"><span title="${esc(kod)}">${esc(kod)}</span></td>`

        +`<td class="c h3"><span>${esc(adet)}</span></td>`
        +`<td class="c hdt"><span title="${esc(dt)}">${esc(fdate(dt)||dt)}</span></td>`
        +`<td class="c h20"><span title="${esc(onur)}">${esc(onur)}</span></td>`
        +`<td class="c h20"><span title="${esc(oz)}">${esc(oz)}</span></td>`
        +`</tr>`;
    }).join("");
    /* Blok başlığı (h3 "PEM"/"PRJ") YOK — blok kimliği ilk sütun başlığında: PEM / Proje.
       Adetler damga satırında (PEM Adet / PRJ Adet). */
    const kodHd=tip==="pem"?"PEM":"Proje";
    const heads=`<th>${kodHd}</th><th>Proje Adı</th><th>${noteHd}</th><th>Adet</th><th>${dateHd}</th><th>Sevk Durumu (Onur)</th><th>Sevk Durum Değişimi</th>`;
    return `<div class="scroll hblk"><table><thead><tr>${heads}</tr></thead><tbody>${body}</tbody></table></div>`;
  };
  const st=await erpStamp();
  const a0=(adRes&&adRes.data&&adRes.data[0])||{}, a1=(adRes&&adRes.data&&adRes.data[1])||{};
  const oeAt=(oeRes&&oeRes.data&&oeRes.data[0])?oeRes.data[0].yayin_at:null;
  const hStamp='<div class="stamp">ERP: '+(st||"—")+' · Sevk durumu (OE): '+(oeAt?dOnly(oeAt):"—")
    +' · PEM Adet: '+Math.round(Number(a0.pem_adet)||0)+pctSpan(a0.pem_adet,a1.pem_adet)
    +' · PRJ Adet: '+Math.round(Number(a0.prj_adet)||0)+pctSpan(a0.prj_adet,a1.prj_adet)+'</div>';
  view.innerHTML=`${hStamp}
    <style>.hblk table{font-size:11.5px}.hblk th,.hblk td{white-space:nowrap;padding:2px 6px;border-bottom:1px solid #eef1f5;line-height:16px}.hblk thead th{vertical-align:bottom}.hblk .c>span{display:block;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;white-space:nowrap}.hblk .c>span::-webkit-scrollbar{display:none}.h3>span{width:3ch}.h5>span{width:5ch}.h8>span{width:8ch}.h15>span{width:15ch}.h20>span{width:68ch}.h25>span{width:25ch}.hdt>span{width:12.45ch}</style>
    ${block("pem")}
    ${block("prj")}`;
  /* Bayat satır varsa canlı özetleri bir kez üret, sonra panoyu tazele (idempotent: fonksiyon
     yalnız imzası değişmiş satırlar için LLM çağırır, hepsi güncelse hiç çağırmaz). */
  if(sevkBayat && !window.__sevkCanliCalisti){
    window.__sevkCanliCalisti=true;
    const s=document.createElement("span");
    s.style.cssText="color:#8a6100;font-weight:600;margin-left:8px";
    s.textContent="· sevk değişim özetleri üretiliyor…";
    const stEl=view.querySelector(".stamp"); if(stEl) stEl.appendChild(s);
    try{
      const {data,error}=await sb.functions.invoke("sevk-degisim-ozet",{body:{mod:"canli"}});
      if(error||(data&&data.ok===false)) s.textContent="· özet üretilemedi";
      else { if(document.querySelector('.tabs button[data-t="hazir"].active')) return loadHazir(); }
    }catch(e){ s.textContent="· özet üretilemedi"; }
  }
}

/* ---------- AÜP (salt-okur) ---------- */
async function loadAup(){
  const view=document.getElementById("view");
  const [{data,error},oz]=await Promise.all([sb.from("aup_panosu").select("*").order("aup",{ascending:true}), sb.from("aup_ozet").select("*").order("damga",{ascending:false}).limit(2)]);
  if(error){ view.innerHTML=`<div class="load">Hata: ${esc(error.message)}</div>`; return; }
  const dk=d=>{ d=String(d||""); const i=d.indexOf(" "); return i<0?d:(d.slice(0,i)+" "+d.slice(i+1,i+4)); };
  /* Hücre deseni = Hazır PEM/PRJ panosu: her hücre tek satır, sığmayan içerik yatayda kaydırılır
     (scrollbar gizli), tam metin title ile hover'da görünür. Metin KIRPILMAZ — sütun genişliği
     kadarı görünür, gerisi kaydırılarak okunur. */
  let rows="";
  data.forEach(r=>{
    const ga=r.gyt_aup, ky=r.kayma;
    const pad=String(r.proje_adi||""), dur=String(r.proje_durumu||"");
    const sn=String(r.satis_santiye_notlari||""), un=String(r.uretim_notlari||"");
    rows+=`<tr>
      <td class="c kod a6"><span title="${esc(r.proje_no)}">${esc(String(r.proje_no||"").slice(-6))}</span></td>
      <td class="c a30"><span title="${esc(pad)}">${esc(pad)}</span></td>
      <td class="c a10"><span title="${esc(dur)}">${esc(dk(r.proje_durumu))}</span></td>
      <td class="num">${esc(r.adet)}</td>
      <td class="num ctr">${fdate(r.mvt)}</td>
      <td class="num ctr">${fdate(r.aup)}</td>
      <td class="num ctr">${fdate(r.gyt)}</td>
      <td class="num pstd ${ga<0?'red':''}">${ga==null?'':ga}</td>
      <td class="num ${ky>=3?'red':''}">${ky==null?'':ky}</td>
      <td class="num">${money(r.anlasma_fiyati)}</td>
      <td class="c ss${r.satis_santiye_notlari?' snpink':''}"><span title="${esc(sn)}">${esc(sn)}</span></td>
      <td class="c ur"><span title="${esc(un)}">${esc(un)}</span></td>
    </tr>`;
  });
  const st=await erpStamp();
  const o0=(oz.data&&oz.data[0])||{}, o1=(oz.data&&oz.data[1])||{};
  const pct=(a,b)=>{ a=Number(a)||0; b=Number(b)||0; if(!b) return ""; const v=Math.round((a-b)/Math.abs(b)*100); return ' <span style="color:'+(v>=0?'#0a6b3f':'#b23a2e')+'">('+(v>=0?'+':'−')+Math.abs(v)+'%)</span>'; };
  const gk=Number(o0.global_kayma||0).toFixed(1).replace(".",",");
  const stamp='<div class="stamp">Son güncelleme: '+(st||"—")+' · Adet: '+money(o0.toplam_adet)+pct(o0.toplam_adet,o1.toplam_adet)+' · Tutar: '+money(o0.toplam_tutar)+' €'+pct(o0.toplam_tutar,o1.toplam_tutar)+' · Global kayma: '+gk+' gün</div>';
  view.innerHTML=`${stamp}
    <style>
    #view table.aupmain td,#view table.aupmain th{white-space:nowrap;padding:2px 6px;line-height:16px}
    #view table.aupmain td.c>span{display:block;white-space:nowrap;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
    #view table.aupmain td.c>span::-webkit-scrollbar{display:none}
    #view table.aupmain td.ss,#view table.aupmain td.ur{white-space:nowrap;vertical-align:middle}
    /* AUP-COLFIX (07.09.2026): sütun genişlikleri artık span'ın ch genişliğinden DEĞİL, colgroup'tan
       gelir. Sebep: span'a ch genişliği verilse bile Chrome hücrenin max-content'ini metnin tam
       genişliğinden hesaplıyor ve tablo, kapsayıcı genişliğine kadar orantılı yayılıyordu — bu
       yüzden DURUM ile Ad arasında kullanılmayan boşluk kalıyordu. table-layout:fixed + width:1px
       (bkz. CLAUDE.md "Sabit sütunlu tablolarda kural") ile tablo tam colgroup toplamı kadar olur. */
    #view table.aupmain{table-layout:fixed;width:1px}
    #view table.aupmain td.c>span{width:100%}
    /* MVT · AÜP · PST sütunları ortalanır (07.09.2026, Melih). */
    #view table.aupmain td.ctr,#view table.aupmain thead th.ctr{text-align:center}
    /* PST-AÜP başlığı iki satıra sarılır (fixed düzende nowrap olsaydı kırpılırdı). */
    #view table.aupmain thead th.pstd{white-space:normal;line-height:11px}
    </style>
    <div class="scroll aupwrap"><table class="aup aupmain">
    <colgroup>${AUP_COLW.map(w=>'<col style="width:'+w+'px">').join("")}</colgroup>
    <thead><tr><th>NO</th><th>PROJE ADI</th><th>DURUM</th><th>Ad</th><th class="ctr">MVT</th><th class="ctr">AÜP</th><th class="ctr">PST</th><th class="pstd">PST-AÜP</th><th>Kayma</th><th>TUTAR €</th><th class="ss">Satış-Şantiye Notu</th><th class="ur">Üretim Notu</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
  aupFit();
}
/* AUP-COLW: NO · PROJE ADI · DURUM · Ad · MVT · AÜP · PST · PST-AÜP · Kayma · TUTAR € · Satış-Şantiye · Üretim
   (12px gövde yazısında 1ch ≈ 6,47px + 12px hücre dolgusu). PROJE ADI / Satış-Şantiye / Üretim
   07.09.2026'da %12 daraltıldı (30→26,4ch · 40→35,2ch · 67,5→59,4ch), DURUM 10→7,5ch. */
const AUP_COLW=[51,183,61,34,64,64,64,32,44,57,240,396];
/* AUP-FIT: tablo kutusu pencerenin altına kadar uzar — sabit 82vh sınırı altta boş bant bırakıyordu. */
function aupFit(){
  const w=document.querySelector("#view .aupwrap"); if(!w) return;
  w.style.maxHeight=Math.max(240,Math.round(window.innerHeight-w.getBoundingClientRect().top-10))+"px";
}
window.addEventListener("resize",()=>{ if(document.querySelector("#view .aupwrap")) aupFit(); });


/* ---------- BILANÇO (bilanco_ozet view + gider detay) ---------- */
async function loadBilanco(tgt){
  const view=document.getElementById(tgt||"view");
  const [{data,error},g7,gd]=await Promise.all([
    sb.from("bilanco_ozet").select("*"),
    sb.from("gider_710_kalem").select("*").order("sira_no",{ascending:true}),
    sb.from("bilanco_gider_detay").select("yil,ust,ad,tutar_tl").eq("ust","girdi")
  ]);
  if(error){ view.innerHTML=`<div class="load">Hata: ${esc(error.message)}</div>`; return; }
  const rowsD=(data||[]).slice().sort((a,b)=>b.yil-a.yil);
  /* Üstteki 4 KPI kutusu (Net Satış · Toplam Maliyet · Kâr/Zarar · Kâr Marjı) KALDIRILDI
     (26.08.2026, Melih): aynı bilgi tablonun ilk satırında zaten var. */
  /* 710 MALZEME İKİYE AYRILDI: "710 Ahşap Mlz" = 710 listesinin ilk grubu (1 AHŞAP HAMMADDE
     ALIMLARI) · "710 Diğer Mlz" = k710_tl − Ahşap. Ahşap değeri 2025 ve sonrası için CANLI
     olarak gider_710_kalem'den (grup satırı, sira="1") gelir; 2024 ve öncesi SB tablosundan
     bilanco_yil.k710_ahsap_tl'ye yazılmıştır ve o değer önceliklidir. */
  const g7all=(g7&&!g7.error)?(g7.data||[]):[];
  const ahsapYil={};
  g7all.forEach(r=>{ if(r.grup && String(r.sira||"").trim()==="1"){ const y=parseInt(String(r.donem).slice(0,4),10); if(y) ahsapYil[y]=Number(r.alinan_tutar)||0; } });
  const ahsapOf=r=>(r.k710_ahsap_tl!=null?Number(r.k710_ahsap_tl):(ahsapYil[r.yil]!=null?ahsapYil[r.yil]:null));
  /* 710 CAM AYRI SÜTUN (09.09.2026, Melih): "710 Cam" = listedeki CAM (2.1) + CAM TAKOZU (2.2)
     kalem satırlarının toplamı; "710 Diğer Mlz" artık k710_tl − Ahşap − Cam. Eşleşme cinsi'nin
     TAM adıyla yapılır — "CAM ÇITASI" (2.12) BİLEREK DIŞARIDA, o Diğer'de kalır.
     2025 ve sonrası canlı listeden gelir.
     2022–2024'te 710 kalem listesi YOK; o yılların kaynağı `bilanco_gider_detay` tablosundaki
     `ust='girdi'` kırılımıdır (Ahşap · Cam · Alu · Aksesuar · Diğer Girdi — beşinin toplamı
     `k710_tl` ile BİREBİR tutar, doğrulandı) → Cam = "Cam Girdi" satırı (`GIRDI-CAM`).
     2021 ve öncesinde gider verisi hiç olmadığı için Cam "—" kalır. */
  const CAM_AD=["CAM","CAM TAKOZU"];
  const camYil={};
  g7all.forEach(r=>{ if(!r.grup && CAM_AD.includes(String(r.cinsi||"").trim().toLocaleUpperCase("tr-TR"))){ const y=parseInt(String(r.donem).slice(0,4),10); if(y) camYil[y]=(camYil[y]||0)+(Number(r.alinan_tutar)||0); } });
  /* GIRDI-CAM: 2022–2024 cam kaynağı. */
  const camGirdi={};
  ((gd&&!gd.error)?(gd.data||[]):[]).forEach(r=>{ if(String(r.ad||"").trim().toLocaleLowerCase("tr-TR")==="cam girdi" && r.yil!=null) camGirdi[r.yil]=(camGirdi[r.yil]||0)+(Number(r.tutar_tl)||0); });
  const camOf=r=>(r.k710_cam_tl!=null?Number(r.k710_cam_tl):(camYil[r.yil]!=null?camYil[r.yil]:(camGirdi[r.yil]!=null?camGirdi[r.yil]:null)));
  let rows="";
  rowsD.forEach(r=>{
    const k=r.kar_tl, hasK=k!=null;
    const kc=hasK?`<td class="num" style="color:${k>=0?'#0a6b3f':'#b23a2e'};font-weight:600">${k>=0?'+':'−'}${money(Math.abs(k))}</td>`:'<td class="num" style="color:#c2ccd6">—</td>';
    const mc=hasK?`<td class="num" style="color:${k>=0?'#0a6b3f':'#b23a2e'}">${Number(r.marj).toFixed(1).replace(".",",")}%</td>`:'<td class="num" style="color:#c2ccd6">—</td>';
    const g=v=>v==null?'<td class="num" style="color:#c2ccd6">—</td>':`<td class="num">${money(v)}</td>`;
    /* Pay sütunları NET SATIŞ'a orandır (toplam gidere değil — 27.08.2026, Melih). */
    const tg=r.net_tl;
    const p=v=>(v==null||tg==null||Number(tg)===0)?'<td class="num" style="color:#c2ccd6">—</td>':`<td class="num" style="color:#6a7888">%${Math.round(v/tg*100)}</td>`;
    const ah=ahsapOf(r), cm=camOf(r);
    const dg=(ah==null||r.k710_tl==null)?null:(Number(r.k710_tl)-ah-(cm||0));
    rows+=`<tr><td class="kod">${esc(r.yil)}</td><td class="num">${money(r.net_tl)}</td><td class="num">${money(r.net_eur)}</td>${g(ah)}${p(ah)}${g(cm)}${p(cm)}${g(dg)}${p(dg)}${g(r.k720_tl)}${p(r.k720_tl)}${g(r.k730_tl)}${p(r.k730_tl)}${g(r.toplam_gider_tl)}${kc}${mc}</tr>`;
  });
  /* 710 kalem listesi — TEK liste, dönemler YAN YANA (yeni → eski).
     Sabit sütunlar: Sıra · Cinsi · Birim. Her dönem için: Dönem İçi Alınan (€) · Birim Fiyat (€) · Pay (%).
     Kaynak TL'dir; € = TL / dönemin ORTALAMA EUR/TRY kuru (x-rates.com aylık ortalamalarının
     gün-ağırlıklı ortalaması): 2025 (12 ay) = 44,82 · 2026-6 (Oca–Haz) = 52,05.
     YENİ DÖNEM EKLENDİĞİNDE kurunu da G7KUR'a ekle; kuru olmayan dönem "—" gösterir.
     Birim Fiyat = dönem içi alınan tutar / dönem içi alınan miktar. Pay = dönem toplamına oran. */
  const G7KUR={"2025":44.82,"2026-6":52.05};
  const g7rows=(g7&&!g7.error)?(g7.data||[]):[];
  const donemler=[...new Set(g7rows.map(r=>r.donem))].sort().reverse();
  const eur=(tl,k)=>(!k||tl==null||!isFinite(Number(tl)))?null:Number(tl)/k;
  const e0=v=>v==null?"":Math.round(v).toLocaleString("tr-TR");
  const e2=v=>v==null?"":Number(v).toLocaleString("tr-TR",{minimumFractionDigits:2,maximumFractionDigits:2});
  const g710Box=()=>{
    if(!g7rows.length||!donemler.length) return "";
    /* Satır kimliği = sira_no (dönemler arasında birebir aynı liste). */
    const keys=[...new Set(g7rows.map(r=>r.sira_no))].sort((a,b)=>a-b);
    const byK={}; g7rows.forEach(r=>{ (byK[r.sira_no]=byK[r.sira_no]||{})[r.donem]=r; });
    const tot={}; donemler.forEach(d=>{ tot[d]=g7rows.filter(r=>r.donem===d&&r.grup).reduce((a,r)=>a+(Number(r.alinan_tutar)||0),0); });
    const cells=(r,d)=>{
      const k=G7KUR[d];
      if(!r||!k) return `<td class="num g7s" style="color:#c2ccd6">—</td><td class="num" style="color:#c2ccd6">—</td><td class="num" style="color:#c2ccd6">—</td>`;
      const tl=Number(r.alinan_tutar)||0, mk=Number(r.alinan_miktar)||0;
      /* Grup satırında birim fiyat YOK — grup miktarı farklı birimlerin (m3+adet+kg) toplamıdır. */
      const e=eur(tl,k), bf=(!r.grup&&mk>0&&tl>0)?eur(tl/mk,k):null;
      const py=tot[d]&&tl?(tl/tot[d]*100):null;
      return `<td class="num g7s">${tl?e0(e):""}</td><td class="num">${bf==null?"":e2(bf)}</td>`
        +`<td class="num" style="color:#6a7888">${py==null?"":("%"+py.toLocaleString("tr-TR",{minimumFractionDigits:1,maximumFractionDigits:1}))}</td>`;
    };
    const body=keys.map(k=>{
      const any=donemler.map(d=>byK[k]&&byK[k][d]).find(Boolean)||{};
      return `<tr${any.grup?' class="grp"':''}><td class="kod">${esc(any.sira)}</td><td>${esc(any.cinsi)}</td><td>${esc(any.birim||"")}</td>`
        +donemler.map(d=>cells(byK[k]&&byK[k][d],d)).join("")+`</tr>`;
    }).join("");
    const totRow=`<tr class="itot"><td></td><td>LİSTE TOPLAMI</td><td></td>`
      +donemler.map(d=>`<td class="num g7s">${G7KUR[d]?e0(eur(tot[d],G7KUR[d])):"—"}</td><td class="num"></td><td class="num">${G7KUR[d]?"%100,0":""}</td>`).join("")
      +`</tr>`;
    const h1=`<tr><th rowspan="2">Sıra</th><th rowspan="2">Cinsi</th><th rowspan="2">Birim</th>`
      +donemler.map(d=>`<th colspan="3" class="g7s g7h">${esc(d)}${G7KUR[d]?` <span class="g7k">(kur ${String(G7KUR[d]).replace(".",",")})</span>`:""}</th>`).join("")+`</tr>`;
    const h2=`<tr>`+donemler.map(()=>`<th class="num g7s">Dönem İçi Alınan (€)</th><th class="num">Birim Fiyat (€)</th><th class="num">Pay (%)</th>`).join("")+`</tr>`;
    const adet=g7rows.filter(r=>r.donem===donemler[0]&&!r.grup).length;
    return `<details class="g7box"><summary>710 — Direkt İlk Madde/Malzeme listesi <span class="muted">(${adet} kalem · ${esc(donemler.join(" · "))})</span></summary>
      <div class="scroll"><table class="g7t"><thead>${h1}${h2}</thead><tbody>${body}${totRow}</tbody></table></div></details>`;
  };
  const st=await tblStamp("bilanco_yil");
  view.innerHTML=`${stampHTML(st)}
    <style>.g7box{background:#fff;border:1px solid #dde3ea;border-radius:8px;padding:4px 10px;margin:6px 0;width:max-content;max-width:100%}
    .g7box>summary{cursor:pointer;font-weight:700;color:#16324f;font-size:12px;padding:2px 0}
    .g7box[open]>summary{margin-bottom:4px}
    table.g7t td.g7s,table.g7t th.g7s{border-left:2px solid #cdd8e4}
    table.g7t th.g7h{text-align:center;background:#22456b}
    table.g7t .g7k{font-weight:400;opacity:.8}
    table.g7t thead th{vertical-align:bottom}
    table.g7t thead tr:first-child th{top:0;z-index:3}
    table.g7t thead tr:nth-child(2) th{top:22px;z-index:2}</style>
    <div class="scroll"><table>
    <thead><tr><th>Yıl</th><th class="num">Net Satış (TL)</th><th class="num">Net (€)</th><th class="num">710 Ahşap Mlz</th><th class="num">Ahşap %</th><th class="num">710 Cam</th><th class="num">Cam %</th><th class="num">710 Diğer Mlz</th><th class="num">Diğer %</th><th class="num">720 İşçilik</th><th class="num">720 %</th><th class="num">730 GÜG</th><th class="num">730 %</th><th class="num">Toplam Gider</th><th class="num">Kâr/Zarar</th><th class="num">Marj</th></tr></thead>
    <tbody>${rows}</tbody></table></div>
    ${g710Box()}`;
}


/* ---------- YILLIK İCMAL (icmal_ozet view) ---------- */
async function loadIcmal(tgt){
  const view=document.getElementById(tgt||"view");
  const [ic,bl]=await Promise.all([
    sb.from("icmal_satir").select("*").order("sira",{ascending:true}),
    sb.from("fiyat_parametre_log").select("*").eq("anahtar","baz_iskonto").order("gecerli_baslangic",{ascending:true})
  ]);
  const {data,error}=ic;
  if(error){ view.innerHTML=`<div class="load">Hata: ${esc(error.message)}</div>`; return; }
  /* Sütun sırası (27.08.2026, Melih): Miktar (DK1) ve Top.Per birer "lider" sütun — sağlarındaki
     ikişer ayrıntı sütunu (Miktar Ad + m² · İd.Per + Ür.Per) VARSAYILAN GİZLİ, lider başlığa
     tıklanınca açılır/kapanır (Ahşap panosundaki yıl→ay deseninin aynısı). */
  const F=["dk1_ad","adet","m2","net_eur","ort_kur","net_tl","netfi_eur_m2","netfi_eur_ad","top_per","id_per","ur_per","ciro_per_eur","isk","kapasite_ad_ay","onaysiz_ad","onay_ter_hf","urt_ad","son_proje_cikis","so_alinan_eur","so_muht_eur","fa_alinan_eur","fa_muht_eur","top_alinan_eur","alinan_ter_hf","top_muht_eur","fr_isk_pct","dig_isk_pct"];
  const IC_LIDER={dk1_ad:"mik", top_per:"per"};          /* lider sütun → grup kodu */
  const IC_GIZLI={adet:"mik", m2:"mik", id_per:"per", ur_per:"per"};   /* gizli ayrıntı sütunları */
  /* DAR sütunlar: verisi en çok 4-5 hane olanlar. Başlık sarma sınırı bunlarda 4,5ch'e iner
     (uzun sözcük varsa sözcük genişliği taban olur) → başlığın açtığı sol boşluk kalkar.
     Verisi geniş sütunlara uygulanmaz; orada sınırı düşürmek başlığı uzatır, sütunu daraltmaz. */
  const IC_DAR=new Set(["adet","m2","ort_kur","netfi_eur_m2","netfi_eur_ad","id_per","ur_per","top_per","isk","kapasite_ad_ay","onaysiz_ad","onay_ter_hf","urt_ad","alinan_ter_hf","fr_isk_pct","dig_isk_pct"]);
  /* YIL TOPLAM SATIRI PANODA HESAPLANIR (DB'deki değer kullanılmaz).
     Sebep: icmal_satir'ın is_total satırlarını hiçbir betik güncellemiyordu (worker/us_icmal ve
     icmal_satis_yaz yalnız is_total=false satırlara yazar) → yeni ay girilince yıl toplamı
     geride kalıyordu (07.26 eklendiğinde "2026 Top." Ocak–Haziran'da kalmıştı).
     Kural: SUMF = altındaki ayların toplamı · türevler orandan · personel/Ciro-Per dolu ayların
     ORTALAMASI · İsk brüt-ağırlıklı (brüt = net/(1-isk/100)). Ayların hiçbirinde veri yoksa
     sütun DB'deki haliyle bırakılır (2011-13 dk1_ad gibi). Satır düzeni: toplam, sonra o yılın ayları. */
  const SUMF=["adet","dk1_ad","m2","net_eur","net_tl"];
  const AVGF=["id_per","ur_per","top_per","ciro_per_eur"];
  const trNum=s=>{ if(s==null||s==="") return null; const v=parseFloat(String(s).replace(/\./g,"").replace(",",".")); return isFinite(v)?v:null; };
  const rowsA=(data||[]).slice();
  for(let i=0;i<rowsA.length;i++){
    if(!rowsA[i].is_total) continue;
    const T=rowsA[i], acc={}, sum={}, cnt={};
    AVGF.forEach(f=>acc[f]=[]); SUMF.forEach(f=>{ sum[f]=0; cnt[f]=0; });
    let net=0, brut=0;
    for(let j=i+1; j<rowsA.length && !rowsA[j].is_total; j++){
      const m=rowsA[j];
      AVGF.forEach(f=>{ const v=trNum(m[f]); if(v) acc[f].push(v); });
      SUMF.forEach(f=>{ const v=trNum(m[f]); if(v!=null){ sum[f]+=v; cnt[f]++; } });
      const ne=trNum(m.net_eur), ik=trNum(m.isk);
      if(ne!=null && ik!=null && ik!==100){ net+=ne; brut+=ne/(1-ik/100); }
    }
    SUMF.forEach(f=>{ if(cnt[f]) T[f]=money(sum[f]); });
    if(cnt.net_eur && sum.net_tl)  T.ort_kur=money(sum.net_tl/sum.net_eur);
    if(cnt.net_eur && sum.m2)      T.netfi_eur_m2=money(sum.net_eur/sum.m2);
    if(cnt.net_eur && sum.adet)    T.netfi_eur_ad=money(sum.net_eur/sum.adet);
    if(brut) T.isk=money((1-net/brut)*100);
    AVGF.forEach(f=>{ if(acc[f].length) T[f]=money(acc[f].reduce((a,b)=>a+b,0)/acc[f].length); });
  }
  /* "Yurt Dışı" sütunu = Yurt Dışı 1 (fa_*) + Yurt Dışı 2 (fy2_*); FY2 girilmemiş aylarda
     yalnız FY görünür. FY2 doluysa Toplam da (Yurt İçi + YD1 + YD2) olarak yeniden hesaplanır. */
  rowsA.forEach(r=>{
    const yd2a=trNum(r.fy2_alinan_eur), yd2m=trNum(r.fy2_muht_eur);
    if(yd2a){ r.fa_alinan_eur=money((trNum(r.fa_alinan_eur)||0)+yd2a); r.top_alinan_eur=money((trNum(r.so_alinan_eur)||0)+(trNum(r.fa_alinan_eur)||0)); }
    if(yd2m){ r.fa_muht_eur=money((trNum(r.fa_muht_eur)||0)+yd2m); r.top_muht_eur=money((trNum(r.so_muht_eur)||0)+(trNum(r.fa_muht_eur)||0)); }
  });
  /* YD1 İsk. / YD2 İsk. = o aya isabet eden SON baz iskonto (Fiyatlandırma panosu: FR / Diğer).
     Kaynak fiyat_parametre_log — fiyat_parametre üstündeki trigger her değer değişiminde bir satır
     bırakır (kod/fiyat_parametre_log_260826.sql). Log'un başlangıcından ÖNCEKİ aylar icmal_satir'daki
     elle girilmiş değerde kalır (Melih kararı 26.08.2026). */
  const BIL=(bl&&!bl.error)?(bl.data||[]):[];
  const pctNum=s=>{ const m=String(s==null?"":s).match(/-?\d+([.,]\d+)?/); return m?m[0].replace(",","."):null; };
  if(BIL.length) rowsA.forEach(r=>{
    if(r.is_total) return;
    const d=String(r.donem||""); if(!/^\d{2}\.\d{2}$/.test(d)) return;
    const ay=+d.slice(0,2), yil=2000+ +d.slice(3,5);
    const sonGun=new Date(Date.UTC(yil,ay,0)).toISOString().slice(0,10);
    let hit=null; BIL.forEach(x=>{ if(String(x.gecerli_baslangic)<=sonGun) hit=x; });
    if(hit){ r.fr_isk_pct=pctNum(hit.fransa_deger); r.dig_isk_pct=pctNum(hit.diger_deger); }
  });
  let rows="";
  rowsA.forEach(r=>{
    let tds='<td class="kod">'+esc(r.donem)+'</td>';
    F.forEach(f=>{ const g=IC_GIZLI[f]; tds+='<td class="num'+(g?' icg icg-'+g+' ichide':'')+'">'+esc(r[f])+'</td>'; });
    rows+='<tr'+(r.is_total?' class="itot"':'')+'>'+tds+'</tr>';
  });
  const st=await tblStamp("icmal_yil");
  const TH=["D\u00f6nem","Miktar (DK1)","Miktar (Ad)","Miktar (m\u00b2)","Net Tutar (\u20ac)","Ort. Kur","Net Tutar (TL)","Net Fi. (\u20ac/m\u00b2)","Net Fi. (\u20ac/ad)","Top.Per (ki\u015fi)","\u0130d.Per (Ki\u015fi)","\u00dcr.Per (Ki\u015fi)","Ciro/Per (\u20ac/ki\u015fi)","\u0130sk (%)","Kapasite (Ad/Ay)","0..4 Onays\u0131z (Ad)","Onay Ter (hf)","4.1\u20267 \u00dcrt (Ad)","Son Proje \u00c7\u0131k\u0131\u015f","Yurt \u0130\u00e7i al\u0131nan Prj (\u20ac)","Yurt \u0130\u00e7i muht. Prj (\u20ac)","Yurt D\u0131\u015f\u0131 al\u0131nan Prj (\u20ac)","Yurt D\u0131\u015f\u0131 muht. Prj (\u20ac)","Top.al\u0131nan Prj (\u20ac)","Al.Ter. (hf)","Top.muht. Prj (\u20ac)","YD1 \u0130sk. (%)","YD2 \u0130sk. (%)"];
  /* Gizli sütunların başlıkları fitHeads çalışırken display:none olduğu için ölçülemez
     (genişlik 0 → atlanır) → Ahşap panosundaki gibi thsm/thw ELLE verilir; açılınca dar
     ve iki satırlı gelirler. */
  const head=TH.map((h,i)=>{
    if(i===0) return '<th>'+h+'</th>';
    const f=F[i-1], lid=IC_LIDER[f], giz=IC_GIZLI[f];
    const dar=IC_DAR.has(f)?" icn":"";
    if(lid) return '<th class="num iclead'+dar+'" data-g="'+lid+'" title="Ayrıntı sütunlarını aç/kapa">'+h+' <span class="iccar" id="icc-'+lid+'">▸</span></th>';
    if(giz) return '<th class="num icg icg-'+giz+' ichide thsm'+dar+'"><span class="thw">'+h+'</span></th>';
    return '<th class="num'+dar+'">'+h+'</th>';
  }).join("");
  view.innerHTML=`${stampHTML(st)}
    <style>
     .ichide{display:none}
     thead th.iclead{cursor:pointer;background:#22456b}
     thead th.iclead:hover{background:#2d5a8a}
     .iccar{font-size:9px;opacity:.85}
     /* Başlık sarma genişliği global 14ch idi; dar sayılı sütunlarda (Kapasite, Onay Ter,
        Al.Ter., YD1/YD2 İsk. …) başlık sütunu gereksiz genişletip solda boşluk bırakıyordu.
        8ch'e indirildi — verisi geniş sütunlar zaten veriden ölçüldüğü için etkilenmez. */
     table.icm thead th .thw{max-width:8ch}
     /* min-width:min-content ŞART — max-width tek başına uzun sözcüğü (Kapasite, Top.Per)
        kırpıyordu ("Kapasi", "Top.Pe"); artık taban en uzun sözcüğün genişliği. */
     table.icm thead th.icn .thw{max-width:4.5ch;min-width:min-content}
     table.icm th,table.icm td{padding-left:5px;padding-right:5px}
    </style>
    <div class="scroll"><table class="icm">
    <thead><tr>${head}</tr></thead>
    <tbody>${rows}</tbody></table></div>`;
  view.querySelectorAll("th.iclead").forEach(th=>{ th.onclick=()=>{
    const g=th.dataset.g, on=th.dataset.on==="1";
    view.querySelectorAll(".icg-"+g).forEach(c=>c.classList.toggle("ichide",on));
    th.dataset.on=on?"0":"1";
    const c=view.querySelector("#icc-"+g); if(c) c.textContent=on?"▸":"▾";
  }; });
}

  const addRow=`<tr class="kaddrow">`+C.map(c=>{
    if(c.t==="kod") return `<td class="pkod"><input id="ki-kod" class="cell" size="1" placeholder="Kod"></td>`;

  const numOf=s=>{ if(s==null) return null; let t=String(s).replace(/[^0-9,.\-]/g,""); if(t==="") return null;
    t=t.replace(/\./g,"").replace(",","."); const v=parseFloat(t); return isNaN(v)?null:v; };
  const dstore=s=>{ const dt=dparse(s); return dt?p2(dt.getDate())+"."+p2(dt.getMonth()+1)+"."+dt.getFullYear():null; };

/* ---------- KİŞİLER satır düzeni (Personel panosu, eski Referans) — yazma yalnız authenticated int@arbor.com.tr; anon RLS ile kapalı ---------- */
function startKisiEdit(el){
  if(el.querySelector("input")) return;
  const kod=el.dataset.kod, f=el.dataset.f;
  const cur=el.textContent==="—"?"":el.textContent;
  const inp=document.createElement("input"); inp.className="cell"; inp.value=cur;
  el.textContent=""; el.appendChild(inp); inp.focus(); inp.select();
  const commit=async()=>{
    const val=inp.value.trim();
    if((f==="kod"||f==="tam_ad") && !val){ el.textContent=cur||"—"; return; }
    if(val===cur){ el.textContent=cur||"—"; return; }
    if(f==="sifre"){ /* KISI-SIFRE: kisi_sifre tablosu (yalnız int@ okur/yazar) */
      if(!/^\d{6}$/.test(val)){ alert("Şifre 6 haneli rakam olmalıdır."); el.textContent=cur||"—"; return; }
      const {error}=await sb.from("kisi_sifre").upsert({kod,sifre:val,updated_at:new Date().toISOString()});
      if(error){ el.textContent=cur||"—"; alert(error.code==="23505"?"Bu şifre başka bir kişide kullanılıyor.":error.message); return; }
      el.textContent=val; el.classList.add("saveflash"); setTimeout(()=>el.classList.remove("saveflash"),400); return;
    }
    const patch={}; patch[f]=(f==="kod"||f==="tam_ad")?val:(val||null); patch.updated_at=new Date().toISOString();
    const {error}=await sb.from("kisiler").update(patch).eq("kod",kod);
    if(error){ el.textContent="hata"; alert(error.message); return; }
    if(f==="kod"){ /* PERSONEL-ED: form_erisim.kisiler ve rol_map yeni koda taşınır (kisi_sifre, maas_prim FK cascade) */
      try{ const {data:fe}=await sb.from("form_erisim").select("yol,kisiler,rol_map");
        for(const r of (fe||[])){ const ki=(r.kisiler||[]), rm=r.rol_map||{}; if(!ki.includes(cur)&&!(cur in rm)) continue;
          const nrm={}; Object.keys(rm).forEach(x=>nrm[x===cur?val:x]=rm[x]);
          await sb.from("form_erisim").update({kisiler:ki.map(x=>x===cur?val:x),rol_map:nrm,updated_at:new Date().toISOString()}).eq("yol",r.yol); }
      }catch(e){ alert("Form yetkileri taşınamadı: "+e.message); }
      loadRef(); return; }
    if(f==="kod"){ const tr=el.closest("tr"); if(tr){ tr.dataset.kod=val; tr.querySelectorAll(".kicell").forEach(x=>x.dataset.kod=val); const db=tr.querySelector(".kdel"); if(db) db.dataset.kod=val; } }
    el.textContent=val||"—"; el.classList.add("saveflash"); setTimeout(()=>el.classList.remove("saveflash"),400);
  };
  inp.onblur=commit;
  inp.onkeydown=e=>{ if(e.key==="Enter"){e.preventDefault();inp.blur();} if(e.key==="Escape"){el.textContent=cur||"—";} };
}
async function kisiAdd(){
  const g=id=>{ const e=document.getElementById(id); return e?e.value.trim():""; }; /* PERSONEL-ED */
  const kod=g("ki-kod"), tam_ad=g("ki-ad");
  if(!kod){ alert("Kod gir."); return; }
  if(!tam_ad){ alert("Ad Soyad gir."); return; }
  const rec={kod,tam_ad,bolum:g("ki-bolum")||null,email:g("ki-email")||null,rol:g("ki-rol")||null,updated_at:new Date().toISOString()};
  const {error}=await sb.from("kisiler").insert(rec);
  if(error){ alert(error.message); return; }
  loadRef();
}
async function kisiDel(kod){
  if(!confirm("Bu kişi silinsin mi? ("+kod+")")) return;
  const {error}=await sb.from("kisiler").delete().eq("kod",kod);
  if(error){ alert(error.message); return; }
  loadRef();
}

   {sec:"A",no:"4",ad:"ERP tarih tanımları",tarih:"25.09.2024 · rev. 04.08.2026 · rev. 20.08.2026 · EU",metin:"<span class='sub'><b>MVT:</b> Müşteriye Verilen Tarih (Satış/Etüt/Şantiye'nin ilk verdiği fabrika çıkış tarihi). MVT tarihleri <b>adet, proje tipi ve parti sayısına göre formüllü</b> belirlenir.</span><span class='sub'><b>AÜP:</b> Ana Üretim Programı tarihi; bilgiler oluştukça değişir. Müşteriyle paylaşılmaz.</span><span class='sub'><b>Planlanan Sevk Tarihi (PST):</b> &quot;Güncel Yükleme Tarihi&quot;nin yerine geldi (04.08.2026). Projelerde güncel tutulmalı; <b>her pazartesi 12:00'dan önce</b> güncellenir. AÜP her pazartesi yapılır; ürünler bu tarihe göre sandıklanıp sevkiyat alanına alınır.</span><span class='sub'><b>ERP'den erken çıkış talebi:</b> ERP'nin verdiği tarihten daha önce çıkması gereken proje varsa <b>Melih Bey'den onay alınarak</b> EU'ya iletilir.</span><span class='sub'><b>MVT termin tablosu (hafta, rev. 20.08.2026):</b> projedeki ürün ya da cephedeki cam sayısına göre — <b>1–4 ad:</b> 68p/78t/78a içeren 6 · içermeyen + hızlandırmak için standart (4/16/4) camlı numuneler 3 · içermeyen + standart dışı camlı 4 · <b>5–6 ad:</b> 6 / — / 4 · <b>7–10 ad:</b> 6 / — / 6 · <b>11–80 ad:</b> 10 / — / 10.</span><span class='sub'>Bir proje <b>maksimum bir kamyon (80 adet)</b> üründen oluşur. Bir hafta zarfında aynı PGD'ye ait <b>maksimum bir proje</b> üretilir.</span>"},
   {sec:"A",no:"3",ad:"Termin/yükleme bilgisi ERP'ye işlenir",tarih:"07.11.2023",metin:"Planlamada dikkate alınması istenen bilgi ve yükleme yorumları mail/telefon yerine ERP'deki ilgili (ek) bölüme."},

   {sec:"T",no:"17",ad:"Teknik sunum / döküman değişiklikleri (17.08.2026)",tarih:"17.08.2026 · Büşra Kurt",metin:"<span class='sub'><b>1.</b> 68 tek lamba teknik sunumunda ZTS kilit karşılığı 2 mm iç tarafa kaydırıldı; karşılık sacı 2 mm küçültüldü. Yeni karşılık sacı siparişlerinde kullanılmak üzere ilgili saca (10x11 mm) ait çizim paftası teknik sunuma eklendi.</span><span class='sub'><b>2.</b> 68 tek lambalı Z-TS ispanyolet — tek/çift kanat teknik sunumunda, çift kanat standart Z-TS boşaltma referansları paftasındaki değişiklikle uyumlu olarak diğer paftalarda da kilit karşılığı 5 mm yukarı alındı; referans ölçüler eşik üstten ölçüye düzeltildi (paftalara not eklendi).</span><span class='sub'><b>3.</b> 68s ve 78s teknik sunumlarından boya aşamaları paftası kaldırıldı; yerine 'Teknos' ve 'Remmers' boya kimyasallarının adımlarını gösteren paftalar örtücü ve transparan olarak ayrı ayrı eklendi. Kimyasalların teknik dökümanları ortak klasörde: <code>\\\\192.168.1.3\\new\\ORTAK\\_TEKNIK_VERI_DOSYASI\\1.ARBOR_TEKNIK_SUNUM\\Teknik Dökümanlar\\Boya</code></span>"},
   {sec:"T",no:"18",ad:"Teknik sunum / döküman değişiklikleri (24.08.2026)",tarih:"24.08.2026 · Büşra Kurt",metin:"<span class='sub'><b>Kural:</b> G-U aksesuar ile <b>maksimum 7 kanat</b> yapılabilir; 7 kanat üzeri tipolojiler bölünmelidir. Şema 871 ve Şema 853 tipolojileri Pivot, Volkswagen, Kayar Katlanır, 78s ve 90s teknik sunumlarından kaldırıldı.</span><span class='sub'><b>68s:</b> ahşap damlalıklardaki vidalı sistem <b>geçmeli</b> hale getirildi (alüminyum eşikli–ahşap damlalıklı detayda klipsli damlalık kaldırıldı); ahşap kasa–kanatta ahşap damlalık plan izdüşümlerinde yan kenar açıları 80°. Söve–pervaz–denizlik satırına söve ile ahşap denizlik arası derz detayı eklendi (derz conta + silikon ile doldurulur). Giriş kapısı satırına klasik model tek açılım ve Fransız açılım detayları; Maco Z-TS kilidin Maco silindir dil (roller latch) ile modifiye hali eksen bazında eklendi.</span><span class='sub'><b>68 tek lamba:</b> alüminyum eşik–ahşap damlalıklı detaylar geçmeli damlalığa güncellendi. <b>78s:</b> ahşap kasa–kanatta damlalık plan izdüşümlerinde yan kenar açıları 80°.</span><span class='sub'><b>Kepenk:</b> Fransız detay boşluk ölçüleri revize (bini çıtası uzatıldı, kilit sistemi ve stoper kaydırıldı); montaj bilgileri–kilit kancaları satırına &quot;binili birleşimlerde ötelenmelidir&quot; notu, stoper paftasından &quot;5 mm&quot; ifadesi kaldırıldı. Örnek tipolojilerde plan/görünüş aksesuar çizimleri düzeltildi, kayar katlanırda eksik stoper çizimleri eklendi.</span><span class='sub'><b>Pencad:</b> 58f için 120 mm orta kayıt çizim/alüminyum detayları &quot;58f Çizim Yönergeleri&quot;ne; yavru kepenk aksesuarları ve kayar katlanır aksesuarları &quot;ekstra malzemeler&quot;e; yavru kanatlı kepenk yönergeleri &quot;Kepenk Açılım Seçimleri&quot;ne; Ar-Ge'nin akustik/u değeri hesapladığı 4 sandviç panel ve taçlı denizlik stokları eklendi.</span><span class='sub'>Dr.Hahn ve Baka menteşe teknik dökümanları ortak klasörde: <code>\\\\192.168.1.3\\new\\ORTAK\\_TEKNIK_VERI_DOSYASI\\1.ARBOR_TEKNIK_SUNUM\\Teknik Dökümanlar\\Menteşeler</code></span>"},
   {sec:"T",no:"19",ad:"Teknik sunum / döküman değişiklikleri (31.08.2026)",tarih:"31.08.2026 · Büşra Kurt",metin:"<span class='sub'><b>Kural:</b> 68s teknik sunumu, Kemerli ve Açılı Birleşim satırı, Kemer Kanat Birleşim ve Aşamaları paftasına — <b>kemer segment genişlikleri maksimum 120 mm</b> olmalıdır.</span><span class='sub'><b>68s ve 78s:</b> üretim konuları satırı, kanatta ahşap damlalık paftasından <b>klipsli ahşap damlalık alternatifi kaldırıldı</b>; ilgili tüm detaylar buna uygun düzenlendi (24.08 duyurusundaki geçmeli sisteme geçişin tamamlanması).</span>"},
   {sec:"T",no:"6",ad:"Cam montaj silikonu nötr (neutral cure) olmalı",tarih:"19.06.2026 · EA · K52.9",metin:"Silikon camdaki thiokol ile reaksiyona girip bozulma/yapışma problemi/akmaya yol açabilir. Şantiyede nötr kürlenme (neutral cure) silikon kullanılmalı; uygulama öncesi teknik föy kontrol edilmeli. Tereddütte Ar-Ge onayı alınır."}
  ];
  const HIDE_KEY="arbor_pros_iptal";
  const getHidden=()=>{ try{ return JSON.parse(localStorage.getItem(HIDE_KEY)||"[]"); }catch(e){ return []; } };
  const hidden=getHidden();
  /* Grup içi sıra: YENİ → ESKİ. Tarih alanındaki bütün GG.AA.YYYY damgaları taranır, EN YENİSİ
     alınır (revizyonlu maddeler revizyon tarihine göre sıralanır). Tarihsiz madde en sona. */
  const dnum=t=>{ const re=/(\d{1,2})\.(\d{1,2})\.(\d{4})/g; let m,best=0;
    while((m=re.exec(String(t||"")))){ const v=+(m[3]+String(m[2]).padStart(2,"0")+String(m[1]).padStart(2,"0")); if(v>best) best=v; }
    return best; };
  let sec="";
  Object.keys(SECS).forEach(s=>{
    const items=PROS.filter(d=>d.sec===s && !hidden.includes(d.no)).sort((a,b)=>dnum(b.tarih)-dnum(a.tarih));
    if(!items.length) return;
    sec+=`<div class="secH">${esc(SECS[s])}</div>`;
    items.forEach(d=>{ sec+=`<div class="law" data-no="${esc(d.no)}"><div class="lno${d.ek?' ek':''}">${esc(d.no)}</div><div class="lbody"><div class="lhead"><span class="lcaret">▶</span><span class="ltitle">${esc(d.ad)}</span><span class="ldate">(${esc(d.tarih)})</span></div><div class="ltext">${d.metin}</div></div><div class="lx" title="İptal (gizle)">✕</div></div>`; });
  });
  view.innerHTML=`<style>
    #view .secH{margin:9px 0 3px;font-size:12px}
    #view .law{padding:1px 0;margin:0;border-bottom:1px solid #eef1f5}
    #view .law .lhead{padding:1px 0;gap:6px;line-height:16px}
    #view .law .ltitle{font-size:12px}
    #view .law .ldate{font-size:11px}
    #view .law .lno{font-size:11px;padding:0 5px;line-height:16px}
    #view .law .lcaret{font-size:9px}
    #view .law .ltext{font-size:12px;line-height:1.35;padding:2px 0 4px}
  </style><div class="stamp">Son Güncelleme: 23.09.26</div>${sec}`;
  view.querySelectorAll(".law").forEach(law=>{
    const tog=()=>law.classList.toggle("open");
    const head=law.querySelector(".lhead"), no=law.querySelector(".lno");
    head.onclick=tog; no.onclick=tog; no.style.cursor="pointer";
    law.querySelector(".lx").onclick=e=>{ e.stopPropagation(); const h=getHidden(); if(!h.includes(law.dataset.no)) h.push(law.dataset.no); localStorage.setItem(HIDE_KEY,JSON.stringify(h)); law.remove(); };
  });
}

/* ---------- EĞİTİM (EGITIM-PANO, 2026-09-23) — En.xlsx (egitim_dokuman_snapshot) +
   Ep.xlsx (egitim_plan_snapshot). Salt-okur, ERP kaynaklı. Gerçekleşen eğitim tarihi henüz
   ERP'de tutulmuyor (Planlanan/Gerçekleşen kolonları boş) — "Sıradaki Eğitim" yayım tarihi +
   periyot(ay) ile hesaplanır; geçmişse "gecikmiş" olarak kırmızı işaretlenir. En yeni çekim
   egitim_dokuman_current / egitim_plan_current view'lerinden okunur. ---------- */
async function loadEgitim(){
  const view=document.getElementById("view");
  view.innerHTML=`<div class="load">Yükleniyor…</div>`;
  const [{data:dok},{data:plan},erpT]=await Promise.all([
    sb.from("egitim_dokuman_current").select("*"),
    sb.from("egitim_plan_current").select("*"),
    erpStamp()
  ]);
  const D=dok||[], P=plan||[];
  function periyotAy(p){ const m=/^(\d+)\s*Ay$/i.exec(String(p||"").trim()); return m?+m[1]:null; }
  /* EGITIM-GERCEKLESEN (23.09.2026): Ep.xlsx aylık <ay>_gerceklesen kolonları satır (bölüm+konu) bazında okunur */
  const AYLAR=["ocak","subat","mart","nisan","mayis","haziran","temmuz","agustos","eylul","ekim","kasim","aralik"];
  function gercList(row){ return AYLAR.map(a=>row[a+"_gerceklesen"]).filter(Boolean).sort(); }
  function sonGerc(row){ const g=gercList(row); return g.length?g[g.length-1]:null; }
  function siradaki(row){
    const per=periyotAy(row.periyot); const baz=sonGerc(row)||row.yayim_tarihi; if(!per||!baz) return null;
    const d=new Date(baz+"T00:00:00"); d.setMonth(d.getMonth()+per); return d;
  }
  function fmt(d){ return String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+"."+d.getFullYear(); }
  function grupla(arr,key){ const m={}; arr.forEach(r=>{ const k=r[key]||"—"; (m[k]=m[k]||[]).push(r); }); return m; }
  const today=new Date();
  const YIL=String(today.getFullYear()), AY=YIL+"-"+String(today.getMonth()+1).padStart(2,"0");
  const pG=grupla(P,"bolum");
  let planHtml="";
  Object.keys(pG).sort((a,b)=>a.localeCompare(b,"tr")).forEach(bol=>{
    const rows=pG[bol].slice().sort((a,b)=>(a.kod||"").localeCompare(b.kod||"","tr"));
    const bG=rows.filter(r=>gercList(r).some(x=>x.slice(0,4)==YIL)).length;
    planHtml+=`<div class="secH">${esc(bol)} (${rows.length}) <span class="muted" style="font-weight:400">· bu yıl gerçekleşen konu: ${bG}/${rows.length}</span></div><div class="scroll"><table class="egt"><colgroup><col class="ek"><col class="ekonu"><col class="e3"><col class="e4"><col class="e4"><col class="e3"><col class="e5"></colgroup><thead><tr><th>Kod</th><th>Konu</th><th>Periyot</th><th>Yayım Tarihi</th><th>Son Gerçekleşen</th><th>Bu Yıl (adet)</th><th>Sıradaki Eğitim</th></tr></thead><tbody>`;
    rows.forEach(r=>{
      const sd=siradaki(r), gec = sd && sd<today;
      planHtml+=`<tr><td>${esc(r.kod||"—")}</td><td title="${esc(r.konu||"")}">${esc(r.konu||"—")}</td><td>${esc(r.periyot||"—")}</td><td>${dOnly(r.yayim_tarihi)}</td><td>${sonGerc(r)?dOnly(sonGerc(r)):"—"}</td><td class="num">${gercList(r).filter(x=>x.slice(0,4)==YIL).length||"—"}</td><td${gec?' style="color:#b23a2e;font-weight:600"':''}>${sd?fmt(sd):"—"}${gec?" (gecikmiş)":""}</td></tr>`;
    });
    planHtml+="</tbody></table></div>";
  });
  const dG=grupla(D,"bolum");
  let dokHtml="";
  Object.keys(dG).sort((a,b)=>a.localeCompare(b,"tr")).forEach(bol=>{
    const rows=dG[bol].slice().sort((a,b)=>(a.kod||"").localeCompare(b.kod||"","tr"));
    dokHtml+=`<div class="secH">${esc(bol)} (${rows.length})</div><div class="scroll"><table class="egt"><colgroup><col class="ek"><col class="ekonu"><col class="e3"><col class="e4"><col class="e5"></colgroup><thead><tr><th>Kod</th><th>Konu</th><th>Grup</th><th>Yayım Tarihi</th><th>Revizyon Tarihi</th></tr></thead><tbody>`;
    rows.forEach(r=>{
      dokHtml+=`<tr><td>${esc(r.kod||"—")}</td><td title="${esc(r.konu||"")}">${esc(r.konu||"—")}</td><td>${esc(r.grup||"—")}</td><td>${dOnly(r.yayim_tarihi)}</td><td>${dOnly(r.revizyon_tarihi)}</td></tr>`;
    });
    dokHtml+="</tbody></table></div>";
  });
  const gecSay=P.filter(r=>{ const sd=siradaki(r); return sd&&sd<today; }).length;
  /* EGITIM-OZET (23.09.2026): bu yıl / bu ay — gerçekleşen eğitim, yayınlanan ve revize edilen doküman */
  const gE=[]; P.forEach(r=>gercList(r).forEach(t=>{ if(t.slice(0,4)==YIL) gE.push({t,bolum:r.bolum,kod:r.kod,konu:r.konu}); }));
  /* EGITIM-DOK-BIRLES (23.09.2026): yayınlanan + revize tek kartta, en sağda Yeni/Revize */
  const yE=D.filter(r=>r.yayim_tarihi&&r.yayim_tarihi.slice(0,4)==YIL).map(r=>({t:r.yayim_tarihi,bolum:r.bolum,kod:r.kod,konu:r.konu,tip:"Yeni"}))
    .concat(D.filter(r=>r.revizyon_tarihi&&r.revizyon_tarihi.slice(0,4)==YIL).map(r=>({t:r.revizyon_tarihi,bolum:r.bolum,kod:r.kod,konu:r.konu,tip:"Revize"})));
  const ozKart=(bas,arr)=>{
    arr.sort((a,b)=>b.t.localeCompare(a.t));

/* ---------- ŞANTİYE ONAY (SANTIYE-ONAY) ----------------------------------------
   Kaynak: santiye_form (7 form tanımı) + santiye_form_proje (ERP'den doldurulan
   proje blokları + şantiye sorumlusunun MVT/PST onayları).
   Doldurma: her ayın 21'inden sonraki ilk ERP çekiminde kod/_santiye_form_fill.py.
   Damga: pano_yayin['santiye_<kod>'] = o formun "Aylık Güncelle" düğmesine son basılma.
   Pano SALT-OKUR — cevaplar yalnız formlardan girilir.
   DİKKAT: adı loadSantiyeOnay — loadSantiye ZATEN VAR (MK Faaliyet altındaki
   "tıkanmış şantiyeler" tablosu, ~satır 2200). Aynı ada koyulursa sonraki bildirim
   öncekini ezer ve iki pano birden bozulur. */
async function loadSantiyeOnay(){
  const view=document.getElementById("view");
  const [fr,pr,py]=await Promise.all([
    sb.from("santiye_form").select("*").order("sira"),
    sb.from("santiye_form_proje").select("*"),
    sb.from("pano_yayin").select("anahtar,yayin_at")
  ]);
  const err=fr.error||pr.error;
  if(err){ view.innerHTML=`<div class="load">Hata: ${esc(err.message)}</div>`; return; }
  const formlar=fr.data||[], hepsi=pr.data||[];
  const pyBy={}; ((py&&!py.error)?(py.data||[]):[]).forEach(r=>pyBy[r.anahtar]=r.yayin_at);
  /* Yalnız EN YENİ dönem gösterilir (geçmiş dönemler tabloda kalır). */
  const donem = hepsi.length ? hepsi.map(r=>r.donem).sort().reverse()[0] : null;
  const rows = hepsi.filter(r=>r.donem===donem);
  const fdt=s=>{ if(!s) return "—"; const p=String(s).slice(0,10).split("-"); return p[2]+"."+p[1]+"."+p[0].slice(2); };
  const erpT = rows.length ? rows.map(r=>r.erp_tarih).filter(Boolean).sort().reverse()[0] : null;

  let onay=0, red=0, bos=0;
  rows.forEach(r=>{ ["mvt_onay","pst_onay"].forEach(a=>{
    if(r[a]==="Evet") onay++; else if(r[a]==="Hayır") red++; else bos++; }); });

  const cevap=(o,s)=>{
    if(!o) return '<span class="muted">—</span>';
    if(o==="Evet") return '<span style="color:#0a6b3f;font-weight:600">Evet</span>';
    return '<span style="color:#b40000;font-weight:700">Hayır</span>';
  };
  const bloklar = formlar.map(f=>{
    const rs = rows.filter(r=>r.form_kodu===f.kod)
      .sort((a,b)=>String(a.mvt||"9").localeCompare(String(b.mvt||"9"))||String(a.proje_no).localeCompare(String(b.proje_no)));
    const dmg = pyBy["santiye_"+f.kod];
    const kirmizi = rs.filter(r=>r.mvt_onay==="Hayır"||r.pst_onay==="Hayır").length;
    const eksik   = rs.filter(r=>!r.mvt_onay||!r.pst_onay).length;
    const head=`<h3 class="sec">${esc(f.ad)} <span class="muted" style="font-weight:400">· ${esc(f.kisi_kod||"")} · ${rs.length} proje`
      +(kirmizi?` · <b style="color:#b40000">${kirmizi} itiraz</b>`:"")
      +(eksik?` · <b style="color:#8a6100">${eksik} cevapsız</b>`:"")
      +` · Aylık Güncelle: ${dmg?dOnly(dmg):"—"}</span></h3>`;
    if(!rs.length) return head+`<div class="hint">Bu dönemde bu forma düşen proje yok.</div>`;
    const body=rs.map(r=>`<tr>`
      +`<td class="sb"><div class="cx">${esc(r.proje_no)}</div></td>`
      +`<td><div class="cx">${esc(r.proje_adi)}</div></td>`
      +`<td class="num">${r.adet==null?"—":r.adet}</td>`
      +`<td class="num">${fdt(r.mvt)}</td><td class="num">${fdt(r.aup)}</td><td class="num">${fdt(r.pst)}</td>`
      +`<td>${cevap(r.mvt_onay)}</td><td><div class="cx">${esc(r.mvt_sebep||"")}</div></td>`
      +`<td>${cevap(r.pst_onay)}</td><td><div class="cx">${esc(r.pst_sebep||"")}</div></td>`
      +`</tr>`).join("");
    return head+`<div class="scroll"><table class="sty"><colgroup>`
      +`<col class="s18"><col class="s34"><col class="s6"><col class="s8"><col class="s8"><col class="s8">`
      +`<col class="s7"><col class="s26"><col class="s7"><col class="s26"></colgroup>`
      +`<thead><tr><th>Proje Kodu</th><th>Proje Adı</th><th class="num">Adet</th>`
      +`<th class="num">MVT</th><th class="num">AÜP</th><th class="num">PST</th>`
      +`<th>MVT Onay</th><th>MVT Sebebi</th><th>PST Onay</th><th>PST Sebebi</th></tr></thead>`
      +`<tbody>${body}</tbody></table></div>`;
  }).join("");

  /* SANTIYE-ONAY-SADE (22.09.2026): baştaki damga satırı ve salt-okur açıklaması kaldırıldı */
  view.innerHTML=`    <style>
      table.sty{border-collapse:collapse;table-layout:fixed;width:1px;font-size:12px;background:#fff}
      table.sty col.s6{width:6ch}table.sty col.s7{width:9ch}table.sty col.s8{width:9ch}
      table.sty col.s18{width:20ch}table.sty col.s26{width:26ch}table.sty col.s34{width:34ch}
      table.sty th,table.sty td{border-bottom:1px solid #eef1f5;padding:2px 6px;text-align:left;vertical-align:middle;height:21px;line-height:17px}
      table.sty thead th{background:#16324f;color:#fff;font-weight:600;font-size:10.5px;white-space:nowrap;padding:3px 6px}
      table.sty td.num,table.sty th.num{text-align:right}
      table.sty td.sb{font-family:ui-monospace,Consolas,monospace;font-size:11.5px}
      table.sty td .cx{overflow:hidden;text-overflow:clip;white-space:nowrap}
    </style>
    ${bloklar || '<div class="hint">Henüz forma düşmüş proje yok.</div>'}`;
}

  ];
  /* FORM-ERISIM (KOD-GIRIS 23.09.2026): Kullanıcı sütunu = form_erisim tablosu — form-giris edge fonksiyonunun

  /* FORMLAR-260921: Teklif Talepleri + eski fy/fy2 formları yayından kaldırıldı */
  const FK={"sel-arb/":"sel_arb_form","onur/":"onur_sevk","ob-rapor/":"ob_rapor","mk-prim/":"mk_prim","fy/":"yd1","fy2/":"yd2","ahsap/":"ahsap",

  const [ft,pyF,onU,obU,sayU,mkaU,fyY,engF]=await Promise.all([

    sb.from("pano_yayin").select("anahtar,yayin_at"),
    sb.from("sevk_durumu_onur").select("updated_at").order("updated_at",{ascending:false}).limit(1),

  const engBy={}; ((engF&&!engF.error)?(engF.data||[]):[]).forEach(r=>{ if(!engBy[r.form_key]) engBy[r.form_key]=r; });
  const ftBy={}; ((ft&&!ft.error)?(ft.data||[]):[]).forEach(r=>ftBy[r.form_key]=r);
  const pyBy={}; ((pyF&&!pyF.error)?(pyF.data||[]):[]).forEach(r=>pyBy[r.anahtar]=r.yayin_at);

  /* FORM-CANLI-IZ: canlı iz = GÜNCELLEME DÜĞMESİNE basılma (pano_yayin), satır-bazlı otomatik
     kayıt DEĞİL. onur_sevk/ob_rapor eskiden ilgili tablonun updated_at'ini okuyordu → çalışan
     yalnız hücreye yazınca da "güncellendi" sayılıyor, geciken 0 görünüyordu. */
  const sayBy={}; ((sayU&&!sayU.error)?(sayU.data||[]):[]).forEach(r=>sayBy[r.kaynak]=r.updated_at);
  const mk0=(mkaU&&!mkaU.error&&mkaU.data&&mkaU.data[0])||null;
  const mkAt=mk0?(mk0.updated_at||mk0.created_at||null):null;
  const CANLI={ onur_sevk:pyBy.oe_sevk, ob_rapor:pyBy.ob_rapor,
                mk_prim:mkAt, yurtici:sayBy.SO, yd1:sayBy.FY, yd2:sayBy.FY2,
                ahsap:pyBy.ahsap, yd_alacak:pyBy.sel_arb, sel_arb_form:pyBy.sel_arb_form,

     (form_takip elle ✓ dahil değil). Düğmesi olmayan formlar (YD Akış, Teklif Talepleri, Cam) "—". */
  const fyAt=(fyY&&!fyY.error&&fyY.data&&fyY.data[0])?fyY.data[0].yayin_at:null;
  const BTN_AT=Object.assign({},...Object.keys(FK).map(u=>({[u]:CANLI[FK[u]]})),{"so/":sayBy.SO,"teklif/":fyAt});
  const today=new Date(); today.setHours(0,0,0,0);
  const dParse=s=>{ if(!s) return null; const p=String(s).slice(0,10).split("-"); return new Date(+p[0],+p[1]-1,+p[2]); };
  const isIs=d=>{ const w=d.getDay(); return w!==0&&w!==6; };
  const sonTarih=sik=>{
    if(/sal[ıi]/i.test(sik)){ const d=new Date(today); d.setDate(d.getDate()-((d.getDay()-2+7)%7)); return d; }
    if(/ay/i.test(sik)){ const d=new Date(today.getFullYear(),today.getMonth(),1); while(!isIs(d)) d.setDate(d.getDate()+1); return d; }
    return null;
  };
  const sonGuncelleme=r=>{
    const a=dParse(r.son_guncelleme), b=dParse(CANLI[r.form_key]);
    return (a&&b)?(a>b?a:b):(a||b);
  };
  const gecikenGun=r=>{
    const due=sonTarih(r.gunc_sikligi||""); if(!due) return 0;
    const son=sonGuncelleme(r);
    if(son&&son>=due) return 0;
    /* GECIKEN-IS-GUNU: takvim günü değil İŞ GÜNÜ sayılır — son tarihten SONRAKİ iş günleri,
       bugün dahil (hafta sonu sayılmaz). Son tarih zaten iş günüdür (Salı / ayın ilk iş günü). */
    let n=0; const d=new Date(due);
