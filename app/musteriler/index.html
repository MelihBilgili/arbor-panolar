<script>
/* ARB-AD-YAZIM (2026-09-22, Melih): proje / müşteri / firma adları her kelimenin yalnız baş harfi büyük,
   kısaltmalar tamamı büyük. Supabase REST (/rest/v1/) yanıtlarında ve yazma gövdelerinde (POST/PATCH/PUT)
   proje · proje_adi · musteri · firma alanlarına (fiyat_musteri_sinif'te ad) uygulanır — tek kaynak: kod/_arb_ad_yazim.js */
(function(){
  if(window.ARB_AD) return;
  var AKR=("SCI SAS SARL SA SASU EURL SNC SEM SPL SPLA ZAC PEM PST MVT AÜP OE ÖB MK MB EU UK USA TR FR AŞ LTD LLC PLC GMBH AG BV NV SPA SRL "+
    "HLM OPH OPAC EHPAD CHU CROUS RATP SNCF IDF ICF HQE BBC CA ILM FCAI CLC CBC LCB BAT BTP TRT KDV SGDB SVM LMP RBKC MTC GTM NHS PVC "+
    "ARGE ARB YD SÖ TOKİ İBB İTÜ ODTÜ ENSA ESSEC ENS HEC IUT CFA RTE EDF GDF CCI CMA SEMIIC SAEM SPIE CPAM CAF UGC ARS KYK TMO SGK TCDD İSKİ AVM ÖSYM THY PTT MSB TBMM YTÜ MSGSÜ").split(" ");
  var AK={}; AKR.forEach(function(w){ AK[w]=1; });
  var KUCUK={ST:1,MR:1,DR:1,SR:1,JR:1,MRS:1,MS:1};           /* sesli harfsiz ama kısaltma sayılmayanlar → St, Mr … */
  var TRH=/[ğĞşŞıİçÇöÖüÜ]/, SESLI=/[aeiouyàâäéèêëîïôöùûüÿıAEIOUYÀÂÄÉÈÊËÎÏÔÖÙÛÜŸİ]/, ROMA=/^(I{1,3}|IV|VI{0,3}|IX|XI{0,3}|XIV|XV)$/;
  function up(w,tr){ return tr?w.toLocaleUpperCase("tr"):w.toUpperCase(); }
  function lo(w,tr){ return tr?w.toLocaleLowerCase("tr"):w.toLowerCase(); }
  var OLAGAN={};  /* karışık metinde büyük yazılsa da kısaltma sayılmayan sık kelimeler */
  ("LE LA LES DE DU DES SUR SOUS AUX AU ET EN UN UNE THE OF AND FOR ON IN AT TO VON DER DIE DAS UND IM AM ZUM ZUR VE İLE EVİ BEY HAN KAT LOT VIA DEL DI DA LOS EL SAN SUD NORD EST OUEST").split(" ").forEach(function(w){ OLAGAN[w]=1; });
  function kelime(w,karisik,tr){
    if(/\d/.test(w)) return w;                                   /* rakamlı (P19, I3F, 68s) aynen */
    var U=up(w,tr);
    if(AK[U]) return U;
    if(w.length===1) return U;                                   /* tek harf (Lot F, Y Blok) */
    if(ROMA.test(U)) return U;                                   /* III. Faz */
    if(!SESLI.test(w) && !KUCUK[U]) return U;                    /* sesli harfsiz: SVM, LMP, RBKC */
    if(karisik && w===U && w.length<=3 && !OLAGAN[U]) return U;                /* karışık yazılmış metinde büyük yazılmış kısa kelime = kısaltma */
    var l=lo(w,tr); return up(l.charAt(0),tr)+l.slice(1);
  }
  window.ARB_AD=function(s){
    if(s==null||typeof s!=="string") return s;
    var t=s.replace(/\s+/g," ").trim(); if(!t) return t;
    var harf=t.replace(/[^\p{L}]/gu,""), karisik=harf!==harf.toUpperCase()&&harf!==harf.toLowerCase(), tr=TRH.test(t);  /* Türkçe harf içeren metin → tr yerel ayarı (YAPI → Yapı) */
    return t.replace(/[\p{L}\p{M}\p{N}]+/gu,function(w){ return kelime(w,karisik,tr); });
  };
  var ALAN={proje:1,proje_adi:1,musteri:1,firma:1};
  function donus(o,tablo){
    if(Array.isArray(o)){ for(var i=0;i<o.length;i++) donus(o[i],tablo); return o; }
    if(o&&typeof o==="object"){ for(var k in o){ if(typeof o[k]==="string"&&(ALAN[k]||(k==="ad"&&tablo==="fiyat_musteri_sinif"))) o[k]=window.ARB_AD(o[k]); } }
    return o;
  }
  window.ARB_AD_DONUS=donus;
  var of=window.fetch.bind(window);
  window.fetch=function(u,o){
    var url=String((u&&u.url)||u||""), m=url.match(/\/rest\/v1\/([A-Za-z0-9_]+)/), tablo=m?m[1]:null;
    if(!tablo) return of(u,o);
    try{ var me=((o&&o.method)||"GET").toUpperCase();
      if(o&&typeof o.body==="string"&&/^(POST|PATCH|PUT)$/.test(me)&&tablo!=="rpc"){ o=Object.assign({},o,{body:JSON.stringify(donus(JSON.parse(o.body),tablo))}); } }catch(e){}
    return of(u,o).then(function(r){
      var ct=r.headers.get("content-type")||"";
      if(!r.ok||ct.indexOf("json")<0) return r;
      return r.clone().text().then(function(t){ if(!t) return r;
        try{ return new Response(JSON.stringify(donus(JSON.parse(t),tablo)),{status:r.status,statusText:r.statusText,headers:r.headers}); }catch(e){ return r; } });
    });
  };
})();
</script>
<script>
/* ARB-KOD-GIRIS (23.09.2026): forma giris = kisisel 6 haneli kod (App > Referans > Kisiler > Sifre).
   form-giris edge fonksiyonu kodu dogrular, yetkiyi form_erisim'den kontrol eder, rolu otomatik secer ve
   rol hesabi icin tek kullanimlik token doner; burada verifyOtp ile oturum acilir. Rol hesaplarinin parolasi yoktur. */
window.ARB_FORM_YOL=(function(){ var m=/\/app\/([^\/]+)\//.exec(location.pathname); return m?m[1]+"/":""; })();
window.ARB_KOD_GIRIS=async function(cli,kod){
  kod=String(kod==null?"":kod).replace(/\D/g,"");
  if(kod.length!==6) return {error:{message:"Kod 6 haneli olmal\u0131d\u0131r."}};
  try{
    var r=await fetch("https://zehysygpqxqmrzangvuc.supabase.co/functions/v1/form-giris",{method:"POST",cache:"no-store",
      headers:{"Content-Type":"application/json",apikey:"sb_publishable_ZCcDv4S7qH1hc9tuiv4__A_YVxmIpWc"},
      body:JSON.stringify({form:window.ARB_FORM_YOL,kod:kod})});
    var j={}; try{ j=await r.json(); }catch(e){}
    if(!r.ok||!j.ok||!j.token_hash) return {error:{message:j.hata||"Kod hatal\u0131."}};
    var v=await cli.auth.verifyOtp({token_hash:j.token_hash,type:"magiclink"});
    if(v.error) return {error:{message:"Giri\u015f a\u00e7\u0131lamad\u0131: "+v.error.message}};
    try{ localStorage.setItem("arb_kisi_"+window.ARB_FORM_YOL,JSON.stringify({kod:j.kisi,ad:j.ad,rol:j.rol})); }catch(e){}
    return {error:null,data:j};
  }catch(e){ return {error:{message:"Ba\u011flant\u0131 hatas\u0131."}}; }
};
window.ARB_KISI_AL=function(em){ try{ var k=JSON.parse(localStorage.getItem("arb_kisi_"+window.ARB_FORM_YOL)||"null"); return (k&&(!em||k.rol===em))?k:null; }catch(e){ return null; } };
</script>
<script>
/* MUSTERI-ONERI (05.10.2026) — Müşteriler kayıt/öneri ortak modülü. TEK KAYNAK: kod/_musteri_oneri.js
   Gömülü kopyalar: musteriler_form.html, satis_yd_akis_form_template.html (python kod\_musteri_oneri_sync.py <html>).
   Tablolar: musteri_firma(blok,firma) · musteri_ilgili(firma_id,ad_soyad,mail,tel). Sıra: Şirket → Ad Soyad → E-posta/Telefon. */
window.MUS=(function(){
  var F=[], I=[];
  function n(s){ return String(s==null?"":s).replace(/\s+/g," ").trim(); }
  function k(s){ return n(s).toLocaleLowerCase("tr"); }
  function e(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
  async function yukle(sb){
    var a=await sb.from("musteri_firma").select("id,blok,firma").order("firma");
    var b=await sb.from("musteri_ilgili").select("id,firma_id,ad_soyad,mail,tel,created_at").order("id");
    if(a.error) throw a.error; if(b.error) throw b.error;
    F=a.data||[]; I=b.data||[]; return {F:F,I:I};
  }
  function firmalar(blok){ return F.filter(function(f){return f.blok===blok;}).sort(function(x,y){return String(x.firma).localeCompare(String(y.firma),"tr");}); }
  function firmaBul(blok,ad){ var q=k(ad); if(!q) return null; return F.find(function(f){return f.blok===blok&&k(f.firma)===q;})||null; }
  function ilgililer(fid){ return I.filter(function(r){return r.firma_id===fid;}); }
  function adlar(fid){ var s={},o=[]; ilgililer(fid).forEach(function(r){ var q=k(r.ad_soyad); if(q&&!s[q]){ s[q]=1; o.push(n(r.ad_soyad)); } }); return o.sort(function(x,y){return x.localeCompare(y,"tr");}); }
  function kayitlar(fid,ad){ var q=k(ad); return ilgililer(fid).filter(function(r){return k(r.ad_soyad)===q;}); }
  /* Ekleme/güncelleme: aynı kişi + aynı e-posta/telefon varsa yeni satır açılmaz, boş alan doldurulur */
  async function kaydet(sb,blok,firma,ad,mail,tel){
    firma=n(firma); ad=n(ad); mail=n(mail)||null; tel=n(tel)||null;
    if(!firma) throw new Error("Şirket boş");
    var f=firmaBul(blok,firma);
    if(!f){ var r=await sb.from("musteri_firma").insert({blok:blok,firma:firma}).select("id,blok,firma"); if(r.error) throw r.error; f=r.data[0]; F.push(f); }
    if(!ad) return {firma:f,ilgili:null};
    var rows=kayitlar(f.id,ad), em=k(mail), te=n(tel);
    var ayni=rows.find(function(r){ return k(r.mail)===em && n(r.tel)===te; });
    if(ayni) return {firma:f,ilgili:ayni};
    var hedef=null, upd=null;
    if(mail&&tel){ hedef=rows.find(function(r){return k(r.mail)===em&&!n(r.tel);}); if(hedef) upd={tel:tel};
      if(!hedef){ hedef=rows.find(function(r){return n(r.tel)===te&&!n(r.mail);}); if(hedef) upd={mail:mail}; } }
    if(!hedef && (mail||tel)){ hedef=rows.find(function(r){return !n(r.mail)&&!n(r.tel);}); if(hedef) upd={mail:mail,tel:tel}; }
    if(!hedef && mail && !tel){ hedef=rows.find(function(r){return k(r.mail)===em;}); if(hedef) return {firma:f,ilgili:hedef}; }
    if(!hedef && tel && !mail){ hedef=rows.find(function(r){return n(r.tel)===te;}); if(hedef) return {firma:f,ilgili:hedef}; }
    if(hedef){ var u=await sb.from("musteri_ilgili").update(upd).eq("id",hedef.id).select(); if(u.error) throw u.error; Object.assign(hedef,u.data[0]); return {firma:f,ilgili:hedef}; }
    var ins=await sb.from("musteri_ilgili").insert({firma_id:f.id,ad_soyad:ad,mail:mail,tel:tel}).select(); if(ins.error) throw ins.error;
    I.push(ins.data[0]); return {firma:f,ilgili:ins.data[0]};
  }
  /* Dört kutuyu sıralı öneriye bağlar. o={blok:()=>"YD1", firma,ad,mail,tel:<input>, pre:"benzersiz-önek"} */
  function bagla(o){
    var B=typeof o.blok==="function"?o.blok:function(){return o.blok;};
    function dl(el,ad){ var id=o.pre+"-"+ad, d=document.getElementById(id); if(!d){ d=document.createElement("datalist"); d.id=id; document.body.appendChild(d); } el.setAttribute("list",id); return d; }
    var dF=dl(o.firma,"f"), dA=dl(o.ad,"a"), dM=dl(o.mail,"m"), dT=dl(o.tel,"t");
    function fid(){ var f=firmaBul(B(),o.firma.value); return f?f.id:null; }
    function tazele(){
      dF.innerHTML=firmalar(B()).map(function(f){return '<option value="'+e(f.firma)+'">';}).join("");
      var id=fid(); dA.innerHTML=id?adlar(id).map(function(a){return '<option value="'+e(a)+'">';}).join(""):"";
      var rs=id?kayitlar(id,o.ad.value):[], sm={}, st={};
      dM.innerHTML=rs.filter(function(r){var q=k(r.mail); if(!q||sm[q]) return false; sm[q]=1; return true;}).map(function(r){return '<option value="'+e(n(r.mail))+'" label="'+e(n(r.tel)||"")+'">';}).join("");
      dT.innerHTML=rs.filter(function(r){var q=n(r.tel); if(!q||st[q]) return false; st[q]=1; return true;}).map(function(r){return '<option value="'+e(n(r.tel))+'" label="'+e(n(r.mail)||"")+'">';}).join("");
      var fv=!!n(o.firma.value), av=fv&&!!n(o.ad.value);
      o.ad.disabled=!fv; o.mail.disabled=!av; o.tel.disabled=!av;
      o.ad.placeholder=fv?"Ad Soyad":"önce şirket"; o.mail.placeholder=av?"E-posta":"önce ad soyad"; o.tel.placeholder=av?"Telefon":"önce ad soyad";
    }
    o.firma.addEventListener("input",tazele); o.ad.addEventListener("input",tazele);
    o.mail.addEventListener("input",function(){ if(n(o.tel.value)) return; var id=fid(); if(!id) return; var r=kayitlar(id,o.ad.value).find(function(x){return k(x.mail)===k(o.mail.value)&&n(x.tel);}); if(r) o.tel.value=n(r.tel); });
    o.tel.addEventListener("input",function(){ if(n(o.mail.value)) return; var id=fid(); if(!id) return; var r=kayitlar(id,o.ad.value).find(function(x){return n(x.tel)===n(o.tel.value)&&n(x.mail);}); if(r) o.mail.value=n(r.mail); });
    tazele(); return {tazele:tazele};
  }
  return {yukle:yukle,firmalar:firmalar,firmaBul:firmaBul,ilgililer:ilgililer,adlar:adlar,kayitlar:kayitlar,kaydet:kaydet,bagla:bagla,
          get F(){return F;}, get I(){return I;}, n:n, k:k};
})();

</script>

      var key=adaylar[i][0]; var c=key?_arbCC(ARB_URL,ARB_KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:key}}):_arbCC(ARB_URL,ARB_KEY);
      var e2=await arbEm(c);
      if(ARB_ROLLER.indexOf(e2)>=0 || (!key && e2===ARB_MB)){ ARB_ACTIVE=c; em=e2; break; }
    }
  }
  if(ARB_ROLLER.indexOf(em)>=0 || em===ARB_MB){ window.ARB_EM=em; (0,eval)(document.getElementById("arbmain").textContent); }
  else arbGateUI();
})(); }
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",ARB_BOOT); else ARB_BOOT();
</script>
<script type="text/plain" id="arbmain">
const sb=supabase.createClient(ARB_URL,ARB_KEY);
const BLOKLAR=[["YD1","Yurt Dışı Satış 1"],["YD2","Yurt Dışı Satış 2"]];
/* Sınıf adları Fiyatlandırma panosundaki listelerle aynı: 1-2 Fransa (YD1), 3-4 İngiltere, 5-6 Almanya (YD2) */
const SINIF_AD={1:"1. Sınıf Fransa",2:"2. Sınıf Fransa",3:"1. Sınıf İngiltere",4:"2. Sınıf İngiltere",5:"1. Sınıf Almanya",6:"2. Sınıf Almanya"};
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const MAIL_RE=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
let SINIF={}; const ARA={YD1:"",YD2:""}; const BAG={};
function setMsg(t,ok){ const m=document.getElementById("msg"); m.className="msg "+(ok?"ok":"err"); m.textContent=t; }
function sinifTxt(b,firma){ const a=SINIF[b+"|"+MUS.k(firma)]; return a?a.slice().sort().map(s=>SINIF_AD[s]||s).join(", "):""; }
async function load(){
  try{ await MUS.yukle(sb); }catch(e){ setMsg("Yüklenemedi: "+(e.message||e),false); return; }
  const r=await sb.from("fiyat_musteri_sinif").select("sinif,ad");
  SINIF={}; (r.data||[]).forEach(x=>{ const kk=(x.sinif<=2?"YD1":"YD2")+"|"+MUS.k(x.ad); (SINIF[kk]=SINIF[kk]||[]).push(x.sinif); });
  if(!document.querySelector("section.blk")) iskelet();
  BLOKLAR.forEach(([b])=>{ govde(b); if(BAG[b]) BAG[b].tazele(); });
}
function iskelet(){
  document.getElementById("list").innerHTML=BLOKLAR.map(([b,ad])=>
    '<section class="blk" data-b="'+b+'"><div class="sechead"><h2>'+esc(ad)+' ('+b+') — Müşteriler</h2><span class="say"></span><input class="ara" type="search" placeholder="Şirket / kişi ara…"></div>'
    +'<div class="addbar"><b>Yeni satır</b><input class="a-firma" placeholder="Şirket" autocomplete="off"><input class="a-ad" autocomplete="off"><input class="a-mail" type="email" autocomplete="off"><input class="a-tel" type="tel" autocomplete="off"><button class="btn a-ekle" type="button">Ekle</button><span class="amsg"></span></div>'
    +'<div class="card"><table><colgroup><col style="width:24%"><col style="width:13%"><col style="width:20%"><col style="width:24%"><col style="width:15%"><col style="width:4%"></colgroup>'
    +'<thead><tr><th>Şirket</th><th>Sınıf</th><th>Ad Soyad</th><th>E-posta</th><th>Telefon</th><th></th></tr></thead><tbody></tbody></table></div></section>').join("");
  document.querySelectorAll("section.blk").forEach(sec=>{
    const b=sec.dataset.b, q=c=>sec.querySelector(c);
    BAG[b]=MUS.bagla({blok:b,firma:q(".a-firma"),ad:q(".a-ad"),mail:q(".a-mail"),tel:q(".a-tel"),pre:"mus-"+b});
    q(".ara").addEventListener("input",e=>{ ARA[b]=e.target.value; govde(b); });
    q(".a-ekle").onclick=()=>ekle(sec);
    const tb=q("tbody");
    tb.addEventListener("change",e=>{ const el=e.target; if(el.classList.contains("fi")) firmaDegis(el); else if(el.classList.contains("il")) ilgiliDegis(el); });
    tb.addEventListener("click",e=>{ const el=e.target; if(el.classList.contains("del")) ilgiliSil(el.dataset.iid); else if(el.classList.contains("fdel")) firmaSil(el.dataset.fid); });
  });
}
function govde(b){
  const sec=document.querySelector('section.blk[data-b="'+b+'"]'); if(!sec) return;
  const q=MUS.k(ARA[b]); let say=0, sayI=0, g=0, h="";
  MUS.firmalar(b).forEach(f=>{
    const L=MUS.ilgililer(f.id).slice().sort((x,y)=>String(x.ad_soyad).localeCompare(String(y.ad_soyad),"tr"));
    if(q && !(MUS.k(f.firma).includes(q) || L.some(r=>[r.ad_soyad,r.mail,r.tel].some(v=>MUS.k(v).includes(q))))) return;
    say++; sayI+=L.length; const n=Math.max(1,L.length), cls=' class="g'+(g++%2)+'"';
    const bas='<td rowspan="'+n+'" class="fc"><div class="fwrap"><input class="cell fi" data-fid="'+f.id+'" value="'+esc(f.firma)+'" title="Şirket adı — değiştirilirse Fiyatlandırma panosundaki sınıf listesinde de değişir">'
      +((L.length||sinifTxt(b,f.firma))?'':'<button class="fdel" type="button" data-fid="'+f.id+'" title="Şirketi sil">✕</button>')+'</div></td><td rowspan="'+n+'" class="sn">'+esc(sinifTxt(b,f.firma))+'</td>';
    if(!L.length){ h+='<tr'+cls+'>'+bas+'<td colspan="4" class="bos">ilgili kaydı yok — üstteki satırdan ekleyin</td></tr>'; return; }
    L.forEach((r,i)=>{ h+='<tr'+cls+'>'+(i?'':bas)
      +'<td><input class="cell il" data-iid="'+r.id+'" data-k="ad_soyad" value="'+esc(r.ad_soyad)+'"></td>'
      +'<td><input class="cell il" data-iid="'+r.id+'" data-k="mail" type="email" value="'+esc(r.mail||"")+'"></td>'
      +'<td><input class="cell il" data-iid="'+r.id+'" data-k="tel" type="tel" value="'+esc(r.tel||"")+'"></td>'
      +'<td><button class="del" type="button" data-iid="'+r.id+'" title="İlgiliyi sil">✕</button></td></tr>'; });
  });
  sec.querySelector("tbody").innerHTML=h||'<tr><td colspan="6" class="bos">Kayıt yok.</td></tr>';
  sec.querySelector(".say").textContent=say+" şirket · "+sayI+" ilgili";
}
async function ekle(sec){
  const b=sec.dataset.b, q=c=>sec.querySelector(c), m=q(".amsg");
  const firma=q(".a-firma").value, ad=q(".a-ad").value, mail=q(".a-mail").value.trim(), tel=q(".a-tel").value;
  q(".a-mail").classList.remove("bad");
  if(!MUS.n(firma)){ m.className="amsg err"; m.textContent="Şirket yazın."; return; }
  if(mail && !MAIL_RE.test(mail)){ q(".a-mail").classList.add("bad"); m.className="amsg err"; m.textContent="E-posta geçersiz."; return; }
  if(!MUS.n(ad) && MUS.firmaBul(b,firma)){ m.className="amsg err"; m.textContent="Şirket zaten kayıtlı — ilgili için Ad Soyad yazın."; return; }
  try{ await MUS.kaydet(sb,b,firma,ad,mail,tel); }catch(e){ m.className="amsg err"; m.textContent="Kayıt hatası: "+(e.message||e); return; }
  ["a-firma","a-ad","a-mail","a-tel"].forEach(c=>q("."+c).value=""); m.className="amsg"; m.textContent="Eklendi ✓";
  govde(b); BAG[b].tazele(); q(".a-firma").focus();
}
async function firmaDegis(el){
  const f=MUS.F.find(x=>x.id===+el.dataset.fid); if(!f) return; const v=MUS.n(el.value);
  if(!v){ el.value=f.firma; setMsg("Şirket adı boş olamaz.",false); return; }
  if(MUS.k(v)!==MUS.k(f.firma) && MUS.firmaBul(f.blok,v)){ el.value=f.firma; setMsg("Bu adla kayıtlı şirket zaten var.",false); return; }
  const {error}=await sb.from("musteri_firma").update({firma:v}).eq("id",f.id);
  if(error){ el.value=f.firma; setMsg("Kayıt hatası: "+error.message,false); return; }
  setMsg("Kaydedildi ✓",true); await load();
}
async function ilgiliDegis(el){
  const r=MUS.I.find(x=>x.id===+el.dataset.iid); if(!r) return; const k=el.dataset.k; let v=el.value.trim();
  el.classList.remove("bad");
  if(k==="ad_soyad" && !v){ el.value=r.ad_soyad; setMsg("Ad Soyad boş olamaz.",false); return; }
  if(k==="mail" && v && !MAIL_RE.test(v)){ el.classList.add("bad"); setMsg("E-posta geçersiz.",false); return; }
  const upd={}; upd[k]=v||null;
  const {error}=await sb.from("musteri_ilgili").update(upd).eq("id",r.id);
  if(error){ el.value=r[k]||""; setMsg("Kayıt hatası: "+error.message,false); return; }
  r[k]=upd[k]; setMsg("Kaydedildi ✓",true); const b=(MUS.F.find(f=>f.id===r.firma_id)||{}).blok; if(b&&BAG[b]) BAG[b].tazele();
}
async function ilgiliSil(id){
  const r=MUS.I.find(x=>x.id===+id); if(!r) return; if(!confirm(r.ad_soyad+" silinsin mi?")) return;
  const {error}=await sb.from("musteri_ilgili").delete().eq("id",r.id);
  if(error){ setMsg("Silinemedi: "+error.message,false); return; }
  setMsg("Silindi",true); await load();
}
async function firmaSil(id){
  const f=MUS.F.find(x=>x.id===+id); if(!f) return; if(!confirm(f.firma+" şirketi silinsin mi?")) return;
  const {error}=await sb.from("musteri_firma").delete().eq("id",f.id);
  if(error){ setMsg("Silinemedi: "+error.message,false); return; }
  setMsg("Silindi",true); await load();
}
(function(){ const k=document.getElementById("arb-kim"); if(k) k.textContent="Giriş: "+(ARB_ROL_AD[window.ARB_EM]||window.ARB_EM||"");
  const b=document.getElementById("arb-cikis"); if(b&&window.ARB_EM===ARB_MB) b.style.display="none"; /* pano oturumu kapatılmasın */ if(b) b.onclick=async()=>{ try{ await sb.auth.signOut({scope:"local"}); }catch(e){} location.reload(); }; })();
load();
</script>
