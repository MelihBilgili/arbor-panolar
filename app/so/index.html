<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yurt İçi Satış Formu</title>
<style>
  :root{color-scheme:light}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Segoe UI',system-ui,sans-serif;background:#f7f8fa;color:#1c2430;font-size:14px}
  header{background:#16324f;color:#fff;padding:12px 16px}
  header h1{font-size:17px;margin:0;font-weight:700}
  header .sub{font-size:12px;color:#cfe0f0;margin-top:3px}
  .wrap{max-width:1120px;margin:0 auto;padding:14px 16px 60px}
  .bar{background:#fff;border:1px solid #dde3ea;border-radius:10px;padding:10px 14px;margin-bottom:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .sum{font-size:12.5px;color:#5a6b7d}

  .btn{background:#2e7d54;color:#fff;border:0;border-radius:8px;padding:9px 16px;font-size:14px;font-weight:700;cursor:pointer}
  .btn.sec{background:#e3edf7;color:#16324f;font-weight:600}

  .card{background:#fff;border:1px solid #dde3ea;border-radius:10px;overflow:auto}
  table{border-collapse:collapse;width:100%;font-size:13px;min-width:800px}
  thead th{background:#16324f;color:#fff;font-weight:600;font-size:11.5px;padding:8px 9px;text-align:left;white-space:nowrap;position:sticky;top:0}
  td{border-bottom:1px solid #eef1f5;padding:5px 7px;vertical-align:top}
  tbody tr:nth-child(even){background:#fbfcfe}
  input.cell,select.cell,textarea.cell{font:inherit;border:1px solid #cdd6df;border-radius:6px;padding:5px 7px;width:100%;background:#fff}
  input.cell:focus,select.cell:focus,textarea.cell:focus{border-color:#2e7d54;outline:none}
  td.net input{text-align:right}
  textarea.cell{min-height:34px;resize:vertical;min-width:200px}
  .del{color:#b40000;cursor:pointer;font-weight:700;border:0;background:none;font-size:16px;padding:0 4px}
  .colp{width:1%;white-space:nowrap}
  .hint{font-size:12px;color:#8a97a4;margin:10px 2px}
  .addrow{margin:10px 0}
  .dirty{color:#b8863a;font-weight:600}
  .load{padding:30px;text-align:center;color:#8a97a4}

html,body{max-width:100vw;overflow-x:hidden}
table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
</style>
</head>
<body>
<header>
  <h1>Yurt İçi Satış Formu</h1>
  <div class="sub"><b>Bu tabloda her hücre anında kaydedilir.</b></div>
  <div class="sub"><b>Muhtemel:</b> müşterinin teklifle ilgilendiği, revizyon/soru gelen projeler. <b>Alınan:</b> sözlü dahi işi aldığımız ama henüz üretime gönderilmemiş projeler.</div>
</header>
<div class="wrap">
  <div class="bar">
    <button class="btn sec" id="addM">+ Muhtemel satır</button>
    <button class="btn sec" id="addA">+ Alınan satır</button>
    <span class="sum" id="sum"></span>
    <span class="msg" id="msg"></span>
  </div>
  <div id="list" class="card"><div class="load">Yükleniyor…</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ARB-AD-YAZIM (2026-09-22, Melih): proje / müşteri / firma adları her kelimenin yalnız baş harfi büyük,
   kısaltmalar tamamı büyük. Supabase REST (/rest/v1/) yanıtlarında ve yazma gövdelerinde (POST/PATCH/PUT)
   proje · proje_adi · musteri · firma alanlarına (fiyat_musteri_sinif'te ad) uygulanır — tek kaynak: kod/_arb_ad_yazim.js */
(function(){
  if(window.ARB_AD) return;
  var AKR=("SCI SAS SARL SA SASU EURL SNC SEM SPL SPLA ZAC PEM PST MVT AÜP OE ÖB MK MB EU UK USA TR FR AŞ LTD LLC PLC GMBH AG BV NV SPA SRL "+
    "HLM OPH OPAC EHPAD CHU CROUS RATP SNCF IDF ICF HQE BBC CA ILM FCAI CLC CBC LCB BAT BTP TRT KDV SGDB SVM LMP RBKC MTC GTM NHS PVC "+
    "ARGE ARB YD SÖ TOKİ İBB İTÜ ODTÜ ENSA ESSEC ENS HEC IUT CFA RTE EDF GDF CCI CMA SEMIIC SAEM SPIE CPAM CAF UGC ARS KYK TMO SGK TCDD İSKİ AVM ÖSYM THY PTT MSB TBMM YTÜ MSGSÜ").split(" ");
  var AK={}; AKR.forEach(function(w){ AK[w]=1; });
  var KUCUK={ST:1,MR:1,DR:1,SR:1,JR:1,MRS:1,MS:1};           /* sesli harfsiz ama kısaltma sayılmayanlar → St, Mr … */
  var TRH=/[ğĞşŞıİçÇöÖüÜ]/, SESLI=/[aeiouyàâäéèêëîïôöùûüÿıAEIOUYÀÂÄÉÈÊËÎÏÔÖÙÛÜŸİ]/, ROMA=/^(I{1,3}|IV|VI{0,3}|IX|XI{0,3}|XIV|XV)$/;
  function up(w,tr){ return tr?w.toLocaleUpperCase("tr"):w.toUpperCase(); }
  function lo(w,tr){ return tr?w.toLocaleLowerCase("tr"):w.toLowerCase(); }
  var OLAGAN={};  /* karışık metinde büyük yazılsa da kısaltma sayılmayan sık kelimeler */
  ("LE LA LES DE DU DES SUR SOUS AUX AU ET EN UN UNE THE OF AND FOR ON IN AT TO VON DER DIE DAS UND IM AM ZUM ZUR VE İLE EVİ BEY HAN KAT LOT VIA DEL DI DA LOS EL SAN SUD NORD EST OUEST").split(" ").forEach(function(w){ OLAGAN[w]=1; });
  function kelime(w,karisik,tr){
    if(/\d/.test(w)) return w;                                   /* rakamlı (P19, I3F, 68s) aynen */
    var U=up(w,tr);
    if(AK[U]) return U;
    if(w.length===1) return U;                                   /* tek harf (Lot F, Y Blok) */
    if(ROMA.test(U)) return U;                                   /* III. Faz */
    if(!SESLI.test(w) && !KUCUK[U]) return U;                    /* sesli harfsiz: SVM, LMP, RBKC */
    if(karisik && w===U && w.length<=3 && !OLAGAN[U]) return U;                /* karışık yazılmış metinde büyük yazılmış kısa kelime = kısaltma */
    var l=lo(w,tr); return up(l.charAt(0),tr)+l.slice(1);
  }
  window.ARB_AD=function(s){
    if(s==null||typeof s!=="string") return s;
    var t=s.replace(/\s+/g," ").trim(); if(!t) return t;
    var harf=t.replace(/[^\p{L}]/gu,""), karisik=harf!==harf.toUpperCase()&&harf!==harf.toLowerCase(), tr=TRH.test(t);  /* Türkçe harf içeren metin → tr yerel ayarı (YAPI → Yapı) */
    return t.replace(/[\p{L}\p{M}\p{N}]+/gu,function(w){ return kelime(w,karisik,tr); });
  };
  var ALAN={proje:1,proje_adi:1,musteri:1,firma:1};
  function donus(o,tablo){
    if(Array.isArray(o)){ for(var i=0;i<o.length;i++) donus(o[i],tablo); return o; }
    if(o&&typeof o==="object"){ for(var k in o){ if(typeof o[k]==="string"&&(ALAN[k]||(k==="ad"&&tablo==="fiyat_musteri_sinif"))) o[k]=window.ARB_AD(o[k]); } }
    return o;
  }
  window.ARB_AD_DONUS=donus;
  var of=window.fetch.bind(window);
  window.fetch=function(u,o){
    var url=String((u&&u.url)||u||""), m=url.match(/\/rest\/v1\/([A-Za-z0-9_]+)/), tablo=m?m[1]:null;
    if(!tablo) return of(u,o);
    try{ var me=((o&&o.method)||"GET").toUpperCase();
      if(o&&typeof o.body==="string"&&/^(POST|PATCH|PUT)$/.test(me)&&tablo!=="rpc"){ o=Object.assign({},o,{body:JSON.stringify(donus(JSON.parse(o.body),tablo))}); } }catch(e){}
    return of(u,o).then(function(r){
      var ct=r.headers.get("content-type")||"";
      if(!r.ok||ct.indexOf("json")<0) return r;
      return r.clone().text().then(function(t){ if(!t) return r;
        try{ return new Response(JSON.stringify(donus(JSON.parse(t),tablo)),{status:r.status,statusText:r.statusText,headers:r.headers}); }catch(e){ return r; } });
    });
  };
})();
</script>
<script>
/* ARB-KOD-GIRIS (23.09.2026): forma giris = kisisel 6 haneli kod (App > Referans > Kisiler > Sifre).
   form-giris edge fonksiyonu kodu dogrular, yetkiyi form_erisim'den kontrol eder, rolu otomatik secer ve
   rol hesabi icin tek kullanimlik token doner; burada verifyOtp ile oturum acilir. Rol hesaplarinin parolasi yoktur. */
window.ARB_FORM_YOL=(function(){ var m=/\/app\/([^\/]+)\//.exec(location.pathname); return m?m[1]+"/":""; })();
window.ARB_KOD_GIRIS=async function(cli,kod){
  kod=String(kod==null?"":kod).replace(/\D/g,"");
  if(kod.length!==6) return {error:{message:"Kod 6 haneli olmal\u0131d\u0131r."}};
  try{
    var r=await fetch("https://zehysygpqxqmrzangvuc.supabase.co/functions/v1/form-giris",{method:"POST",cache:"no-store",
      headers:{"Content-Type":"application/json",apikey:"sb_publishable_ZCcDv4S7qH1hc9tuiv4__A_YVxmIpWc"},
      body:JSON.stringify({form:window.ARB_FORM_YOL,kod:kod})});
    var j={}; try{ j=await r.json(); }catch(e){}
    if(!r.ok||!j.ok||!j.token_hash) return {error:{message:j.hata||"Kod hatal\u0131."}};
    var v=await cli.auth.verifyOtp({token_hash:j.token_hash,type:"magiclink"});
    if(v.error) return {error:{message:"Giri\u015f a\u00e7\u0131lamad\u0131: "+v.error.message}};
    try{ localStorage.setItem("arb_kisi_"+window.ARB_FORM_YOL,JSON.stringify({kod:j.kisi,ad:j.ad,rol:j.rol})); }catch(e){}
    return {error:null,data:j};
  }catch(e){ return {error:{message:"Ba\u011flant\u0131 hatas\u0131."}}; }
};
window.ARB_KISI_AL=function(em){ try{ var k=JSON.parse(localStorage.getItem("arb_kisi_"+window.ARB_FORM_YOL)||"null"); return (k&&(!em||k.rol===em))?k:null; }catch(e){ return null; } };
</script>
<script>
/* ===== ARBOR FORM KAPISI (2026-08-20) — anon erisim kapali, rol hesabiyla giris ===== */
const ARB_ROLE_EMAIL = "so.form@arbor.com.tr";
const ARB_STORE = "arbform_" + ARB_ROLE_EMAIL.split("@")[0].replace(/\./g, "_");
const ARB_GATE_SB = supabase.createClient("https://zehysygpqxqmrzangvuc.supabase.co","sb_publishable_ZCcDv4S7qH1hc9tuiv4__A_YVxmIpWc",{auth:{persistSession:true,autoRefreshToken:true,storageKey:ARB_STORE}});
const ARB_MB = "int@arbor.com.tr";
/* panolarin varsayilan oturumu (ayni origin, varsayilan storageKey) */
const ARB_MB_SB = supabase.createClient("https://zehysygpqxqmrzangvuc.supabase.co","sb_publishable_ZCcDv4S7qH1hc9tuiv4__A_YVxmIpWc");
var ARB_ACTIVE = ARB_GATE_SB;
/* form kodu kendi createClient cagirsa bile aktif oturumlu istemci doner */
supabase.createClient = function(){ return ARB_ACTIVE; };
function arbGateUI(msg){
  var d=document.createElement("div"); d.id="arb-gate";
  d.style.cssText="position:fixed;inset:0;background:#16324f;z-index:99999;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',system-ui,sans-serif";
  d.innerHTML='<div style="background:#fff;color:#1c2430;padding:22px;border-radius:12px;width:310px;box-shadow:0 10px 40px rgba(0,0,0,.3)">'
    +'<div style="font-weight:700;font-size:16px;margin-bottom:3px">Arbor — Form Girisi</div>'
    +'<div style="font-size:12px;color:#5a6b7d;margin-bottom:10px">Kişisel giriş kodunuzu giriniz. Rolünüz koda göre otomatik belirlenir.</div>'
    +'<input id="arb-pw" type="password" placeholder="6 haneli giriş kodu" autocomplete="off" inputmode="numeric" maxlength="6" style="width:100%;font:inherit;padding:9px;border:1px solid #cdd6df;border-radius:8px">'
    +'<button id="arb-go" style="width:100%;margin-top:10px;font:inherit;font-weight:600;background:#2e7d54;color:#fff;border:0;border-radius:8px;padding:9px;cursor:pointer">Giris</button>'
    +'<div id="arb-msg" style="font-size:12px;color:#b40000;min-height:16px;margin-top:8px">'+(msg||"")+'</div></div>';
  document.body.appendChild(d);
  var go=async function(){
    var pw=document.getElementById("arb-pw").value;
    document.getElementById("arb-msg").style.color="#5a6b7d";
    document.getElementById("arb-msg").textContent="Giris yapiliyor...";
    var r=await ARB_KOD_GIRIS(ARB_GATE_SB,pw);
    if(r.error){ document.getElementById("arb-msg").style.color="#b40000"; document.getElementById("arb-msg").textContent=((r.error&&r.error.message)||"Kod hatalı."); return; }
    location.reload();
  };
  document.getElementById("arb-go").onclick=go;
  document.getElementById("arb-pw").onkeydown=function(e){ if(e.key==="Enter"){ e.preventDefault(); go(); } };
  setTimeout(function(){ var i=document.getElementById("arb-pw"); if(i) i.focus(); },50);
}
function ARB_BOOT(){ (async function(){
  var s=await ARB_GATE_SB.auth.getSession();
  var em=(s && s.data && s.data.session && s.data.session.user && s.data.session.user.email || "").toLowerCase();
  if(em!==ARB_ROLE_EMAIL){
    var m=await ARB_MB_SB.auth.getSession();
    var mem=(m && m.data && m.data.session && m.data.session.user && m.data.session.user.email || "").toLowerCase();
    if(mem===ARB_MB){ ARB_ACTIVE=ARB_MB_SB; em=mem; }
  }
  if(em===ARB_ROLE_EMAIL || em===ARB_MB){ (0,eval)(document.getElementById("arbmain").textContent); }
  else { arbGateUI(); }
})(); }
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", ARB_BOOT); else ARB_BOOT();
</script>
<script type="text/plain" id="arbmain">
const sb=supabase.createClient("https://zehysygpqxqmrzangvuc.supabase.co","sb_publishable_ZCcDv4S7qH1hc9tuiv4__A_YVxmIpWc");
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money=n=>{const v=Math.round(Number(n)||0);return v.toLocaleString("tr-TR");};
const parseNet=s=>{ if(s==null) return null; let t=String(s).replace(/[^0-9,.\-]/g,""); if(t.indexOf(",")>-1 && t.indexOf(".")>-1){ t=t.replace(/\./g,"").replace(",", "."); } else { t=t.replace(",", "."); } const v=parseFloat(t); return isNaN(v)?null:v; };
let ROWS=[], OLD_IDS=[], dirty=false, AKTIF_CEKIM=null;
async function load(){
  const {data,error}=await sb.from("satis_yorum").select("*").eq("kaynak","SO").eq("aktif",true);
  if(error){ document.getElementById("list").innerHTML='<div class="load">Hata: '+esc(error.message)+'</div>'; return; }
  const d=(data||[]).slice().sort((a,b)=> (a.statu||"").localeCompare(b.statu||"") || (Number(b.net_eur)||0)-(Number(a.net_eur)||0));
  OLD_IDS=d.map(r=>r.id);
  /* SATIS-CEKIM: satir bazli yeni kayit AKTIF CEKIME katilir; bugunun tarihiyle
     sahte cekim grubu acmaz (yoksa pano diff'i tum satirlari "eklenen" gosterir). */
  { const c={}; (data||[]).forEach(r=>{ if(r.cekim) c[r.cekim]=(c[r.cekim]||0)+1; });
    AKTIF_CEKIM = Object.keys(c).sort((a,b)=>(c[b]-c[a])||(a<b?1:-1))[0] || null; }
  ROWS=d.map(r=>({id:r.id,statu:r.statu||"Muhtemel",proje:r.proje||"",musteri:r.musteri||"",net_eur:r.net_eur,durum:r.durum||""}));
  dirty=false; render();
}
function setMsg(t,ok){ const m=document.getElementById("msg"); m.className="msg "+(ok?"ok":"err"); m.textContent=t; }
function markDirty(){ dirty=true; sums(); }
function sums(){
  const m=ROWS.filter(r=>/^muht/i.test(r.statu)), a=ROWS.filter(r=>/^al/i.test(r.statu));
  const s=arr=>arr.reduce((x,r)=>x+(Number(r.net_eur)||0),0);
  document.getElementById("sum").innerHTML="Muhtemel <b>"+m.length+"</b> / "+money(s(m))+" € &nbsp;·&nbsp; Alınan <b>"+a.length+"</b> / "+money(s(a))+" €"+(dirty?' &nbsp;<span class="dirty">(kaydedilmedi)</span>':'');
}
function render(){
  let h='<table><thead><tr><th class="colp">Statü</th><th>Proje</th><th>Müşteri</th><th class="colp">Net (€)</th><th>Durum</th><th class="colp"></th></tr></thead><tbody>';
  ROWS.forEach((r,i)=>{
    h+='<tr data-i="'+i+'">'
      +'<td class="colp"><select class="cell" data-f="statu"><option'+(/^muht/i.test(r.statu)?" selected":"")+'>Muhtemel</option><option'+(/^al/i.test(r.statu)?" selected":"")+'>Alınan</option></select></td>'
      +'<td><input class="cell" data-f="proje" value="'+esc(r.proje)+'"></td>'
      +'<td><input class="cell" data-f="musteri" value="'+esc(r.musteri)+'"></td>'
      +'<td class="colp net"><input class="cell" data-f="net_eur" style="width:120px" value="'+(r.net_eur==null?"":esc(r.net_eur))+'"></td>'
      +'<td><textarea class="cell" data-f="durum">'+esc(r.durum)+'</textarea></td>'
      +'<td class="colp"><button class="del" title="Satırı sil">✕</button></td>'
      +'</tr>';
  });
  h+='</tbody></table>';
  const list=document.getElementById("list"); list.innerHTML=h;
  /* Her hücre değişikliği ANINDA Supabase'e yazılır (Güncelle'ye basılmasa da kalıcı). */
  list.querySelectorAll("[data-f]").forEach(el=>{
    const i=+el.closest("tr").dataset.i, f=el.dataset.f;
    el.addEventListener("input",()=>{ ROWS[i][f]=el.value; sums(); });
    el.addEventListener("change",()=>{ ROWS[i][f]=el.value; saveRow(i,f); });
  });
  list.querySelectorAll(".del").forEach(b=>b.onclick=()=>delRow(+b.closest("tr").dataset.i));
  sums();
}
const stat=r=>/^al/i.test(r.statu)?"Alınan":"Muhtemel";
async function saveRow(i,f){
  const r=ROWS[i]; if(!r) return;
  if(!r.id){
    if(!(r.proje||"").trim()) return;   /* proje yazılana kadar kayıt açılmaz */
    const rec={grup:"Yurtiçi",kaynak:"SO",statu:stat(r),proje:(r.proje||"").trim(),musteri:(r.musteri||"").trim(),
               net_eur:parseNet(r.net_eur),durum:(r.durum||"").trim(),ulke:"TR",cekim:(AKTIF_CEKIM||new Date().toISOString().slice(0,10)),aktif:true};
    const {data,error}=await sb.from("satis_yorum").insert(rec).select();
    if(error){ setMsg("Kayıt hatası: "+error.message,false); return; }
    r.id=data[0].id; OLD_IDS.push(r.id); dirty=false; setMsg("Kaydedildi ✓",true); sums(); return;
  }
  const rec={};
  rec[f]= f==="net_eur" ? parseNet(r.net_eur) : (f==="statu" ? stat(r) : String(r[f]||"").trim());
  const {error}=await sb.from("satis_yorum").update(rec).eq("id",r.id);
  if(error){ setMsg("Kayıt hatası: "+error.message,false); return; }
  dirty=false; setMsg("Kaydedildi ✓",true); sums();
}
async function delRow(i){
  const r=ROWS[i]; if(!r) return;
  if(r.id){
    if(!confirm("Bu satır silinsin mi? (geri alınamaz)")) return;
    const {error}=await sb.from("satis_yorum").delete().eq("id",r.id);
    if(error){ setMsg("Silinemedi: "+error.message,false); return; }
    OLD_IDS=OLD_IDS.filter(x=>x!==r.id);
  }
  ROWS.splice(i,1); render(); setMsg("Silindi",true);
}
function addRow(statu){ ROWS.push({statu,proje:"",musteri:"",net_eur:null,durum:""}); render(); const inps=document.querySelectorAll('#list input[data-f="proje"]'); if(inps.length) inps[inps.length-1].focus(); }
async function publish(){
  const clean=[];
  for(const r of ROWS){
    const proje=(r.proje||"").trim(); if(!proje) continue;
    const statu=/^al/i.test(r.statu)?"Alınan":"Muhtemel";
    clean.push({grup:"Yurtiçi",kaynak:"SO",statu,proje,musteri:(r.musteri||"").trim(),net_eur:parseNet(r.net_eur),durum:(r.durum||"").trim(),ulke:"TR",cekim:new Date().toISOString().slice(0,10),aktif:true});
  }
  if(!clean.length){ setMsg("En az bir dolu (projesi olan) satır gerekli.",false); return false; }
  setMsg("Kaydediliyor…",true);
  const {error:eIns}=await sb.from("satis_yorum").insert(clean);
  if(eIns){ setMsg("Ekleme hatası: "+eIns.message,false); return false; }
  if(OLD_IDS.length){ const {error:eA}=await sb.from("satis_yorum").update({aktif:false}).in("id",OLD_IDS);
    if(eA){ setMsg("Eklendi ama önceki arşivlenemedi: "+eA.message,false); return false; } }
  setMsg("Yayınlandı ✓ ("+clean.length+" proje). Satış panosu güncel.",true);
  await load();
  return true;
}
document.getElementById("addM").onclick=()=>addRow("Muhtemel");
document.getElementById("addA").onclick=()=>addRow("Alınan");
/* ===== Güncelleme işareti (satis_ay_islendi + mail; yurtiçi takip yok) ===== */
setupAyIsaret("SO",null);
function setupAyIsaret(KAYNAK,SNAP){
  const AYLAR=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
  const btn0=document.getElementById("ayBtn"); if(!btn0) return;
  const now=new Date();

  }
