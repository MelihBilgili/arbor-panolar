  if(t==='tl'||t==='sf')return 100*m('lowe')+50*m('solar')+50*m('cool')+50*m('plan')+50*m('en')+5*m('coat')+3*m('sat')+1.5*m('xc')+1*m('tr')+Math.abs(C.tg-q.tg)/8+0.3*m('ac')+0.3*m('fp');
  return 100*m('tr')+3*m('ac')+1.5*d+1.5*i+Math.abs(C.tg-q.tg)/2+0.7*Math.abs(C.nlam-q.nlam)+Math.abs(C.cav-q.cav)/6+2*m('fp')+0.1*m('lowe');}
function kalin(q){if(q.kal!=null&&!q.own)return q.kal;const P=q.c.map(pane);return P.reduce((a,p)=>a+p.mm+(p.lam?0.38*p.pvb:0),0)+q.cav*(q.c.length-1);}
function median(a){a=a.slice().sort((x,y)=>x-y);const n=a.length;return n%2?a[(n-1)/2]:(a[n/2-1]+a[n/2])/2;}
/* CAM-LISTE-KENDI (04.11.2026, Melih): kombinasyon Cam Listesi'nde birebir varsa Ug/Tlg/Rw+Ctr/Sfg o satır(lar)dan; yoksa en yakınların medyanı */
const AYNI_K=['tr','lowe','solar','cool','plan','en','sat','xc','ac','fp','tp'];
function ayni(q,C){return C.c.join('/')===q.c.join('/')&&C.cav===q.cav&&AYNI_K.every(k=>(C[k]||0)===(q[k]||0))&&(C.coat||'')===(q.coat||'');}
function perf(q){const r={};for(const t of ['ug','tl','rw','sf']){const E=CAT.filter(C=>C[t]!=null&&ayni(q,C));if(E.length){r[t]=median(E.map(C=>C[t]));continue;}let mn=1e9,ds=[];for(const C of CAT){if(C[t]==null)continue;const d=dist(q,C,t);ds.push([d,C[t]]);if(d<mn)mn=d;}

  const X={tg:_tg,tg2:Math.pow(Math.min(q.tg,22)-14,2)/100,nlam:q.nlam,pvb4:q.pvb4,triple:q.tr,cav:q.cu,cav_dar:cl(q.cu<=12),cav_genis:cl(q.cu>=20),lowe:q.lowe,solar:q.solar,
