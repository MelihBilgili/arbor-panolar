  <h1>EU — Faaliyet Formu</h1>
  <div class="sub">Sevke hazır projeler, gelecek ay ve ileri tarihli projeler, sevke hazır ve üretimdeki PEM'ler. PST tarihleri Hedef Yükleme tarihlerine göre düzeltilir.</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ARB-AD-YAZIM (2026-09-22, Melih): proje / müşteri / firma adları her kelimenin yalnız baş harfi büyük,
   kısaltmalar tamamı büyük. Supabase REST (/rest/v1/) yanıtlarında ve yazma gövdelerinde (POST/PATCH/PUT)
   proje · proje_adi · musteri · firma alanlarına (fiyat_musteri_sinif'te ad) uygulanır — tek kaynak: kod/_arb_ad_yazim.js */
(function(){
  if(window.ARB_AD) return;
  var AKR=("SCI SAS SARL SA SASU EURL SNC SEM SPL SPLA ZAC PEM PST MVT AÜP OE ÖB MK MB EU UK USA TR FR AŞ LTD LLC PLC GMBH AG BV NV SPA SRL "+
    "HLM OPH OPAC EHPAD CHU CROUS RATP SNCF IDF ICF HQE BBC CA ILM FCAI CLC CBC LCB BAT BTP TRT KDV SGDB SVM LMP RBKC MTC GTM NHS PVC "+
    "ARGE ARB YD SÖ TOKİ İBB İTÜ ODTÜ ENSA ESSEC ENS HEC IUT CFA RTE EDF GDF CCI CMA SEMIIC SAEM SPIE CPAM CAF UGC ARS KYK TMO SGK TCDD İSKİ AVM ÖSYM THY PTT MSB TBMM YTÜ MSGSÜ").split(" ");
  var AK={}; AKR.forEach(function(w){ AK[w]=1; });
  var KUCUK={ST:1,MR:1,DR:1,SR:1,JR:1,MRS:1,MS:1};           /* sesli harfsiz ama kısaltma sayılmayanlar → St, Mr … */
  var TRH=/[ğĞşŞıİçÇöÖüÜ]/, SESLI=/[aeiouyàâäéèêëîïôöùûüÿıAEIOUYÀÂÄÉÈÊËÎÏÔÖÙÛÜŸİ]/, ROMA=/^(I{1,3}|IV|VI{0,3}|IX|XI{0,3}|XIV|XV)$/;
  function up(w,tr){ return tr?w.toLocaleUpperCase("tr"):w.toUpperCase(); }
  function lo(w,tr){ return tr?w.toLocaleLowerCase("tr"):w.toLowerCase(); }
  var OLAGAN={};  /* karışık metinde büyük yazılsa da kısaltma sayılmayan sık kelimeler */
  ("LE LA LES DE DU DES SUR SOUS AUX AU ET EN UN UNE THE OF AND FOR ON IN AT TO VON DER DIE DAS UND IM AM ZUM ZUR VE İLE EVİ BEY HAN KAT LOT VIA DEL DI DA LOS EL SAN SUD NORD EST OUEST").split(" ").forEach(function(w){ OLAGAN[w]=1; });
  function kelime(w,karisik,tr){
    if(/\d/.test(w)) return w;                                   /* rakamlı (P19, I3F, 68s) aynen */
    var U=up(w,tr);
    if(AK[U]) return U;
    if(w.length===1) return U;                                   /* tek harf (Lot F, Y Blok) */
    if(ROMA.test(U)) return U;                                   /* III. Faz */

    const U=mrows.filter(r=>r.blok==="pem"&&pno(r)<3).sort((a,b)=>(pno(a)-pno(b))||String(a.tarih||"9999").localeCompare(String(b.tarih||"9999")));
    const acl=r=>r.durum==="Acil"?'<span style="color:#b40000;font-weight:700">Acil · '+esc(r.sekil||"Kamyon")+'</span>':(r.talep==="Acil"?'<span style="color:#b26a00;font-weight:600" title="Şantiye acil talebi · MY onayı bekliyor">Acil talebi</span>':'<span class="muted">Normal</span>');
    const hed=r=>(r.durum==="Acil"&&r.hedef)?r.hedef:(r.plan||"");
    if(ue) ue.innerHTML='<div class="aupsevkh">Üretimdeki PEM\'ler <span style="font-weight:400;color:#5a6b7d">· ERP durumu &lt; 3 · yurt dışı · PEM: '+U.length+'</span></div>'
      +'<style>.hblk table{font-size:11.5px}.hblk th,.hblk td{white-space:nowrap;padding:2px 6px;border-bottom:1px solid #eef1f5;line-height:16px}.hblk thead th{vertical-align:bottom}.hblk .c>span{display:block;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;white-space:nowrap}.hblk .c>span::-webkit-scrollbar{display:none}.h3>span{width:3ch}.h8>span{width:8ch}.h15>span{width:15ch}.h25>span{width:25ch}.hdt>span{width:12.45ch}.h20>span{width:24ch}</style>'
      +'<div class="scroll hblk"><table><thead><tr><th>PEM</th><th>Proje Adı</th><th>Ek Bilgi</th><th>Adet</th><th>Termin Tarihi</th><th>ERP Durumu</th><th>Hedef Yükleme</th><th>Aciliyet</th></tr></thead><tbody>'
      +(U.map(r=>'<tr><td class="c h8"><span title="'+esc(r.no)+'">'+esc(r.kod)+'</span></td><td class="c h15"><span title="'+esc(r.proje)+'">'+esc(r.proje)+'</span></td><td class="c h25"><span title="'+esc(r.ekbilgi)+'">'+esc(r.ekbilgi)+'</span></td><td class="c h3"><span>'+esc(r.adet)+'</span></td><td class="c hdt"><span>'+esc(fdate(r.tarih))+'</span></td><td class="c h20"><span title="'+esc(r.durum_erp)+'">'+esc(r.durum_erp)+'</span></td><td class="c hdt"><span>'+esc(fdate(hed(r)))+'</span></td><td>'+acl(r)+'</td></tr>').join("")||'<tr><td colspan="8" class="c">Kayıt yok</td></tr>')
      +'</tbody></table></div>';
  }
}

  w.style.maxHeight=Math.max(240,Math.round(window.innerHeight-w.getBoundingClientRect().top-10))+"px";
}
