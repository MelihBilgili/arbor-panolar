<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arbor — Panolar</title>
<style>
  :root{color-scheme:light}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Segoe UI',system-ui,sans-serif;background:#f7f8fa;color:#1c2430;font-size:13px}
  header{background:#16324f;color:#fff;padding:0}
  .topbar{display:flex;align-items:center;gap:14px;padding:8px 14px}
  .topbar h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.5px}
  .tabs{display:flex;gap:2px;padding:4px 6px 0;flex-wrap:wrap}
  .tabs button{background:transparent;color:#cfe0f0;border:0;padding:3px 9px;font-size:11px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent}
  .tabs button.active{color:#fff;border-bottom-color:#fff;background:rgba(255,255,255,.08)}
  .spacer{flex:1}
  .who{font-size:12px;color:#cfe0f0}
  .btn{background:#2e7d54;color:#fff;border:0;border-radius:6px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer}
  .btn.sec{background:#e3edf7;color:#16324f}
  .wrap{padding:8px 10px}
  .login{max-width:360px;margin:9vh auto;background:#fff;border:1px solid #dde3ea;border-radius:12px;padding:24px}
  .login h2{margin:0 0 4px;color:#16324f;font-size:19px}
  .login p{margin:0 0 16px;color:#7a8794;font-size:12.5px}
  .login input{width:100%;padding:10px;border:1px solid #cdd6df;border-radius:8px;font-size:14px;margin-bottom:10px}
  .login .btn{width:100%}
  .msg{font-size:12px;margin-top:10px;min-height:16px}
  .msg.err{color:#b40000}.msg.ok{color:#2e7d54}
  .scroll{overflow:auto;border:1px solid #dde3ea;border-radius:8px;max-height:82vh;background:#fff}
  table{border-collapse:collapse;width:100%;font-size:12px}
  thead th{position:sticky;top:0;background:#16324f;color:#fff;font-weight:600;font-size:11px;padding:6px 8px;text-align:left;white-space:nowrap;z-index:2}
  td{border-bottom:1px solid #eef1f5;padding:4px 8px;vertical-align:top}
  tbody tr:nth-child(even){background:#fbfcfe}
  tbody tr:hover td{background:#eef6ff}
  td.red{background:#ffe1e1;color:#b40000;font-weight:700}
  .grp td{background:#e8eef5;font-weight:700;color:#16324f;position:sticky;left:0}
  .kod{font-weight:700;color:#16324f;white-space:nowrap}
  .gnb .kod,.gnb .grp td{font-weight:400}
  .ed{border:1px dashed transparent;border-radius:4px;padding:2px 4px;min-width:60px;cursor:text}
  .ed:hover{border-color:#b7c6d6;background:#fffef2}
  input.cell,select.cell{font:inherit;border:1px solid #86a6c6;border-radius:4px;padding:2px 4px;width:100%}
  .saveflash{outline:2px solid #2e7d54;transition:outline .1s}
  .hint{font-size:11px;color:#8a97a4;margin:4px 2px}
  .stamp{font-size:11.5px;color:#0a6b3f;font-weight:700;margin:2px 2px 8px}
  .num{text-align:right;white-space:nowrap}
  .snpink{background:#ffd9ec} .itot td{background:#eef4fb;font-weight:700}
  table.aup th,table.aup td{width:1%;white-space:nowrap}
  table.aup th.note,table.aup td.note{width:auto;white-space:normal;min-width:160px}
  .addbar{display:flex;gap:6px;margin:0 0 8px;flex-wrap:nowrap;align-items:center}
  .addbar input{border:1px solid #cdd6df;border-radius:6px;padding:6px 8px;font:inherit;min-width:0}
  .addbar select#ag-ilgili{flex:none;border:1px solid #cdd6df;border-radius:6px;padding:6px 6px;font:inherit;background:#fff}
  .addbar input#ag-konu{flex:1;min-width:0}
  .addbar .btn{flex:none;white-space:nowrap;padding:6px 12px}
  .load{padding:30px;text-align:center;color:#8a97a4}
  .del{color:#b40000;cursor:pointer;font-weight:700;border:0;background:none;font-size:14px;padding:0 4px}
  .flow{background:#fff;border:1px solid #dde3ea;border-radius:8px;padding:10px 12px;margin-bottom:12px;line-height:1.8}
  .step{display:inline-block;background:#eef4fb;border:1px solid #d3e0ee;border-radius:8px;padding:3px 8px;font-weight:600;color:#16324f}
  .arr{color:#2e7d54;font-weight:700;margin:0 3px}
  h3.sec{margin:14px 2px 6px;color:#16324f;font-size:13px}
  .flow p{margin:0 0 7px}.flow p:last-child{margin:0}
  .tag{display:inline-block;background:#16324f;color:#fff;font-size:10px;font-weight:700;border-radius:5px;padding:1px 7px;margin-left:6px;vertical-align:middle}
  .tag.ok{background:#2e7d54}
  .muted{color:#7a8794;font-size:11.5px}
  .sybox{background:#fff;border:1px solid #dde3ea;border-radius:8px;padding:6px 14px;margin:4px 0 10px}
  .syrow{font-size:15px;color:#1c2430;padding:6px 0;border-bottom:1px solid #f0f3f7}
  .syrow:last-child{border-bottom:0}
  table.tks{border-collapse:collapse;width:100%;font-size:13px;margin:2px 0 12px}
  table.tks th{background:#16324f;color:#fff;font-weight:600;font-size:11px;padding:5px 7px;text-align:center;white-space:nowrap}
  table.tks td{border-bottom:1px solid #eef1f5;padding:4px 7px}
  table.tks tr.grp td{font-weight:700;background:#eef3f8;border-top:2px solid #cdd8e4}
  .dl{font-size:12px;color:#6a7888;font-weight:600}
  .pin{background:#eef4fb;border:1px solid #d3e0ee;border-radius:8px;padding:8px 12px;font-size:11.5px;color:#16324f;margin:0 2px 12px;line-height:1.6}
  .secH{margin:16px 2px 6px;color:#16324f;font-size:13px;font-weight:700;border-left:3px solid #16324f;padding-left:8px}
  .law{background:#fff;border:1px solid #dde3ea;border-radius:8px;margin-bottom:7px;padding:9px 12px;display:flex;gap:11px;align-items:flex-start}
  .law:hover{background:#fafcff}
  .lno{font-weight:700;color:#fff;background:#16324f;border-radius:6px;min-width:34px;height:24px;display:flex;align-items:center;justify-content:center;font-size:12px;flex:none;padding:0 4px}
  .lno.ek{background:#b8863a}
  .lbody{flex:1;min-width:0}
  .ltitle{font-weight:700;color:#1c2430}
  .ldate{font-size:10.5px;color:#93a1b0;font-weight:600;margin-left:6px}
  .ltext{color:#3a4756;line-height:1.55;margin-top:3px}
  .ltext .sub{display:block;margin-top:3px;color:#4a5867}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://zehysygpqxqmrzangvuc.supabase.co";
const SUPABASE_KEY = "sb_publishable_ZCcDv4S7qH1hc9tuiv4__A_YVxmIpWc";

const memStore = {};
function safeStorage(){
  try{ const k="__arb_t"; window.localStorage.setItem(k,"1"); window.localStorage.removeItem(k); return window.localStorage; }
  catch(e){ return { getItem:k=> (k in memStore? memStore[k]:null), setItem:(k,v)=>{memStore[k]=String(v)}, removeItem:k=>{delete memStore[k]} }; }
}
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:false, storage:safeStorage() }
});

const app = document.getElementById("app");
let state = { tab:"gundem", email:"", session:null, allowed:null };
const PREFIX = { F:"Fabrika", G:"Yurtdışı / Genel", P:"PEM", S:"Şahsi", ARGE:"ARGE" };

function esc(s){ return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fdate(s){ if(!s) return ""; const d=new Date(s); if(isNaN(d)) return esc(s); return String(d.getDate()).padStart(2,'0')+"."+String(d.getMonth()+1).padStart(2,'0')+"."+String(d.getFullYear()).slice(2); }
function money(n){ if(n==null||n==="") return ""; const v=Math.round(Number(n)); return isNaN(v)?"":v.toLocaleString("tr-TR"); }

/* ---------- AUTH ---------- */
function renderLogin(){
  app.innerHTML = `
   <div class="login">
     <h2>Arbor Panolar</h2>
     <p>Devam etmek için giriş yap.</p>
     <input id="email" type="email" placeholder="ornek@arbor.com.tr" value="${esc(state.email)}" autocomplete="username">
     <input id="pw" type="password" placeholder="Parola" autocomplete="current-password">
     <button class="btn" id="go">Giriş yap</button>
     <div class="msg" id="msg"></div>
   </div>`;
  document.getElementById("go").onclick = doLogin;
  document.getElementById("pw").onkeydown = e=>{ if(e.key==='Enter'){ e.preventDefault(); doLogin(); } };
}
function msg(t,ok){ const m=document.getElementById("msg"); if(m){ m.textContent=t; m.className="msg "+(ok?"ok":"err"); } }
async function doLogin(){
  const email=document.getElementById("email").value.trim();
  const pw=document.getElementById("pw").value;
  if(!email||!pw){ msg("E-posta ve parola gir."); return; }
  state.email=email; msg("Giriş yapılıyor…",true);
  const {data,error}=await sb.auth.signInWithPassword({ email, password:pw });
  if(error){ msg("Hata: "+error.message); return; }
  state.session=data.session; await loadPerms(); renderApp();
}
async function doLogout(){ await sb.auth.signOut(); state.session=null; state.allowed=null; state.tab="gundem"; renderLogin(); }
/* Kullanıcının yetkili olduğu bölümler (yetkiler tablosu, RLS ile yalnız kendi satırları). '*' = admin (hepsi). */
async function loadPerms(){
  try{
    const {data,error}=await sb.from("yetkiler").select("bolum");
    if(error){ state.allowed=null; return; }
    const rows=data||[];
    state.allowed = rows.some(r=>r.bolum==='*') ? null : rows.map(r=>r.bolum);
  }catch(e){ state.allowed=null; }
}

/* ---------- APP SHELL ---------- */
const TABS=[["gundem","Ana Gündem"],["aup","AÜP"],["hazir","Hazır PEM/PRJ"],["so","SÖ"],["satis","Satış"],["bilanco","Bilanço"],["icmal","İcmal"],["ref","Referans"],["prosedur","⚖️ Prosedürler"],["formlar","Formlar"],["blueprint","Blueprint"],["ozel","🔒 Özel"]];
function renderApp(){
  const vis = TABS.filter(t=> state.allowed===null || state.allowed.includes(t[0]));
  if(!vis.length){ app.innerHTML=`<div class="login"><h2>Arbor Panolar</h2><p>Bu hesap için tanımlı bir bölüm yok. Yöneticiyle görüşün.</p><button class="btn" id="lo">Çıkış</button></div>`; document.getElementById("lo").onclick=doLogout; return; }
  if(!vis.some(t=>t[0]===state.tab)) state.tab=vis[0][0];
  app.innerHTML = `
   <header>
     <div class="tabs">
       ${vis.map(t=>`<button data-t="${t[0]}" class="${state.tab===t[0]?'active':''}">${t[1]}</button>`).join("")}
     </div>
   </header>
   <div class="wrap" id="view"><div class="load">Yükleniyor…</div></div>`;
  document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{ state.tab=b.dataset.t; renderApp(); });
  loadView();
}
function loadView(){
  if(state.tab==='gundem') loadGundem();
  else if(state.tab==='hazir') loadHazir();
  else if(state.tab==='so') loadSo();
  else if(state.tab==='satis') loadSatis();
  else if(state.tab==='bilanco') loadBilanco();
  else if(state.tab==='icmal') loadIcmal();
  else if(state.tab==='ref') loadRef();
  else if(state.tab==='prosedur') loadProsedur();
  else if(state.tab==='formlar') loadFormlar();
  else if(state.tab==='blueprint') loadBlueprint();
  else if(state.tab==='ozel') loadOzel();
  else loadAup();
}
function fmtDamga(dg){ return (dg&&dg.length>=6)? dg.slice(4,6)+"."+dg.slice(2,4)+"."+dg.slice(0,2) : "—"; }
function dOnly(iso){ if(!iso) return "—"; const d=new Date(iso); return isNaN(d)?"—":String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+"."+String(d.getFullYear()).slice(2); }
async function erpStamp(){ const {data}=await sb.from("erp_yukleme").select("damga").order("damga",{ascending:false}).limit(1); return data&&data[0]?fmtDamga(data[0].damga):"—"; }
async function tblStamp(t){ const {data}=await sb.from(t).select("updated_at").order("updated_at",{ascending:false}).limit(1); return data&&data[0]?dOnly(data[0].updated_at):"—"; }
function stampHTML(d){ return '<div class="stamp">Son güncelleme: '+(d||"—")+'</div>'; }

/* ---------- ANA GÜNDEM (blok = kod_prefix; İlgili = kişi; kapat = sil) ---------- */
async function loadGundem(){
  const view=document.getElementById("view");
  const [g,ar]=await Promise.all([
    sb.from("ana_gundem").select("*"),
    sb.from("gundem_arge").select("*")
  ]);
  const err=g.error||ar.error;
  if(err){ view.innerHTML=`<div class="load">Hata: ${esc(err.message)}</div>`; return; }
  const man=(g.data||[]).map(r=>Object.assign({_ed:true},r));
  const der=(ar.data||[]).map(r=>Object.assign({_ed:false},r));
  const all=man.concat(der);
  const onc=r=>{ const m=String(r.son_durum||"").match(/Öncelik\s*(\d+)/i); return m?parseInt(m[1]):(r.sira!=null?r.sira:999); };
  const ac=r=>{ const m=String(r.son_durum||"").match(/(\d{2})\.(\d{2})\.(\d{4})/); return m?(m[3]+m[2]+m[1]):"99999999"; };
  const isA=r=>/Öncelik/i.test(String(r.son_durum||""));
  const groups={};
  all.forEach(r=>{ const k=isA(r)?"ARGE":(r.ilgili||"—"); (groups[k]=groups[k]||[]).push(r); });
  Object.keys(groups).forEach(k=>groups[k].sort((a,b)=>{
    const aA=isA(a),bA=isA(b);
    if(aA!==bA) return aA?1:-1;
    if(aA){ const oa=onc(a),ob=onc(b); if(oa!==ob) return oa-ob; const ca=ac(a),cb=ac(b); if(ca!==cb) return ca.localeCompare(cb); return String(a.kod).localeCompare(String(b.kod)); }
    return String(a.kod).localeCompare(String(b.kod));
  }));
  const keys=Object.keys(groups).sort((a,b)=> ((a==="ARGE")-(b==="ARGE")) || groups[b].length-groups[a].length || a.localeCompare(b));
  let rows="";
  keys.forEach(k=>{
    rows+=`<tr class="grp"><td colspan="3">${esc(k)} · ${groups[k].length}</td></tr>`;
    groups[k].forEach(r=>{
      if(r._ed){
        rows+=`<tr data-id="${r.id}">
          <td class="kod">${esc(r.kod)}</td>
          <td>${esc(r.konu)}</td>
          <td><button class="del" title="Kapat (sil)" data-id="${r.id}">✕</button></td>
        </tr>`;
      } else {
        rows+=`<tr style="background:#fafbfd" title="ERP-türevi · salt-okur">
          <td class="kod" style="color:#5a6b7d">${esc(r.kod)}</td>
          <td>${esc(r.konu)}</td>
          <td></td>
        </tr>`;
      }
    });
  });
  const st=await erpStamp();
  const ilgSet=[...new Set(["MB","EA","OE","CTP","EU"].concat(keys.filter(k=>k!=='ARGE')))];
  const ilgSel=ilgSet.map(k=>`<option value="${esc(k)}"${k==='MB'?' selected':''}>${esc(k)}</option>`).join("")+`<option value="__new__">Diğer…</option>`;
  view.innerHTML=`${stampHTML(st)}
    <div class="addbar">
      <select id="ag-ilgili" title="İlgili">${ilgSel}</select>
      <input id="ag-konu" placeholder="Yeni konu">
      <button class="btn" id="ag-add">Ekle</button>
    </div>
    <div class="scroll"><table class="gnb">
    <thead><tr><th>Kod</th><th>Konu</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
  view.querySelectorAll(".ed").forEach(el=>el.onclick=()=>startEdit(el));
  view.querySelectorAll(".del").forEach(b=>b.onclick=()=>delGundem(b.dataset.id));
  document.getElementById("ag-add").onclick=addGundem;
  document.getElementById("ag-konu").onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); addGundem(); } };
}
async function addGundem(){
  const ei=document.getElementById("ag-ilgili"), ek=document.getElementById("ag-konu");
  let ilg=(ei.value||"").trim();
  if(ilg==="__new__"){ ilg=(prompt("İlgili kodu (ör. MK, FA):")||"").trim(); }
  ilg=ilg.toUpperCase();
  const konu=(ek.value||"").trim();
  if(!ilg||!konu){ (ilg?ek:ei).focus(); return; }
  const btn=document.getElementById("ag-add"); btn.disabled=true; btn.textContent="Ekleniyor…";
  const {data}=await sb.from("ana_gundem").select("kod").like("kod","M%");
  let mx=0; (data||[]).forEach(r=>{ const m=String(r.kod||"").match(/^M(\d+)$/); if(m) mx=Math.max(mx,+m[1]); });
  const {error}=await sb.from("ana_gundem").insert([{kod:"M"+(mx+1),kod_prefix:"M",konu,ilgili:ilg,kaynak_tip:"manuel",turetilmis:false}]);
  btn.disabled=false; btn.textContent="Ekle";
  if(error){ alert(error.message); return; }
  loadGundem();
}

async function delGundem(id){
  if(!confirm("Bu gündem maddesi kalıcı olarak silinsin mi? (kapat = sil)")) return;
  const {error}=await sb.from("ana_gundem").delete().eq("id",id);
  if(error){ alert(error.message); return; }
  loadGundem();
}
function startEdit(el){
  if(el.querySelector("input,select")) return;
  const f=el.dataset.f, type=el.dataset.type, id=el.closest("tr").dataset.id;
  const cur=el.textContent.trim().replace(/^\+.*/,"").replace(/^tarih$/,"");
  const inp=document.createElement("input"); inp.className="cell"; inp.type = type==='date'?'date':'text';
  inp.value = type==='date'? "": cur;
  el.innerHTML=""; el.appendChild(inp); inp.focus();
  const commit=async()=>{
    let val=inp.value;
    if(type==='date' && !val){ el.innerHTML='<span style=color:#b7c6d6>tarih</span>'; return; }
    const {error}=await sb.from("ana_gundem").update({[f]:val||null}).eq("id",id);
    if(error){ el.innerHTML='<span style=color:#b40000>hata</span>'; alert(error.message); return; }
    el.textContent = type==='date'? fdate(val) : (val|| "");
    el.classList.add("saveflash"); setTimeout(()=>el.classList.remove("saveflash"),400);
  };
  inp.onblur=commit;
  inp.onkeydown=e=>{ if(e.key==='Enter'){e.preventDefault();inp.blur();} if(e.key==='Escape'){loadGundem();} };
}

/* ---------- SÖ (so_panosu, bölüm bloklu) ---------- */
async function loadSo(){
  const view=document.getElementById("view");
  const {data,error}=await sb.from("so_panosu").select("*");
  if(error){ view.innerHTML=`<div class="load">Hata: ${esc(error.message)}</div>`; return; }
  const groups={};
  (data||[]).forEach(r=>{ const k=r.bolum||"—"; (groups[k]=groups[k]||[]).push(r); });
  let rows="";
  Object.keys(groups).sort().forEach(k=>{
    rows+=`<tr class="grp"><td colspan="6">${esc(k)} · ${groups[k].length}</td></tr>`;
    groups[k].forEach(r=>{
      rows+=`<tr>
        <td class="kod">${esc(r.nr)}</td>
        <td class="num">${fdate(r.tarih)}</td>
        <td>${esc(r.durum)}</td>
        <td>${esc(r.proje_adi||r.proje_numarasi)}</td>
        <td>${esc(r.problem)}</td>
        <td>${esc(r.bildiren)}</td>
      </tr>`;
    });
  });
  const st=await erpStamp();
  view.innerHTML=`${stampHTML(st)}<div class="hint">SÖ — açık Sorun ve Öneriler (Şantiye/PEM), <b>kusurlu birim = bölüme</b> göre bloklu, açılış tarihine göre. ${(data||[]).length} kayıt.</div>
    <div class="scroll"><table>
    <thead><tr><th>NR</th><th>Açılış</th><th>Durum</th><th>Proje</th><th>Problem</th><th>Bildiren</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

/* ---------- SATIŞ YORUM (satis_yorum: SO yurtiçi + FY yurtdışı, tek pano) ---------- */
async function loadSatis(){
  const view=document.getElementById("view");
  const [sy,tk,ss]=await Promise.all([ sb.from("satis_yorum").select("*"), sb.from("satis_takip").select("*").eq("aktif",true), sb.from("satis_takip_stats").select("*") ]);
  if(sy.error){ view.innerHTML=`<div class="load">Hata: ${esc(sy.error.message)}</div>`; return; }
  const data=sy.data||[];
  const cur=data.filter(r=>r.aktif), archived=data.filter(r=>!r.aktif);
  const prevCekim={}; archived.forEach(r=>{ if(!prevCekim[r.kaynak]||r.cekim>prevCekim[r.kaynak]) prevCekim[r.kaynak]=r.cekim; });
  const prev=archived.filter(r=>r.cekim===prevCekim[r.kaynak]);
  const prevSrc=new Set(prev.map(r=>r.kaynak));
  const curCmp=cur.filter(r=>prevSrc.has(r.kaynak));
  const by=(arr,s)=>arr.filter(r=>String(r.statu).toLocaleLowerCase('tr').startsWith(s));
  const sum=arr=>arr.reduce((a,r)=>a+(Number(r.net_eur)||0),0);
  const cM=by(cur,'muht'), cA=by(cur,'al'), cMc=by(curCmp,'muht'), cAc=by(curCmp,'al'), pM=by(prev,'muht'), pA=by(prev,'al');
  const dAd=(a,b)=> b.length? ` <span class="dl">(${a.length-b.length>=0?'+':'−'}${Math.abs(a.length-b.length)} ad)</span>`:'';
  const dTut=(a,b)=>{ if(!b.length) return ''; const v=Math.round(sum(a)-sum(b)); return ` <span class="dl">(${v>=0?'+':'−'}${money(Math.abs(v))} €)</span>`; };
  const key=r=>String(r.proje).trim().toLocaleLowerCase('tr');
  const diff=(c,p)=>{ const ps=new Set(p.map(key)), cs=new Set(c.map(key));
    return { ekl:c.filter(r=>!ps.has(key(r))), sil:p.filter(r=>!cs.has(key(r))) }; };
  const chip=r=>`${esc(r.proje)} (${esc(r.grup)}, ${money(r.net_eur)} €)`;
  const esList=(c,p)=>{ if(!p.length) return ''; const {ekl,sil}=diff(c,p); let s='';
    if(ekl.length) s+=` &nbsp;·&nbsp; <b style="color:#0a6b3f">Eklenen (${ekl.length}):</b> ${ekl.map(chip).join(' · ')}`;
    if(sil.length) s+=` &nbsp;·&nbsp; <b style="color:#b23a2e">Silinen (${sil.length}):</b> ${sil.map(chip).join(' · ')}`;
    return s; };
  const src={}; cur.forEach(r=>{ src[r.kaynak]={cekim:r.cekim,grup:r.grup}; });
  const srcLine=Object.keys(src).sort().map(k=>`${esc(src[k].grup)} (${esc(k)}): ${dOnly(src[k].cekim)}${prevCekim[k]?` <span class="muted">(önceki ${dOnly(prevCekim[k])})</span>`:''}`).join('  ·  ');
  const stampDate=cur.reduce((m,r)=> (r.cekim>m?r.cekim:m), '0');
  const tbl=arr=>{ const g={}; arr.forEach(r=>{ (g[r.grup]=g[r.grup]||[]).push(r); });
    let rows=''; Object.keys(g).sort().forEach(gn=>{
      const list=g[gn].slice().sort((a,b)=>(Number(b.net_eur)||0)-(Number(a.net_eur)||0));
      rows+=`<tr class="grp"><td colspan="4">${esc(gn)} · ${list.length} proje · Net ${money(sum(list))} €</td></tr>`;
      list.forEach(r=>{ rows+=`<tr><td class="kod" style="white-space:normal">${esc(r.proje)}</td><td>${esc(r.musteri)}</td><td>${esc(r.durum)}</td><td class="num">${money(r.net_eur)}</td></tr>`; });
    });
    return `<div class="scroll"><table><thead><tr><th>PROJE</th><th>MÜŞTERİ</th><th>DURUM</th><th class="num">NET (€)</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  };
  const totAd=cM.length+cA.length, totTut=sum(cM)+sum(cA);
  const bigrow=(lbl,ad,tut,dad,dtut)=>`<div class="syrow"><b>${lbl} Proje Sayısı:</b> ${ad} ad${dad} &nbsp;·&nbsp; <b>Tutar:</b> ${money(tut)} €${dtut}</div>`;
  const takip=(tk.data||[]).slice().sort((a,b)=>(Number(b.net_ht_eur)||0)-(Number(a.net_ht_eur)||0));
  const tkNet=takip.reduce((a,r)=>a+(Number(r.net_ht_eur)||0),0);
  const tkRows=takip.map(r=>`<tr>
     <td class="kod" style="white-space:normal">${esc(r.proje)}</td>
     <td>${esc(r.musteri)}</td>
     <td>${esc(r.ulke)}</td>
     <td>${esc(r.hazirlayan)}</td>
     <td class="num">${fdate(r.teklif_tarihi)}</td>
     <td>${esc(r.agac)}</td>
     <td class="num">${money(r.net_ht_eur)}</td>
     <td>${esc(r.takip_sekli)}</td>
     <td>${esc(r.ihale)}</td>
     <td>${esc(r.durum)}</td></tr>`).join("");
  const takipHTML = takip.length? `
    <h3 class="sec">Yurtdışı takipteki teklifler <span class="muted">(${takip.length} teklif · Net HT ${money(tkNet)} €)</span></h3>
    <div class="scroll"><table class="aup">
    <thead><tr><th>PROJE</th><th>MÜŞTERİ</th><th>ÜLKE</th><th>HAZIRLAYAN</th><th>TEKLİF</th><th>AĞAÇ</th><th class="num">NET HT (€)</th><th>TAKİP</th><th>İHALE</th><th>DURUM</th></tr></thead>
    <tbody>${tkRows}</tbody></table></div>`:'';
  /* ---- Takipteki teklifler: yıllık sonuç istatistiği (satis_takip_stats) ---- */
  const stats=(ss&&!ss.error)?(ss.data||[]):[];
  let statsHTML='';
  if(stats.length){
    const DD=['Kazandık','Kaybettik','Belirsiz','Müşteri işi alamadı'];
    const S={}, years=new Set();
    stats.forEach(r=>{ const y=r.yil, u=r.ulke||'—', d=r.durum; years.add(y);
      (S[y]=S[y]||{}); (S[y][u]=S[y][u]||{});
      S[y][u][d]={adet:Number(r.adet)||0,tutar:Number(r.tutar)||0,ort:r.ort_isk==null?null:Number(r.ort_isk)}; });
    const rd=v=>v==null?'—':Math.round(v)+'%';
    const full=o=>o?`<td class="num">${o.adet}</td><td class="num">${money(o.tutar)}</td><td class="num">${rd(o.ort)}</td>`:'<td class="num">0</td><td class="num">—</td><td class="num">—</td>';
    const cnt=o=>`<td class="num">${o?o.adet:0}</td>`;
    const rowFor=(lbl,g,cl)=>`<tr${cl?' class="grp"':''}><td class="kod">${esc(lbl)}</td>${full(g['Kazandık'])}${full(g['Kaybettik'])}${cnt(g['Belirsiz'])}${cnt(g['Müşteri işi alamadı'])}</tr>`;
    const yrs=[...years].sort((a,b)=>b-a);
    statsHTML='<h3 class="sec">Takipteki teklifler — yıllık sonuç istatistiği</h3>'
      +'<div class="hint">Ülke bazında + Toplam. Kazandık/Kaybettik: adet · tutar · ort. iskonto. Belirsiz/Müşteri işi alamadı: adet. Yıl = kararın verildiği yıl (Belirsiz için teklif yılı).</div>';
    yrs.forEach(y=>{
      const uls=Object.keys(S[y]).sort();
      const gT={}; DD.forEach(d=>{ let ad=0,tu=0,ws=0,wa=0; uls.forEach(u=>{ const o=S[y][u][d]; if(o){ ad+=o.adet; tu+=o.tutar; if(o.ort!=null){ ws+=o.ort*o.adet; wa+=o.adet; } } }); gT[d]={adet:ad,tutar:tu,ort:wa?ws/wa:null}; });
      let body=uls.map(u=>rowFor(u,S[y][u],false)).join('');
      body+=rowFor('Toplam',gT,true);
      statsHTML+=`<div class="scroll"><table class="tks"><thead>
        <tr><th rowspan="2">${y} · ÜLKE</th><th colspan="3">Kazandık</th><th colspan="3">Kaybettik</th><th rowspan="2" class="num">Belirsiz<br>(adet)</th><th rowspan="2" class="num">Müşteri işi<br>alamadı (adet)</th></tr>
        <tr><th class="num">Adet</th><th class="num">Tutar €</th><th class="num">Ort.İsk</th><th class="num">Adet</th><th class="num">Tutar €</th><th class="num">Ort.İsk</th></tr>
        </thead><tbody>${body}</tbody></table></div>`;
    });
  }
  view.innerHTML=`
    <div class="stamp">Satış — Son güncelleme: ${dOnly(stampDate)}</div>
    <div class="hint">Yurtiçi (SO) + Yurtdışı (FY) birleşik · Kaynak — ${srcLine}</div>
    <div class="sybox">
      ${bigrow('Muhtemel',cM.length,sum(cM),dAd(cMc,pM),dTut(cMc,pM))}
      ${bigrow('Alınan',cA.length,sum(cA),dAd(cAc,pA),dTut(cAc,pA))}
      ${bigrow('Toplam',totAd,totTut, dAd(curCmp,prev), dTut(curCmp,prev))}
    </div>
    <h3 class="sec">Muhtemel <span class="muted">(${cM.length} proje · Net ${money(sum(cM))} €)</span><span class="muted">${esList(cMc,pM)}</span></h3>
    ${tbl(cM)}
    <h3 class="sec">Alınan <span class="muted">(${cA.length} proje · Net ${money(sum(cA))} €)</span><span class="muted">${esList(cAc,pA)}</span></h3>
    ${tbl(cA)}
    ${statsHTML}
    ${takipHTML}
  `;
}

/* ---------- AÜP (salt-okur) ---------- */
async function loadAup(){
  const view=document.getElementById("view");
  const [{data,error},oz]=await Promise.all([sb.from("aup_panosu").select("*").order("aup",{ascending:true}), sb.from("aup_ozet").select("*").order("damga",{ascending:false}).limit(2)]);
  if(error){ view.innerHTML=`<div class="load">Hata: ${esc(error.message)}</div>`; return; }
  const dk=d=>{ d=String(d||""); const i=d.indexOf(" "); return i<0?d:(d.slice(0,i)+" "+d.slice(i+1,i+4)); };
  let rows="";
  data.forEach(r=>{
    const ga=r.gyt_aup, ky=r.kayma;
    rows+=`<tr>
      <td class="kod">${esc(String(r.proje_no||"").slice(-6))}</td>
      <td>${esc(String(r.proje_adi||"").slice(0,30))}</td>
      <td>${esc(dk(r.proje_durumu))}</td>
      <td class="num">${esc(r.adet)}</td>
      <td class="num">${fdate(r.mvt)}</td>
      <td class="num">${fdate(r.aup)}</td>
      <td class="num">${fdate(r.gyt)}</td>
      <td class="num ${ga>0?'red':''}">${ga==null?'':ga}</td>
      <td class="num ${ky>=3?'red':''}">${ky==null?'':ky}</td>
      <td class="num">${money(r.anlasma_fiyati)}</td>
      <td class="note${r.satis_santiye_notlari?' snpink':''}">${esc(r.satis_santiye_notlari)}</td>
      <td class="note">${esc(r.uretim_notlari)}</td>
    </tr>`;
  });
  const st=await erpStamp();
  const o0=(oz.data&&oz.data[0])||{}, o1=(oz.data&&oz.data[1])||{};
  const pct=(a,b)=>{ a=Number(a)||0; b=Number(b)||0; if(!b) return ""; const v=Math.round((a-b)/Math.abs(b)*100); return ' <span style="color:'+(v>=0?'#0a6b3f':'#b23a2e')+'">('+(v>=0?'+':'−')+Math.abs(v)+'%)</span>'; };
  const dgun=(a,b)=>{ const v=Math.round((Number(a)||0)-(Number(b)||0)); const c=v>0?'#0a6b3f':(v<0?'#b23a2e':'#6a7888'); return ' <span style="color:'+c+'">('+(v>0?'+':(v<0?'−':''))+Math.abs(v)+' gün)</span>'; };
  const gk=Number(o0.global_kayma||0).toFixed(1).replace(".",",");
  const stamp='<div class="stamp">Son güncelleme: '+(st||"—")+' · Adet: '+money(o0.toplam_adet)+pct(o0.toplam_adet,o1.toplam_adet)+' · Tutar: '+money(o0.toplam_tutar)+' €'+pct(o0.toplam_tutar,o1.toplam_tutar)+' · Global kayma: '+gk+' gün'+dgun(o0.global_kayma,o1.global_kayma)+'</div>';
  view.innerHTML=`${stamp}<div class="hint">AÜP — ERP snapshot üstünde canlı görüntü (salt-okur). ${data.length} proje · PST-AÜP&gt;0 ve Kayma≥3 kırmızı.</div>
    <div class="scroll"><table class="aup">
    <thead><tr><th>NO</th><th>PROJE ADI</th><th>DURUM</th><th>Ad</th><th>MVT</th><th>AÜP</th><th>PST</th><th>PST-AÜP</th><th>Kayma</th><th>TUTAR €</th><th class="note">Satış-Şantiye Notu</th><th class="note">Üretim Notu</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

    <div class="hint">Süreçler Melih'in tarif ettiği işleyişi yansıtır; her biri <b>tetik → sorumlu → adımlar → çıktı</b> zinciriyle, sıklık etiketiyle yazılmıştır. Firma içi <b>kurallar</b> (yasalar) ayrı ⚖️ Prosedürler sekmesindedir.</div>
    <div class="flow"><b>1. ERP İngest Hattı</b><span class="tag">tek P süreci</span>
      <p>Melih ERP'yi manuel çeker → Excel'leri <code>Arbor\ERP\&lt;YYMMDD&gt;\</code> içine bırakır (geçici giriş kutusu; hedef Supabase Storage <code>erp/&lt;YYMMDD&gt;/</code>) → worker en güncel klasörü <b>başlık adına göre</b> okur, idempotent upsert eder → snapshot tabloları → app view'leri.</p>
      <p class="muted">Ingest edilen dört rapor: <b>Prj→proje_snapshot, Pem→pem_snapshot, Arge→arge_snapshot, SÖ→so_snapshot</b>. <b>Cam.xlsx ingest edilmez</b> (ayrı fiyat aracı, app/cam/). Panolar: Prj→AÜP + Hazır PRJ (durum 8/8.1); Pem→Hazır PEM (durum 3); Arge→Ana Gündem ARGE bloğu; SÖ→Ana Gündem SÖ türevi + EA formu.</p>
    </div>
    <div class="flow"><b>2. SÖ Bölüm Gündem Süreci</b><span class="tag ok">SÖ sorumlusu = EA (Enes Artan)</span>
      <p>Her ERP çekiminden sonra tüm sorun ve öneriler (SÖ'ler) Claude tarafından, EA (Enes Artan) ile paylaşılan bir panoya işlenir.</p>
      <p>EA, o hafta gündeme alacağı bölümü panoda seçer; seçilen bölüme ait olanların yine EA tarafından <b>Pazartesi akşamına kadar</b> incelenip <b>"gündeme alındı"</b>ya çevrilmesi gerektiğini belirten bir mail Claude tarafından EA'ya gönderilir.</p>
      <p>Claude, <b>Salı sabahı</b> paylaşılan panoda seçilen bölümle ilgili tüm SÖ'lerin işlenip işlenmediğini kontrol eder; <b>eksik varsa</b> mail ile EA'dan ister ve bu kontrolü <b>Çarşamba sabahı</b> tekrarlar.</p>
      <p class="muted"><b>EA formu (ayrı):</b> <a href="ea/" target="_blank">app/ea/</a> — EA bunu kendi web formundan yapar; çalışanlar Melih'in panolarına doğrudan yazmaz, form sonucu buraya salt-okur yansır.</p><p class="muted">Fabrika bölümü SÖ.xlsx KUSURLU BİRİM sütunundan gelir; boşsa "Atanmamış". Açık SÖ kümesi: DURUM ≤ 7.2 &amp; NİTELİK PEM/Şantiye.</p>
    </div>
    <div class="flow"><b>3. Bilanço Süreci</b><span class="tag">Türkiye · gider=SB · gelir=İcmal</span>
      <p>SB (Muhasebe) gider tablosu → yeni dönem gideri gelince Melih iletir → Claude bilanço panosunu günceller. Kapsam yalnız Arbor Türkiye. Bilanço = Net Satış (İcmal) − Toplam Maliyet (710+720+730, SB).</p>
    </div>
    <div class="flow"><b>4. Yıllık İcmal Süreci</b><span class="tag">tek gelir kaynağı</span>
      <p>Yıllık İcmal, aylık/yıllık Net Satış'ın tek kaynağıdır ve bilançonun gelir tarafını besler. PRJ/ERP çekiminden türetilir; satış raporları ay başı mapping ile iş hacmini canlı tutar.</p>
    </div>
    <div class="flow"><b>5. Satış Raporları Süreci</b><span class="tag">AK · FA/FY · SO</span>
      <p>Kaynak raporu gönderir → Claude "Satış Yorum" + İcmal'e işler → mail "Rapor" klasörüne taşınır. AK (UK) ve FA/FY (Fransa/ihracat) ayın 1'i ve 15'i; SO (yurtiçi) yalnız ayın 1'i.</p>
      <p class="muted">Eskalasyon: ayın 5. ve 20. günü gelmeyen kaynağa tek hatırlatma; önce Melih, sonra ilgili.</p>
    </div>
    <div class="flow"><b>6. Prim / Ödeme Süreci</b>
      <p>Aylık prim banknot denominasyonu 100 $ → 50 € → 200 TL. Sabit: Onur 200 €/ay, Özlem Y. 7.000 TL/ay, Orhan 20.000 TL/ay. Oransal: Özgül %0,01 tahsilat. Değişken: Fatma proje primi.</p>
      <p class="muted">Ödeme onayı: Melih "Uygundur" (52.1) onaya sunulur; Osman onaylı iç/fabrika (52.25) sorulmadan işlenir.</p>
    </div>
    <div class="flow"><b>7. Sevke-Hazır / PEM Takip</b><span class="tag">Onur (Sevkiyat)</span>
      <p>Onur Ekinci sevke-hazır PEM/PRJ durumunu ve Excel'i günceller. PEM İlgili DURUM bazlı: 1.2 → Berat (dış sipariş), 1.3/2 → Semih (üretim).</p>
      <p class="muted">Hazır PEM/PRJ panosu (<code>hazir_pem_prj</code>): PEM durum 3 · PRJ durum 8/8.1. Onur'un sevk durumu <code>sevk_durumu_onur</code>'a yazılır, panoya salt-okur yansır.</p>
    </div>
    <div class="flow"><b>8. ARGE Süreci</b><span class="tag ok">İlgili = EU</span>
      <p>ERP Arge.xlsx İLGİLİ sütunu (Ömer/Tarık) yok sayılır; tüm ARGE'nin İlgili'si Enes Uzun'da toplanır (K73). Ana Gündem'de ARGE ayrı blok (kişi gruplarından sonra), sıra öncelik→açılış.</p>
      <p class="muted"><code>gundem_arge</code> filtresi: öncelik 1–3 &amp; durum 1–4. (SÖ İlgili = EA, ARGE İlgili = EU — farklı kişiler.)</p>
    </div>
    <div class="flow"><b>9. Cam Fiyatlandırma Aracı</b><span class="tag">talep üzerine · MB</span>
      <p>Cam parametrelerinden (dış/iç cam, kaplama, akustik, temper, form, ara boşluk, Fire Proof…) çarpımsal model + geçmiş teklif eşleşmesiyle €/m² fiyat üretir. Bağlantı çalışanla paylaşılabilir: <a href="cam/" target="_blank">app/cam/</a>. Cam.xlsx ERP'ye ingest edilmez; bu araç ayrıdır.</p>
    </div>
    <div class="flow"><b>10. AÜP Kayma Takibi</b><span class="tag">her ERP çekimi</span>
      <p>AÜP panosu ERP snapshot üstünde canlı görüntüdür. <b>PST-AÜP&gt;0</b> ve <b>Kayma≥3</b> kırmızı işaretlenir; global kayma tutar-ağırlıklı (<code>aup_ozet</code>) hesaplanır ve önceki çekimle karşılaştırılır.</p>
    </div>
    <div class="flow"><b>11. Sistem / Bakım Süreci</b><span class="tag ok">yapısal garanti</span>
      <p><b>App cerrahi düzenlenir</b>, asla sıfırdan üretilmez: <code>arbor_app.html</code> düzenlenir → <code>_deploy_app.py</code> invariants kapısını çalıştırır (require eksik / forbid varsa deploy durur) → GitHub <code>app/index.html</code>. Bilerek davranış değişince önce <code>arbor_invariants.json</code> güncellenir.</p>
      <p class="muted"><b>SQL/DDL</b> service key ile local'den çalışmaz → Supabase SQL Editor (tarayıcı) üzerinden Run; anon yazımlarda <code>audit_log</code> grant + policy unutulmaz.</p>
    </div>
`;
}

/* ---------- BOOT (Supabase Auth oturumu — e-posta+parola) ---------- */
async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if(session){ state.session=session; state.email=session.user&&session.user.email||""; await loadPerms(); renderApp(); }
  else renderLogin();
}
sb.auth.onAuthStateChange((_ev,s)=>{ if(!s){ state.session=null; renderLogin(); } });
boot();
setInterval(()=>{ if(!document.getElementById("view")) return; if(document.querySelector('input.cell,select.cell')) return; loadView(); }, 60000);
</script>
