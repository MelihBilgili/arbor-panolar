window.ARB_FORM_YOL=(function(){ var m=/\/app\/([^\/]+)\//.exec(location.pathname); return m?m[1]+"/":""; })();
window.ARB_KOD_GIRIS=async function(cli,kod){
  kod=String(kod==null?"":kod).replace(/\D/g,"");
  if(kod.length!==6) return {error:{message:"Kod 6 haneli olmal\u0131d\u0131r."}};
  try{
    var r=await fetch("https://zehysygpqxqmrzangvuc.supabase.co/functions/v1/form-giris",{method:"POST",cache:"no-store",
      headers:{"Content-Type":"application/json",apikey:"sb_publishable_ZCcDv4S7qH1hc9tuiv4__A_YVxmIpWc"},
      body:JSON.stringify({form:window.ARB_FORM_YOL,kod:kod})});
    var j={}; try{ j=await r.json(); }catch(e){}
    if(!r.ok||!j.ok||!j.token_hash) return {error:{message:j.hata||"Kod hatal\u0131."}};
    var v=await cli.auth.verifyOtp({token_hash:j.token_hash,type:"magiclink"});
    if(v.error) return {error:{message:"Giri\u015f a\u00e7\u0131lamad\u0131: "+v.error.message}};
    try{ localStorage.setItem("arb_kisi_"+window.ARB_FORM_YOL,JSON.stringify({kod:j.kisi,ad:j.ad,rol:j.rol})); }catch(e){}
    return {error:null,data:j};
  }catch(e){ return {error:{message:"Ba\u011flant\u0131 hatas\u0131."}}; }
};
window.ARB_KISI_AL=function(em){ try{ var k=JSON.parse(localStorage.getItem("arb_kisi_"+window.ARB_FORM_YOL)||"null"); return (k&&(!em||k.rol===em))?k:null; }catch(e){ return null; } };
</script>

};
/* CAM-KONFIG-AKUSTIK: Rw'si olmayan konfigürasyona aynı cam yapısının (cam kalınlıkları + akustik ara katman; kaplama etkisiz) ölçülmüş Rw (C;Ctr) değeri ≈ ile atanır.
   Kaynak: cam_akustik tablosu + Rw'si olan cam_konfig satırları. Boşluk farkı en çok 4 mm; ters yön (iç↔dış) de eşleşir. */
function yapiKey(k){
  const seg=String(k||"").replace(/\([^)]*\)/g,"").replace(/(\d{2})\/(\d{2})/g,"$1-$2").split(/\s*\/\s*/); const panes=[], gaps=[];
  seg.forEach((t,i)=>{ const m=/(\d{1,4}(?:\.\d{1,2})?)/.exec(t); if(!m) return;
    if(i%2){ gaps.push(+m[1]); return; }
    const aku=/acoustic|akustik|silence|optiphon|phonic|\bst\b|\bSS\b/i.test(t);
    panes.push(m[1]+(aku&&m[1].indexOf(".")>0?"a":"")); });
  return {panes,gaps};
}
let ACU=[];
function akuEkle(k,rw,c,ctr,src){ if(rw==null) return; const y=yapiKey(k); if(!y.panes.length||y.gaps.length!==y.panes.length-1) return; ACU.push({p:y.panes.join("|"),pr:y.panes.slice().reverse().join("|"),g:y.gaps,rw:+rw,c:c==null?null:+c,ctr:ctr==null?null:+ctr,src,k}); }
function akuBul(k){ const y=yapiKey(k); if(!y.panes.length) return null; const key=y.panes.join("|"); let best=null,bd=1e9;
  for(const a of ACU){ let gs; if(a.p===key) gs=a.g; else if(a.pr===key) gs=a.g.slice().reverse(); else continue;
    if(gs.length!==y.gaps.length) continue; let d=0, ok=true; gs.forEach((g,i)=>{ const x=Math.abs(g-y.gaps[i]); if(x>4) ok=false; d+=x; }); if(!ok) continue;
    if(d<bd){ bd=d; best=a; } }
  return best; }
const num=v=>{ if(v==null) return null; const s=String(v).trim().replace(",","."); if(s==="") return null; const x=+s; return isFinite(x)?x:null; };
const f2=(x,d)=>x==null?"–":Number(x).toLocaleString("tr-TR",{minimumFractionDigits:d,maximumFractionDigits:d});
const pct=x=>x==null?"–":Math.round(x*100);
/* Kombinasyon metninden cam kalınlıkları → kalınlık ve yaklaşık ağırlık (cam 2,5 kg/m²·mm; PVB 0,38 mm ≈ 0,41 kg/m²) */
function camlar(k){
  const seg=String(k||"").replace(/\([^)]*\)/g,"").replace(/(\d{2})\/(\d{2})/g,"$1-$2").split(/\s*\/\s*/); /* kaplama adlarindaki 70/35 gibi egik cizgiler yapi ayiricisi sayilmaz */
  const out=[];
  seg.forEach((s,i)=>{ if(i%2) return;
    const m=/^\s*(\d{2,4})\.(\d{1,2})/.exec(s);
    if(m){ const d=m[1]; let a,b; if(d.length===2){a=+d[0];b=+d[1];} else if(d.length===4){a=+d.slice(0,2);b=+d.slice(2);} else if(d[0]==="1"&&d[1]==="0"){a=10;b=+d.slice(2);} else {a=+d[0];b=+d.slice(1);} out.push({cam:a+b,pvb:(+m[2])*0.38}); return; }
    const n=/^\s*(\d{1,2})(?:[.,](\d))?/.exec(s); if(n) out.push({cam:+(n[1]+(n[2]?"."+n[2]:"")),pvb:0});
  });
  return out;
}
function agirlik(r){ if(r.agirlik!=null) return +r.agirlik; const c=camlar(r.kombinasyon); if(!c.length) return null; return c.reduce((s,x)=>s+x.cam*2.5+x.pvb*1.07,0); }
let DATA=[];
async function load(){
  let all=[], from=0;
  for(;;){ const {data,error}=await sb.from("cam_konfig").select("*").eq("aktif",true).order("id").range(from,from+999);
    if(error){ $("res").innerHTML='<div class="bos" style="color:#b40000">Okunamadı: '+esc(error.message)+'</div>'; return; }
    all=all.concat(data||[]); if(!data||data.length<1000) break; from+=1000; }
  const ak=await sb.from("cam_akustik").select("*");
  ACU=[]; ((ak&&!ak.error&&ak.data)||[]).forEach(a=>akuEkle(a.kombinasyon,a.rw,a.c,a.ctr,a.kaynak));
  all.forEach(r=>{ if(r.rw!=null) akuEkle(r.kombinasyon,r.rw,r.c,r.ctr,((KAYNAK[r.kaynak]||{}).e||r.kaynak)+": "+r.kombinasyon); });
  DATA=all.map(r=>{ const o=Object.assign({},r); ["ug","lt","lr_dis","g","rw","c","ctr","kalinlik"].forEach(k=>o[k]=r[k]==null?null:+r[k]);
    if(o.rw==null){ const a=akuBul(o.kombinasyon); if(a){ o.rw=a.rw; o.c=a.c; o.ctr=a.ctr; o._rwT=a.src+" — "+a.k; } }
    o._agr=agirlik(r); o._rwctr=(o.rw!=null&&o.ctr!=null)?o.rw+o.ctr:null; o._sel=(o.lt!=null&&o.g)?o.lt/o.g:null; return o; });

(function(){
