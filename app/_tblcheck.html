<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;font-family:'Segoe UI',system-ui,sans-serif;font-size:13px}
.wrap{padding:6px 8px}
.scroll{overflow:auto;border:1px solid #dde3ea;border-radius:8px;max-height:82vh;background:#fff;width:max-content;max-width:100%}
table{border-collapse:collapse;width:auto;font-size:12px}
thead th{position:sticky;top:0;background:#16324f;color:#fff;font-weight:600;font-size:10.5px;padding:3px 6px;text-align:left;white-space:nowrap;z-index:2}
td{border-bottom:1px solid #eef1f5;padding:2px 6px;vertical-align:middle;line-height:16px}
.kod{font-weight:700;color:#16324f;white-space:nowrap}
.num{text-align:right;white-space:nowrap}
table.sat{width:auto}
table.sat th,table.sat td{white-space:nowrap}
table.sat td>.cx{display:block;white-space:nowrap;overflow-x:auto;scrollbar-width:none}
table.sat td.s25>.cx{width:25ch}table.sat td.s20>.cx{width:20ch}table.sat td.s60>.cx{width:60ch}
</style></head><body><div class="wrap"><div class="satis-wrap">
<div class="scroll"><table class="sat"><thead><tr><th>PROJE</th><th>MÜŞTERİ</th><th>DURUM</th><th class="num">NET (€)</th></tr></thead><tbody>
<tr><td class="kod s25"><div class="cx">Harbiye Askeri Müze</div></td><td class="s20"><div class="cx">Bilgili İnşaat</div></td><td class="s60"><div class="cx">Teklif verildi, ihale bekleniyor</div></td><td class="num">600.000</td></tr>
<tr><td class="kod s25"><div class="cx">KYK YURT BİNASI - BEŞİKTAŞ</div></td><td class="s20"><div class="cx">KYK</div></td><td class="s60"><div class="cx">Revize teklif hazırlanıyor</div></td><td class="num">93.600</td></tr>
</tbody></table></div>
</div></div>
<pre id="out" style="padding:8px;font-size:12px"></pre>
<script>
const t=document.querySelector('table.sat');
const ths=[...t.querySelectorAll('thead th')];
document.getElementById('out').textContent=JSON.stringify({
  tableWidth:Math.round(t.getBoundingClientRect().width),
  scrollWidth:Math.round(t.parentElement.getBoundingClientRect().width),
  viewport:window.innerWidth,
  cols:ths.map(h=>h.textContent+"="+Math.round(h.getBoundingClientRect().width))
},null,1);
</script></body></html>
