<header><h1>Cam Fiyatlandırma</h1></header>
<div class="wrap"><div class="grid">
<div class="card">

  <div id="ortaWrap" style="display:none"><label>Orta cam kodu (üçlü)</label><select id="orta"><option>4</option><option>6</option></select></div>
  <!-- CAM-V18 DUZEN -->
  <div class="row2"><div><label>Kaplama</label><select id="kap"><option value="yok">Kaplamasız</option><option value="lowe" selected>Low-E</option><option value="solar">Solar Low-E</option></select></div><div><label>Form / şekil</label><select id="form"><option value="duz">Düz</option><option value="karolaj">Karolaj</option><option value="egrisel">Eğrisel (kemerli, dairesel dahil)</option><option value="ke">Karolaj+Eğrisel</option></select></div></div>
</div>
<div class="card">
<div class="perfgrid"><div>
  <div class="chk2">
  <div class="chk"><input type="checkbox" id="acoustic"><label style="margin:0">Akustik lamine</label></div>
  <div class="chk"><input type="checkbox" id="satin"><label style="margin:0">Satin / Satine</label></div>
  <div class="chk"><input type="checkbox" id="temper"><label style="margin:0">Temperli</label></div>
  <div class="chk"><input type="checkbox" id="fireproof"><label style="margin:0">Fire Proof (EI60)</label></div>
  <div class="chk"><input type="checkbox" id="extraclear"><label style="margin:0">Extra / Ultra Clear cam</label></div>
  <div class="chk"><input type="checkbox" id="argon" checked><label style="margin:0">Argon gazı</label></div>
  <div class="chk"><input type="checkbox" id="we" checked><label style="margin:0">WE (sıcak kenar)</label></div>
  </div>
  <div class="aarow"><div><label>Toplam adet</label><input id="adet" type="number" value="10" step="1" min="0"></div><div><label>Toplam alan (m²)</label><input id="m2" type="number" value="10.0" step="0.1" min="0"></div><div class="hint" id="avgnote"></div></div>
  </div>
<div class="hedef"><div class="htit">Hedef değerler <span>(boş = serbest)</span></div>
  <div class="hgrid"><div><label>Ug ≤ (W/m²K)</label><input id="h_ug" type="number" step="0.1" min="0"></div><div><label>Rw+Ctr ≥ (dB)</label><input id="h_rw" type="number" step="1" min="0"></div><div><label>TL ≥ (0–1)</label><input id="h_tl" type="number" step="0.01" min="0" max="1"></div><div><label>Solar faktör ≤ (0–1)</label><input id="h_sf" type="number" step="0.01" min="0" max="1"></div></div>
</div></div>
</div></div>
<div class="out" id="out"></div>

/* CAM-V10 BANT-DUZEN */ /* CAM-V13 LISTE-FIYATSIZ: listede satis yoksa model fiyati gosterilmez */function catFiyat(C,u){return C.satis>0?f2(C.satis,2)+' €/m²':'<span class="no">listede fiyat yok</span>';}
function lineY(lbl,b){lbl=String(lbl).replace(/:\s*$/,'');let L,R='<div class="ll">'+lbl+'</div>';
  if(b&&typeof b==='object'){L='<div class="yp">'+b.pr+'</div><div class="lv">'+vplain(b.v)+'</div>';R+='<div><b>'+b.n+'</b> · '+f2(b.k,2)+' mm</div>';}else L='<div class="lv">'+b+'</div>';
  return '<div class="line yk"><div class="yl">'+L+'</div><div class="yr">'+R+'</div></div>';}
const bodyY=(n,k,v,pr)=>({n,k,v,pr});
function gq(g){const p=g.k.split('|'),c=p[0].split('/'),f=p[3].split('').map(Number),P=c.map(pane);
  return{c,cav:+p[1],cu:+p[1],tg:g.tg,nlam:P.reduce((a,x)=>a+x.lam,0),pvb4:P.filter(x=>x.lam&&x.pvb>=4).length,tr:f[0],lowe:f[1],solar:f[2],fp:f[3],ac:f[4],sat:f[5],tp:f[6],xc:f[7],ar:f[8],we:f[9],cool:0,plan:0,en:0,coat:'',own:1,frm:p[2]};}
function yakinlar(q,po,h,hasH,u){let out='';
  /* 1) hedef degerler: Ug/SF <= hedef (esit yoksa en yakin kucuk), TL/Rw+Ctr >= hedef (esit yoksa en yakin buyuk) */
  const L1='Cam listesindeki en yakın hedef değerler:';
  if(!hasH)out+=lineY(L1,'<span class="lv">— hedef değer girilmedi</span>');
  else{const SC={ug:0.1,tl:0.01,rw:1,sf:0.01};let best=null;
    /* CAM-V11 YAKIN-X2: Ug/SF hedefin ustu x2, TL/Rw+Ctr hedefin alti x2 ceza; iki yonde de aday olur */
    for(const C of CAT){let s=0,ok=true;for(const t of ['ug','tl','rw','sf']){if(h[t]==null)continue;const v=C[t];if(v==null){ok=false;break;}
        const kotu=(t==='ug'||t==='sf')?v-h[t]:h[t]-v;s+=(kotu>0?2*kotu:-kotu)/SC[t];}
      if(!ok)continue;const d=Dq(q,C);if(!best||s<best.s-1e-9||(Math.abs(s-best.s)<=1e-9&&d<best.d))best={C,s,d};}
    out+=lineY(L1,best?bodyY(nmT(best.C.komb),kalL(best.C),best.C,catFiyat(best.C,u)):'<span class="no">Hedefleri karşılayan kombinasyon cam listesinde yok</span>');}
  /* 2) forma islenen kombinasyona en yakin cam listesi kaydi */
  let bc=null;for(const C of CAT){const d=Dq(q,C);if(!bc||d<bc.d-1e-9||(Math.abs(d-bc.d)<=1e-9&&!(bc.C.satis>0)&&C.satis>0))bc={C,d};}
  out+=lineY('Cam listesindeki en yakın kombinasyon:',bc?bodyY(nmT(bc.C.komb),kalL(bc.C),bc.C,catFiyat(bc.C,u)):'—');
  /* 3) forma islenen kombinasyona en yakin gecmis teklif grubu */
  let bg=G.find(r=>r.k===po.key)||null;
  if(!bg){let bd=1e9;for(const r of G){const Q=gq(r),d=Dq(q,Q)+(Q.frm!==u.frm?0.5:0);if(d<bd-1e-9||(Math.abs(d-bd)<=1e-9&&bg&&r.n>bg.n)){bd=d;bg=r;}}}
  if(bg){const Q=gq(bg);out+=lineY('Fiyat tekliflerindeki en yakın kombinasyon:',bodyY(nmT(bg.komb),kalin(Q),perf(Q),f2(bg.bf*KAT,2)+' €/m² (ort. teklif × 2,5 · '+bg.n+' teklif)'/* CAM-V15 */));}
  else out+=lineY('Fiyat tekliflerindeki en yakın kombinasyon:','—');
  return out;}

const $=id=>document.getElementById(id);
const fmt=n=>n==null?'—':n.toLocaleString('tr-TR',{maximumFractionDigits:1});
const f2=(n,d)=>n==null?'—':n.toLocaleString('tr-TR',{minimumFractionDigits:d,maximumFractionDigits:d});
const cl=v=>v?1:0,cavUI=c=>[10,12,14,16,20].reduce((a,o)=>Math.abs(o-c)<Math.abs(a-c)?o:a,16);
function pane(c){c=String(c).replace(',','.');const m=c.match(/^(\d)(\d)\.(\d)$/);return m?{mm:+m[1]+ +m[2],lam:1,pvb:+m[3]}:{mm:+c,lam:0,pvb:0};}
/* secili kombinasyon */
function own(){const kap=$('kap').value,triple=$('yapi').value==='uclu'?1:0;
  const codes=triple?[$('dis').value,$('orta').value,$('ic').value]:[$('dis').value,$('ic').value];const P=codes.map(pane);
  const ar=cl($('argon').checked),we=cl($('we').checked);
  return {c:codes,cav:+$('cav').value,cu:+$('cav').value,tg:P.reduce((a,p)=>a+p.mm,0),nlam:P.reduce((a,p)=>a+p.lam,0),pvb4:P.filter(p=>p.lam&&p.pvb>=4).length,tr:triple,
    lowe:cl(kap!=='yok'),solar:cl(kap==='solar'),cool:0,plan:0,en:0,sat:cl($('satin').checked),xc:cl($('extraclear').checked),ac:cl($('acoustic').checked),
    fp:cl($('fireproof').checked),tp:cl($('temper').checked),ar,we,sw:0,coat:'',own:1};}
/* katalogdan Ug/TL/Rw+Ctr/SF (egitimdeki atama ile ayni kural) */
function dist(q,C,t){const m=k=>C[k]!==q[k]?1:0,d=C.c[0]!==q.c[0]?1:0,i=C.c[C.c.length-1]!==q.c[q.c.length-1]?1:0;
  if(t==='ug')return 100*m('lowe')+100*m('tr')+3*m('ar')+Math.abs(C.cav-q.cav)/4+0.5*m('coat')+0.3*m('solar')+0.05*Math.abs(C.tg-q.tg)/4+0.2*m('fp');
  if(t==='tl'||t==='sf')return 100*m('lowe')+50*m('solar')+50*m('cool')+50*m('plan')+50*m('en')+5*m('coat')+3*m('sat')+1.5*m('xc')+1*m('tr')+Math.abs(C.tg-q.tg)/8+0.3*m('ac')+0.3*m('fp');
  return 100*m('tr')+3*m('ac')+1.5*d+1.5*i+Math.abs(C.tg-q.tg)/2+0.7*Math.abs(C.nlam-q.nlam)+Math.abs(C.cav-q.cav)/6+2*m('fp')+0.1*m('lowe');}
function kalin(q){if(q.kal!=null&&!q.own)return q.kal;const P=q.c.map(pane);return P.reduce((a,p)=>a+p.mm+(p.lam?0.38*p.pvb:0),0)+q.cav*(q.c.length-1);}
function median(a){a=a.slice().sort((x,y)=>x-y);const n=a.length;return n%2?a[(n-1)/2]:(a[n/2-1]+a[n/2])/2;}
function perf(q){const r={};for(const t of ['ug','tl','rw','sf']){let mn=1e9,ds=[];for(const C of CAT){if(C[t]==null)continue;const d=dist(q,C,t);ds.push([d,C[t]]);if(d<mn)mn=d;}
  r[t]=median(ds.filter(x=>x[0]<=mn+0.25).map(x=>x[1]));}return r;}
/* fiyat */
function ctxUI(){const form=$('form').value,sp='',adet=+$('adet').value||0,m2=+$('m2').value||0;return{form,frm:form,sp,adet,m2,ort:adet>0&&m2>0?m2/adet:1};}
function price(q,v,u){const tp=cl(q.tp||$('temper').checked),we=q.we;
  const X={tg:q.tg,tg2:Math.pow(Math.min(q.tg,22)-14,2)/100,nlam:q.nlam,pvb4:q.pvb4,triple:q.tr,cav:q.cu,cav_dar:cl(q.cu<=12),cav_genis:cl(q.cu>=20),lowe:q.lowe,solar:q.solar,
    satin:q.sat,temper:tp,acoustic:q.ac,extraclear:q.xc,argon:q.ar,we,
    karolaj:cl(u.frm==='karolaj'||u.frm==='ke'),egrisel:cl(u.frm==='egrisel'||u.frm==='ke'),l_ortm2:Math.log(Math.min(Math.max(u.ort,0.05),4)),
    tl:v.tl,rwctr:v.rw,sf:v.sf,l_m2:Math.log(Math.min(Math.max(u.m2||1,0.2),300)),kucuk_m2:cl(u.m2>0&&u.m2<2),kucuk_adet:cl(u.adet>0&&u.adet<=2)};
  let s=DB.ic;for(const k in M)s+=M[k]*(X[k]||0);const est=Math.exp(s);
  const flags=[q.tr,q.lowe,q.solar,q.fp,q.ac,q.sat,tp,q.xc,q.ar,we].join('');
  const key=q.c.join('/')+'|'+q.cu+'|'+u.frm+'|'+flags;
  const g=G.find(r=>r.k===key);return{est,unit:g?est*Math.exp(g.adj):est,g,key,tp};}
function hedef(){const r=id=>{const x=$(id).value.trim();return x===''?null:+x.replace(',','.');};return{ug:r('h_ug'),tl:r('h_tl'),rw:r('h_rw'),sf:r('h_sf')};}
function meets(v,h){return(h.ug==null||v.ug<=h.ug+1e-9)&&(h.tl==null||v.tl>=h.tl-1e-9)&&(h.rw==null||v.rw>=h.rw-1e-9)&&(h.sf==null||v.sf<=h.sf+1e-9);}
/* CAM-V18 REF-FIYAT: referans fiyatin birim fiyata gore farki (tam sayi %), |fark|>15 kirmizi */
function refUpd(){const e=$('ref'),d=$('refdif'),pc=($('pencad')||{}).value||'',big=$('out').querySelector('.big'),b=window._BF;if(!e||!d)return;
  /* CAM-V19 PENCAD: bos/Evet+ref yok -> birim fiyat bos; ref yalniz Evet'te girilir; |fark|>15 -> soluk birim + Onaysiz Kullanmayiniz */
  e.disabled=pc!=='evet';if(pc!=='evet'&&e.value!=='')e.value='';
  const r=parseFloat(String(e.value).replace(',','.'));let p=null;
  if(r>0&&b>0){p=Math.round((r/b-1)*100);d.textContent=(p>0?'+':p<0?'\u2212':'\u00b1')+'%'+Math.abs(p);d.className='refdif '+(Math.abs(p)>15?'rbad':'rok');}
  else{d.textContent='\u2013';d.className='refdif';}
  if(!big)return;const host=big.parentNode;host.querySelectorAll('.bfwarn,.bfhint').forEach(x=>x.remove());
  const show=pc==='hayir'||(pc==='evet'&&r>0),bad=p!=null&&Math.abs(p)>15;
  big.classList.toggle('faded',show&&bad);
  if(!show){big.textContent='\u2014';host.insertAdjacentHTML('beforeend','<div class="bfhint">'+(pc===''?'Pencad\'de fiyat var m\u0131? se\u00e7in':'Referans fiyat\u0131 girin')+'</div>');}
  else{big.textContent=f2(b,2)+' \u20ac/m\u00b2';if(bad)host.insertAdjacentHTML('beforeend','<div class="bfwarn">Onays\u0131z Kullanmay\u0131n\u0131z</div>');}}
function ownName(q){const k=$('kap').value,t=q.tp?' Temperli':'',a=q.ac?' Akustik':'',sa=q.sat?' Satin':'',x=q.xc?' Extra Clear':'';
  const p=q.c.map((c,j)=>c+(j===0?a+x+(k==='solar'?' Solar Low-E':'')+sa:'')+t+(j===q.c.length-1?(k==='lowe'?' Low-E':'')+(q.fp?' Fire Proof':''):''));
  const cav=q.cav+(q.ar?' Ar':'')+(q.we?' WE':'');return q.tr?p[0]+' / '+cav+' / '+p[1]+' / '+cav+' / '+p[2]:p[0]+' / '+cav+' / '+p[1];}
function vtxt(v,h){const c=(ok,h)=>h==null?'':(ok?' <span class="ok">✓</span>':' <span class="no">✗</span>');
  return 'Ug '+f2(v.ug,1)+c(h.ug==null||v.ug<=h.ug,h.ug)+' · TL '+f2(v.tl,2)+c(h.tl==null||v.tl>=h.tl,h.tl)+' · Rw+Ctr '+Math.round(v.rw)+' dB'+c(h.rw==null||v.rw>=h.rw,h.rw)+' · SF '+f2(v.sf,2)+c(h.sf==null||v.sf<=h.sf,h.sf);}
function calc(){const q=own(),u=ctxUI(),h=hedef();$('ortaWrap').style.display=q.tr?'block':'none';$('avgnote').textContent=u.adet>0?('Ortalama: '+fmt(u.ort)+' m²/adet'):'';
  const vo=perf(q);/* CAM-V9 HEDEF-BOS: gri ipucu kaldirildi, bos kutu bos gorunur */['h_ug','h_tl','h_rw','h_sf'].forEach(i=>{$(i).placeholder='';});
  const po=price(q,vo,u);let sel={q,v:vo,p:po,name:ownName(q),src:'own'};const hasH=Object.values(h).some(x=>x!=null);
  if(hasH&&!meets(vo,h)){let best=null;
    for(const gevsek of [0,1]){for(const C of CAT){if(C.ug==null||C.tl==null||C.rw==null||C.sf==null)continue;
      if((!gevsek&&C.tr!==q.tr)||C.sat!==q.sat||C.fp!==q.fp||C.ac<q.ac||C.xc<q.xc)continue;const v={ug:C.ug,tl:C.tl,rw:C.rw,sf:C.sf};if(!meets(v,h))continue;
      const p=price(C,v,u);if(!best||p.unit<best.p.unit)best={q:C,v,p,name:C.komb,src:'cat',yapi:gevsek&&C.tr!==q.tr};}if(best)break;}
    sel=best||Object.assign(sel,{src:'none'});}
  const P=sel.p,g=P.g,unit=P.unit,tot=unit*u.m2;
  const src=(g?'Model × geçmiş düzeltme ('+g.n+' teklif, ağırlık %'+Math.round(100*g.n/(g.n+DB.keb))+')':'Model tahmini (aynı kombinasyonda geçmiş teklif yok)');
  const badge=g?'<span class="badge">'+g.n+' teklif</span>':'<span class="badge est">tahmin</span>';
  const note=sel.src==='cat'?'<div class="pv">Seçim hedefleri karşılamadığı için katalogdan hedefleri karşılayan en uygun kombinasyon fiyatlandı'+(sel.yapi?' (yapı '+(sel.q.tr?'üçlü':'çift')+' cama çevrildi — seçilen yapıda karşılayan yok)':'')+'.</div>':sel.src==='none'?'<div class="pv"><span class="no">Hedefleri karşılayan kombinasyon katalogda yok — seçimin fiyatı gösteriliyor.</span></div>':'';
  const _fk=P.key.split('|').slice(2,4).join('|'),_fl=P.key.split('|')[3];let bz=g||G.filter(r=>r.k.split('|').slice(2,4).join('|')===_fk&&Math.abs(r.tg-sel.q.tg)<=2).sort((a,b)=>b.n-a.n)[0];
  if(!bz){const cz=G.filter(r=>r.k.split('|')[3]===_fl).sort((a,b)=>Math.abs(a.tg-sel.q.tg)-Math.abs(b.tg-sel.q.tg)||b.n-a.n);bz=cz[0];}
  $('out').innerHTML='<div class="unitrow"><div><div class="lbl">Birim fiyat '+badge+'</div><div class="big">'+f2(unit*KAT,2)/* CAM-V16 BIRIM-2HANE */+' €/m²</div></div>'+
   '<div class="komb"><div class="lbl">Fiyatlanan kombinasyon</div><b>'+/* CAM-V17 KOMB-FORMDAN: ad ve kalinlik formdaki secimlerden; fiyat hedeflerle secilen kombinasyondan */ownName(q)+' · '+f2(kalin(q),2)+' mm</b></div></div>'+
   yakinlar(q,po,h,hasH,u);
  window._BF=unit*KAT;refUpd();
  const tgs=sel.q.tg,fk=P.key.split('|').slice(2,4).join('|');

  let mh='';const row=r=>'<tr><td>'+r.komb+'</td><td class="num">'+r.n+'</td><td class="num">'+r.p+'</td><td class="num">'+fmt(r.bf)+'</td><td class="num">'+fmt(r.lo)+'–'+fmt(r.hi)+'</td></tr>';
  const head='<table><thead><tr><th>Cam Kombinasyonu</th><th class="num">Teklif</th><th class="num">Proje</th><th class="num">Ort. €/m²</th><th class="num">Aralık</th></tr></thead><tbody>';
  if(g)mh+='<h3>Aynı kombinasyonun geçmiş teklifleri (fiyata katıldı)</h3>'+head+row(g)+'</tbody></table>';
  if(sim.length){mh+='<h3>Benzer kombinasyonlar (±2 mm, yalnız bilgi)</h3>'+head;sim.slice().sort((a,b)=>b.n-a.n).slice(0,10).forEach(r=>mh+=row(r));mh+='</tbody></table>'+(sim.length>10?'<div class="hint">… '+(sim.length-10)+' kombinasyon daha</div>':'');}
  if(!g&&!sim.length)mh='<h3>Bu kombinasyon için geçmiş teklif yok — model tahmini kullanıldı.</h3>';
  if($('matches'))$('matches').innerHTML=mh;
  const x=k=>'×'+Math.exp(M[k]).toFixed(2);
  if($('formula'))$('formula').innerHTML='<b>Çarpımsal model:</b> €/m² = e^( '+DB.ic.toFixed(2)+' + Σ katsayı·parametre ) × e^(geçmiş düzeltme). Geçmiş düzeltme = aynı kombinasyonun tekliflerinin modelden ortalama sapması, n/(n+'+DB.keb+') ağırlıkla. Performans etkileri: TL 0,10 düşünce ×'+Math.exp(-0.1*M.tl).toFixed(2)+' · Solar faktör 0,10 düşünce ×'+Math.exp(-0.1*M.sf).toFixed(2)+' · Rw+Ctr +1 dB ×'+Math.exp(M.rwctr).toFixed(3)+' (+5 dB ×'+Math.exp(5*M.rwctr).toFixed(2)+'). Diğer: Akustik '+x('acoustic')+' · Kalın PVB (.4/.6) '+x('pvb4')+' · Temperli '+x('temper')+' · Extra clear '+x('extraclear')+' · Sıcak kenar (WE) '+x('we')+' · Eğrisel '+x('egrisel')+' · m² iki katına çıkınca ×'+Math.exp(M.l_m2*Math.LN2).toFixed(2)+'. Ug fiyatı ayrıca açıklamıyor (Low-E seçimiyle zaten geliyor); yalnız hedef süzgecinde kullanılır. Argon ve sıcak kenar (WE) ayrı parametre: WE işaretsizse çıta Standart / Siyah çıtalı / Black Edge (aynı şey) sayılır; WE fiyata girer; Argon’un ayrı fiyat etkisi veride ölçülemedi (WE’siz argonlu yalnız 7 teklif), Ug ve geçmiş eşleşmede kullanılır. Kemerli ve dairesel = eğrisel. Hedef değer girildiğinde seçim bunları karşılamıyorsa, aynı yapı / akustik / satin / yangın özelliğini koruyan katalog kombinasyonları arasından hedefleri karşılayan en düşük fiyatlı olan fiyatlanır.';}
document.querySelectorAll('select,input').forEach(e=>e.addEventListener('input',calc));

<script>
/* ARB-HOVERTITLE: sigmayan hucre/alan icerigi hover'da (title) gosterilir - tum pano/form ortak */
(function(){
  function fx(el){
    if(!el||el.nodeType!==1) return;
    var tag=el.tagName;
    if(tag==='INPUT'||tag==='TEXTAREA'){ var v=el.value||''; if(v) el.title=v; else el.removeAttribute('title'); return; }
    if(tag==='SELECT'){ var o=el.options[el.selectedIndex]; var v2=o?o.textContent:''; if(v2) el.title=v2; else el.removeAttribute('title'); return; }
    if(el.children.length) return;
    var t=(el.textContent||'').trim();
    if(t && el.scrollWidth>el.clientWidth+1 && !el.getAttribute('title')) el.title=t;
  }
  function scan(root){ if(root&&root.querySelectorAll) root.querySelectorAll('td,th,div,span,input,select,textarea').forEach(fx); }
  document.addEventListener('input',function(e){ fx(e.target); },true);
  document.addEventListener('change',function(e){ fx(e.target); },true);
  var mo=new MutationObserver(function(muts){ muts.forEach(function(m){ m.addedNodes.forEach(function(n){ if(n.nodeType===1){ fx(n); scan(n); } }); }); });
  function boot(){ mo.observe(document.body,{childList:true,subtree:true}); scan(document.body); }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
})();
</script>
<!-- /ARB-HOVERTITLE -->


<!-- ARBOR-DRAGSCROLL -->
<style>
  /* Kaydirma cubuklari gizli — kaydirma tekerlek + surukleme ile yapilir */
  *{scrollbar-width:none;-ms-overflow-style:none}
  ::-webkit-scrollbar{width:0!important;height:0!important;background:transparent}
  body.arb-dragging,body.arb-dragging *{cursor:grabbing!important;user-select:none!important}
</style>
<script>
(function(){
  var el=null,sx=0,sy=0,l=0,t=0,moved=false;
  function skip(n){ return !!(n.closest && n.closest("input,select,textarea,button,a,summary,label,option,.del,.adel,.idel,.ddel,.fdel")); }
  function scrollable(n){
    var st=getComputedStyle(n);
    var okx=(st.overflowX==="auto"||st.overflowX==="scroll") && n.scrollWidth>n.clientWidth+2;
    var oky=(st.overflowY==="auto"||st.overflowY==="scroll") && n.scrollHeight>n.clientHeight+2;
    return okx||oky;
  }
  function start(n,e){
    el=n; sx=e.clientX; sy=e.clientY; l=n.scrollLeft; t=n.scrollTop; moved=false;
    document.body.classList.add("arb-dragging"); e.preventDefault();
  }
  document.addEventListener("mousedown",function(e){
    if(e.button!==0||skip(e.target)) return;
    var n=e.target, hucre=null;
    while(n && n.nodeType===1 && n!==document.body){
      if(scrollable(n)){
        /* once tablo/kutu kapsayicisi; hucre ici mini-kaydirici yalnizca baska aday yoksa */
        if(!n.closest("td,th")) return start(n,e);
        if(!hucre) hucre=n;
      }
      n=n.parentElement;
    }
    if(hucre) return start(hucre,e);
  },true);
  document.addEventListener("mousemove",function(e){
    if(!el) return;
    var dx=e.clientX-sx, dy=e.clientY-sy;
    if(Math.abs(dx)+Math.abs(dy)>3) moved=true;
    el.scrollLeft=l-dx; el.scrollTop=t-dy;
  });
  document.addEventListener("mouseup",function(){
    if(!el) return; el=null; document.body.classList.remove("arb-dragging");
  });
  document.addEventListener("click",function(e){ if(moved){ moved=false; e.stopPropagation(); e.preventDefault(); } },true);
})();
</script>
<!-- /ARBOR-DRAGSCROLL -->
</body></html>
